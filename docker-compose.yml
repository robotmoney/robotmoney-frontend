# Single-box deployment (e.g. one DigitalOcean droplet). No reverse proxy: the
# `api` process serves BOTH the JSON API and the static frontend (STATIC_DIR),
# so there's nothing else to run in front of it.
#
# HOST PORTS ARE REQUIRED INPUTS, NOT DEFAULTS. Both published ports below are
# `${VAR:?…}`: compose REFUSES to start without them rather than falling back.
# `bun run demo` / scripts/stack draw them free per run (scripts/stack/ports.ts);
# a RAW compose invocation must supply them itself, e.g.
#
#   WEB_PORT=8787 POSTGRES_PORT=5433 docker compose up -d postgres
#
# The old `${WEB_PORT:-48787}` / `${POSTGRES_PORT:-5432}` defaults are gone
# because they are what let a CI boot silently claim the port cloudflared routes
# stage.robotmoney-labs.dev to and take the site down; a loud refusal is the
# whole point. (`bun demo --stage` is the single sanctioned 48787 pin.)
#
# Local dev / CI usually only needs Postgres:   POSTGRES_PORT=… docker compose up -d postgres
# Full box:                                     WEB_PORT=… POSTGRES_PORT=… docker compose up -d
#
# DB modes are driven by DATABASE_URL + the postgres volume:
#   ephemeral (CI)  : run with a throwaway volume / `docker compose down -v`
#   demo            : named volume `pgdata` persists across restarts
#   prod            : point DATABASE_URL at an external/managed Postgres and run
#                     only `api` + the worker lanes
#                     (docker compose up api worker-committee worker-analytics worker-research)

# Task-queue worker lanes (issue #107): one container per execution lane. This
# IS the production/default lane topology:
#   worker-committee — RESERVED for interactive committee session-lifecycle
#                      jobs (committee.%); no other lane may claim them.
#   worker-analytics — regime classification + the scheduled data pipelines
#                      (everything except committee.% / research.%).
#   worker-research  — research.% only, so a slow/blocked research fetch can
#                      never occupy a committee or regime slot.
# WORKER_LANE is REQUIRED by the worker entry (fails loudly when empty/unknown);
# WORKER_ID defaults to `<lane>-<pid>` (unique per container, lane-visible in
# locked_by/logs/admin dashboard). Scale a lane independently, e.g.
# `docker compose up -d --scale worker-research=2`.
x-worker-base: &worker-base
  build:
    context: .
    dockerfile: backend/Dockerfile
  command: ["bun", "run", "src/worker/index.ts"]
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

# Shared worker env. The worker RUNS the projects.* cron pipelines, so a prod
# worker needs PROJECTS_SOURCE=live (fail-closed — unset throws in prod; unset
# elsewhere = offline fixture).
x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL}
  # Optional queue-scoped restricted role (migrations/0016_worker_role.sql):
  # point the worker's pool at rm_worker so DB permissions enforce that it can
  # never mutate analytics data tables (issue #106). Falls back to DATABASE_URL
  # when unset.
  WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
  RM_ENV: ${RM_ENV:-demo}
  # Updater → API wiring (issue #106): analytics jobs submit computed outputs
  # through the authenticated /api/analytics/* boundary on the api service —
  # never direct SQL. The token is the same shared secret the api verifies;
  # a worker REFUSES to boot in demo/prod without it
  # (assertAnalyticsUpdaterCredentials). Shared across lanes: every lane runs
  # the same worker entry (only the analytics lane submits, but the boot guard
  # is uniform and the secret is one deployment value).
  ANALYTICS_API_URL: http://api:8787
  ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-}
  PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}
  # Activation notifications are persisted by the API and delivered by the
  # reserved committee worker through the deployment's HTTP mail adapter.
  COMMITTEE_NOTIFICATION_EMAIL_FROM: ${COMMITTEE_NOTIFICATION_EMAIL_FROM:-committee-demo@robotmoney.invalid}
  COMMITTEE_NOTIFICATION_EMAIL_TRANSPORT_URL: ${COMMITTEE_NOTIFICATION_EMAIL_TRANSPORT_URL:-}
  COMMITTEE_NOTIFICATION_EMAIL_TRANSPORT_TOKEN: ${COMMITTEE_NOTIFICATION_EMAIL_TRANSPORT_TOKEN:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robotmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robotmoney}
      POSTGRES_DB: ${POSTGRES_DB:-robotmoney}
    ports:
      # No `:-5432` default (see this file's header): the caller MUST supply a
      # host port. Nothing outside the compose network routes to postgres — api
      # and the worker lanes reach it by service name — so this publish exists
      # only for host-side psql, and a predictable :5432 just collided with
      # whatever postgres the dev box already runs.
      - "${POSTGRES_PORT:?POSTGRES_PORT is required - host ports are drawn free per run by scripts/stack/ports.ts and there is no default; for raw compose set it explicitly}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robotmoney}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["bun", "run", "src/api/index.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RM_ENV: ${RM_ENV:-demo}
      # No API_PORT here on purpose — see the `ports:` comment below. The api
      # listens on backend/src/config.ts's 8787 default, which is the single
      # source of truth for the container-internal port.
      # Guards the privileged surface incl. the /admin task-queue dashboard
      # (X-Admin-Token). The api process is the one that authenticates HTTP; the
      # demo sets a random per-launch value (worker doesn't serve the API).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Analytics-provider bearer credential (issue #106): the api VERIFIES it on
      # POST /api/committee/regime + every /api/analytics/* route. Fail-closed:
      # unset locks those routes except under RM_ALLOW_INSECURE/ephemeral.
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-}
      # Projects data source (backend/src/projects/access/select.ts). Unset →
      # offline fixture source (demo/dev). FAIL-CLOSED IN PROD: RM_ENV=prod
      # REQUIRES PROJECTS_SOURCE=live — the projects pipelines throw rather
      # than serve fixture data as production. See .env.example.
      PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}
      COMMITTEE_NOTIFICATION_EMAIL_FROM: ${COMMITTEE_NOTIFICATION_EMAIL_FROM:-committee-demo@robotmoney.invalid}
      # Committee session-lifecycle cron cadence (issue #208). Read at
      # `bun run migrate` time (seed() -> resolveCommitteeSchedules) — this is
      # the SINGLE-BOX/prod compose file, so it explicitly enables the daily
      # 06:00-08:00 UTC sequence by default; docker-compose.demo.yml pins
      # COMMITTEE_SCHEDULES_ENABLED off (repo demo/e2e never auto-runs the
      # committee on its own). Staging overrides any of these per-kind crons
      # (or COMMITTEE_WINDOW_MINUTES) to an accelerated cadence via its own env.
      COMMITTEE_SCHEDULES_ENABLED: ${COMMITTEE_SCHEDULES_ENABLED:-1}
      COMMITTEE_OPEN_SESSION_CRON: ${COMMITTEE_OPEN_SESSION_CRON:-0 6 * * *}
      COMMITTEE_PUBLISH_BRIEF_CRON: ${COMMITTEE_PUBLISH_BRIEF_CRON:-0 7 * * *}
      COMMITTEE_CLOSE_WINDOW_CRON: ${COMMITTEE_CLOSE_WINDOW_CRON:-0 8 * * *}
      COMMITTEE_AGGREGATE_CRON: ${COMMITTEE_AGGREGATE_CRON:-0 9 * * *}
      COMMITTEE_PUBLISH_CRON: ${COMMITTEE_PUBLISH_CRON:-0 10 * * *}
      COMMITTEE_WINDOW_MINUTES: ${COMMITTEE_WINDOW_MINUTES:-60}
      # Serve the static frontend from this same process — no Caddy/nginx.
      STATIC_DIR: /srv/frontend
    ports:
      # HOST side: required, never defaulted (see this file's header) — a
      # `:-48787` fallback is precisely what raced the stage tunnel.
      # CONTAINER side: the literal 8787, deliberately NOT configurable. Each
      # container has its own network namespace, so nothing can contend for a
      # port inside it; there is no variability to express. All legitimate
      # variability is host-side and `WEB_PORT` already owns it. (The api
      # process's own default lives once, in backend/src/config.ts's
      # `Number(process.env.API_PORT ?? 8787)`, which is live for a host-side
      # `bun run` of the backend. The redundant `API_PORT: "8787"` that used to
      # sit in this service's environment was removed: it made the host `.env`
      # value look effective while compose overrode it, and it turned one port
      # into three places that had to agree with nothing checking them.)
      - "${WEB_PORT:?WEB_PORT is required - host ports are drawn free per run by scripts/stack/ports.ts and there is no default; use `bun demo --stage` for the pinned tunnel port, or set it explicitly for raw compose}:8787"
    volumes:
      - ./frontend/public:/srv/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-committee:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_LANE: committee

  worker-analytics:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_LANE: analytics

  worker-research:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_LANE: research

  # D21 retired the member-facing MCP server: committee members reach the
  # committee REST API on the `api` service directly (docs/decisions.md D21).

volumes:
  pgdata:
