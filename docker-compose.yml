# Single-box deployment (e.g. one DigitalOcean droplet).
#
# Two services answer HTTP: `api` (the JSON API only) and `website-server` (a
# plain nginx static file server for the assembled marketing/SPA/docs site,
# issue #892 — website-server/nginx.conf proxies /api/ and /health through to
# `api` so this stack still presents as one origin, matching frontend/public/
# config.js's same-origin default and this repo's own local dev/smoke/e2e
# harness, which loads pages from `backendUrl`). `api` no longer SERVES any
# static content — see website-server/Dockerfile — but still reads the same
# `_static` mount read-only, for AC-ID-03/T26 identity purposes only (see the
# STATIC_DIR comment on the api service; tracked for removal once the static
# bundle is baked into website-server's own image instead of assembled here).
#
# HOST PORTS ARE ASSIGNED BY DOCKER, NEVER BY US. Both published ports below
# use the container-port-only short form (`- "8787"`), which makes the Docker
# daemon pick a free host port and bind it ATOMICALLY. There is no host port to
# supply, no variable to interpolate, and nothing to collide over:
#
#   docker compose up -d postgres     # postgres lands on some free host port
#   docker compose port postgres 5432 # ask which one
#
# Why not draw the port ourselves first. The previous shape did exactly that —
# scripts/stack/ports.ts opened a socket on a free port, closed it, and passed
# the number in as `${WEB_PORT:?…}` / `${POSTGRES_PORT:?…}`. That is a TOCTOU
# race: between the close and compose's own bind, ANY other process on this box
# (a second demo, a concurrent job on the self-hosted runner, an unrelated
# service) can take the port, and the boot then fails — or worse, succeeds on a
# port somebody else believes they own. Making more stacks random made the race
# MORE likely, not less. Docker's own allocator has no such window.
#
# Read the assignment back with `docker compose -p <project> port <svc> <port>`
# (scripts/stack/ports.ts's parseComposePortOutput); `bun run smoke` prints both
# in its READY banner and records them in .agents/smoke-state.json.
#
# THE ONE FIXED PORT in the whole system is the stage tunnel origin, and it
# lives in its own overlay: docker-compose.stage.yml pins api to 48787 with
# `ports: !override`, applied only by `bun run smoke -- --stage`.
#
# Local dev / CI usually only needs Postgres:   docker compose up -d postgres
# Full box:                                     docker compose up -d
#
# DB modes are driven by DATABASE_URL + the postgres volume:
#   ephemeral (CI)  : run with a throwaway volume / `docker compose down -v`
#   demo            : named volume `pgdata` persists across restarts
#   prod            : point DATABASE_URL at an external/managed Postgres and run
#                     `api` + internal worker lanes + the scheduler + producer
#                     (docker compose up api worker-analytics worker-research system-scheduler analytics-producer)

# Task-queue worker lanes (issue #107): one container per execution lane. This
# IS the production/default lane topology:
#   worker-analytics — internal scheduled pipelines (vault/wallet/buybacks/
#                      projects), excluding research.%.
#   worker-research  — compatibility lane for unreachable legacy research.%
#                      queue handlers; D25 producer execution does not use it.
#   analytics-producer — owns regime/research timers and submits over REST; no
#                        DATABASE_URL or admin credential.
#
# THERE IS NO `worker-swarm` LANE (issue #1026). Session timing is not queue
# work and never was: it is a clock, and it now lives in its own container,
# `system-scheduler`, declared at the bottom of this file. System scheduler
# spec §1 — "`system-scheduler` is one long-running container. It replaces the
# process formerly called `worker-swarm`." The five `swarm.*` schedule rows,
# their cron variables and their enable flag went with it; smoke-production
# spec §6.3 — "There is nothing to enable … There are no schedule rows, no cron
# strings, no `next_run_at`, and no enable command."
# WORKER_LANE is REQUIRED by the worker entry (fails loudly when empty/unknown);
# WORKER_ID defaults to `<lane>-<pid>` (unique per container, lane-visible in
# locked_by/logs/admin dashboard). The producer is not a queue lane.
# Container log retention. Docker's json-file driver defaults to UNBOUNDED: a
# standing demo left up for days grows one log file per container until the host
# disk is the limit. These logs are the primary debugging surface for a crashing
# api or worker lane (`docker compose logs`, and the demo's own telemetry poll),
# so the answer is to bound them, not to turn them off.
#
# 10m x 3 per container: enough history to see a crash loop develop across
# several restarts, capped at ~30MB x 6 services. Applied to EVERY service —
# a service without it silently keeps the unbounded default.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Liveness for the lanes and the producer (backend/src/ops/heartbeat.ts).
#
# These four services deliberately carried NO healthcheck for a long time, and
# the reason still stands: Docker already restarts a lane whose process exits, so
# a check that only proves the process exists (`CMD true`, `pgrep bun`) buys
# nothing and actively lies — it paints a WEDGED worker green. The failure mode
# worth reporting is "alive but not making progress".
#
# What changed is that the loops now emit a signal that can tell those apart:
# each writes a heartbeat from INSIDE its work loop, carrying its own staleness
# budget, and this check just compares the file's age against that budget. A
# deadlocked loop stops writing and goes red; an IDLE lane keeps writing (a claim
# query that finds nothing is still a completed cycle) and stays green.
#
# `bun` rather than curl: the image is oven/bun:1.3.5, Debian-based, no curl —
# same constraint the api's check works around.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "bun", "run", "src/ops/healthcheck.ts"]
  interval: 15s
  timeout: 10s
  retries: 3
  # First-boot cover. A lane records its first heartbeat before touching the
  # database, so this only has to span container start; failures inside it are
  # not counted (acceptance: a slow start is not a failure).
  start_period: 40s

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      AUM_PRODUCER_REVISION: ${AUM_PRODUCER_REVISION:-}
      RM_BUILD_COMMIT: ${RM_BUILD_COMMIT:-}
      RM_BUILD_TAG: ${RM_BUILD_TAG:-}
  command: ["bun", "run", "src/worker/index.ts"]
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  logging: *default-logging
  healthcheck: *worker-healthcheck

# Shared worker env. The worker RUNS the projects.* cron pipelines, so a prod
# worker needs PROJECTS_SOURCE=live (fail-closed — unset throws in prod; unset
# elsewhere = offline fixture).
x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL}
  # Optional queue-scoped restricted role (migrations/0016_worker_role.sql):
  # point the worker's pool at rm_worker so DB permissions enforce that it can
  # never mutate analytics data tables (issue #106). Falls back to DATABASE_URL
  # when unset.
  WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
  # FAIL-CLOSED DEFAULT (D13). This interpolation default must never be reached:
  # scripts/stack/config.ts's buildComposeEnv() emits RM_ENV explicitly for every
  # service, so the value is a property of the stack config rather than of
  # whatever the operator's shell last exported. It used to default to `smoke`,
  # which meant a bare `docker compose up` — or any bring-up path that forgot to
  # emit it — silently disabled AC-MODEL-01's refusals in the api and worker.
  # `prod` is the strict/acceptance path: if the default IS ever reached, the
  # stack refuses a keyless or unpinned model instead of accepting one.
  RM_ENV: ${RM_ENV:-prod}
  PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}
  # Capability-specific cache controls. Blank/unset is intentionally passed
  # through: backend parsing treats it as absent, preserving the production
  # defaults (HTTP cache off; token-price cache 30s).
  HTTP_FETCH_CACHE_TTL_MS: ${HTTP_FETCH_CACHE_TTL_MS:-}
  TOKEN_PRICE_CACHE_TTL_MS: ${TOKEN_PRICE_CACHE_TTL_MS:-}
  # Base RPC endpoint + the SHARED rate budget (issue #709 / #651).
  # BASE_RPC_MAX_CALLS_PER_SEC is the one token bucket every chain read in the
  # app draws from — live samplers and the gap backfill alike — because the
  # provider meters PER-IP and a second limiter beside the first sums to 2x and
  # 429s them both. UNSET means the conservative built-in default (0.25 calls/s,
  # burst 5 — chain/base-rpc-client.ts), which also means the self-healing
  # backfill is ON. Set it to a measured value to go faster; set it to 0 to turn
  # pacing off entirely, which also stops the backfill (it refuses to run
  # unpaced). Passing it through here is still what makes an override reachable
  # inside the container at all.
  # (BASE_RPC_URL / BASE_RPC_SOURCE are deliberately NOT added here: their
  # absence from this allowlist is the pre-existing defect class tracked in
  # #641/#643, and fixing it belongs there rather than riding along on this
  # change. The code defaults they fall through to are the production values.)
  BASE_RPC_MAX_CALLS_PER_SEC: ${BASE_RPC_MAX_CALLS_PER_SEC:-}
  BASE_RPC_RATE_BURST: ${BASE_RPC_RATE_BURST:-}
  # Blast-radius bounds on the repair driver (worker/handlers/repair.ts).
  WALLET_BACKFILL_MAX_DAYS_PER_RUN: ${WALLET_BACKFILL_MAX_DAYS_PER_RUN:-}
  WALLET_BACKFILL_MAX_ATTEMPTS_PER_DAY: ${WALLET_BACKFILL_MAX_ATTEMPTS_PER_DAY:-}
  # Minimum spacing between GeckoTerminal OHLCV requests (a keyless 429 was
  # observed on the 6th call in ~15s). Unrelated to the Base RPC budget above.
  GECKO_OHLCV_MIN_INTERVAL_MS: ${GECKO_OHLCV_MIN_INTERVAL_MS:-}
  # (The consensus judge's knobs are NOT here, and no longer anywhere among the
  # worker lanes: the lane that ran `swarm.judge` is gone (issue #1026) and the
  # judge is a participant now, receiving its model key the way every
  # participant does — smoke-production spec §3 "the judge receives its key the
  # way every participant does, from `credential.json`". worker-analytics and
  # worker-research call no model, so this anchor carries no inference
  # credential at all.)
  # Optional per-call inference bound (issue #537), read by
  # scripts/lib/swarm/inference.ts's timeoutMs(). Declared with a NULL value —
  # not `${OPENCODE_TIMEOUT_MS:-}` — deliberately: the `:-` form resolves to the
  # EMPTY STRING when the knob is unset, and an empty string is not "unset" to
  # `Number(process.env.OPENCODE_TIMEOUT_MS ?? 120000)` — it is 0, i.e. an
  # instant timeout on every model call. The null form passes the host value
  # through when it exists and OMITS the variable entirely when it does not, so
  # the committed default stays in force. Asserted both ways in
  # scripts/tests/integration/demo-compose-config.test.ts.
  OPENCODE_TIMEOUT_MS:

services:
  postgres:
    # DELIBERATELY NOT the same pin as scripts/lib/postgres-image.ts,
    # which is 18 because it stands in for production (DO Managed Postgres,
    # 18.6) in the test harness and the rollout tooling's digital twin. This
    # service is neither: it is the demo / single-box stack, and it owns a
    # PERSISTENT data directory — the `pgdata` volume below, or a host dir
    # under `bun run smoke -- --pg-data`, whose documented contract is that the
    # same value on a later boot resumes the same data (docs/architecture.md
    # "Postgres data location"). A data directory initialised by one major is
    # not readable by another, so moving this to 18 is a dump-and-restore for
    # every existing demo box, not a string edit. It needs to be its own piece
    # of work; do not bump it here in passing (issue #691 was scoped to the
    # harness on purpose).
    image: postgres:17-alpine
    logging: *default-logging
    environment:
      PG_POOL_MAX: "2"
      POSTGRES_USER: ${POSTGRES_USER:-robotmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robotmoney}
      POSTGRES_DB: ${POSTGRES_DB:-robotmoney}
    ports:
      # CONTAINER PORT ONLY — Docker picks the host port (see this file's
      # header). Nothing outside the compose network routes to postgres — api
      # and the worker lanes reach it by service name — so this publish exists
      # only for host-side psql. A predictable :5432 collided with whatever
      # postgres the dev box already runs; a self-drawn "free" port raced
      # whoever grabbed it in the gap before compose bound it. Docker assigning
      # it has neither failure mode. Postgres is Docker-assigned even under
      # `--stage`: the stage overlay pins the api port and nothing else.
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robotmoney}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AUM_PRODUCER_REVISION: ${AUM_PRODUCER_REVISION:-}
        RM_BUILD_COMMIT: ${RM_BUILD_COMMIT:-}
        RM_BUILD_TAG: ${RM_BUILD_TAG:-}
    command: ["bun", "run", "src/api/index.ts"]
    environment:
      
      DATABASE_URL: ${DATABASE_URL}
      # FAIL-CLOSED DEFAULT (D13). This interpolation default must never be reached:
      # scripts/stack/config.ts's buildComposeEnv() emits RM_ENV explicitly for every
      # service, so the value is a property of the stack config rather than of
      # whatever the operator's shell last exported. It used to default to `smoke`,
      # which meant a bare `docker compose up` — or any bring-up path that forgot to
      # emit it — silently disabled AC-MODEL-01's refusals in the api and worker.
      # `prod` is the strict/acceptance path: if the default IS ever reached, the
      # stack refuses a keyless or unpinned model instead of accepting one.
      RM_ENV: ${RM_ENV:-prod}
      # website-server (nginx) now sits in front of `api` for EVERY request in
      # every composition this file resolves (issue #892) — website-server/
      # nginx.conf forwards X-Real-IP/X-Forwarded-For/X-Forwarded-Proto to
      # api:8787. Without this, backend/src/api/index.ts's clientIp falls back
      # to the raw TCP peer, which is now website-server's docker-network
      # address for EVERY request — silently collapsing per-IP rate limiting
      # and the comments/submissions ip_hash audit field to one shared
      # identity, with no error. A hardcoded literal, not `${TRUST_PROXY:-1}`:
      # this topology always has website-server in front, so there is no
      # legitimate operator override to leave room for, and an ambient shell
      # value must never be able to silently turn this back off.
      # scripts/tests/integration/smoke-compose-config.test.ts asserts this
      # resolves to "1" in every composition (base/smoke/stage).
      TRUST_PROXY: "1"
      # The handle/id namespace boot guard's two operator controls (issue #602):
      # its escape hatch and its wall-clock budget. ENUMERATED HERE BECAUSE THIS
      # BLOCK IS AN ALLOWLIST — there is no `env_file:` in any compose file here,
      # so a variable that is not named here NEVER reaches the container at RUN
      # time. The one exception is deliberate and is the opposite of a leak:
      # backend/Dockerfile bakes AUM_PRODUCER_REVISION and RM_BUILD_COMMIT /
      # RM_BUILD_TAG as ENV from its build args, because those are properties of
      # the IMAGE rather than of a deployment. They must NOT be repeated in this
      # block — an `environment:` entry with a blank default would override the
      # baked value with the empty string and erase the identity /version
      # reports. Without the two lines below the runbook's
      # emergency override (§2.1) is a silent no-op: the operator sets it in the
      # droplet env, redeploys, and the api's refusal log still tells them to set
      # the variable they just set. Blank default = unset inside the container,
      # so the guard keeps its fail-closed default and its 8000ms budget.
      # scripts/tests/integration/demo-compose-config.test.ts asserts both keys
      # resolve here, in every composition, from real `docker compose config`.
      RM_ALLOW_HANDLE_NAMESPACE_VIOLATION: ${RM_ALLOW_HANDLE_NAMESPACE_VIOLATION:-}
      PG_NAMESPACE_GUARD_TIMEOUT_MS: ${PG_NAMESPACE_GUARD_TIMEOUT_MS:-}
      # No API_PORT here on purpose — see the `ports:` comment below. The api
      # listens on backend/src/config.ts's 8787 default, which is the single
      # source of truth for the container-internal port.
      # Guards the privileged surface incl. the /admin task-queue dashboard
      # (X-Admin-Token). The api process is the one that authenticates HTTP; the
      # demo sets a random per-launch value (worker doesn't serve the API).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:-}
      # Analytics-provider bearer credential (issue #106): the api VERIFIES it on
      # POST /api/swarm/regime + every /api/analytics/* route. Fail-closed:
      # unset locks those routes except under RM_ALLOW_INSECURE/ephemeral.
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-}
      ANALYTICS_TOKEN_FILE: /run/secrets/analytics_token
      # Passkey relying-party origin/host (issue #617): cloudflared terminates
      # TLS in front of this plain-HTTP Bun server, so the request's own
      # url.origin is http://... while the browser's real origin is
      # https://... — WebAuthn verification compares origin including scheme
      # and fails. relyingParty() in admin-webauthn.ts prefers these when set;
      # unset falls back to url.origin, which is correct for a direct (no
      # proxy) boot but wrong behind the tunnel. See .env.example.
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      # Projects data source (backend/src/projects/access/select.ts). Unset →
      # offline fixture source (demo/dev). FAIL-CLOSED IN PROD: RM_ENV=prod
      # REQUIRES PROJECTS_SOURCE=live — the projects pipelines throw rather
      # than serve fixture data as production. See .env.example.
      PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}
      # Optional capability TTLs. Blank/unset preserves backend defaults.
      HTTP_FETCH_CACHE_TTL_MS: ${HTTP_FETCH_CACHE_TTL_MS:-}
      TOKEN_PRICE_CACHE_TTL_MS: ${TOKEN_PRICE_CACHE_TTL_MS:-}
      # NO SESSION-SCHEDULING VARIABLE IS DECLARED HERE, and that is the whole
      # of issue #1026. There used to be seven — an enable flag and six cadence
      # knobs read at seed time. A subject's epoch duration is now the entire
      # schedule: set by the bootstrap data on a blank database, changed
      # afterwards only through the admin API, and never disabled (system
      # scheduler spec §2.2, §2.3, §2.4). Smoke-production spec §6.3 states the
      # consequence for this file: "There is nothing to enable … There are no
      # schedule rows, no cron strings, no `next_run_at`, and no enable
      # command." An operator looking for the knob is looking for a subject.
      #
      # `AUTOMATION_TOKEN` above is the api's side of the credential
      # `system-scheduler` presents; the scheduler's own copy is a FILE, never
      # an env var (smoke-production spec §3).
      # Consensus judge (issue #752). ITS ON/OFF SWITCH IS NOT HERE, and neither
      # is WHICH MODEL it uses — both are columns on `swarm_judge_config`, set
      # over POST /api/swarm/admin/judge without restarting anything. The model
      # is a row rather than a `SWARM_JUDGE_MODEL` env var because D22 rule 1
      # keeps model selection to one reviewable signal. What is left here is the
      # shared OpenCode Zen credential (the member agents' existing key, not a
      # second one), the endpoint, and the per-call bound. All blank by default.
      # An unconfigured model no longer means template prose and a recorded
      # reason (issue #969): `shadow`/`enforce` REQUIRE a model, and a judge
      # that cannot be reached stops the judging rather than authoring prose
      # under its own name and letting it reach a signed receipt.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      SWARM_JUDGE_BASE_URL: ${SWARM_JUDGE_BASE_URL:-}
      SWARM_JUDGE_TIMEOUT_MS: ${SWARM_JUDGE_TIMEOUT_MS:-}
      # THE TEST-ONLY JUDGE FAULT-INJECTION LEVER (R13, backend/src/swarm/
      # judge-fault-injection.ts). This service arms/disarms the row over
      # POST /api/swarm/admin/judge/fault-injection (swarm/admin.ts), and
      # `assertFaultInjectionAllowed()` runs on THIS process's env before that
      # write — a row armed without the flag present here is refused at arm
      # time, not merely inert. Blank by default so no deployment honours a
      # fault-injected judge unless an operator explicitly sets these.
      SWARM_JUDGE_FAULT_INJECTION: ${SWARM_JUDGE_FAULT_INJECTION:-}
      SWARM_JUDGE_FAULT_INJECTION_ACCEPTANCE_OPT_IN: ${SWARM_JUDGE_FAULT_INJECTION_ACCEPTANCE_OPT_IN:-}
      # READ-ONLY, FOR AC-ID-03/T26 IDENTITY ONLY (issue #892 follow-up tracked
      # separately: this mount should not exist by the time that work lands —
      # the static bundle should be baked into website-server's own image, and
      # deploy-time should only write/check a small identity JSON, never build
      # anything). website-server, not this process, SERVES the SPA from the
      # same underlying `_static` directory; api reads the manifest here purely
      # to compare its own build identity against what was assembled.
      STATIC_DIR: /srv/frontend
    ports:
      # HOST side: ABSENT on purpose — the short form publishes the container
      # port on a host port the Docker daemon picks and binds atomically (see
      # this file's header for why that beats drawing one ourselves). A
      # `:-48787` fallback here is precisely what raced the stage tunnel, and
      # the self-drawn replacement traded that collision for a TOCTOU one.
      # `docker compose -p <project> port api 8787` reports the assignment.
      # CONTAINER side: the literal 8787, deliberately NOT configurable. Each
      # container has its own network namespace, so nothing can contend for a
      # port inside it; there is no variability to express, and all legitimate
      # variability is host-side. (The api process's own default lives once, in
      # backend/src/config.ts's `Number(process.env.API_PORT ?? 8787)`, which is
      # live for a host-side `bun run` of the backend. The redundant
      # `API_PORT: "8787"` that used to sit in this service's environment was
      # removed: it made the host `.env` value look effective while compose
      # overrode it, and it turned one port into three places that had to agree
      # with nothing checking them.)
      #
      # docker-compose.stage.yml REPLACES this line (`ports: !override`) with
      # the pinned 48787 the cloudflared tunnel routes to. Compose merges
      # `ports` by APPENDING, so the overlay must override rather than add —
      # otherwise --stage would publish 48787 AND a second ephemeral port.
      - "8787"
    volumes:
      # READ-ONLY, FOR AC-ID-03/T26 IDENTITY ONLY — api does not serve from
      # this mount (website-server does). See the STATIC_DIR comment above.
      - ./_static:/srv/frontend:ro
    secrets:
      - analytics_token
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Docker-side health for the ONE service that can answer a meaningful
    # question about itself. /health probes the database (`SELECT 1`), so this
    # distinguishes "process alive" from "actually serving" — an api that has
    # lost its database reports unhealthy instead of quietly failing requests.
    # `bun` rather than curl: the image is oven/bun and carries no curl.
    # start_period covers first-boot migration; failures before it do not count.
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8787/health')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Static/SPA/docs file server, split out of the api image (issue #892):
  # `_static/` is a build output (scripts/static-assembly.sh), never the raw
  # source tree — see the api service's old volumes comment (git history) for
  # why mounting `frontend/public` directly breaks every route's metadata.
  # website-server/nginx.conf proxies /api/ and /health to the api service and
  # replicates the old routeShell() fallback order for everything else.
  website-server:
    build:
      context: ./website-server
      dockerfile: Dockerfile
    volumes:
      - ./_static:/srv/frontend:ro
    ports:
      # Docker-assigned host port, same convention as every other service in
      # this file (see the header comment) — CONTAINER side is nginx.conf's
      # fixed `listen 8080`.
      - "8080"
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-analytics:
    <<: *worker-base
    environment:
      PG_POOL_MAX: "2"
      <<: *worker-env
      WORKER_LANE: analytics
      # `analytics.parity_sweep` (issue #979 fix) claims on this lane and now
      # calls the API process over authenticated HTTP (analytics/api-client.ts
      # triggerParitySweep()) instead of holding its own rm_app-credentialed
      # pool — same ANALYTICS_API_URL + analytics_token wiring as
      # analytics-producer below, declared HERE (not the shared *worker-env
      # anchor) so worker-research never receives a credential it has no job
      # kind that needs.
      ANALYTICS_API_URL: http://api:8787
      ANALYTICS_TOKEN_FILE: /run/secrets/analytics_token
    secrets:
      - analytics_token

  worker-research:
    <<: *worker-base
    environment:
      
      <<: *worker-env
      WORKER_LANE: research

  # THE CLOCK (issue #1026). One long-running container that holds one timer per
  # active subject, fires each subject's epoch boundary, drives settlement and
  # rebuilds all of it from the API after any interruption. System scheduler
  # spec §1: "`system-scheduler` is one long-running container. It replaces the
  # process formerly called `worker-swarm`. There is no separate clock process
  # and no separate executor process."
  #
  # WHY THIS SERVICE CARRIES NO DATABASE CREDENTIAL. Spec §1's role table says
  # of the scheduler's database connection: "**No.** Never." §7 spells out what
  # that leaves it: "`system-scheduler` holds exactly one: an **API
  # credential**, an automation token with the rights to read subjects and
  # sessions and to perform lifecycle transitions. It signs nothing, so it has
  # no signing key … It never touches the database, so it has no role password.
  # It calls no model, so it has no model key. It holds no Docker socket."
  #
  # So the absences below are the specification, not an oversight, and each one
  # is load-bearing:
  #   - no DATABASE_URL / WORKER_DATABASE_URL — the clock cannot read or write
  #     state directly, so a scheduler bug cannot corrupt a session; every
  #     transition goes through the API's own authorization and invariants.
  #   - no model-vendor key of any kind — it calls no model. Takes and
  #     judgements are participants' work (smoke-production spec §6). (The
  #     variable is deliberately not spelled out here: no-inline-judge.test.ts
  #     reads this file as service blocks and a mention inside a comment is
  #     indistinguishable from a declaration.)
  #   - no RM_CREDENTIALS / signing key — it authors nothing that is signed.
  #   - no /var/run/docker.sock — smoke-production spec §3: "No container holds
  #     a Docker socket. Not a participant, and not `api`, `worker` or
  #     `system-scheduler` either." Nothing is spawned at runtime.
  # `scripts/tests/unit/system-scheduler-health.test.ts` asserts the module
  # graph that makes the first absence true by construction rather than by
  # discipline, and no-docker-socket-compose-config.test.ts asserts the last.
  #
  # NOT `*worker-base`: that anchor sets the worker entrypoint, a
  # `depends_on: postgres` and the heartbeat healthcheck read out of the
  # database — all three wrong here. The `build:` block is spelled out instead
  # so this still ships from the one image the rest of the stack ships from
  # (scripts/stack/images.ts's SHIPPED_IMAGE_SERVICES).
  system-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AUM_PRODUCER_REVISION: ${AUM_PRODUCER_REVISION:-}
        RM_BUILD_COMMIT: ${RM_BUILD_COMMIT:-}
        RM_BUILD_TAG: ${RM_BUILD_TAG:-}
    command: ["bun", "run", "scripts/system-scheduler.ts"]
    environment:
      # The API this clock drives. A service name on the compose network, not a
      # published host port: nothing outside the stack routes to it, and spec §1
      # gives the API sole ownership of state, so this is the scheduler's only
      # channel to anything.
      SCHEDULER_API_URL: http://api:8787
      # THE ONE CREDENTIAL, AND IT IS A PATH, NOT A SECRET. Smoke-production
      # spec §3: the token is "handed to the container the way a participant's
      # key is handed to its container — a file the boot places in the
      # instance's state directory, named per instance, never in `~/.env` and
      # never in the image." An `environment:` entry holding the token itself
      # would be visible in `docker inspect`, inherited by every child process,
      # and committed into whatever file an operator generated it from; a path
      # to a read-only mount is none of those. Rotation is a re-provision by the
      # boot plus a restart of this container, with no edit to this file.
      SCHEDULER_TOKEN_FILE: /run/rm-state/${RM_INSTANCE:-default}-scheduler-token
      # Explicit rather than relying on readSchedulerEnv()'s 8090 default, so
      # the healthcheck below and the process cannot disagree silently.
      SCHEDULER_HEALTH_PORT: "8090"
    volumes:
      # The instance's state directory, READ-ONLY — the scheduler only ever
      # reads its token from it, and a clock that can write to the directory
      # holding a deployment's credentials has more authority than §7 gives it.
      # The host path is the instance directory under stateRoot() (see
      # scripts/lib/smoke-state.ts); the interpolation default only exists so a
      # bare `docker compose config` parses, and a boot that means to run this
      # service always supplies the real one.
      - ${RM_INSTANCE_STATE_DIR:-./.agents/state}:/run/rm-state:ro
    depends_on:
      # Start ordering only, deliberately not `condition: service_healthy`: the
      # process serves its own health surface BEFORE its first rebuild
      # (scripts/system-scheduler.ts step 3) precisely so an operator watching a
      # scheduler that cannot reach its API sees WHY rather than a refused
      # connection. Gating the start on api health would hide that.
      - api
    restart: unless-stopped
    logging: *default-logging
    # Spec §6.3 of smoke-production defines scheduler readiness — authenticated,
    # stream synchronized, initial rebuild complete, every active subject
    # holding a `collecting` session — and the process answers exactly that on
    # /health: 200 when all of it holds, 503 with the degradation and its
    # subject/session otherwise. So an HTTP status IS the whole check; nothing
    # here has to know the semantics.
    #
    # `bun -e` rather than curl or wget, for the same reason the api service
    # uses it: the image is oven/bun:1.3.5 and carries neither.
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8090/health')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Covers container start plus the startup check and the first rebuild. A
      # scheduler still rebuilding is honestly 503, and a slow start is not a
      # failure.
      start_period: 60s

  # Independent external producer (issue #361 Phase 4): no DATABASE_URL, no
  # queue access, no ADMIN_TOKEN. It computes regime/research outputs in its own
  # container and can persist only through the analytics REST submission gate.
  analytics-producer:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AUM_PRODUCER_REVISION: ${AUM_PRODUCER_REVISION:-}
        RM_BUILD_COMMIT: ${RM_BUILD_COMMIT:-}
        RM_BUILD_TAG: ${RM_BUILD_TAG:-}
    command: ["bun", "run", "src/producer/index.ts", "serve"]
    environment:
      
      ANALYTICS_API_URL: http://api:8787
      ANALYTICS_TOKEN_FILE: /run/secrets/analytics_token
      ANALYTICS_SOURCE: ${ANALYTICS_SOURCE:-}
      # This process performs HTTP extraction but never token-price lookup.
      HTTP_FETCH_CACHE_TTL_MS: ${HTTP_FETCH_CACHE_TTL_MS:-}
      PRODUCER_REGIME_CRON: ${PRODUCER_REGIME_CRON:-30 22 * * *}
      PRODUCER_RESEARCH_CRON: ${PRODUCER_RESEARCH_CRON:-0 23 * * *}
    secrets:
      - analytics_token
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    # Same file, same comparator as the lanes — but this process has no drain
    # loop to speak for it (it owns two daily crons and an otherwise idle event
    # loop), so what it reports is that both crons are still armed and that the
    # REST gate it must submit through is answering. See the liveness block in
    # backend/src/producer/index.ts for why that is the honest signal here.
    healthcheck:
      <<: *worker-healthcheck
      # Longer than the lanes'. On a fresh database this process does real work
      # for many minutes before the liveness loop exists: waitForApi (up to
      # 120s), then a boot catch-up that repairs up to 14 EDGAR days one at a
      # time. It stays green through all of it on records written from inside
      # that work — a `boot` record before the API wait, then one per day from
      # each catch-up loop (src/producer/index.ts). This window only has to
      # cover container start up to that first record.
      start_period: 300s

  # D21 retired the member-facing MCP server: swarm members reach the
  # swarm REST API on the `api` service directly (docs/decisions.md D21).

volumes:
  pgdata:

secrets:
  analytics_token:
    # Compose resolves every top-level secret even when the requested command
    # only targets postgres/core services (or is merely `config`, `ps`, or
    # `down`).  Keep parsing independent of producer launch; the shared full
    # stack preflight validates a real non-empty file before `up`, and the
    # producer itself refuses to boot from this empty sentinel.
    file: ${ANALYTICS_TOKEN_FILE_HOST:-/dev/null}
