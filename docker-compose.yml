# Single-box deployment (e.g. one DigitalOcean droplet). No reverse proxy: the
# `api` process serves BOTH the JSON API and the static frontend (STATIC_DIR),
# so there's nothing else to run in front of it.
#
# Local dev / CI usually only needs Postgres:   docker compose up -d postgres
# Full box:                                      docker compose up -d
#
# DB modes are driven by DATABASE_URL + the postgres volume:
#   ephemeral (CI)  : run with a throwaway volume / `docker compose down -v`
#   demo            : named volume `pgdata` persists across restarts
#   prod            : point DATABASE_URL at an external/managed Postgres and run
#                     only `api` + the worker lanes
#                     (docker compose up api worker-committee worker-analytics worker-research)

# Task-queue worker lanes (issue #107): one container per execution lane. This
# IS the production/default lane topology:
#   worker-committee — RESERVED for interactive committee session-lifecycle
#                      jobs (committee.%); no other lane may claim them.
#   worker-analytics — regime classification + the scheduled data pipelines
#                      (everything except committee.% / research.%).
#   worker-research  — research.% only, so a slow/blocked research fetch can
#                      never occupy a committee or regime slot.
# WORKER_LANE is REQUIRED by the worker entry (fails loudly when empty/unknown);
# WORKER_ID defaults to `<lane>-<pid>` (unique per container, lane-visible in
# locked_by/logs/admin dashboard). Scale a lane independently, e.g.
# `docker compose up -d --scale worker-research=2`.
x-worker-base: &worker-base
  build:
    context: .
    dockerfile: backend/Dockerfile
  command: ["bun", "run", "src/worker/index.ts"]
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

# Shared worker env. The worker RUNS the projects.* cron pipelines, so a prod
# worker needs PROJECTS_SOURCE=live (fail-closed — unset throws in prod; unset
# elsewhere = offline fixture).
x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL}
  RM_ENV: ${RM_ENV:-demo}
  PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robotmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robotmoney}
      POSTGRES_DB: ${POSTGRES_DB:-robotmoney}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robotmoney}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["bun", "run", "src/api/index.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RM_ENV: ${RM_ENV:-demo}
      API_PORT: "8787"
      # Guards the privileged surface incl. the /admin task-queue dashboard
      # (X-Admin-Token). The api process is the one that authenticates HTTP; the
      # demo sets a random per-launch value (worker doesn't serve the API).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Projects data source (backend/src/projects/access/select.ts). Unset →
      # offline fixture source (demo/dev). FAIL-CLOSED IN PROD: RM_ENV=prod
      # REQUIRES PROJECTS_SOURCE=live — the projects pipelines throw rather
      # than serve fixture data as production. See .env.example.
      PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}
      # Serve the static frontend from this same process — no Caddy/nginx.
      STATIC_DIR: /srv/frontend
    ports:
      - "${WEB_PORT:-48787}:8787"
    volumes:
      - ./frontend/public:/srv/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-committee:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_LANE: committee

  worker-analytics:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_LANE: analytics

  worker-research:
    <<: *worker-base
    environment:
      <<: *worker-env
      WORKER_LANE: research

  # Member-facing MCP server (committee). Talks to the API by service name.
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    environment:
      BACKEND_URL: http://api:8787
      MCP_PORT: "8788"
    ports:
      - "${MCP_PORT:-48788}:8788"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
