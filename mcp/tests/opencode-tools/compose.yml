services:
  fixture-backend:
    build:
      context: ../../..
      dockerfile: mcp/tests/opencode-tools/Dockerfile
      target: service
    command: ["bun", "run", "tests/opencode-tools/fixture-backend.ts"]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:8787/health');process.exit(r.ok?0:1)"]
      interval: 1s
      timeout: 2s
      retries: 30

  mcp:
    build:
      context: ../../..
      dockerfile: mcp/tests/opencode-tools/Dockerfile
      target: service
    command: ["bun", "run", "src/server.ts"]
    environment:
      BACKEND_URL: http://fixture-backend:8787
      MCP_PORT: "8788"
      MCP_IDLE_TIMEOUT_SECONDS: "120"
    depends_on:
      fixture-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:8788/health');process.exit(r.ok?0:1)"]
      interval: 1s
      timeout: 2s
      retries: 30

  agent:
    build:
      context: ../../..
      dockerfile: mcp/tests/opencode-tools/Dockerfile
      target: agent
    command: ["bun", "run", "tests/opencode-tools/agent-probe.ts"]
    depends_on:
      fixture-backend:
        condition: service_healthy
      mcp:
        condition: service_healthy

