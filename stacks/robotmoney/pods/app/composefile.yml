# app pod — the api process. Serves BOTH the JSON API and the static frontend
# (STATIC_DIR), so there is no reverse proxy of our own; stack's ingress is the
# only thing in front of it.
services:
  api:
    # NOT `build:`. stack builds robotmoney/api (stack.yml -> containers/api/
    # build.sh) and tags it `<name>:stack`; the composefile references that tag.
    # This is the single biggest shape difference from docker-compose.yml.
    image: robotmoney/api:stack
    # DATABASE_URL IS ASSEMBLED AT CONTAINER START, NOT IN YAML.
    #
    # `DATABASE_URL: postgres://robotmoney:${POSTGRES_PASSWORD}@postgres:5432/...`
    # does NOT work on the k8s target and does not fail either — it renders to
    # `postgres://robotmoney:@postgres:5432/robotmoney`, with the password
    # silently empty. Compose-level `${}` substitution happens when stack
    # generates the manifest; the secret only arrives later, as a secretKeyRef
    # the kubelet resolves at container start. The two never meet.
    # Verified 2026-08-20 by reading the delivered env off the Deployment.
    #
    # backend/src/config.ts:552 requires DATABASE_URL itself (`required(...)`)
    # and accepts no PGHOST/PGUSER/PGPASSWORD parts, so the shell has to build
    # it from the injected variable.
    command:
      - sh
      - -c
      - |
        export DATABASE_URL="postgres://robotmoney:${POSTGRES_PASSWORD}@postgres:5432/robotmoney"
        exec bun run src/api/index.ts
    environment:
      # NOT "staging". backend/src/config.ts:539 pins VALID_ENVS to
      # ephemeral | demo | prod and THROWS on anything else — this app has no
      # staging value, so the staging environment must run `prod` semantics.
      # `demo` here keeps the ad-hoc box off the fail-closed prod paths.
      RM_ENV: demo
      # MUST be set explicitly on k8s, and docker-compose.yml deliberately does
      # NOT set it. Kubernetes injects legacy service-link variables named
      # <SERVICE>_PORT for every service in the namespace; our service is called
      # `api`, so the container receives API_PORT=tcp://10.43.x.x:8787.
      # backend/src/config.ts:553 is `Number(process.env.API_PORT ?? 8787)` —
      # `??` does not catch NaN, so the api binds a RANDOM port while the
      # Service still targets 8787 and nothing routes. The pod reports 1/1
      # Running throughout. An explicitly declared env var wins over a service
      # link, which is what makes this the fix.
      API_PORT: "8787"
      # ADMIN_TOKEN / AUTOMATION_TOKEN / ANALYTICS_TOKEN are declared secrets;
      # stack injects them into every container of the deployment, so they are
      # deliberately NOT restated here.
      #
      # NOTE: docker-compose.yml's `environment:` block is an explicit ALLOWLIST
      # — it has no `env_file:` and the Dockerfile sets no ENV, so a variable
      # not named there never reaches the container. stack's deployment-wide
      # secret injection is the opposite default. That difference is worth
      # stating loudly in the docs; it is a real change in blast radius.
      STATIC_DIR: /srv/frontend
      SWARM_SCHEDULES_ENABLED: "1"
    ports:
      - "8787"   # @stack http-proxy /
    healthcheck:
      # /health probes the database (SELECT 1), so this distinguishes "process
      # alive" from "actually serving". `bun` rather than curl: the oven/bun
      # image carries no curl.
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:8787/health')).ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
