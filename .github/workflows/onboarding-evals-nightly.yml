# Nightly serverless onboarding evals, named by CLAIM (issue #279).
#
# WHY THIS WORKFLOW EXISTS
# `bun demo` reports onboarding health as one opaque red — admitted-zero-
# members — across a four-step funnel. Four isolated, keyless-capable,
# serverless evals under evals/onboarding/isolated/ bisect that funnel to the
# failing step: `runtime` (is the agent alive at all?), `skill-install`,
# `toolchain`, and `keygen-signing`. `runtime` GATES the run — a red runtime
# means the other three measured nothing about the product and report
# `not-measured`, never `failed` (evals/onboarding/support/gating.ts). None of
# the four boot a server (docs/architecture.md §11.3 E3: layers 0-3 need none).
#
# CI taxonomy class: heavy — sweep-only, so this workflow carries NO
# `pull_request` trigger. Every timeout below is DERIVED from
# evals/onboarding/support/budget.ts (`ISOLATED_JOB_BUDGET`), never a
# hand-written literal — scripts/tests/unit/onboarding-eval-budget.test.ts
# recomputes the same numbers from that module and pins them against this
# file, and scripts/tests/unit/onboarding-evals-nightly-workflow.test.ts pins
# this workflow's CI_CLASS, triggers, and teardown scope.
#
# RUNTIME-FIRST EXECUTION ORDER. Bun does not serialise multiple test files
# given to one `bun test` invocation in the order they were listed (confirmed
# empirically while building this suite), so `runtime` runs to completion in
# its OWN `bun test` process first; the second process (the other three
# claims) only starts once that first process has fully exited and its
# outcome handoff file is flushed to disk. Both processes are wrapped in the
# ONE package.json target `eval:onboarding:isolated` this step runs, and its
# combined exit code reflects either process failing.
name: onboarding-evals-nightly
env:
  CI_CLASS: heavy
on:
  # DISPOSITION (issue #373): FOLDED into the merge-to-main set. Nothing here
  # duplicates a check the merge set already runs — the four isolated claims
  # bisect the onboarding funnel that e2e.yml's single end-to-end admission
  # only reports as one opaque red — so this belongs in BOTH places, not on a
  # schedule alone. Nightly is now the mirror of what a merge runs.
  push:
    branches: [main]
  schedule:
    - cron: "18 5 * * *" # nightly 05:18 UTC — offset from e2e.yml's 04:37 so the two heavy suites don't contend
  workflow_dispatch: {}

jobs:
  onboarding-evals-isolated:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    # Derived from budget.ts's ISOLATED_JOB_BUDGET.jobTimeoutMinutes — a CI
    # backstop ABOVE every in-test timeout, never the primary bound.
    timeout-minutes: 201
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1
      # Real inference, always (D22 rule 2 / §11.3 E2): no mock, no injection
      # seam, no conditional skip. A missing OPENCODE_API_KEY, a missing Docker
      # daemon, or missing egress fails this step loudly rather than passing by
      # absence — see evals/onboarding/support/run.ts's
      # resolveIsolatedEvalModelConfig.
      - name: Run the isolated onboarding evals (runtime, skill-install, toolchain, keygen-signing)
        run: bun run eval:onboarding:isolated
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        # Derived from budget.ts's ISOLATED_JOB_BUDGET.stepTimeoutMinutes —
        # strictly above every claim's own in-test timeout, so the in-test
        # bound always fires first and a SIGKILL can never eat the
        # classification.
        timeout-minutes: 191
      # Containers/networks/volumes ONLY — never images, which is what keeps
      # this nightly's Docker build cache warm across runs. The isolated
      # claims mint their own `rmeval_<claim>_<random>` compose project per run
      # (evals/onboarding/support/eval-stack.ts's evalProject), so a killed
      # step cannot be torn down by one known project name; this scans by the
      # shared name prefix instead, exactly the way committee-opencode-
      # nightly.yml's teardown scans by its own known project name.
      - name: Tear down any leaked rmeval_* containers/networks/volumes (image cache preserved)
        if: always()
        run: |
          set -u
          echo "::group::rmeval_* containers"
          docker ps -a --filter "name=rmeval_" -q | xargs -r docker rm -f
          echo "::endgroup::"
          echo "::group::rmeval_* networks"
          docker network ls --filter "name=rmeval_" -q | xargs -r docker network rm
          echo "::endgroup::"
          echo "::group::rmeval_* volumes"
          docker volume ls --filter "name=rmeval_" -q | xargs -r docker volume rm
          echo "::endgroup::"
