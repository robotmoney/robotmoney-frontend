# Runs the backend test suite on every push/PR. The suite is self-contained: its
# preload starts an ephemeral Postgres via Docker (available on ubuntu-latest) and
# applies migrations, then tears it down — the SAME harness used locally, so there
# is no CI-specific behavior. A missing Docker/Postgres fails the run loudly.
name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install deps
        working-directory: backend
        run: bun install
      - name: Run tests (ephemeral Postgres via Docker)
        working-directory: backend
        run: bun test
