# e2e, domain 3 of 4: the WEB client against a LIVE stack. The core-surface
# checks (scripts/smoke-frontend-check.ts, the loud-failure guard that keeps a
# broken smoke off main; self-tested by scripts/tests/integration/
# smoke-frontend-check.test.ts) and the Playwright specs (`bun run test:browser`)
# with BACKEND_URL pointed at the stack the boot left up.
#
# The specs that stub `/api/**` themselves also run, with no stack, in
# web-client.yml (D45). The ones that need a real api, named in
# scripts/web-client/static-specs.ts, run only here. See e2e-lifecycle.yml for
# how the four e2e-*.yml domains divide the old e2e.yml, and for the CI taxonomy
# class and draft deferral that apply here too.
name: e2e-web
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main, "releases-*", "fusion/**"]
  schedule:
    - cron: "27 4 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  # ── change detection ───────────────────────────────────────────────────────
  changes:
    # Plumbing, not an assurance job: it must run in every context so the e2e
    # job below has a filter output to gate on.
    env:
      CI_CLASS: ignore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      # `every`: a file is relevant only if it matches ALL patterns, i.e. it is
      # a path (`**`) that is on none of the skip entries (`!...`). The filter
      # is true when ANY changed file is relevant.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            e2e:
              - '**'
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!brand-assets/**'
              - '!goldens/**'
              - '!frontend/test/**'
              - '!frontend/public/views/**'
              - '!frontend/public/data/**'
              - '!frontend/public/skills/**'
              - '!frontend/public/blog/**'
              - '!frontend/public/avatars/**'
              - '!frontend/public/assets/img/**'
              - '!scripts/tests/unit/**'
              - '!scripts/web-client/**'

  e2e-web:
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    # The ceiling for the whole job. The specs took ~10 minutes live; the rest is
    # headroom for a slow provider.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Boot a LIVE smoke stack
        id: stack
        uses: ./.github/actions/e2e-setup
        with:
          browser: "true"
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          agent-model: ${{ vars.AGENT_MODEL || '' }}
      # The specs read the published swarm sessions the session driver files
      # (spa.spec.ts resolves the seeded "woon" session, swarm-receipts.spec.ts a
      # server-verified take). The blank boot has none, so this domain runs the
      # driver first, as the old single e2e job did. The first live run failed
      # without it.
      - name: Swarm session (seeds the published sessions the specs read)
        run: bun --no-env-file scripts/smoke-ci-checks.ts --check swarm-session
        env:
          CI: "true"
          RM_ENV: stage
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || '' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Core-surface checks (smoke-frontend-check)
        run: bun --no-env-file scripts/smoke-ci-checks.ts --check frontend
        env:
          CI: "true"
          RM_ENV: stage
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || '' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Playwright specs on the live stack
        run: bun --no-env-file scripts/smoke-ci-checks.ts --check browser
        env:
          CI: "true"
          RM_ENV: stage
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || '' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Tear down this job's smoke stack
        if: always()
        uses: ./.github/actions/e2e-teardown
        with:
          smoke-project: ${{ steps.stack.outputs.smoke-project }}
