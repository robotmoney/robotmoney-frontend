# Analyst SDK tier: the package's own tests (`bun test` inside
# packages/analyst-sdk) with every HTTP client replaced by a thrower, a typecheck, and a
# standalone install from a copy holding ONLY the package, so the SDK cannot
# quietly grow a dependency on the rest of the monorepo (issue #1095).
#
# The purity test (no node:fs, postgres, bun:sqlite, db/chain/store/cutover
# paths or process.env under packages/analyst-sdk/src) lives in
# scripts/tests/unit/analyst-sdk-purity.test.ts and runs in unit.yml.
#
# CI taxonomy class: feature-correctness. Pure compute, no Docker, no network,
# so it runs on every PR (draft AND ready) when its paths change.
#
# Path-gated like contract.yml: a job-level `if:` skip driven by
# dorny/paths-filter, never workflow-level `on.paths`, so a skipped run reports
# a real `skipped` conclusion. `push` to main is never path-filtered. A PR that
# touches only packages/analyst-sdk also selects backend.yml, because
# backend.yml's filter names `packages/**`.
name: analyst-sdk
env:
  CI_CLASS: feature-correctness
on:
  push:
    branches: [main, "releases-*", "analyst-sdk/releases-*", "qa/**"]
  # NIGHTLY MIRROR of the merge-to-main set (issue #373); see unit.yml.
  schedule:
    - cron: "15 4 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changes:
    env:
      CI_CLASS: ignore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      analyst-sdk: ${{ steps.filter.outputs.analyst-sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            analyst-sdk:
              - 'packages/analyst-sdk/**'
              # The suite guard the job runs (issue 1421).
              - 'scripts/checks/assert-junit-suites.ts'

  analyst-sdk:
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.analyst-sdk == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - name: Install
        working-directory: packages/analyst-sdk
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/analyst-sdk
        # Spelled out because ci-workflows-structure.test.ts pins the package-script
        # form of this command to unit.yml and backend.yml.
        run: bunx tsc --noEmit
      # Recorded fixtures must exist and be current before the suite runs: the
      # archive copies, the raw-history fixture and the golden (issue 1404).
      - name: Fixtures exist and are current
        working-directory: packages/analyst-sdk
        run: |
          for f in tests/fixtures/raw-indicator-history.csv tests/fixtures/raw-indicator-history.json tests/golden/regime-report.json tests/fixtures/archive/facts.json tests/fixtures/archive/api-recorded/backups.json tests/reference/backtest-pre-refactor.ts; do
            test -s "$f" || { echo "::error::$f is missing: an SDK fixture is absent"; exit 1; }
          done
          bun run archive-fixture:regenerate --check
          bun run golden:regenerate --check
      - name: SDK tests (every HTTP client is a thrower)
        working-directory: packages/analyst-sdk
        run: bun test --reporter=junit --reporter-outfile="$RUNNER_TEMP/analyst-sdk.junit.xml"
      # Issue 1423: the series-identity proofs ran with at least their number of
      # cases and none skipped; a renamed or emptied file is red, never green.
      - name: Series identity proofs ran (issue 1423)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/input-rule.test.ts:11
          tests/regime.test.ts:22
      # Issue 1421: every named suite ran with at least its number of behaviour
      # cases and none skipped; a renamed or emptied file is red, never green.
      - name: SDK parity, provenance and no-HTTP suites ran (issue 1421)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/originals-provenance.test.ts:26
          tests/report-parity.test.ts:15
          tests/an-behaviours.test.ts:21
          tests/byte-negative-control.test.ts:7
          tests/exported-helpers.test.ts:15
          tests/supplied-input-no-http.test.ts:7
          tests/regime.test.ts:22
          tests/prepare.test.ts:7
          tests/input-rule.test.ts:11
          tests/extract.test.ts:9
      # Decision D78: the exact-arithmetic suite ran (results against BigInt
      # rationals on real data, the pearson scale cases, the constant-return Sharpe),
      # and the up-to-rounding comparison rejected every mutated original.
      - name: Exact numerics suite ran (D78)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/exact-numerics.test.ts:43
          tests/numeric-diff-negative-control.test.ts:11
      # Decision D79 (issue 1513): the supplementary series suite ran (format, the pure
      # reader over injected files, the directory rules, the fetch seam, the command's refusals).
      - name: Supplementary series suite ran (D79)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/supplementary.test.ts:17
      # Issue 1513: the archive reader suite ran (openArchive over injected files against
      # the bin/ adapter, the revised-table replay, the revisions key check, latestValues).
      - name: Archive reader suite ran (issue 1513)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/local-copy.test.ts:17
      # Issue 1513: the drift-aware simulation suite ran (never, daily, band and
      # target-change fixtures, the calendar rules, the BigInt-rational weight
      # update, parity with simulatePortfolio, the option checks).
      - name: Drift-aware simulation suite ran (issue 1513)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/backtest-drift.test.ts:19
      # Issue 1399: the as-of label suite ran, the 419-run hindsight case included.
      - name: As-of label suite ran (issue 1399)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/asof-labels.test.ts:11
      # Issue 1402: the sleeve signal suite ran (grammar, fixture date, missing data).
      - name: Sleeve signal suite ran (issue 1402)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/signals.test.ts:16
      # Issue 1401: the rule file suite ran (shipped files, field-named errors, README example).
      - name: Rule file suite ran (issue 1401)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/rules.test.ts:19
      # Issue 1403: the allocation engine suite ran (tilts, caps, volatility, the prototype's weekly weights).
      - name: Allocation engine suite ran (issue 1403)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/engine.test.ts:18
      # Issue 1513: the certified optimizers, their linear algebra, the
      # Markowitz workflow and its tuning options, and the package-entry exports
      # ran with at least their number of cases and none skipped.
      - name: Optimizer, linear algebra and Markowitz suites ran (issue 1513)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/linalg.test.ts:10
          tests/optimizers.test.ts:21
          tests/markowitz.test.ts:21
          tests/exports.test.ts:3
      # Issue 1404: the backtest, CLI and producer-to-SDK suites ran with at
      # least their number of cases and none skipped (JUnit, not console text).
      - name: Backtest, CLI and input suites ran (issue 1404)
        run: >-
          bun scripts/checks/assert-junit-suites.ts "$RUNNER_TEMP/analyst-sdk.junit.xml"
          tests/backtest.test.ts:16
          tests/cli.test.ts:10
          tests/backtest-cli.test.ts:5
          tests/inputs.test.ts:15
          tests/input-rule.test.ts:11
          tests/regime.test.ts:22
          tests/prepare.test.ts:7
      # Export ONLY the package's tracked files (no node_modules from the install
      # above) into a fresh directory, install from the lockfile, and diff the CLI
      # output against the committed golden. Fails if the SDK reaches outside
      # its own directory for anything.
      - name: Standalone install reproduces the golden
        shell: bash
        run: |
          d="$(mktemp -d)"
          git archive HEAD packages/analyst-sdk | tar -x -C "$d" --strip-components=2
          test ! -e "$d/node_modules"
          cd "$d"
          bun install --frozen-lockfile
          bun run regime tests/fixtures/raw-indicator-history.csv | diff - tests/golden/regime-report.json
          # Relative paths resolve from the caller's folder, also under bun run.
          (cd tests && bun run regime fixtures/raw-indicator-history.json | diff - golden/regime-report.json)
          # Provenance: no manifest gives pinned:false around the unchanged report;
          # the recorded API-only copy (no private repository access) gives
          # pinned:true with its manifest.
          bun run regime tests/fixtures/raw-indicator-history.csv --provenance > "$d/env.json"
          bun -e 'const e = JSON.parse(await Bun.file(process.argv[1]).text()); const g = await Bun.file("tests/golden/regime-report.json").text(); if (e.pinned !== false || JSON.stringify(e.report, null, 2) + "\n" !== g) process.exit(1)' "$d/env.json"
          # tests/fixtures/archive/api-recorded is the recording of the real public
          # archive routes (backend/tests/analyst-sdk-public-archive-recording.test.ts).
          run=0f6b6c1e-6a52-4c39-9f4e-1a2b3c4d5ea2
          bun run inputs --archive tests/fixtures/archive/api-recorded --run "$run" --out "$d/gen"
          bun run regime "$d/gen/inputs.csv" --replay --provenance > "$d/pinned.json"
          bun -e 'const e = JSON.parse(await Bun.file(process.argv[1]).text()); if (e.pinned !== true || e.manifest.run_key !== process.argv[2] || e.manifest.source !== "api") process.exit(1)' "$d/pinned.json" "$run"
