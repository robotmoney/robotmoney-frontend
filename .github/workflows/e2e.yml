# End-to-end tier of the test pyramid: stands up the full stack (api + worker +
# mcp + postgres via docker compose) and drives the demo lifecycle end to end.
#
# CI taxonomy class: system-correctness (integration/e2e/cross-component). Per the
# taxonomy gating matrix this is DEFERRED until a PR is ready for review: it must
# SKIP on draft PRs and RUN once the PR is marked ready-for-review, plus on push
# to the default branch. Wiring that enforces this:
#   - `pull_request.types` includes `ready_for_review` so flipping a draft to
#     ready re-triggers the workflow (default PR types would not).
#   - the job `if:` guard skips the run while the PR is still a draft.
#   - `paths-ignore: ['**.md','**.txt']` bypasses this code check on docs-only PRs.
# A nightly sweep is intentionally NOT added: the intended triggers are ready PRs
# + push main (a full-stack docker-compose run is too expensive to schedule
# daily). The taxonomy grader flags a missing nightly sweep only as an optional
# full-sweep warning, never an error.
name: e2e
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']

jobs:
  e2e:
    # Deferred until ready-for-review: run on push (non-PR) and on non-draft PRs;
    # skip while the PR is still a draft.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root browser tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install deps
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck MCP
        working-directory: mcp
        run: bun run typecheck
      - name: Test MCP
        working-directory: mcp
        run: bun test
      # === Demo readiness gate ===
      # This DEMO_HERMETIC=1 boot-and-check step block IS the "demo readiness" gate.
      # It boots the full hermetic demo stack and runs the three loud-failure guards
      # that keep broken demos off main: scripts/demo-frontend-check.ts (core-surface
      # detector), `test:browser` (Playwright), and scripts/demo-rpc-guard.ts (no live
      # RPC leak). scripts/demo-frontend-check.ts's own loud-failure path is itself
      # self-tested by scripts/tests/demo-frontend-check.test.ts (run in the required
      # `integration` job), which proves it exits non-zero when a core surface marker
      # is stripped and 0 against correct content. See docs/demo-spec.md §"Demo
      # readiness gate". The job id below stays `e2e` so branch protection's existing
      # required-status-check mapping is unaffected.
      - name: Full-stack demo (demo readiness gate)
        run: bun run scripts/demo.ts
        env:
          CI: "true"
          # Real committee-member inference (issue #77): each present member's
          # take is authored by a live claude-opus-4-8 call in mcp/src/inference.ts
          # (driven via mcp/src/e2e.ts). The key is REQUIRED — authorTake throws
          # with no template fallback when it is absent, so this job fails loudly
          # rather than silently emitting fake takes (loud-skip contract). The
          # ANTHROPIC_API_KEY repository/org secret must be provisioned for this
          # required check to pass; see blocker issue #92.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # EXPLICIT hermetic opt-in (issue #50, supersedes the #48 wiring): local
          # `bun demo` now defaults to the production-parity LIVE data path, so
          # this required check must opt in to the hermetic mode itself.
          # DEMO_HERMETIC=1 (resolved by scripts/lib/demo-env.ts and mirrored by
          # docker-compose.demo.yml interpolation) pins the vault-economics
          # eth_call reads to the in-CI stub (base-rpc-stub service) and the
          # analytics to the offline seeded source, so this job NEVER reads live,
          # rate-limited Base mainnet (config.ts default https://mainnet.base.org)
          # or live analytics hosts. The demo's scripts/demo-rpc-guard.ts fails
          # this job loudly if this knob is missing or any layer leaks live RPC.
          DEMO_HERMETIC: "1"
        timeout-minutes: 20
