# End-to-end tier of the test pyramid: stands up the full stack (api + worker +
# mcp + postgres via docker compose) and drives the demo lifecycle end to end.
name: e2e
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root browser tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install deps
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Typecheck MCP
        working-directory: mcp
        run: bun run typecheck
      - name: Test MCP
        working-directory: mcp
        run: bun test
      - name: Full-stack demo
        run: bun run scripts/demo.ts
        env:
          CI: "true"
        timeout-minutes: 20
