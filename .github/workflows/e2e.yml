# End-to-end tier of the test pyramid: stands up the full stack (api + worker +
# postgres via docker compose) and drives the demo lifecycle end to end
# against LIVE external providers (issue #147: DEMO_HERMETIC and the stubbed
# demo path were removed entirely — this required gate now boots the SAME
# production-parity LIVE data path `bun run demo` always resolves, and every
# PR's merge gate depends on live upstreams: public Base mainnet RPC,
# FRED/Coin Metrics/GeckoTerminal/Yahoo/EDGAR. This is a deliberate,
# owner-approved architecture decision — issue #163 — that trades required-CI
# determinism for proving the demo's real, product-parity behavior on every
# PR; expect this job to run slower and be occasionally flakier against live
# upstreams than the old hermetic boot was. A genuinely-unreachable external
# provider after real retries is a legitimate external blocker, not a bug in
# this workflow — file it, don't silently skip the assertion).
#
# CI taxonomy class: system-correctness (integration/e2e/cross-component). Per the
# taxonomy gating matrix this is DEFERRED until a PR is ready for review: it must
# SKIP on draft PRs and RUN once the PR is marked ready-for-review, plus on push
# to the default branch. Wiring that enforces this:
#   - `pull_request.types` includes `ready_for_review` so flipping a draft to
#     ready re-triggers the workflow (default PR types would not).
#   - the job `if:` guard skips the run while the PR is still a draft.
#   - `paths-ignore: ['**.md','**.txt']` bypasses this code check on docs-only PRs.
# A NIGHTLY SCHEDULE IS ADDED HERE (issue #373), and demo-live-smoke-nightly.yml
# is retired. That nightly booted the same LIVE stack and ran the same
# scripts/demo-live-smoke.ts assertions this job does; its own header said its
# "only distinguishing input is the schedule". Now that this workflow carries
# that schedule, keeping it would have been the pure duplication it was written
# to avoid. Nightly is a MIRROR of the merge-to-main set, not a second set —
# scripts/tests/unit/nightly-mirrors-merge-set.test.ts enforces the equality.
#
# Stage 7 (docs/plans/onboarding-ic-workflow.md, §11 R8) + issue #289: this job
# carries the onboarding eval's REAL-INFERENCE half, but it does NOT spend a
# real model call on an ORDINARY `pull_request` run. Exactly what runs where:
#   - EVERY PR, drafts and forks included, via the separate
#     .github/workflows/onboarding-eval-rails.yml (issue #275 addendum: split
#     out of this job): the inference-off infra-rails check,
#     scripts/tests/integration/onboarding-eval-infra.test.ts. It proves every
#     rail the real eval rides on — member-agent image builds and starts,
#     reaches the swarm REST API over the compose network, a signed apply
#     lands through POST /api/swarm/apply — without spending a model
#     token. It moved to its own workflow because it brings up its own minimal
#     stack (postgres + api only) and never needed this job's full LIVE demo
#     boot; nothing about the check ITSELF changed.
#   - PUSH TO MAIN: the REAL-INFERENCE onboarding eval — one vanilla OpenCode
#     member-agent container navigating our own onboarding docs end to end via a
#     real model call.
#   - OPT-IN PER PR (the `real-eval` label — see "OPTING ONE PR IN" below): the
#     same real-inference eval, on demand, for the one PR that needs it.
#   - MANUAL RUN: `workflow_dispatch` with the `real_eval` input set true.
#     (Actions reads dispatch inputs from the DEFAULT BRANCH's copy of this
#     file, so this route only works once this change is on main; the label
#     route works from a PR head immediately, which is why the label — not the
#     dispatch input — is the primary mechanism.)
#   - NIGHTLY (issue #373): the real-inference measurement's SCHEDULED HOME is
#     now THIS workflow's own `schedule: 37 4 * * *` (nightly 04:37 UTC) — the
#     slot the retired .github/workflows/swarm-opencode-nightly.yml held.
#     ONBOARDING_REAL_EVAL resolves to "1" on `schedule` exactly as it does on
#     `push`, so a nightly run spends one real admission. That is a SMALLER
#     per-night sweep than the retired nightly's models × identities, and a
#     LARGER denominator over time: one admission a night is thirty samples a
#     month, read off run history via the admission record below, rather than
#     four samples on one night read off a bespoke scorecard.
#
# OPTING ONE PR IN — add the label `real-eval` to the pull request. That is the
# whole procedure: `pull_request.types` below includes `labeled`, so adding it
# re-triggers this workflow immediately (no push, no re-run needed), and
# ONBOARDING_REAL_EVAL on the "Full-stack demo" step resolves to "1" for that
# run and every later run of the PR while the label is still attached. Remove
# the label to go back to zero model spend. Two guards keep the opt-in from
# leaking cost:
#   - the job `if:` below IGNORES a `labeled` event whose label is not
#     `real-eval`, so labelling a PR `docs` (or anything else) does NOT boot the
#     ~40-minute live stack. The known cost of that guard: a skipped job reports
#     as passing to branch protection, so an unrelated label added on top of a
#     RED e2e would supersede it with a green skip. Accepted deliberately — no
#     automation in this repo labels PRs, the same property already holds for
#     the draft guard on the line below, and the alternative (running the full
#     gate on every label event) is worse on a single self-hosted runner.
#   - the label is read from the PR payload at trigger time, so a fork PR that
#     carries the label still cannot reach OPENCODE_API_KEY; the "Configure
#     onboarding real-inference eval" step reports CANNOT RUN there rather than
#     degrading silently.
#
# WHY IT IS OFF BY DEFAULT (issue #289): the eval used to run unconditionally on
# every non-draft PR, and scripts/lib/onboarding-eval.ts's
# runOnboardingEvalWithRetry retries on a 429/overload signal, a model refusal,
# or a bare timeout, so a single job could spend several model runs. The free,
# no-credential OpenCode Zen tier is quota-limited, and ordinary PR cadence
# exhausted it — turning this REQUIRED gate red on every open PR for a reason
# that had nothing to do with the code under test. The default model is FUNDED
# now (D22 as amended), so cost is money rather than an exhaustible quota — but
# this repo has ONE self-hosted runner, and an eval per PR is still minutes of
# exclusive runner time per PR against a stochastic metric. Off by default,
# opt-in per PR, nightly for the trend. This is a deliberate, recorded default,
# not a silent one: the "Configure onboarding real-inference eval" step below
# writes to the job summary, on every run, whether the eval ran here, why not if
# it did not, and how to opt this PR in.
#
# Two things the NON-PR path accounts for, not ignores:
#   (a) This self-hosted runner shares its IP with the standing rm_demo_* demo
#       stack, which has caused 429 rate-limit flake on other live-call gates
#       before, and the free tier is documented as slower/more variable than a
#       paid one. scripts/lib/onboarding-eval.ts's runOnboardingEvalWithRetry
#       retries, with backoff, a detected 429/overload signal, a model refusal,
#       and a bare timeout on ANY tier — measured 2026-07-28, a FUNDED
#       deepseek-v4-flash run stalled mid-session for ~18 minutes with no
#       token, no tool call and no error. It never retries a genuine navigation
#       failure, which presents as a container EXIT rather than a timeout —
#       see that function's doc comment.
#       scripts/lib/onboarding-eval.ts resolves the same model
#       scripts/lib/swarm/inference.ts already
#       uses for real swarm takes.
#   (b) That model is FUNDED (D22 as amended 2026-07-28): the default is
#       `opencode/deepseek-v4-flash`, billed to the `OPENCODE_API_KEY` repo
#       secret. Which model runs is selected by `AGENT_MODEL` against
#       scripts/lib/model-registry.ts; `AGENT_MODEL=free` still runs keyless.
#       The key only ever resolves in a trusted context: a push to main, or a
#       `real-eval`-labelled PR from a branch in THIS repo. A labelled fork PR
#       resolves no key and fails loudly instead of degrading.
name: e2e
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  # NIGHTLY MIRROR of the merge-to-main set (issue #373): every workflow that
  # runs on `push: branches: [main]` also runs on a nightly schedule, and
  # nothing else does — so a red nightly means exactly what a red merge would
  # have meant, with no required reading. Cron minutes are staggered across the
  # ten mirrors. The invariant is enforced mechanically by
  # scripts/tests/unit/nightly-mirrors-merge-set.test.ts, not by convention.
  #
  # This one keeps 04:37 UTC, the slot the retired swarm-opencode-nightly.yml
  # held: a `schedule` run of THIS workflow is now the real-inference
  # onboarding admission's scheduled home (ONBOARDING_REAL_EVAL resolves to "1"
  # on `schedule` exactly as it does on `push`, below). One admission a night,
  # read off run history, is a larger denominator than the bespoke K=5 sweep
  # #280/#367 proposed — at no extra cost. `paths-ignore` is deliberately absent
  # here: a schedule event carries no file list, so a docs-only day still gets a
  # full mirror run.
  schedule:
    - cron: "37 4 * * *"
  pull_request:
    # `labeled` is here ONLY so that adding the `real-eval` opt-in label
    # re-triggers this workflow on an already-open PR (see the "OPTING ONE PR
    # IN" block in the header). It does not make this gate run more often for
    # unlabelled PRs: the job `if:` below drops any `labeled` event carrying a
    # different label before a runner is allocated.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['**.md', '**.txt']
  # Manual re-run of the whole gate, with an explicit opt-in for the paid
  # real-inference onboarding eval. NOTE: GitHub reads these input definitions
  # from the DEFAULT BRANCH's copy of this file, so `real_eval` is only
  # dispatchable once this file is on main — the `real-eval` PR label is the
  # route that works from a PR head today.
  workflow_dispatch:
    inputs:
      real_eval:
        description: "Run the §11 R8 real-inference onboarding eval (spends real model tokens)."
        type: boolean
        default: false

jobs:
  e2e:
    # Two guards, both evaluated before a runner is allocated:
    #   1. Deferred until ready-for-review: run on push/dispatch (non-PR) and on
    #      non-draft PRs; skip while the PR is still a draft.
    #   2. A `labeled` event only proceeds when the label added is the
    #      `real-eval` opt-in. Without this, `types: [..., labeled]` above would
    #      boot the full ~40-minute live stack every time anyone tagged a PR.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event.action != 'labeled' || github.event.label.name == 'real-eval') }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    env:
      # Read by scripts/lib/rmpc-fetch.ts's fetchRmpc() for the real-inference
      # eval inside "Full-stack demo" below. The infra-rails check that used to
      # share this cache moved to onboarding-eval-rails.yml (issue #275
      # addendum); its "Cache rmpc release binary" step uses the SAME cache key
      # pattern, so GitHub Actions' cross-workflow cache sharing (scoped by key,
      # not by workflow file) still avoids a redundant download whichever
      # workflow runs first for a given rmpc version.
      RMPC_CACHE_DIR: ${{ github.workspace }}/.rmpc-cache
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # Playwright's CLI/transform runs on Node.js (its bin is `#!/usr/bin/env
      # node`); `bun run test:browser` shells out to it. `setup-bun` does NOT
      # provide node, so on a self-hosted runner without a system node the
      # Playwright build fails for EVERY spec ("2 errors building …") and no
      # browser test runs. Provision node explicitly so this required gate is
      # runner-independent instead of relying on node happening to be
      # pre-installed on the host.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root browser tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        # Browser binary only — Chromium's system libraries are provisioned on
        # the self-hosted runner host. The `--with-deps` variant shells out to
        # `sudo apt-get`, which fails on this runner (the runner user has no
        # passwordless sudo and no TTY); the binary itself installs into the
        # runner user's cache with no elevation.
        run: bunx playwright install chromium
      # D21 retired the mcp/ package — no separate MCP install/typecheck/test
      # steps. The swarm surface is the api's REST API; the swarm
      # session driver (scripts/lib/swarm/session.ts) is covered by the
      # root typecheck + the "Full-stack demo" step below.
      # Needed BEFORE "Full-stack demo" (issue #108): scripts/lib/demo-main.ts
      # now spawns backend/scripts/edgar-seed-bootstrap.ts as a host-side
      # subprocess (cwd: backend/) after API health, which needs backend's own
      # node_modules (@robotmoney/contract) resolvable on this runner — the api
      # container installs its own copy at image-build time, but that is
      # invisible to a host-side `bun run` outside docker.
      - name: Install backend deps (for the host-side EDGAR seed bootstrap step)
        working-directory: backend
        run: bun install --frozen-lockfile
      # Needed BEFORE "Full-stack demo" (issue #301): scripts/lib/swarm/
      # inference.ts's runOpencode() Bun.spawn()s the bare `opencode` binary
      # HOST-SIDE (scripts/lib/swarm/session.ts runs as a runner subprocess,
      # not inside a container) for every swarm session the demo boots —
      # there is no template fallback anymore, so a runner without this CLI on
      # PATH fails the required gate loudly instead of degrading. This is a
      # DIFFERENT consumer than scripts/lib/member-agent/Dockerfile's baked-in
      # copy (that one is for the containerized onboarding member-agent); same
      # pinned release + checksum, kept in lockstep with that Dockerfile's
      # OPENCODE_VERSION / OPENCODE_LINUX_X64_SHA256 args on purpose — bump both
      # together.
      - name: Install opencode CLI (swarm takes require live inference)
        env:
          OPENCODE_VERSION: "1.18.1"
          OPENCODE_LINUX_X64_SHA256: "9ecce27cf529ade5f177fab478b4876b5c31d9ddc8216b994816acf192159511"
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/opencode.tar.gz" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_LINUX_X64_SHA256}  $RUNNER_TEMP/opencode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          rm "$RUNNER_TEMP/opencode.tar.gz"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/opencode-bin/opencode" --version

      # === Onboarding eval (Stage 7, §11 R8) ===
      # The inference-off infra-rails check (Stage 5's test) that used to run
      # here moved to .github/workflows/onboarding-eval-rails.yml (issue #275
      # addendum) — it never needed this job's full LIVE demo boot, only its
      # own minimal postgres+api stack. The steps below remain because the
      # REAL-INFERENCE eval further down (inside "Full-stack demo") also needs
      # the rmpc binary, and reuses THIS already-booted stack rather than
      # standing up a second one.
      - name: Resolve pinned rmpc release version (cache key)
        id: rmpc-version
        run: |
          VERSION=$(bun -e 'import("./scripts/lib/rmpc-fetch.ts").then((m) => console.log(m.RMPC_VERSION))')
          echo "resolved rmpc version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Cache the pinned rmpc release binary by tag (Stage 3's
      # scripts/lib/rmpc-fetch.ts): avoids re-downloading a GitHub Releases
      # asset on every PR run for a binary that only changes when RMPC_VERSION
      # is bumped. Consumed by RMPC_CACHE_DIR (job-level env above) inside the
      # real-inference eval nested in "Full-stack demo" below. The SAME cache
      # key pattern is used by onboarding-eval-rails.yml's identical step, so
      # the underlying GitHub Actions cache entry is shared across both
      # workflows even though each computes its own local RMPC_CACHE_DIR path.
      - name: Cache rmpc release binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rmpc-cache
          key: rmpc-${{ steps.rmpc-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      # Resolves — and RECORDS — what the real-inference eval does on this run.
      # On an ordinary `pull_request` run it does not run at all (issue #289 +
      # the runner cost above; this workflow's own nightly `schedule` mirror
      # measures the same surface once a night). Withholding a runtime assertion
      # from a REQUIRED gate must never be silent, so the PR branch below writes
      # that fact, how to opt THIS PR in, and the eval's real home, to the job
      # summary — loudly — on every such run. When the eval IS on (push to main,
      # the nightly schedule, the `real-eval` label, or a dispatch that asked
      # for it) this step keeps its
      # original job: resolve whether the funded key is reachable, and say so.
      #
      # REAL_EVAL_REQUESTED below MUST stay textually identical to
      # ONBOARDING_REAL_EVAL on the "Full-stack demo" step — one expression, two
      # consumers — so this notice can never claim the eval was skipped on a run
      # that in fact spent one, or vice versa. Asserted by
      # scripts/tests/unit/e2e-onboarding-eval-pr-cost.test.ts.
      - name: Configure onboarding real-inference eval
        id: onboarding-gate
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          REAL_EVAL_REQUESTED: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.real_eval) || contains(github.event.pull_request.labels.*.name, 'real-eval')) && '1' || '' }}
          TRUSTED_CONTEXT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          HAS_ZEN_KEY: ${{ secrets.OPENCODE_API_KEY != '' }}
        run: |
          if [ "$REAL_EVAL_REQUESTED" = "1" ]; then
            if [ "$TRUSTED_CONTEXT" = "true" ] && [ "$HAS_ZEN_KEY" = "true" ]; then
              MSG="§11 R8 real-inference onboarding eval: RUNNING on the funded default model (trusted context, OPENCODE_API_KEY configured) as part of the Full-stack demo step below. Requested by: push to main, the 'real-eval' pull-request label, or workflow_dispatch with real_eval=true — whichever triggered this run."
            else
              MSG="§11 R8 real-inference onboarding eval: **CANNOT RUN** — the eval was requested for this run, but no OPENCODE_API_KEY is available in this context (fork PR, or the secret is unset). The default model is funded (D22 as amended), so the eval will fail loudly rather than silently degrade. Configure the OPENCODE_API_KEY secret, or set AGENT_MODEL=free to run keyless."
            fi
          elif [ "$IS_PULL_REQUEST" = "true" ]; then
            MSG="§11 R8 real-inference onboarding eval: **DELIBERATELY NOT RUN** on this pull_request run — ONBOARDING_REAL_EVAL is not set here and ZERO model tokens are spent. Off by default, not removed: issue #289 (an exhaustible free tier) plus the exclusive runner time per-PR evals cost against a stochastic metric. TO OPT THIS PR IN: add the label 'real-eval' to the pull request — that re-triggers this workflow at once and every subsequent run of the PR spends a real eval until the label is removed. Where it ALSO runs: THIS SAME WORKFLOW, on every push to main and on its nightly schedule mirror at 04:37 UTC (cron '37 4 * * *'), plus workflow_dispatch with real_eval=true. Issue #373 retired .github/workflows/swarm-opencode-nightly.yml, which used to hold that slot: each of those runs now spends exactly one real admission and writes an admission record to the job summary and an uploaded artifact, so the admission rate over time is read off run history — thirty nights is thirty samples. What this PR run DID assert about that surface: the separate, inference-off .github/workflows/onboarding-eval-rails.yml workflow (issue #275 addendum), which executes scripts/tests/integration/onboarding-eval-infra.test.ts in full whenever its own path filter matches."
          else
            MSG="§11 R8 real-inference onboarding eval: NOT REQUESTED on this manual run — re-dispatch this workflow with real_eval=true to spend one. ZERO model tokens are spent here. The separate onboarding-eval-rails.yml workflow still covers the inference-off rails check."
          fi
          echo "$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      # === Demo readiness gate ===
      # This boot-and-check step block IS the "demo readiness" gate. It boots the
      # full LIVE demo stack (issue #147: no hermetic mode exists anymore — every
      # boot resolves live external providers) and runs the loud-failure guards
      # that keep broken demos off main: scripts/demo-frontend-check.ts (core-surface
      # detector), `test:browser` (Playwright), and scripts/demo-live-smoke.ts
      # (issue #128's LIVE steady-state assertions — reused as-is, not re-authored:
      # >=2 published swarm sessions, fresh regime snapshot, live wallet/vault
      # provenance with only the documented #120 degrades, both research signals
      # landed). scripts/demo-frontend-check.ts's own loud-failure path is itself
      # self-tested by scripts/tests/integration/demo-frontend-check.test.ts (run in the required
      # `integration` job), which proves it exits non-zero when a core surface marker
      # is stripped and 0 against correct content. See docs/architecture.md §"Demo
      # readiness gate". The job id below stays `e2e` so branch protection's existing
      # required-status-check mapping is unaffected.
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Full-stack demo (demo readiness gate)
        run: bun run scripts/demo.ts
        env:
          CI: "true"
          # Pin a deterministic, per-run compose project name (issue: demo
          # persistent volumes). Teardown now keeps the postgres volume by default,
          # so this required boot on the SHARED self-hosted runner must reclaim its
          # OWN volume and no one else's. A pinned name makes the volume label
          # (robotmoney.demo.project=<this>) unique per run+attempt, so both the
          # in-process cleanup (demo-main.ts cleanCiVolume) and the always() backstop
          # step below can scope the delete to exactly this run — never the co-tenant
          # standing demo. run_attempt makes reruns collision-free.
          #
          # The `rm_ci_` prefix is the CI half of the environment-scoped naming
          # scheme (scripts/stack/naming.ts, CI_PROJECT_PREFIX) — the single fact
          # a reaper needs before it touches anything on this shared host: a
          # `rm_demo_*` container belongs to the standing stage demo or to an
          # operator's shell and must never be swept by CI. Spelled from the
          # GitHub context rather than left to the helper's default because the
          # `always()` teardown step below has to name the same project from
          # YAML; scripts/tests/unit/stack-naming.test.ts asserts both values
          # here carry the prefix. Every container ALSO carries
          # robotmoney.env=ci + robotmoney.env.hash labels from the helper, which
          # is the channel tooling should select on.
          DEMO_PROJECT: rm_ci_stack_${{ github.run_id }}_${{ github.run_attempt }}
          # Swarm takes are always live-authored through opencode. A missing
          # credential, CLI, or model response fails this required gate loudly;
          # there is no deterministic memo fallback.
          #
          # Every OTHER external dependency here IS live and keyless: public Base
          # mainnet JSON-RPC (vault-economics eth_call reads), and the keyless
          # analytics/research fetchers (FRED/Coin Metrics/GeckoTerminal/Yahoo/
          # EDGAR). A required credential or provider that is unreachable fails
          # this job loudly (scripts/lib/demo-env.ts / the api's own startup
          # checks) — never a silent fallback to a fixture or stub. Expect this
          # job to run longer and be occasionally flakier against live upstreams
          # than the retired hermetic boot was — an accepted, deliberate
          # consequence of issue #147/#163, not a bug in this workflow.
          #
          # Stage 7 (§11 R8) + issue #289: the onboarding eval is OFF by default
          # on pull requests and opt-in per PR. ONBOARDING_REAL_EVAL below
          # resolves to "1" for exactly three cases — (1) a push to main, (2) a
          # `pull_request` event whose PR carries the `real-eval` label, (3) a
          # `workflow_dispatch` run started with real_eval=true — and to the
          # empty string otherwise, so an ordinary PR run spends no model call.
          # Add the `real-eval` label to a PR to opt it in; remove it to opt out
          # (full rationale in this file's header, "OPTING ONE PR IN"). The
          # nightly `schedule` mirror of THIS workflow (04:37 UTC — issue #373
          # retired swarm-opencode-nightly.yml, which used to hold that
          # slot) owns the trend measurement, one admission a night, recorded to
          # the job summary and an artifact. demo-main.ts reads ONBOARDING_REAL_EVAL ===
          # "1"; empty is simply "off". When it IS on, it runs the funded
          # default model (D22 as amended). OPENCODE_API_KEY below is injected
          # ONLY into the short-lived member-agent container
          # scripts/lib/onboarding-eval.ts launches (never into the api/worker
          # services), and only when the "Configure onboarding real-inference
          # eval" step resolved one — so a labelled FORK PR still gets no key
          # and a loud failure rather than a silent degrade. AGENT_MODEL is left
          # unset so the repo default applies; set it to a family name (e.g.
          # `kimi`) to switch which agent this gate measures.
          #
          # This expression is duplicated as REAL_EVAL_REQUESTED on the
          # "Configure onboarding real-inference eval" step above so the job
          # summary always describes what actually happened; the two must stay
          # byte-identical, which
          # scripts/tests/unit/e2e-onboarding-eval-pr-cost.test.ts asserts.
          ONBOARDING_REAL_EVAL: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.real_eval) || contains(github.event.pull_request.labels.*.name, 'real-eval')) && '1' || '' }}
          # The swarm session always requires live authoring. On an
          # untrusted fork GitHub supplies an empty secret and the session fails
          # loudly instead of fabricating a template take.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || '' }}
        # 40 min for the pre-existing checks + headroom for the onboarding eval
        # on the runs that spend one (push to main, a `real-eval`-labelled PR, a
        # dispatch with real_eval=true — issue #289; an ordinary PR run stops
        # well short of this ceiling because no eval runs there; the ceiling is
        # not split per event, so every eval-spending path keeps the same
        # headroom). Headroom is DERIVED, not guessed: DEFAULT_TIMEOUT_MS is 30
        # minutes per admission attempt (raised from 20 on measurement — see
        # onboarding-eval.ts's comment: a real admission took 1183s) and
        # runOnboardingEvalWithRetry allows 2 attempts with a 45s backoff, so
        # the eval's own worst case is ~61 min. 40 + 61 ≈ 101, rounded to 105.
        # Raising DEFAULT_TIMEOUT_MS without raising this would just move the
        # truncation from the eval to the job, which reports as an infra kill
        # rather than the honest `timed-out` outcome.
        timeout-minutes: 105
      # Stack-leak backstop (issue: demo persistent volumes; hardened after e2e
      # run 30406428674). The demo boot above tears its own stack down on both
      # success and failure. This always() step is the belt-and-suspenders case:
      # if the boot step is KILLED (the timeout above, or a job cancellation) it
      # never reaches its own teardown, so tear down here too.
      #
      # THE ORDER IS THE FIX. This step used to run demo-clean ALONE, which
      # removes VOLUMES only. Run 30406428674 was cancelled mid-boot, its
      # containers survived, so its volume was in use, so demo-clean loudly
      # skipped it — and exited 0. The step reported SUCCESS over a live leak,
      # and the surviving api container held :48787 (the cloudflared origin for
      # stage.robotmoney-labs.dev) for over an hour. `compose down` must come
      # FIRST so the volume is unreferenced by the time demo-clean reaches it;
      # demo-clean now also EXITS NON-ZERO on an in-use skip when --project is
      # given (scripts/demo-clean.ts's header), so this step can no longer be
      # green while a leak survives.
      #
      # Strictly scoped to THIS run: `-p "$DEMO_PROJECT"` (byte-identical to the
      # boot step's DEMO_PROJECT above) and the same project label on the volume.
      # This runner is shared with the standing stage demo, which must never be
      # touched — hence no bare `docker compose down`, no `docker system prune`,
      # no name globbing. `--remove-orphans` is what kills the dynamically
      # spawned member-agent eval containers that the compose model does not
      # declare; `-v` reclaims this project's volumes in the same pass.
      #
      # WEB_PORT / POSTGRES_PORT are placeholders purely to satisfy compose
      # INTERPOLATION: docker-compose.yml's port lines are `${VAR:?…}` and refuse
      # to resolve without a value (c0d34f4). `down` publishes nothing, so the
      # numbers only have to exist — same trick scripts/demo-down.ts uses. The
      # `|| true` is deliberate: a compose-down failure must not skip the
      # demo-clean verdict below, which is the step's actual gate.
      # ── The admission RECORD (issue #373) ─────────────────────────────────
      # Reporting on the admission that ALREADY ran — no new harness, no
      # sampling loop, no second stack bring-up. scripts/lib/demo-main.ts
      # classifies the run with the existing scripts/agent/classify-outcome.ts
      # and writes onboarding-admission-record.md (outcome, resolved model id,
      # duration, member id, agent-liveness counts) BEFORE it throws, so a RED
      # admission records exactly as much as a green one. Both steps are
      # `if: always()` for the same reason. The admission rate over time is then
      # derivable from run history: one record per push to main, plus one per
      # nightly `schedule` mirror above.
      #
      # A run that spent no eval (an unlabelled pull_request) writes no file;
      # both steps below are no-ops there rather than a failure.
      - name: Record the real-inference onboarding admission
        if: always()
        run: |
          set -u
          if [ -f onboarding-admission-record.md ]; then
            cat onboarding-admission-record.md >> "$GITHUB_STEP_SUMMARY"
            cat onboarding-admission-record.md
          else
            echo "no admission record on this run (no real-inference eval was spent)"
          fi
      - name: Upload the admission record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-admission-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: onboarding-admission-record.md
          if-no-files-found: ignore
          retention-days: 90
      - name: Tear down this run's demo stack (no leaks on the shared runner)
        if: always()
        run: |
          set -u
          echo "::group::docker compose -p $DEMO_PROJECT down -v --remove-orphans"
          docker compose -p "$DEMO_PROJECT" \
            -f docker-compose.yml -f docker-compose.demo.yml \
            down -v --remove-orphans || echo "compose down exited non-zero — demo-clean below is the gate"
          echo "::endgroup::"
          bun run scripts/demo-clean.ts --project "$DEMO_PROJECT"
        env:
          DEMO_PROJECT: rm_ci_stack_${{ github.run_id }}_${{ github.run_attempt }}
          WEB_PORT: "1"
          POSTGRES_PORT: "1"
      # Cross-run orphan reaper (the third gap behind run 30406428674): even a
      # perfect teardown above only ever cleans ITS OWN run, so a run whose
      # teardown was killed outright leaked forever. This host had accumulated
      # containers up to four days old. Selection is by the robotmoney.env LABEL
      # (c0d34f4), pinned to `ci` — it can therefore never match `robotmoney.env
      # =local`, i.e. the standing stage demo or an operator's shell — and the
      # 6h threshold is comfortably longer than this job's own 105-minute
      # ceiling, so no live CI run can reap another's stack. The reaper's own G3
      # guard additionally excludes this job's env hash. Full guard rationale in
      # scripts/lib/demo-reap.ts; assertions in
      # scripts/tests/unit/demo-reap.test.ts.
      #
      # Non-blocking on purpose: clearing a PRIOR run's orphan is housekeeping,
      # not a defect in THIS PR, so it must not turn someone else's leak into
      # this PR's red X. The leak that IS this run's own is gated by the step
      # above, which does fail.
      - name: Reap CI container leftovers from prior runs
        if: always()
        continue-on-error: true
        run: bun run scripts/demo-reap.ts --env-class ci --older-than 6h
