name: e2e
on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install deps
        working-directory: mcp
        run: bun install
      - name: Full-stack demo
        run: bun run scripts/demo.ts
        env:
          CI: "true"
        timeout-minutes: 20
