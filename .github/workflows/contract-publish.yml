# Publishes contract/ as a versioned package (issue #884; D43/D10). Separate
# file from contract.yml on purpose:
# scripts/tests/unit/ci-workflows-structure.test.ts requires every
# PATH_GATED_WORKFLOWS file (contract.yml among them) to declare exactly one
# non-"changes" job, so a tag-triggered publish job cannot be folded into that
# job or added alongside it there.
#
# Runs ONLY on a push of a `contract-v*` tag — contract/'s OWN release tag,
# deliberately a different namespace from this repo's whole-app `v*` release
# tags, since contract/package.json's version is independent of the app
# version. Never runs on a PR and never runs on a plain merge to main, so
# nothing publishes unreviewed; cutting the tag is itself the reviewable act.
#
# Not part of the nightly-mirrors-merge-set invariant
# (scripts/tests/unit/nightly-mirrors-merge-set.test.ts): that test only binds
# workflows with `push: branches: [main]` or a `schedule:`, and this workflow
# has neither — publishing a specific version is not an idempotent thing a
# nightly rerun should ever redo.
#
# CI taxonomy: a release action, not a test — CI_CLASS: ignore throughout (see
# the job-level comment below), since it never runs on a PR and draft/r4r
# gating doesn't apply to it.
name: contract-publish
env:
  CI_CLASS: ignore
on:
  push:
    tags: ["contract-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history, all refs) is required by the
          # provenance check below: it needs origin/main's ref and enough
          # commit history to compute a merge-base against it.
          fetch-depth: 0
      # SEC-1: tag creation only requires repo write access, not a review —
      # any contributor with write access could otherwise point a
      # `contract-v*` tag at a commit that never went through a PR/branch
      # protection. Refuse to publish unless the tagged commit is actually
      # reachable from origin/main, so cutting the tag can never bypass
      # review on its own.
      - name: Verify tagged commit is reachable from origin/main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at commit $GITHUB_SHA, which is not reachable from origin/main — refusing to publish an unreviewed commit." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Contract tests (unit)
        working-directory: contract
        run: bun run test
      # `bun publish` (bun 1.3.x) does not read package.json's
      # `publishConfig.registry` — only contract/.npmrc's scope->registry
      # mapping and `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}` (see
      # that file's header) actually drive the registry + auth used below.
      # GITHUB_TOKEN is the existing CI credential granted `packages: write`
      # above — issue #884's scope requires reusing whatever registry the
      # existing CI credentials already support, not choosing a new one or
      # adding a new secret.
      - name: Publish contract package
        working-directory: contract
        run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
