# Unit tier of the test pyramid: typecheck + scripts/tests/unit — no Docker, no
# network, no model. Every test in this class must run on a bare checkout with
# only bun installed. This claim is ENFORCED below (issue #819), not merely
# asserted here and trusted to hold: the job never invokes a selector broader
# than scripts/tests/unit, and it makes the real `docker` binary unreachable
# before any test step runs, so a future Docker-dependent test placed here
# fails loudly instead of silently passing because a runner happened to have
# Docker installed.
#
# CI taxonomy class: feature-correctness. Per the taxonomy gating matrix this
# runs on EVERY PR (draft AND ready) — cheap enough to gate early, and the unit
# suite is the fastest signal a contributor gets. No draft deferral, no
# paths-ignore: every code change must pass the unit suite.
#
# This workflow replaces the "Check root scripts" and "Unit cost class" steps
# that previously lived in integration.yml (issue #275). It is directly
# required in branch protection (issue #275 addendum: the ci-gate.yml/
# ci-gate.ts fan-in mechanism this workflow used to feed was removed after a
# production incident on PR #316; a structurally sounder fan-in replacement is
# tracked in issue #348).
name: unit
env:
  CI_CLASS: feature-correctness
on:
  push:
    branches: [main, "releases-*"]
  # NIGHTLY MIRROR of the merge-to-main set (issue #373): every workflow that
  # runs on `push: branches: [main]` also runs on a nightly schedule, and
  # nothing else does — so a red nightly means exactly what a red merge would
  # have meant, with no required reading. Cron minutes are staggered across the
  # ten mirrors. The invariant is enforced mechanically by
  # scripts/tests/unit/nightly-mirrors-merge-set.test.ts, not by convention.
  schedule:
    - cron: "3 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AC (issue #819): the tier's own "no Docker" claim is ENFORCED here, not
      # merely asserted in the header above and trusted to hold as the test set
      # grows. GitHub's ubuntu-latest images ship a real Docker daemon and CLI,
      # so nothing today would fail if a future PR quietly added a
      # Docker-dependent test under scripts/tests/unit — it would just silently
      # pass because Docker happened to be there. Removing the binary from PATH
      # before any test step runs means such a test fails LOUDLY ("docker:
      # command not found") instead of depending on nobody making that mistake.
      - name: Make Docker unreachable (this tier's own claim, enforced not trusted)
        run: |
          set -euo pipefail
          docker_bin="$(command -v docker || true)"
          if [ -n "$docker_bin" ]; then
            sudo mv "$docker_bin" "${docker_bin}.blocked-by-unit-ci"
          fi
          sudo systemctl stop docker.service docker.socket 2>/dev/null || true
          if command -v docker >/dev/null 2>&1; then
            echo "docker is still reachable on PATH after blocking it — the unit tier's no-Docker claim would not be enforced" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # scripts/tests/integration/admin-live-guard.test.ts spawns `bun run test:browser --
      # --list`, which shells out to Playwright's CLI/transform — that runs on
      # Node.js (its bin is `#!/usr/bin/env node`), which `setup-bun` does not
      # provide. Provision node so the guard exercises the real spec load path.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      # Installed BEFORE test steps: scripts/tests/ may import backend types
      # that need backend's own node_modules resolvable.
      - name: Install deps
        working-directory: backend
        run: bun install --frozen-lockfile
      # Typecheck only. `bun run test` (the run-everything alias, `bun test
      # scripts/tests`) used to be chained on here — issue #819: it recurses
      # into scripts/tests/integration/, the Docker-backed class this workflow's
      # own header excludes, which is why a Docker test could redden this gate.
      # `test:unit` below is the only selector this job runs.
      - name: Check root scripts
        run: bun run typecheck
      # The unit class must hold on a bare checkout — no Docker, no network.
      # The greps are the "exit 0 is not tested" evidence: bun's own summary must
      # report a NON-ZERO pass count and a zero fail count, so a run that
      # collected nothing cannot be mistaken for a green. ANSI codes are stripped
      # first because bun colours its summary even when stdout is a pipe.
      - name: Unit cost class (scripts/tests/unit)
        run: |
          set -o pipefail
          bun run test:unit 2>&1 | tee /tmp/test-unit.log
          sed -E 's/\x1b\[[0-9;]*m//g' /tmp/test-unit.log > /tmp/test-unit.plain
          grep -qE '^ *[1-9][0-9]* pass$' /tmp/test-unit.plain
          grep -qE '^ *0 fail$' /tmp/test-unit.plain
      # Test plan (issue #819): prove it from this job's OWN log, not merely
      # from the selector's directory scoping — a scripts/tests/integration
      # path must never appear in test:unit's output.
      - name: No integration-tier file executed here (checked against the log)
        run: |
          if grep -q 'scripts/tests/integration' /tmp/test-unit.plain; then
            echo "a scripts/tests/integration path appeared in the unit job's test:unit output — the tier boundary broke" >&2
            exit 1
          fi
      # Pins fail-red-on-empty-selection: the two selectors above are just
      # directory paths, so a future rename must break CI rather than silently
      # collect zero files in both classes.
      - name: Empty test selection is red
        run: |
          if bun test scripts/tests/__no_such_dir__ >/dev/null 2>&1; then
            echo "bun test over an empty selection exited 0 — 0 tests collected must never be green" >&2
            exit 1
          fi
