# Nightly proof that a RELEASED rmpc binary drives the README's documented
# external-agent flow end-to-end against a live robotmoney-frontend stack
# (issue #104).
#
# WHY THIS SUITE EXISTS
# README.md's "Attach a prospective agent" section documents: rmpc identity
# create → show-public-key → POST /api/committee/apply → POST
# /api/committee/admin/activate → token-claim/challenge → rmpc-signed token-claim
# → canonicalizeSubmission → rmpc committee-identity sign → POST
# /api/committee/submit (D21 — REST only; the MCP OAuth/get_signing_payload/
# submit_recommendation chain is retired). robotmoney-core's own suite proves
# rmpc's crypto/CLI behavior in isolation (unit/integration tests against the
# source build); nothing there proves a RELEASED binary (downloaded from GitHub
# Releases, never built from source here) actually completes this flow against a
# live robotmoney-frontend backend stack. scripts/rmpc-release-e2e.ts
# is that proof: it downloads the pinned release asset for the runner platform,
# fails loudly if the download 404s or the committee-identity subcommand is
# missing, drives the real flow through a live job-queue-backed committee
# session, then independently re-verifies the resulting Ed25519 signature.
#
# WHY NIGHTLY ONLY (NOT EVERY PR)
# A live GitHub Releases download is a real external network dependency
# unrelated to most PRs' diffs — gating every PR's required checks on GitHub's
# release CDN would make the required suite flaky for unrelated reasons. Nightly
# gives a daily signal that the pinned release still works, without that
# coupling. Same split as nightly-fetchers.yml. (Issue #373: "not every PR" is
# not "not on a merge" — see the DISPOSITION note on the triggers below.)
#
# NEVER SKIPS
# scripts/rmpc-release-e2e.ts calls process.exit(1) (via its fail() helper) on a
# failed download, a missing committee-identity subcommand, any non-2xx/non-ok
# HTTP response, or a failed independent signature re-verification. This job
# goes RED, never green-via-skip, on any of those.
#
# NO SECRET
# Public GitHub Releases assets download over plain HTTPS with no token. There is
# no secret anywhere in this path.
#
# CI taxonomy class: heavy (scheduled, real external release download + full
# stack). Heavy suites are sweep-only: NO `pull_request` trigger — schedule +
# on-demand only.
name: rmpc-release-e2e-nightly
env:
  CI_CLASS: heavy
on:
  # DISPOSITION (issue #373): FOLDED into the merge-to-main set. Nothing else
  # proves a RELEASED rmpc binary drives the documented flow, so this is not a
  # duplicate of anything the merge set already runs. The "why nightly only"
  # rationale above is about PULL REQUESTS — a release-CDN download must not
  # flake a required PR gate — and push-to-main is not a required gate, so it
  # is unaffected. Nightly is now the mirror of what a merge runs.
  push:
    branches: [main]
  schedule:
    - cron: "53 5 * * *" # nightly 05:53 UTC
  workflow_dispatch: {}

jobs:
  rmpc-release-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root browser tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # Needed by scripts/demo.ts's host-side EDGAR seed bootstrap step
      # (backend/scripts/edgar-seed-bootstrap.ts, issue #108) — see e2e.yml's
      # matching step for the full rationale.
      - name: Install backend deps (for the host-side EDGAR seed bootstrap step)
        working-directory: backend
        run: bun install --frozen-lockfile

      # Reuses the EXACT demo stack boot (scripts/demo.ts → scripts/lib/demo-main.ts):
      # postgres + api + worker via docker compose, migrations, health checks,
      # then the existing required-tier checks (LIVE committee session, frontend
      # checks, browser checks, live steady-state smoke — issue #147 removed
      # DEMO_HERMETIC and the hermetic path entirely, so every boot is LIVE now) —
      # RMPC_RELEASE_E2E=1 additionally runs scripts/rmpc-release-e2e.ts against
      # that SAME booted stack before teardown, so there is no parallel stack
      # bring-up for this driver.
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Boot demo stack + rmpc release e2e driver
        run: bun run scripts/demo.ts
        env:
          CI: "true"
          RMPC_RELEASE_E2E: "1"
        timeout-minutes: 40
