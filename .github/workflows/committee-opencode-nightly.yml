# Nightly REAL committee-member inference check (issue #77).
#
# WHY THIS SUITE EXISTS
# Real-inference onboarding — a vanilla OpenCode agent navigating our own docs
# end to end with a live model — needs a daily sampled run wider than the
# required per-PR `e2e` gate can afford (more identities per night).
#
# D21 (docs/decisions.md): this suite previously also carried a
# `committee-real-inference` job that ran an external `opencode run` CLI against
# a REMOTE MCP server, asserting the model could discover and call the committee
# MCP tools (get_regime/get_brief/post_memo). D21 retired the MCP transport and
# deleted that harness (scripts/opencode-committee-tools-test.ts, mcp/), so the
# job is removed here — it tested a surface that no longer exists.
#
# COVERAGE GAP (honest): with that job gone, NO CI job currently exercises the
# real-model committee-take authoring path (COMMITTEE_REAL_INFERENCE=1,
# scripts/lib/committee/inference.ts) — every committee take in CI, including in
# the demo boot below, takes the deterministic stanceFor()/buildMemo() template
# path. Re-establishing that coverage — a job that sets COMMITTEE_REAL_INFERENCE=1
# and loud-fails on the deterministic fallback, and/or drives an external
# real-inference agent through the REST participation chain — is follow-up work,
# not part of the retirement. What IS covered nightly below is real-inference
# ONBOARDING (ONBOARDING_REAL_EVAL), a different surface.
#
# NO SECRET, EVER (docs/decisions.md D22 rule 1, docs/architecture.md §11.3 E1)
# `opencode/big-pickle` is a free, no-credential OpenCode Zen model, pinned by
# an in-code constant in scripts/agent/model-config.ts. This job is keyless: it
# reads no credential and passes none. The sweep-over-models rationale this
# suite used to carry is RETIRED — "does a stronger model refuse less often?"
# is a research question about models, not a gate on our instructions, and
# answering it inside the gate made the gate's subject ambiguous. The keyless
# admission rate is the number that means something about this product.
#
# Landing in the follow-up eval unit (docs/architecture.md §11.3): E4 sampling
# (K samples, classified outcomes, admission RATE as the reported metric) and
# the repoint of this job onto the layered eval running on a `core` stack.
#
# CI taxonomy class: heavy (scheduled real external-model drift check). Heavy
# suites are sweep-only: NO `pull_request` trigger — schedule + on-demand only.
#
# The job below, `onboarding-real-inference-sweep`, exists to run a WIDER
# sampled eval than the required PR gate (.github/workflows/e2e.yml) can afford
# on every push — real inference is not nightly-exclusive (that's the whole
# point of the §11 R8 rework: onboarding-as-eval only means something with a
# real model doing the reasoning, on every PR that touches this surface).
# INTERIM, stated plainly rather than left to look accidental: until the §11.3
# E3/E4 eval lands, this job runs the SAME single keyless admission the `e2e`
# gate runs. That is a knowing duplicate for one unit, not a hidden one.
name: committee-opencode-nightly
env:
  CI_CLASS: heavy
on:
  schedule:
    - cron: "37 4 * * *" # nightly 04:37 UTC
  workflow_dispatch: {}

jobs:
  # Real-inference onboarding admission (§11 R8, Stage 7). Reuses the EXACT
  # demo stack boot the required `e2e` PR gate uses (scripts/demo.ts →
  # scripts/lib/demo-main.ts, same pattern as rmpc-release-e2e-nightly.yml's
  # "boot once, drive the extra check off the same boot" — no parallel stack
  # stood up here). No secret access is used or needed here, and e2e.yml no
  # longer gates on trust context either: with nothing to withhold, every run
  # of this eval is identical (D22 rule 1 / §11.3 E1). Until the sampling unit
  # lands, this runs the same single keyless admission as `e2e` — an honest
  # interim, not a hidden duplicate.
  onboarding-real-inference-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root browser tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install backend deps (for the host-side EDGAR seed bootstrap step)
        working-directory: backend
        run: bun install --frozen-lockfile
      # Cache the pinned rmpc release binary by tag — same rationale as e2e.yml.
      - name: Resolve pinned rmpc release version (cache key)
        id: rmpc-version
        run: |
          VERSION=$(bun -e 'import("./scripts/lib/rmpc-fetch.ts").then((m) => console.log(m.RMPC_VERSION))')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache rmpc release binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rmpc-cache
          key: rmpc-${{ steps.rmpc-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      # Boot demo stack + the real-inference onboarding admission, against that
      # SAME booted stack (RMPC_RELEASE_E2E-style additive reuse — see
      # scripts/lib/demo-main.ts's ONBOARDING_REAL_EVAL block). Keyless: the env
      # below carries no model id and no credential, because none exists to
      # carry. Fails loudly (non-zero exit, no skip) if the rmpc binary can't be
      # fetched/verified or the admission doesn't reach the active roster.
      - name: Boot demo stack + real-inference onboarding admission
        run: bun run scripts/demo.ts
        env:
          CI: "true"
          DEMO_PROJECT: rmdemo_ci_onboarding_${{ github.run_id }}_${{ github.run_attempt }}
          RMPC_CACHE_DIR: ${{ github.workspace }}/.rmpc-cache
          ONBOARDING_REAL_EVAL: "1"
        timeout-minutes: 55
      - name: Reclaim this run's demo volume (no leaks on the shared runner)
        if: always()
        run: bun run scripts/demo-clean.ts --project "$DEMO_PROJECT"
        env:
          DEMO_PROJECT: rmdemo_ci_onboarding_${{ github.run_id }}_${{ github.run_attempt }}
