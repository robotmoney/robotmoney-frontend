# Nightly REAL-inference onboarding EVAL (docs/architecture.md §11.3,
# docs/decisions.md D22; issue #77 is where this suite started).
#
# WHAT THIS RUNS
# `evals/onboarding/` — the layered, keyless onboarding eval:
#   layers 0-3 (isolated, no server): runtime, skill install, rmpc toolchain,
#     keygen + offline signature verification;
#   layer 4 (admission, `core` stack = postgres + api only): the full R4→R8
#     sequence, sampled K times, scored by ADMISSION RATE.
# The eval never boots the full demo cluster: no worker lanes, no EDGAR seed,
# no frontend checks, no session drivers — which is why this job no longer
# installs Chromium, no longer installs backend deps for a seed bootstrap, and
# no longer reclaims a demo volume.
#
# NO SECRET IS USED, AND NONE EXISTS TO USE (D22 rule 1 / §11.3 E1)
# The eval runs a vanilla, keyless OpenCode install pinned by an in-code
# constant in scripts/agent/model-config.ts. There is no `env:` block here on
# purpose: no model id, no credential, no sweep knob, no opt-in. A fork run and
# a same-repo run are therefore IDENTICAL — there is nothing to withhold from
# one of them — and any contributor with Docker and egress runs exactly this,
# locally, with `bun run eval:onboarding`.
#
# NO INFERENCE-OFF MODE (§11.3 E2)
# Every layer makes a real model call. Missing Docker or missing egress THROWS;
# nothing here skips. The inference-off RAILS check that proves the machinery
# this eval rides on is a different thing entirely and stays on the per-PR path
# (scripts/tests/integration/onboarding-eval-infra.test.ts).
#
# A REFUSAL IS DATA, NOT FLAKE
# On 2026-07-25 a demo run admitted zero members because the model REFUSED the
# canonical prompt in roughly 1 sample of 5, and no instrument in this repo
# could see it. Layer 4's scorecard is that instrument: every outcome is
# classified and the rate is reported, so a rising refusal rate reads as the
# prompt-quality regression it is. The scorecard is uploaded on every run,
# INCLUDING a failed one — its per-outcome counts are the only thing that
# distinguishes a product regression from a provider outage.
#
# COVERAGE GAP (honest, unchanged): no CI job exercises the real-model committee
# TAKE-authoring path (COMMITTEE_REAL_INFERENCE, scripts/lib/committee/
# inference.ts). That is a different surface from onboarding, and
# re-establishing it is follow-up work.
#
# CI taxonomy class: heavy (scheduled real external-model drift check). Heavy
# suites are sweep-only: NO `pull_request` trigger — schedule + on-demand only.
# `ubuntu-latest`, not the self-hosted runner: that runner shares its IP with
# the standing rmdemo_* stack and has a documented history of 429 flake on
# live-call gates.
#
# TWO JOBS, matching the two cost directories (§3 L1). The isolated layers are
# cheap and give sharp per-step diagnostics; the sampled admission sweep is the
# expensive one. Splitting them means a 150-minute sweep can never swallow the
# layer diagnostics' wall clock, and a red layer 2 is visible without waiting
# for layer 4. No new workflow is added (§11.3 E6).
name: committee-opencode-nightly
env:
  CI_CLASS: heavy
on:
  schedule:
    - cron: "37 4 * * *" # nightly 04:37 UTC
  workflow_dispatch: {}

jobs:
  # Layers 0-3 — no server, no stack: the member-agent image and the agent only.
  onboarding-eval-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Layers 0-3 (runtime, skill install, rmpc toolchain, keygen + signing)
        run: bun run eval:onboarding:isolated
        timeout-minutes: 80
      - name: Reclaim any eval containers/networks/volumes left behind
        if: always()
        run: |
          docker ps -aq --filter "name=rmeval_" | xargs -r docker rm -f
          docker network ls -q --filter "name=rmeval_" | xargs -r docker network rm
          docker volume ls -q --filter "name=rmeval_" | xargs -r docker volume rm

  # Layer 4 — the sampled admission sweep, on a `core` stack.
  onboarding-real-inference-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Layer 4 — sampled admission (K samples, scored by admission rate)
        run: bun run eval:onboarding:admission
        timeout-minutes: 150
      - name: Upload the scorecard (always — a failed sweep still reports its rate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-eval-scorecard
          path: |
            .agents/onboarding-eval-scorecard.json
            .agents/onboarding-eval-transcripts/
          if-no-files-found: warn
      - name: Reclaim any eval containers/networks/volumes left behind
        if: always()
        run: |
          docker ps -aq --filter "name=rmeval_" | xargs -r docker rm -f
          docker network ls -q --filter "name=rmeval_" | xargs -r docker network rm
          docker volume ls -q --filter "name=rmeval_" | xargs -r docker volume rm
