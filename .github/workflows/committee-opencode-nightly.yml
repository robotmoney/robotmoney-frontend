# Nightly REAL committee-member inference check (issue #77).
#
# WHY THIS SUITE EXISTS
# Real-inference onboarding — a vanilla OpenCode agent navigating our own docs
# end to end with a live model — needs a daily sweep wider than the required
# per-PR `e2e` gate can afford (more identities, more model variety).
#
# D21 (docs/decisions.md): this suite previously also carried a
# `committee-real-inference` job that ran an external `opencode run` CLI against
# a REMOTE MCP server, asserting the model could discover and call the committee
# MCP tools (get_regime/get_brief/post_memo). D21 retired the MCP transport and
# deleted that harness (scripts/opencode-committee-tools-test.ts, mcp/), so the
# job is removed here — it tested a surface that no longer exists.
#
# COVERAGE GAP (honest): with that job gone, NO CI job currently exercises the
# real-model committee-take authoring path (COMMITTEE_REAL_INFERENCE=1,
# scripts/lib/committee/inference.ts) — every committee take in CI, including in
# the demo boot below, takes the deterministic stanceFor()/buildMemo() template
# path. Re-establishing that coverage — a job that sets COMMITTEE_REAL_INFERENCE=1
# and loud-fails on the deterministic fallback, and/or drives an external
# real-inference agent through the REST participation chain — is follow-up work,
# not part of the retirement. What IS covered nightly below is real-inference
# ONBOARDING (ONBOARDING_REAL_EVAL), a different surface.
#
# NO SECRET (keyless default)
# `opencode/big-pickle` is a free, no-credential OpenCode Zen model. The sweep
# job below opts into a paid model via ANTHROPIC_API_KEY for reliability.
#
# CI taxonomy class: heavy (scheduled real external-model drift check). Heavy
# suites are sweep-only: NO `pull_request` trigger — schedule + on-demand only.
#
# The job below, `onboarding-real-inference-sweep`, is NOT a duplicate of the
# required PR gate's (.github/workflows/e2e.yml) real-inference onboarding
# admission — real inference is no longer nightly-exclusive (that's the whole
# point of the §11 R8 rework: onboarding-as-eval only means something with a
# real model doing the reasoning, on every PR that touches this surface). This
# job is additive: it runs a WIDER sweep (more identities, more model variety)
# than the PR gate can afford to spend on every push, using an
# ANTHROPIC_API_KEY secret.
name: committee-opencode-nightly
env:
  CI_CLASS: heavy
on:
  schedule:
    - cron: "37 4 * * *" # nightly 04:37 UTC
  workflow_dispatch: {}

jobs:
  # Broader/deeper real-inference onboarding sweep (§11 R8, Stage 7). Reuses
  # the EXACT demo stack boot the required `e2e` PR gate uses
  # (scripts/demo.ts → scripts/lib/demo-main.ts, same pattern as
  # rmpc-release-e2e-nightly.yml's "boot once, drive the extra check off the
  # same boot" — no parallel stack stood up here) but sweeps
  # ONBOARDING_SWEEP_MODELS × ONBOARDING_SWEEP_IDENTITIES_PER_MODEL admissions
  # instead of the PR gate's single one. A run here has full repo-secret
  # access (scheduled/workflow_dispatch triggers are never fork PRs), so no
  # trust-context gating is needed — unlike e2e.yml, which must gate this
  # exact eval behind a same-repo/trusted-context check.
  onboarding-real-inference-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root browser tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install backend deps (for the host-side EDGAR seed bootstrap step)
        working-directory: backend
        run: bun install --frozen-lockfile
      # Cache the pinned rmpc release binary by tag — same rationale as e2e.yml.
      - name: Resolve pinned rmpc release version (cache key)
        id: rmpc-version
        run: |
          VERSION=$(bun -e 'import("./scripts/lib/rmpc-fetch.ts").then((m) => console.log(m.RMPC_VERSION))')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache rmpc release binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rmpc-cache
          key: rmpc-${{ steps.rmpc-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      # Boot demo stack + a WIDER real-inference onboarding sweep than the PR
      # gate runs, against that SAME booted stack (RMPC_RELEASE_E2E-style
      # additive reuse — see scripts/lib/demo-main.ts's ONBOARDING_REAL_EVAL
      # block). Fails loudly (non-zero exit, no skip) if the model key isn't
      # usable, the rmpc binary can't be fetched/verified, or any swept
      # admission doesn't reach the active roster.
      - name: Boot demo stack + real-inference onboarding sweep
        run: bun run scripts/demo.ts
        env:
          CI: "true"
          DEMO_PROJECT: rmdemo_ci_onboarding_${{ github.run_id }}_${{ github.run_attempt }}
          RMPC_CACHE_DIR: ${{ github.workspace }}/.rmpc-cache
          ONBOARDING_REAL_EVAL: "1"
          OPENCODE_MODEL: ${{ vars.ONBOARDING_EVAL_MODEL || 'anthropic/claude-haiku-4-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Wider than the PR gate's implicit single model / single identity:
          # two models, two fresh identities each = 4 real admissions/night.
          ONBOARDING_SWEEP_MODELS: "anthropic/claude-haiku-4-5:anthropic/claude-sonnet-5"
          ONBOARDING_SWEEP_IDENTITIES_PER_MODEL: "2"
        timeout-minutes: 55
      - name: Reclaim this run's demo volume (no leaks on the shared runner)
        if: always()
        run: bun run scripts/demo-clean.ts --project "$DEMO_PROJECT"
        env:
          DEMO_PROJECT: rmdemo_ci_onboarding_${{ github.run_id }}_${{ github.run_attempt }}
