# Integration tier of the test pyramid: Docker- and network-backed suites that
# cannot run on a bare checkout. The self-contained preload starts an ephemeral
# Postgres via Docker and applies migrations, then tears it down — the SAME
# harness used locally, so there is no CI-specific behavior. A missing
# Docker/Postgres fails the run loudly.
#
# CI taxonomy class: system-correctness. Per the taxonomy gating matrix this is
# DEFERRED until a PR is ready for review: it must SKIP on draft PRs and RUN
# once the PR is marked ready-for-review, plus on push to the default branch.
#
# Post-split (issue #275): this workflow runs ONLY the scripts/tests/integration
# cost class. The unit class, backend, contract, and repo-guards have their own
# dedicated workflows. This workflow feeds the ci-gate fan-in required check.
name: integration
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  integration:
    # Deferred until ready-for-review: run on push (non-PR) and on non-draft PRs;
    # skip while the PR is still a draft.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, robotmoney-self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # scripts/tests/integration/admin-live-guard.test.ts spawns `bun run test:browser --
      # --list`, which shells out to Playwright's CLI/transform — that runs on
      # Node.js (its bin is `#!/usr/bin/env node`), which `setup-bun` does not
      # provide. On a self-hosted runner without a system node, Playwright's
      # build fails for every spec ("2 errors building …") and the guard test
      # sees that generic failure instead of admin-live.spec.ts's own loud-skip
      # message. Provision node so the guard exercises the real spec load path.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      # Installed BEFORE test steps (issue #108): scripts/tests/
      # integration/demo-edgar-bootstrap.test.ts spawns backend/scripts/edgar-seed-bootstrap.ts
      # as a host-side subprocess (cwd: backend/), which needs backend's own
      # node_modules (@robotmoney/contract) resolvable — the same reason the
      # rest of this job's backend steps need it, just moved earlier.
      - name: Install deps
        working-directory: backend
        run: bun install --frozen-lockfile
      # Docker- and network-backed suites. This job is the only place they run
      # per-PR, which is exactly what the split buys: cheaper jobs can select
      # scripts/tests/unit without paying for these.
      - name: Integration cost class (scripts/tests/integration)
        run: bun run test:integration
