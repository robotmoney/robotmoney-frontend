# Integration tier of the test pyramid: the backend suite runs against a real
# Postgres. The self-contained preload starts an ephemeral Postgres via Docker
# (available on ubuntu-latest) and applies migrations, then tears it down — the
# SAME harness used locally, so there is no CI-specific behavior. A missing
# Docker/Postgres fails the run loudly.
#
# CI taxonomy class: system-correctness (backend suite vs real Postgres). Per the
# taxonomy gating matrix this is DEFERRED until a PR is ready for review: it must
# SKIP on draft PRs and RUN once the PR is marked ready-for-review, plus on push
# to the default branch. Wiring that enforces this:
#   - `pull_request.types` includes `ready_for_review` so flipping a draft to
#     ready re-triggers the workflow (default PR types would not).
#   - the job `if:` guard skips the run while the PR is still a draft.
#   - `paths-ignore: ['**.md','**.txt']` bypasses this code check on docs-only PRs.
# A nightly sweep is intentionally NOT added: the intended triggers are ready PRs
# + push main. The taxonomy grader flags a missing nightly sweep only as an
# optional full-sweep warning, never an error.
name: integration
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']

jobs:
  backend-integration:
    # Deferred until ready-for-review: run on push (non-PR) and on non-draft PRs;
    # skip while the PR is still a draft.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, robotmoney-self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # scripts/tests/integration/admin-live-guard.test.ts spawns `bun run test:browser --
      # --list`, which shells out to Playwright's CLI/transform — that runs on
      # Node.js (its bin is `#!/usr/bin/env node`), which `setup-bun` does not
      # provide. On a self-hosted runner without a system node, Playwright's
      # build fails for every spec ("2 errors building …") and the guard test
      # sees that generic failure instead of admin-live.spec.ts's own loud-skip
      # message. Provision node so the guard exercises the real spec load path.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      # Installed BEFORE the root-script steps (issue #108):
      # scripts/tests/integration/demo-edgar-bootstrap.test.ts spawns
      # backend/scripts/edgar-seed-bootstrap.ts as a host-side subprocess
      # (cwd: backend/), which needs backend's own node_modules
      # (@robotmoney/contract) resolvable — the same reason the rest of this
      # job's backend steps need it, just moved earlier.
      - name: Install deps
        working-directory: backend
        run: bun install --frozen-lockfile
      # D23 L1: scripts/tests/ is split by cost class, and the split buys
      # SELECTABILITY, not a smaller per-PR suite — both classes still run on
      # every non-draft PR, as two separate unconditional steps (no `if:`, no
      # continue-on-error) so a red is attributable to its cost class.
      # `bun run test:unit` needs nothing but the checkout; `test:integration`
      # needs the docker CLI/daemon and GitHub Releases egress. `bun run test`
      # (the recursive aggregate) stays the local one-command target.
      - name: Check root scripts (typecheck + unit tests)
        run: bun run typecheck && bun run test:unit
      - name: Root integration tests (docker CLI/daemon + GitHub Releases egress)
        run: bun run test:integration
      - name: Check docs/analytics consistency
        run: bash scripts/check-docs-analytics.sh
      - name: Typecheck backend
        working-directory: backend
        run: bun run typecheck
      - name: No Supabase infra in backend/src (issue #87)
        run: bash backend/scripts/check-no-supabase.sh
      - name: No AI/LLM overview enrichment in backend/src (issue #93)
        run: bash backend/scripts/check-no-ai-overview.sh
      # D22 rules 1-2 / §11.3 E1-E2: evals/ must carry no provider key, no paid
      # model, no environment read at all, no conditional skip, and no test
      # double or injection seam. Milliseconds, no Docker — and executed (with
      # negative controls) by scripts/tests/unit/evals-guard.test.ts so the guard
      # itself can never go vacuously green.
      - name: Evals are keyless and have no inference-off mode (D22 E1/E2)
        run: bash scripts/checks/check-eval-keyless.sh
      # D23 / §3 L3, the dependency-direction half: tests and evals may import
      # runtime and shared code, but runtime must never import test or eval
      # code. Milliseconds, no Docker — and executed with a planted violation by
      # scripts/tests/unit/runtime-import-guard.test.ts.
      - name: Runtime never imports test or eval code (D23 §3 L3)
        run: bash scripts/checks/check-no-test-imports-in-runtime.sh
      - name: Verify vendored contract
        run: bun run check-contract
      # contract/ has tests but, until this step existed, NO workflow ever ran
      # them (nothing used `working-directory: contract`) — a test-coverage
      # invariant-4 violation, and the reason a 404ing
      # COMMITTEE_ONBOARDING_SKILL_URL survived in a file that has a test
      # asserting its shape. `bun test tests/unit` pins the cost class: the
      # package's network-touching live test lives in contract/tests/live/ and
      # is run only by nightly-fetchers.yml, so this step stays offline.
      - name: Contract tests (unit)
        working-directory: contract
        run: bun run test
      - name: Run tests (ephemeral Postgres via Docker)
        working-directory: backend
        run: bun test
