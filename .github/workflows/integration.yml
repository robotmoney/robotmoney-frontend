# Integration tier of the test pyramid: the backend suite runs against a real
# Postgres. The self-contained preload starts an ephemeral Postgres via Docker
# (available on ubuntu-latest) and applies migrations, then tears it down — the
# SAME harness used locally, so there is no CI-specific behavior. A missing
# Docker/Postgres fails the run loudly.
#
# CI taxonomy class: system-correctness (backend suite vs real Postgres). Per the
# taxonomy gating matrix this is DEFERRED until a PR is ready for review: it must
# SKIP on draft PRs and RUN once the PR is marked ready-for-review, plus on push
# to the default branch. Wiring that enforces this:
#   - `pull_request.types` includes `ready_for_review` so flipping a draft to
#     ready re-triggers the workflow (default PR types would not).
#   - the job `if:` guard skips the run while the PR is still a draft.
#   - `paths-ignore: ['**.md','**.txt']` bypasses this code check on docs-only PRs.
# A nightly sweep is intentionally NOT added: the intended triggers are ready PRs
# + push main. The taxonomy grader flags a missing nightly sweep only as an
# optional full-sweep warning, never an error.
name: integration
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']

jobs:
  backend-integration:
    # Deferred until ready-for-review: run on push (non-PR) and on non-draft PRs;
    # skip while the PR is still a draft.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, robotmoney-self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # scripts/tests/admin-live-guard.test.ts spawns `bun run test:browser --
      # --list`, which shells out to Playwright's CLI/transform — that runs on
      # Node.js (its bin is `#!/usr/bin/env node`), which `setup-bun` does not
      # provide. On a self-hosted runner without a system node, Playwright's
      # build fails for every spec ("2 errors building …") and the guard test
      # sees that generic failure instead of admin-live.spec.ts's own loud-skip
      # message. Provision node so the guard exercises the real spec load path.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      # Installed BEFORE "Check root scripts" (issue #108): scripts/tests/
      # demo-edgar-bootstrap.test.ts spawns backend/scripts/edgar-seed-bootstrap.ts
      # as a host-side subprocess (cwd: backend/), which needs backend's own
      # node_modules (@robotmoney/contract) resolvable — the same reason the
      # rest of this job's backend steps need it, just moved earlier.
      - name: Install deps
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Check root scripts
        run: bun run typecheck && bun run test
      - name: Check docs/analytics consistency
        run: bash scripts/check-docs-analytics.sh
      - name: Typecheck backend
        working-directory: backend
        run: bun run typecheck
      - name: No Supabase infra in backend/src (issue #87)
        run: bash backend/scripts/check-no-supabase.sh
      - name: No AI/LLM overview enrichment in backend/src (issue #93)
        run: bash backend/scripts/check-no-ai-overview.sh
      - name: Verify vendored contract
        run: bun run check-contract
      - name: Run tests (ephemeral Postgres via Docker)
        working-directory: backend
        run: bun test
