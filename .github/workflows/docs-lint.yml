# Doc-correctness tier of the test pyramid (issue #165). Every code-check
# workflow in this repo (e2e, integration) carries a
# `paths-ignore: ['**.md', '**.txt']` bypass, so a PR that changes only
# Markdown (e.g. a docs-only spec drop) triggers zero of them — `gh pr checks`
# reports nothing to gate on. Per the CI taxonomy, `doc-correctness` is the one
# class explicitly required to still run on docs-only PRs, so it is the check
# that gives a pure-docs PR any CI signal at all. Deliberately lightweight —
# no external linter dependency, no network access, just the sanity checks in
# scripts/lint-docs.sh (kebab-case docs/*.md filenames, no unresolved conflict
# markers, no empty doc files).
#
# CI taxonomy class: doc-correctness. Per the taxonomy gating matrix this must
# run on every PR (draft AND ready-for-review) and on push to main — unlike
# the code-check classes, it carries no `paths-ignore` and no draft `if:`
# guard, since running it is the entire point on a docs-only diff.
#
# This doc-correctness job now ALSO runs scripts/check-contribution.ts on pull
# requests: an author-aware, deny-by-default file gate. Every create/edit/delete
# in the PR diff is checked against .github/file-permissions.json, which maps
# each GitHub login to permitted path globs per operation; an author with no
# matching glob for the operation on the path is blocked. The same script also
# runs a docs task-list PM-state check (roadmap/checklist checkboxes belong in
# the GitHub Plan issue, not committed docs). It carries no paths-ignore so it
# still runs on docs-only PRs.
name: docs-lint
env:
  CI_CLASS: doc-correctness

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  docs-lint:
    runs-on: [self-hosted, robotmoney-self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint docs
        run: bash scripts/lint-docs.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Contribution governance check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          bun scripts/check-contribution.ts
