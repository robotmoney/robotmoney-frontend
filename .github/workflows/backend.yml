# Backend tier: typecheck, policy greps, and integration test against a real
# ephemeral Postgres via Docker. The self-contained preload starts an ephemeral
# Postgres via Docker (available on the self-hosted runner) and applies
# migrations, then tears it down — the SAME harness used locally, so there is
# no CI-specific behavior. A missing Docker/Postgres fails the run loudly.
#
# CI taxonomy class: system-correctness (backend suite vs real Postgres). Per the
# taxonomy gating matrix this is DEFERRED until a PR is ready for review: it must
# SKIP on draft PRs and RUN once the PR is marked ready-for-review, plus on push
# to the default branch.
#
# This workflow replaces the backend-specific steps that previously lived in
# integration.yml (issue #275). It is directly required in branch protection
# (issue #275 addendum: the ci-gate.yml/ci-gate.ts fan-in mechanism this
# workflow used to feed was removed after a production incident on PR #316; a
# structurally sounder fan-in replacement is tracked in issue #348).
#
# RELEASE BRANCHES RUN THE SAME SET (2026-08-23). `releases-*` is on the push
# trigger beside `main` because a release branch is where release code actually
# lives during a rollout: it is cut from main, then accumulates rc commits that
# main never sees until the backport. Without this, every one of those commits
# was unverified by CI, and the v0.3.0 rollout ended up running suites by hand on
# the stage host and discovering a broken gate four rcs deep. `push` to a release
# branch is never path-filtered, exactly as `push` to main is not — see the job
# `if:` below, which keys on `event_name != 'pull_request'` and so already
# covered this the moment the trigger did.
#
# Path-gated (issue #275 addendum): a `pull_request` run whose changed files
# don't match `backend/**`/`docker-compose*.yml` skips the job body entirely —
# a REAL dorny/paths-filter-computed skip, not a synthetic outcome. Because
# it's a job-level `if:` skip (never workflow-level `on.paths`), it reports a
# real `skipped` conclusion to the Checks API, so requiring this workflow
# directly in branch protection carries no deadlock risk. `push` to `main` is never
# path-filtered — see the job `if:` below — so a merge to main always runs the
# full backend suite regardless of what changed.
#
# `bun test`'s --path-ignore-patterns below excludes the two tests that now
# belong exclusively to research-pipeline.yml (issue #275 addendum): the
# GeckoTerminal new_pools resilience suite and the chain token-price resilience
# suite. Both are narrowly scoped to backend/src/analytics/** and
# backend/src/chain/**, so an unrelated backend change (swarm, admin,
# chain-agnostic routes) no longer pays for them — research-pipeline.yml runs
# them exclusively, gated on those specific paths.
name: backend
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main, "releases-*"]
  # NIGHTLY MIRROR of the merge-to-main set (issue #373): every workflow that
  # runs on `push: branches: [main]` also runs on a nightly schedule, and
  # nothing else does — so a red nightly means exactly what a red merge would
  # have meant, with no required reading. Cron minutes are staggered across the
  # ten mirrors. The invariant is enforced mechanically by
  # scripts/tests/unit/nightly-mirrors-merge-set.test.ts, not by convention.
  schedule:
    - cron: "27 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ── change detection ───────────────────────────────────────────────────────
  changes:
    # Plumbing, not an assurance job itself — it must run in EVERY context,
    # including pr_draft, so the main job below has a filter output to gate
    # on. Overriding the workflow-level CI_CLASS here keeps the taxonomy
    # scanner from flagging this job as a system-correctness job that
    # wrongly runs on drafts.
    env:
      CI_CLASS: ignore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'

  backend:
    needs: [changes]
    # Deferred until ready-for-review: run on push (non-PR) and on non-draft PRs;
    # skip while the PR is still a draft. Path-gated ONLY on pull_request: a
    # push to main always runs regardless of needs.changes' output.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Install deps
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Typecheck backend
        working-directory: backend
        run: bun run typecheck
      - name: Run tests (ephemeral Postgres via Docker)
        working-directory: backend
        # tests/geckoterminal-resilience.test.ts and
        # tests/token-prices-resilience.test.ts are excluded here — they are
        # research-pipeline.yml's exclusive responsibility (issue #275 addendum).
        run: bun test --path-ignore-patterns='tests/geckoterminal-resilience.test.ts' --path-ignore-patterns='tests/token-prices-resilience.test.ts'
