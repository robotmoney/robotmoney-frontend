# Nightly live-fetcher drift check. The live drift test (tests/fetchers-live.test.ts)
# HITS REAL KEYLESS ENDPOINTS (FRED/Yahoo/DefiLlama/blockchain.com/Coinmetrics/
# GeckoTerminal/Shiller/EDGAR). It is intentionally NOT gated on plain CI, so it
# never runs on PRs where a transient upstream hiccup could flake an unrelated
# change. Instead it runs here on a daily schedule (and on-demand) with
# RUN_LIVE_FETCHERS=1, so source drift is still caught every day without gating PRs.
# Per-PR coverage remains the deterministic parser suite (tests/extract.test.ts).
#
# Also runs the live Base RPC smoke test (tests/vault-rpc-live.test.ts, issue
# #40): hits the real configured vault contract over the real Base RPC and
# fails loudly (non-zero exit) on an unreachable RPC or malformed response.
# Per-PR coverage for the vault-economics chain client is fully offline
# (tests/chain-client.test.ts + tests/vault-economics.test.ts, mocked eth_call).
#
# Also runs the live GeckoTerminal token_price smoke test
# (tests/token-price-live.test.ts): hits the real GeckoTerminal
# simple/networks/base/token_price endpoint (fetchGeckoTokenPriceUsd in
# src/chain/token-prices.ts) that feeds the LIVE /allocation and /performance
# prop-wallet USD valuation for WETH/ROBOTMONEY/BNKR, and fails loudly on an
# unreachable endpoint or malformed response. Per-PR coverage is fully offline
# (tests/api/wallet-balances.test.ts, mocked fetch).
#
# Also runs the contract package's LIVE published-URL reachability suite
# (contract/tests/live/, job `contract-live-urls`): a real fetch of
# COMMITTEE_ONBOARDING_SKILL_URL asserting HTTP 200 plus the skill's own
# front-matter markers. That constant is the D21 onboarding flow's single
# discovery mechanism, and a 404 on it is silent — the member agent just never
# finds the skill — so it needs a real request somewhere. It belongs HERE rather
# than on the per-PR path for the same reason as everything above: a transient
# GitHub hiccup must not flake an unrelated PR. Per-PR coverage is the offline
# regression pin in contract/tests/unit/committee-application.test.ts, run by
# the required `integration` job.
#
# This workflow is therefore the repo's nightly LIVE external-dependency sweep:
# live data fetchers AND published-artifact URLs. A separate live.yml was
# rejected — it would duplicate this schedule, class annotation, and checkout to
# run one 2-second job.
#
# CI taxonomy class: heavy (scheduled live external-endpoint drift test). Heavy
# suites are sweep-only: they must have NO `pull_request` trigger at all, and run
# only on a schedule and/or push to the default branch. This workflow already
# carries only `schedule` + `workflow_dispatch`, so keeping the live-fetcher test
# off the per-PR graph is exactly what the taxonomy requires.
name: nightly-fetchers
env:
  CI_CLASS: heavy
on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC
  workflow_dispatch: {}

jobs:
  live-fetchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install deps
        working-directory: backend
        run: bun install
      # EXPECT_LIVE=1 on every live-suite step is the execution-evidence guard
      # (test-coverage policy invariant 2): each live test file throws at module
      # load when EXPECT_LIVE=1 but its RUN_LIVE_FETCHERS gate resolves off, so a
      # gate-name drift between this workflow and the test files fails the
      # nightly loudly instead of turning every live test into a silent
      # all-skips green. scripts/tests/unit/nightly-fetchers-guard.test.ts (required
      # integration root job) asserts this pairing stays present here and in the
      # test files.
      - name: Live fetcher drift test (real keyless endpoints)
        working-directory: backend
        run: bun test tests/fetchers-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
          EXPECT_LIVE: "1"
        timeout-minutes: 15
      - name: Live projects provider drift test (CoinGecko + DexScreener, issue #87)
        working-directory: backend
        run: bun test tests/projects-fetchers-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
          EXPECT_LIVE: "1"
        timeout-minutes: 10
      - name: Live Base RPC smoke test (real vault contract)
        working-directory: backend
        run: bun test tests/vault-rpc-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
          EXPECT_LIVE: "1"
        timeout-minutes: 5
      - name: Live GeckoTerminal token_price smoke test (real endpoint)
        working-directory: backend
        run: bun test tests/token-price-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
          EXPECT_LIVE: "1"
        timeout-minutes: 5

  # Published-artifact URL reachability. No `bun install`: contract/ has zero
  # dependencies and its tests import by relative path. No env gate and no skip —
  # `bun test tests/live` fails loudly on a 404, a DNS failure, or blocked
  # egress, and exits 1 if the directory ever empties out (bun 1.3.x treats
  # "no tests collected" as an error), so this job can never pass by absence.
  contract-live-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Published skill URL reachability (live)
        working-directory: contract
        run: bun run test:live
        timeout-minutes: 5
