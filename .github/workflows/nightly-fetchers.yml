# Nightly live-fetcher drift check. The live drift test (tests/fetchers-live.test.ts)
# HITS REAL KEYLESS ENDPOINTS (FRED/Yahoo/DefiLlama/blockchain.com/Coinmetrics/
# GeckoTerminal/Shiller/EDGAR). It is intentionally NOT gated on plain CI, so it
# never runs on PRs where a transient upstream hiccup could flake an unrelated
# change. Instead it runs here on a daily schedule (and on-demand) with
# RUN_LIVE_FETCHERS=1, so source drift is still caught every day without gating PRs.
# Per-PR coverage remains the deterministic parser suite (tests/extract.test.ts).
name: nightly-fetchers
on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC
  workflow_dispatch: {}

jobs:
  live-fetchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install deps
        working-directory: backend
        run: bun install
      - name: Live fetcher drift test (real keyless endpoints)
        working-directory: backend
        run: bun test tests/fetchers-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
        timeout-minutes: 15
