# Nightly live-fetcher drift check. The live drift test (tests/fetchers-live.test.ts)
# HITS REAL KEYLESS ENDPOINTS (FRED/Yahoo/DefiLlama/blockchain.com/Coinmetrics/
# GeckoTerminal/Shiller/EDGAR). It is intentionally NOT gated on plain CI, so it
# never runs on PRs where a transient upstream hiccup could flake an unrelated
# change. Instead it runs here on a daily schedule (and on-demand) with
# RUN_LIVE_FETCHERS=1, so source drift is still caught every day without gating PRs.
# Per-PR coverage remains the deterministic parser suite (tests/extract.test.ts).
#
# Also runs the live Base RPC smoke test (tests/vault-rpc-live.test.ts, issue
# #40): hits the real configured vault contract over the real Base RPC and
# fails loudly (non-zero exit) on an unreachable RPC or malformed response.
# Per-PR coverage for the vault-economics chain client is fully offline
# (tests/chain-client.test.ts + tests/vault-economics.test.ts, mocked eth_call).
#
# CI taxonomy class: heavy (scheduled live external-endpoint drift test). Heavy
# suites are sweep-only: they must have NO `pull_request` trigger at all, and run
# only on a schedule and/or push to the default branch. This workflow already
# carries only `schedule` + `workflow_dispatch`, so keeping the live-fetcher test
# off the per-PR graph is exactly what the taxonomy requires.
name: nightly-fetchers
env:
  CI_CLASS: heavy
on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC
  workflow_dispatch: {}

jobs:
  live-fetchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install deps
        working-directory: backend
        run: bun install
      - name: Live fetcher drift test (real keyless endpoints)
        working-directory: backend
        run: bun test tests/fetchers-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
        timeout-minutes: 15
      - name: Live projects provider drift test (CoinGecko + DexScreener, issue #87)
        working-directory: backend
        run: bun test tests/projects-fetchers-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
        timeout-minutes: 10
      - name: Live Base RPC smoke test (real vault contract)
        working-directory: backend
        run: bun test tests/vault-rpc-live.test.ts
        env:
          RUN_LIVE_FETCHERS: "1"
        timeout-minutes: 5
