# Frontend tier: standalone, decoupled Playwright specs that don't need a live
# backend or the full demo boot.
#
# Issue #275 addendum, critical-bug fix: ci-gate.ts's neededDomains() has
# always required a `"frontend"`-named workflow run whenever `frontend/**`
# changed, but no such workflow existed anywhere in this repo pre-addendum —
# `ci-gate` was permanently unsatisfiable for any frontend-only PR. This
# workflow is that genuine, dedicated `frontend` domain backing (`name:
# frontend` below is what `gh run list` / ci-gate.ts's outcomesFromGitHub()
# match on). It is not a substitute for the full LIVE-backed Playwright
# coverage the `e2e` workflow's "Full-stack demo" step already runs
# (`test:browser` there still runs the ENTIRE frontend/test/browser/ suite,
# unchanged) — this workflow is strictly additive: a fast, cheap signal for
# frontend-touching PRs that doesn't wait for the ~40+ minute LIVE demo boot.
#
# Coordinator direction (mid-review, 2026-07-30): rather than special-casing
# "HTML/CSS-only" as its own path category, this workflow runs whenever
# ANY frontend-touching path changes, and each spec here determines for itself
# whether it can run without live-backend fixtures. Today that is exactly one
# spec: frontend/test/browser/preview-smoke.spec.ts, which spawns its OWN
# scripts/preview-server.ts (a static file server; no BACKEND_URL, no Docker,
# no live backend) and asserts the SPA renders inside the preview wrapper with
# zero console/page errors, using the same failOnBrowserErrors/
# expectNoBrowserErrors pattern spa.spec.ts established. Every other spec in
# that directory documents that it needs the real backend server up (even when
# its own API calls are mocked, the SPA shell + static assets are served by the
# live backend at baseURL) and stays exclusively in the `e2e` workflow's
# `test:browser` step. A future markup/style-only spec written in the
# deterministic archive-fallback style (the pattern PR #327's
# committee-subject.spec.ts introduced: force `/api/**` to fail and assert the
# static-archive render path) is a natural fit to add here later.
#
# CI taxonomy class: feature-correctness. No Docker, no live backend, no
# network beyond localhost — cheap enough to run on every PR, draft included,
# same profile as contract.yml/unit.yml/repo-guards.yml.
#
# Path-gated (issue #275 addendum): a `pull_request` run whose changed files
# don't match `frontend/**`/`playwright.config.ts` skips the job body — a REAL
# dorny/paths-filter skip, not a synthetic outcome. `push` to `main` is never
# path-filtered (see the job `if:` below), so a merge to main always runs this
# in full.
name: frontend
env:
  CI_CLASS: feature-correctness
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ── change detection ───────────────────────────────────────────────────────
  changes:
    # Plumbing, not an assurance job itself (same reasoning as ci-gate.yml's
    # own `changes` job) — overriding the workflow-level CI_CLASS keeps the
    # taxonomy scanner from grading this filter step as if it were a test.
    env:
      CI_CLASS: ignore
    runs-on: [self-hosted, robotmoney-self-hosted]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'playwright.config.ts'

  frontend:
    needs: [changes]
    # Path-gated ONLY on pull_request: a push to main always runs regardless.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    runs-on: [self-hosted, robotmoney-self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # Playwright's CLI/transform runs on Node.js; `bunx playwright test`
      # shells out to it. `setup-bun` does NOT provide node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Standalone Playwright specs (no live backend required)
        run: bunx playwright test frontend/test/browser/preview-smoke.spec.ts
