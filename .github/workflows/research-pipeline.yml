# Research-pipeline tier (issue #275 addendum): the GeckoTerminal/analytics-fetch
# surface, split out of the coarse `backend` category. Confirmed via grep that
# this surface lives entirely under backend/src/analytics/** and
# backend/src/chain/** (extract/geckoterminal.ts, extract/sources.ts,
# analyze/indicators.ts, chain/token-prices.ts, chain/token-metrics.ts,
# chain/wallet-valuation.ts, chain/wallet-balances.ts, chain/buyback-logs.ts).
#
# This workflow owns exactly two tests that are cleanly, exclusively about that
# surface (no broader API-route/dashboard-handler responsibility that would
# regress if narrowed to this path filter alone):
#   - backend/tests/geckoterminal-resilience.test.ts — the new_pools sweep's
#     429/throttle/retry-budget resilience coverage (mocked HTTP).
#   - backend/tests/token-prices-resilience.test.ts — chain/token-prices.ts's
#     batched-fetch resilience coverage (mocked HTTP).
# backend.yml's own `bun test` invocation excludes these two files
# (--path-ignore-patterns) so they are never run twice. Every OTHER backend
# test that happens to touch analytics/chain code (e.g.
# backend/tests/api/wallet-balances.test.ts, backend/tests/api/dashboards-live.test.ts)
# stays in the general backend suite, because those also cover API-route
# behavior outside backend/src/analytics|chain/** and would regress coverage if
# gated behind this narrower filter.
#
# Same Docker/Postgres harness as backend.yml (backend/bunfig.toml's preload:
# an ephemeral Postgres via Docker, migrated, then torn down — no CI-specific
# behavior). A missing Docker/Postgres fails loudly, never a silent skip.
#
# CI taxonomy class: system-correctness. Per the taxonomy gating matrix this is
# DEFERRED until a PR is ready for review: it must SKIP on draft PRs and RUN
# once the PR is marked ready-for-review, plus on push to the default branch.
#
# Path-gated (issue #275 addendum): a `pull_request` run whose changed files
# don't match backend/src/analytics/**  or backend/src/chain/** skips the job
# body — a REAL dorny/paths-filter skip, not a synthetic outcome. Because it's
# a job-level `if:` skip (never workflow-level `on.paths`), it reports a real
# `skipped` conclusion to the Checks API, so requiring this workflow directly
# in branch protection (issue #275 addendum 2 — see this repo's ci-gate.yml
# removal history and issue #348) carries no deadlock risk. `push` to `main`
# is never path-filtered (see the job `if:` below), so a merge to main always
# runs this in full.
name: research-pipeline
env:
  CI_CLASS: system-correctness
on:
  push:
    branches: [main]
  # NIGHTLY MIRROR of the merge-to-main set (issue #373): every workflow that
  # runs on `push: branches: [main]` also runs on a nightly schedule, and
  # nothing else does — so a red nightly means exactly what a red merge would
  # have meant, with no required reading. Cron minutes are staggered across the
  # ten mirrors. The invariant is enforced mechanically by
  # scripts/tests/unit/nightly-mirrors-merge-set.test.ts, not by convention.
  schedule:
    - cron: "45 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ── change detection ───────────────────────────────────────────────────────
  changes:
    # Plumbing, not an assurance job itself — it must run in EVERY context,
    # including pr_draft, so the main job below has a filter output to gate
    # on. Overriding the workflow-level CI_CLASS here keeps the taxonomy
    # scanner from flagging this job as a system-correctness job that
    # wrongly runs on drafts.
    env:
      CI_CLASS: ignore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      research_pipeline: ${{ steps.filter.outputs.research_pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            research_pipeline:
              - 'backend/src/analytics/**'
              - 'backend/src/chain/**'

  research-pipeline:
    needs: [changes]
    # Deferred until ready-for-review: run on push (non-PR) and on non-draft PRs;
    # skip while the PR is still a draft. Path-gated ONLY on pull_request: a
    # push to main always runs regardless of needs.changes' output.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.research_pipeline == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Install deps
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: GeckoTerminal / chain price resilience suite (ephemeral Postgres via Docker)
        working-directory: backend
        run: bun test tests/geckoterminal-resilience.test.ts tests/token-prices-resilience.test.ts
