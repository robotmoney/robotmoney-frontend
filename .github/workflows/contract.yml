# Contract tier: verifies the vendored contract copy matches the source and runs
# the contract's offline tests (`bun run test` — contract/tests/unit, one
# directory, no network).
#
# THERE IS NO LIVE SELECTOR IN THIS JOB, AND THAT IS THE POINT. This workflow
# used to run `bun run test:live` (contract/tests/live/) on every trigger it has
# — every PR touching `contract/**`, every push to `main`, and the nightly
# mirror. That job made a real HTTPS request to `SWARM_ONBOARDING_SKILL_URL`
# (robotmoney.network) and asserted reachability and procedure over the served
# document. It has been DELETED, along with the `test:live` script and the
# `tests/live/` directory itself; every assertion it held is now a row in the
# schedule-only auditor (.github/workflows/production-drift-audit.yml, checks B,
# C and D).
#
# WHY IT LEFT THE MERGE GATE. Whether robotmoney.network answers is not a
# property of the commit under review: it depends on deploys, DNS, TLS, CDN
# state, and renames and releases in robotmoney-core, none of which any diff in
# this repository can change. It was measured, not argued — the `contract` job
# was RED on an open pull request with `Received: 502`, caused by nobody in that
# pull request. A required job that reaches the public internet on every PR hands
# any contributor with a flaky connection, and any upstream hiccup, an
# unmergeable PR for a reason the diff cannot fix, and that is required reading
# whose resolution is outside the repository. The endpoint is still watched: the
# auditor asks the same questions once a night, in a report, and always exits 0.
# The 404 that issue #484 was filed about is now found by that audit rather than
# by the pull request that caused it — a slower, deliberate trade.
#
# WHAT IS STILL MERGE-GATED ABOUT THE SKILL URL. Exactly one hermetic assertion:
# that the constant names a skill directory above `SKILL.md`, so a slug derived
# from it is really a slug
# (contract/tests/unit/swarm-onboarding-skill-url.test.ts, run by the "Contract
# tests (unit)" step below). A URL that stops naming a skill is a fact about this
# repository. Whether that URL is REACHABLE is not, and is not claimed here.
#
# WHAT THE `tests/live/` DIRECTORY'S ABSENCE BUYS, AND WHY IT IS NOT LEFT EMPTY.
# `bun test <dir>` exits 1 against an empty or a missing directory on bun 1.3.x
# (verified, not assumed), so an emptied `tests/live/` would be a permanently red
# step, and a kept-but-unrun `test:live` script would be a guard no workflow
# invokes — the exact false green #484 documented, when `test:live` was declared
# here and invoked by zero of eleven workflows for the entire life of the guard it
# named. Deleted beats both.
#
# NOTHING IN CI VERIFIES THE SKILL ENDPOINT ON A MERGE TRIGGER, and the
# consequence is stated rather than left to be discovered: an unmergeable PR is
# no longer the price of finding out, and no red build is the price of a broken
# URL either. Read the auditor's report for the endpoint.
#
# CI taxonomy class: feature-correctness. Runs on every PR (draft AND ready) —
# cheap, no Docker, and — this is what the class finally matches — no network:
# every step below is hermetic or filesystem-local. This workflow replaces the
# contract-specific
# steps that previously lived in integration.yml (issue #275). It is directly
# required in branch protection (issue #275 addendum: the ci-gate.yml/
# ci-gate.ts fan-in mechanism this workflow used to feed was removed after a
# production incident on PR #316; a structurally sounder fan-in replacement is
# tracked in issue #348).
#
# Path-gated (issue #275 addendum): a `pull_request` run whose changed files
# don't match `contract/**` skips the job body — a REAL dorny/paths-filter skip,
# not a synthetic outcome. Because it's a job-level `if:` skip (never
# workflow-level `on.paths`), it reports a real `skipped` conclusion to the
# Checks API, so requiring this workflow directly carries no deadlock risk.
# `push` to `main` is never path-filtered (see the job `if:` below), so a
# merge to main always runs this in full.
#
# PACKAGING (issue #884). D43 designs the eventual frontend/backend split
# around `contract/` published as a versioned package (D10); this job packages
# `contract/` (`bun pm pack`) on every run, so "a CI job packages contract/ and
# this succeeds without any monorepo-relative path error" is verified on every
# PR touching contract/, not only at publish time.
# contract/tests/unit/contract-package.test.ts (run by the "Contract tests
# (unit)" step below) is what actually asserts the resulting tarball is valid
# and, installed outside the monorepo, resolves its documented main export.
# The actual publish-on-tag step lives in the separate
# .github/workflows/contract-publish.yml — ci-workflows-structure.test.ts
# requires this (PATH_GATED_WORKFLOWS) workflow to declare exactly one
# non-"changes" job, so a tag-triggered publish job cannot live here too.
name: contract
env:
  CI_CLASS: feature-correctness
on:
  push:
    branches: [main, "releases-*", "fusion/**"]
  # NIGHTLY MIRROR of the merge-to-main set (issue #373): every workflow that
  # runs on `push: branches: [main]` also runs on a nightly schedule, and
  # nothing else does — so a red nightly means exactly what a red merge would
  # have meant, with no required reading. Cron minutes are staggered across the
  # eleven mirrors. The invariant is enforced mechanically by
  # scripts/tests/unit/nightly-mirrors-merge-set.test.ts, not by convention.
  schedule:
    - cron: "21 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ── change detection ───────────────────────────────────────────────────────
  changes:
    # Plumbing, not an assurance job itself — overriding the workflow-level
    # CI_CLASS keeps the taxonomy scanner from grading this filter step as
    # if it were a test.
    env:
      CI_CLASS: ignore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            contract:
              - 'contract/**'

  contract:
    needs: [changes]
    # Path-gated ONLY on pull_request: a push to main always runs regardless.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Full history: the version-bump step below diffs against the merge base
      # (a pull_request) or the push event's `before` commit, neither of which
      # a depth-1 checkout carries.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Verify vendored contract
        run: bun run check-contract
      # D54: the API version IS this package's version (GET /api/version
      # reports it, and a separately deployed website accepts or refuses an API
      # by it), so a change to contract/src/routes.js must bump it against the
      # merge base. Exits 1 naming both versions; 2 if the base is unreachable.
      - name: Route change bumps the contract version
        run: bun scripts/check-contract-version-bump.ts
      - name: Contract tests (unit)
        working-directory: contract
        run: bun run test
      # The skill URL's reachability and procedure assertions used to be a step
      # here (`bun run test:live`). They are NOT, deliberately — see the header:
      # whether robotmoney.network answers is not a property of the commit under
      # review, and a required check that depends on it makes a pull request
      # unmergeable for a reason no diff here can fix. The assertions are
      # nightly, non-gating rows in .github/workflows/production-drift-audit.yml
      # instead. Do not re-add a network step to this job: it would be a gate
      # whose resolution is outside the repository, and
      # scripts/tests/unit/ci-workflows-structure.test.ts goes red on it.
      # Packaging (issue #884 AC2/scope): the literal in-scope "CI step that
      # packages contract/" deliverable, run on every trigger this job has, not
      # only a release tag. contract-package.test.ts above already exercises
      # `bun pm pack` and asserts a valid tarball; this step is the same
      # command run for real, outside a test process. dist/ is repo-gitignored.
      - name: Package contract
        working-directory: contract
        run: bun pm pack --destination dist
