# Contract tier: verifies the vendored contract copy matches the source and runs
# the contract's tests — both the offline `test` selector (contract/tests/unit)
# and the `test:live` selector (contract/tests/live).
#
# WHY THE LIVE SELECTOR RUNS HERE (issue #484). contract/tests/live/ holds one
# test, and its whole job is to fail red when SWARM_ONBOARDING_SKILL_URL stops
# returning 200 — the single discovery link in the D21 onboarding flow, whose
# 404 raises no error anywhere in this repo and just silently kills onboarding.
# It used to document itself as running in a `contract-live-urls` job of
# `nightly-fetchers.yml`; that workflow never existed, `grep -rn 'test:live'
# .github/workflows/` returned nothing, and the guard had therefore never
# executed in CI once. It would have caught #407's rename on its first run.
# Rather than give it another schedule-only home, it runs in this already-
# required job on every trigger the job has (pull_request, push to main, and
# the nightly mirror): a red then lands on the PR that caused it, before the
# break ships. Cost is one HTTPS GET, already gated behind this workflow's
# `contract/**` paths-filter. No `continue-on-error`, no env gate, no skip —
# unreachable network is a RED, per the loud-skip-never invariant.
#
# CI taxonomy class: feature-correctness. Runs on every PR (draft AND ready) —
# cheap, no Docker, no network. This workflow replaces the contract-specific
# steps that previously lived in integration.yml (issue #275). It is directly
# required in branch protection (issue #275 addendum: the ci-gate.yml/
# ci-gate.ts fan-in mechanism this workflow used to feed was removed after a
# production incident on PR #316; a structurally sounder fan-in replacement is
# tracked in issue #348).
#
# Path-gated (issue #275 addendum): a `pull_request` run whose changed files
# don't match `contract/**` skips the job body — a REAL dorny/paths-filter skip,
# not a synthetic outcome. Because it's a job-level `if:` skip (never
# workflow-level `on.paths`), it reports a real `skipped` conclusion to the
# Checks API, so requiring this workflow directly carries no deadlock risk.
# `push` to `main` is never path-filtered (see the job `if:` below), so a
# merge to main always runs this in full.
name: contract
env:
  CI_CLASS: feature-correctness
on:
  push:
    branches: [main]
  # NIGHTLY MIRROR of the merge-to-main set (issue #373): every workflow that
  # runs on `push: branches: [main]` also runs on a nightly schedule, and
  # nothing else does — so a red nightly means exactly what a red merge would
  # have meant, with no required reading. Cron minutes are staggered across the
  # ten mirrors. The invariant is enforced mechanically by
  # scripts/tests/unit/nightly-mirrors-merge-set.test.ts, not by convention.
  schedule:
    - cron: "21 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ── change detection ───────────────────────────────────────────────────────
  changes:
    # Plumbing, not an assurance job itself — overriding the workflow-level
    # CI_CLASS keeps the taxonomy scanner from grading this filter step as
    # if it were a test.
    env:
      CI_CLASS: ignore
    runs-on: blacksmith-4vcpu-ubuntu-2204
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            contract:
              - 'contract/**'

  contract:
    needs: [changes]
    # Path-gated ONLY on pull_request: a push to main always runs regardless.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.contract == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root tooling
        run: bun install --frozen-lockfile
      - name: Verify vendored contract
        run: bun run check-contract
      - name: Contract tests (unit)
        working-directory: contract
        run: bun run test
      # Live URL reachability (issue #484). Deliberately NOT continue-on-error
      # and NOT conditioned on any event or secret: the whole point is that a
      # 404 or an unreachable network fails this required job loudly.
      - name: Contract tests (live URLs)
        working-directory: contract
        run: bun run test:live
