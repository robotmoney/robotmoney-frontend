# Nightly LIVE-path demo smoke gate (issue #128; closed the original #101 CI
# blind spot; issue #147 later made the LIVE boot the ONLY demo path — see
# below for why this nightly still earns its keep alongside the now-live
# required `e2e` gate).
#
# WHY THIS SUITE EXISTS
# Originally: the required per-PR `e2e` gate booted the demo ONLY under
# DEMO_HERMETIC=1 (stubbed Base RPC + offline seeded analytics), so the LIVE
# `bun run demo` data path was otherwise absent from CI. Issue #147 removed
# DEMO_HERMETIC entirely (decision: issue #163) — `.github/workflows/e2e.yml`
# now boots this SAME LIVE stack and runs these SAME assertions on every PR.
# This nightly is kept as an independent, PR-cadence-agnostic signal: a dead
# external feed (e.g. #127's MVRV 404) or worker-lane starvation (#101) that
# appears on a quiet day with no open PRs would otherwise go unnoticed until
# the next PR happens to open. It boots the identical demo stack against real
# live upstreams (Base mainnet RPC, FRED/Coin Metrics/GeckoTerminal/Yahoo/
# EDGAR) and asserts the LIVE steady state:
#   - >=2 committee sessions publish through the REAL worker job queue within
#     their per-state deadlines (the #101 starvation guard, now across the #107
#     worker lanes — the fast demo schedules are seeded so LIVE analytics and
#     research fire in their own lanes concurrently with the committee work);
#   - the frontend check asserts LIVE wallet provenance as part of the boot,
#     and scripts/demo-live-smoke.ts then asserts the regime snapshot is FRESH
#     (staleness.stale=false), wallet + vault-economics provenance is 'live'
#     (only the documented #120 ZYFAI/GIZA degrades are tolerated, loud-logged),
#     and both research signals landed;
#   - any failure names the leg/feed that failed.
#
# WHY THIS DOES NOT DUPLICATE e2e.yml's LOGIC
# Both workflows drive the exact same `scripts/demo.ts` → `scripts/lib/demo-main.ts`
# boot and the exact same `scripts/demo-live-smoke.ts` assertion script — no
# assertion logic is re-authored here. This workflow only supplies an
# independent SCHEDULE (not tied to PR activity) around that shared code.
#
# NEVER SKIPS
# There is no .skip/self-skip anywhere in this path.
# scripts/demo-live-smoke.ts exits non-zero on starvation, a stale snapshot, a
# NEW silently-stale leg, or a missing signal — an unavailable LIVE leg turns
# this job RED, never green-via-skip. The loud-failure paths of the smoke
# script are themselves proven by scripts/tests/integration/demo-live-smoke.test.ts in the
# required integration root job.
#
# NO SECRET
# Every live upstream here is keyless (public Base RPC + keyless analytics
# fetchers). Committee takes use the deterministic template path — real model
# inference stays in committee-opencode-nightly.yml.
#
# CI taxonomy class: heavy (scheduled, full docker-compose stack + real live
# external endpoints). Heavy suites are sweep-only: NO `pull_request` trigger —
# schedule + on-demand only. (The required per-PR signal for this same LIVE
# behavior now lives in the `e2e` job, not here.)
name: demo-live-smoke-nightly
env:
  CI_CLASS: heavy
on:
  schedule:
    - cron: "41 6 * * *" # nightly 06:41 UTC (offset from the other nightlies)
  workflow_dispatch: {}

jobs:
  demo-live-smoke:
    runs-on: [self-hosted, robotmoney-self-hosted]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install root browser tooling
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Reuses the EXACT demo stack boot (scripts/demo.ts → scripts/lib/demo-main.ts):
      # postgres + api + worker lanes via docker compose, migrations (fast
      # demo schedules seeded so LIVE analytics/research fire during the run), the
      # committee driver (publishes 2 sessions through the real worker queue), the
      # frontend + browser checks, and scripts/demo-live-smoke.ts's LIVE
      # steady-state assertions before teardown — every one of these now runs
      # unconditionally in CI (issue #147 removed DEMO_HERMETIC and the hermetic
      # opt-in it used to gate against), the exact same boot `.github/workflows/e2e.yml`
      # runs on every PR. This job's only distinguishing input is the schedule below.
      - name: Boot LIVE demo stack + LIVE smoke assertions
        run: bun run scripts/demo.ts
        env:
          CI: "true"
        timeout-minutes: 40
