# scripts/release/runbooks/releases/v0.11.0.yaml — the v0.11.0 release runbook
# (D70; tracking issue 1754, owner 2026-11-25: "a release runbook (kitchen sink) for the next platform 0.x.0 release").
# A full copy of the kitchen-sink template's steps: Q for stage, P and C for production, each
# production step with a stage twin. A release only ADDS: every template step stays, unchanged and in
# order, and each step this release adds carries `added: v0.11.0` (scripts/release/runbook.ts checks it).
# Added (added: v0.11.0): the csvb install on the control machine (Q16a-csvb-install, C03a-csvb-install), and the version
# checks Q38 to Q41 with their production twins C26 to C29 (scripts/release/version-checks/v0.11.0/). Every added step after
# READY declares `after` (issue 1684). The policy is docs/technical/release-runbooks.md.
release: v0.11.0
notes: |
  Identity. From v0.10.0 (tag v0.10.0 at 7a4086cd, running on production) to v0.11.0 at the commit the rc tag names, in a
  new checkout (/root/rm-0110). The target files' `release` reads v0.11.0 and prod's `checkout` names the new folder.
  Tracking issue 1754 (label release:v0.11.0).

  Template: kitchen-sink. This release changes the api (contract 0.5.12), the database (three additive migrations), the
  analytics engine (regime fixes 1744 to 1747, methodology v5 beside the main line) and the site, so it is a full-stack
  release.

  Scope. releases-0.11.x and qa/0.11.x-2026-11-25 were cut from main at 9ad55825 (PR 1759, the v0.10.x release work
  reaching main), never from releases-0.10.x. The SDK version bump PR 1760 (packages/analyst-sdk only) was still open
  at the cut and is not in this release. The range v0.10.0..QA commit carries the main commits of 23 PRs.

  Migrations: 0134_read_path_indexes.sql, 0135_drop_vintage_members_vintage_idx.sql and
  0136_regime_beside_snapshots.sql, each compat: additive. No `breaking:` list; the rolling upgrade applies.
  Q39-migrations reads all three.

  Rolling window (issue 1753, 1754). The old (v0.10.0) image knows no `regime_beside_snapshots` kind: it would store a
  v5-era run as a main-line `regime_snapshots` artifact. No v5 run may start before the new image boots. The old image
  cannot start one (v5 does not exist in it), and the new analytics-producer starts its first v5 run only on its own
  regime tick after C10-rolling-boot replaces it. Nothing in this runbook starts an analytics run by hand, and no step
  may be added that does so between C05-migrate and C11-ready.

  Methodology. CURRENT_REGIME_VERSION stays v4. D95 (SDK options, 1751) and D96 (methodology beside the main line, 1753)
  are proposed, pending owner acceptance; the five new D56 tolerance rows apply only once D96 is accepted.
  Q40-regime-methodology proves v5 runs beside the line; Q41-regime-main-line proves the line itself is unchanged.

  Post-seal SDK replay (QA fix, v0.11.0). postSealCheck in scripts/release/sdk-lib.ts replayed the newest published
  report with no methodology filter; that is now usually a v5 run whose regime_snapshots artifact is []. It now replays
  the newest main-line run (mainLineRuns: a run whose methodology label is a REGIME_LINE "beside" version is skipped).
  The post-seal replay is a report, not a step.

  Compose and env: no change, no new key.

  Owner decision (as v0.10.0): the agent runs QA, stage and the production preflight, then stops. The cutover waits for
  the owner's go file. QA fixes reach main only after the cutover, by a separate PR.

  Exceptions: Q40-regime-methodology polls for the first scheduled v5 run (stage hourly, production every three hours)
  and so runs up to 230 minutes. No check is stageOnly.
recovery: |
  Before C05-migrate, stop and correct the failing step: nothing has changed and v0.10.0 keeps serving.
  A failed C05-migrate resumes at C05-migrate. Migrations 0134, 0135 and 0136 are additive: 0134 adds indexes, 0135
  drops a redundant index, and 0136 widens a CHECK and replaces a function with one that returns the same keys for every
  old kind. An older image never writes or reads the new kind, so rolling the application back to the v0.10.0 images
  needs no schema change (v5 rows stay where no v0.10.0 reader looks). After C05-migrate, fix forward on the next patch
  version (v0.11.1), or restore the C01-backup dump with the write loss it implies. The version tag stays either way.
  The site follows web-serving-architecture.md section 4: a failed post-switch check reverts the swap, and
  after one that passed, restore the previous site image with
    bun smoke:web --host rm-frontend-prod-1 --instance rm_prod --rollback --origin https://robotmoney.network
  Inspect the receipt and verify both site and API. Do not assume a deployment tool rolls back by itself.
scope:
  - {pr: 1722, what: "Backport of web-v0.3.0 to main: frontend/package.json version", check: "Q24-site"}
  - {pr: 1723, what: "Every swarm member works from the same brief, with the regime readings and task our own agents get", none: "swarm session inputs: the soak defers sessions on stage, and no read-only check can observe a session without starting one; the PR carries its own tests"}
  - {pr: 1724, what: "The probe grade tells slow answers from downtime and reports latency on its own", check: "Q25-probe-grade"}
  - {pr: 1725, what: "The Ask Mr. Roboto page and its tests are removed", check: "Q24-site"}
  - {pr: 1726, what: "The site footer shows the web tag, platform version, web commit and commit time", check: "Q24-site"}
  - {pr: 1727, what: "P09-coingecko-credit accepts an authorized CoinGecko overage", check: "P09-coingecko-credit"}
  - {pr: 1728, what: "Batch-gate db_saturated 503 on /api/pipeline/read/gaps.reports fixed (v0.10.0 soak)", check: "Q34a-analytics-load"}
  - {pr: 1729, what: "The site says the composite averages all three panels", check: "Q24-site"}
  - {pr: 1732, what: "The nightly onboarding eval sweep passes the registry selector", none: "nightly CI only; no deployed code changes"}
  - {pr: 1735, what: "A stage resume in place at a new QA commit moves the target checkout", none: "release tooling that the run itself exercises (Q06-checkout on a resume); it ships no product behaviour"}
  - {pr: 1736, what: "Covering indexes and bounded query shapes for the archive day step, vintages freeze, admin overview and leaderboard: migration 0134_read_path_indexes", check: "Q39-migrations"}
  - {pr: 1737, what: "C25a-db-stats excludes the managed provider's hidden pg_stat_activity sessions", check: "Q37a-db-stats"}
  - {pr: 1740, what: "Drop the redundant analytics_vintage_members_vintage_idx: migration 0135_drop_vintage_members_vintage_idx", check: "Q39-migrations"}
  - {pr: 1743, what: "Code review of look-ahead, windowing and skew in the regime pipeline", none: "docs only"}
  - {pr: 1744, what: "Panel weights refit on a fixed 21-day calendar, not on the last day of a run", check: "Q37-sdk-tests"}
  - {pr: 1745, what: "Forward-statistic guards: correlations report an effective sample size; a committee session before the model cutoff is refused", check: "Q37-sdk-tests"}
  - {pr: 1746, what: "Source-data look-ahead: each value is dated by when it was published", check: "Q37-sdk-tests"}
  - {pr: 1747, what: "Observation-day windows: each real observation counted once, a missing panel leaves the day without a composite", check: "Q41-regime-main-line"}
  - {pr: 1748, what: "Backtest look-ahead and reporting bias fixed", check: "Q37-sdk-tests"}
  - {pr: 1750, what: "analyst-sdk bumped to 0.8.0", check: "Q37-sdk-tests"}
  - {pr: 1752, what: "Analyst SDK options and exports a downstream regime model needs (D95 proposed)", check: "Q37-sdk-tests"}
  - {pr: 1755, what: "Regime methodology v5 computed beside the served line (D96 proposed): migration 0136_regime_beside_snapshots, contract 0.5.11 to 0.5.12, ?methodology= on regime-snapshots, producer-only kept-regime-days route", check: "Q40-regime-methodology"}
  - {pr: 1759, what: "The v0.10.x release work reaches main: v0.10.0's runbook and version checks, the Q14 hard-link step, the dormant flow feature", none: "production already runs these at tag v0.10.0; release tooling the run exercises (Q14-backup, the step-list hash) and no product change against production"}
template: kitchen-sink
steps:
  # ── QA: stage only, as often as needed. Every step here runs on the stage target and
  # on no other: stage's preparation (Q01 to Q05), then the whole upgrade (checkout, install,
  # baseline, backup and restore proof, migrate, rolling boot, site), then the soak, then the
  # release's version checks. A stage run that passes is the rehearsal production runs after.
  - id: "Q01-lockfile"
    standing: ["SP.9"]
    host: "control"
    phase: "qa"
    description: "Fresh lockfile: every committed bun.lock equals a fresh resolve at the QA commit, so the rc carries one (owner, 2026-10-14); hosts then install it frozen"
    cmds:
      - ["bun", "scripts/release/lockfile.ts", "check", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q02-dump"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage's starting dump: the newest production dump on the capture host that is at most 24 hours old, else a new capture from production's read replica (never a stale dump, never the production database)"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "dump"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q03-stage-up"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage target: replace it with a production-shaped copy restored from that dump, running the version production runs (the running tag, its ledger, its grants); the release checkout is made by Q06-checkout"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "up", "--dump", "newest", "--replace"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 60
  - id: "Q04-role-passwords"
    standing: ["SR.1"]
    host: "control"
    phase: "qa"
    description: "Stage's role passwords: the stage database sets its own doadmin password and role-passwords writes the roles' passwords to the stage host's ~/.env, so the rest of the list reads stage exactly as it reads production (doadmin stays in no file)"
    cmds:
      - ["bash", "-c", "set -o pipefail && bun scripts/release/stage-target.ts doadmin | bun run role-passwords --target {target} --doadmin-stdin"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q05-scope"
    standing: ["SR.2"]
    host: "control"
    phase: "qa"
    description: "Scope: every PR between the version the target runs (on stage, production's tag, which Q03-stage-up booted) and the QA commit is in the release runbook's scope, each with the step that checks it or a reason none does; and nothing the scope lists is missing from the range"
    cmds:
      - ["bun", "scripts/release/scope.ts", "--release", "{release}", "--commit", "{commit}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q06-checkout"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q07-host-identity"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its identity is absent or matches RM_ENV, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no production step reads doadmin. The ledger reconciliation is Q12-state-baseline's"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q08-install"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target install: bun install --frozen-lockfile, root and backend (an install never rewrites the tree Q07-host-identity proved clean)"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q09-capture-checkout"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture checkout (runner-owned, never a release checkout): clone it when missing, fetch the tags, then detach at the go's ref"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q10-capture-identity"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture identity: HEAD is the commit and the tree is clean"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q11-capture-install"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture install: bun install --frozen-lockfile, root and backend"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q12-state-baseline"
    standing: ["SP.3", "SP.6"]
    host: "target"
    phase: "qa"
    description: "Baseline through rm_readonly: ledger, identity, roles, migration 0101's would-clear list, the ledger reconciliation (the pending set, every applied file's bytes against the version the running stack reports), R2.4 counts and size"
    cmds:
      - ["bun", "scripts/release/baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "baseline*", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q13-log-baseline"
    standing: ["SP.5"]
    host: "target"
    phase: "qa"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    triage: true
  - id: "Q14-backup"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Backup for the restore proof, with no second capture: hard-link the dump Q02-dump used (the newest production capture on the capture host, at most 24 hours old) into a new dated directory, manifest, globals and passphrase included (owner, 2026-11-20); the linked manifest is touched, because a hard link keeps the capture's older mtime and the receipt must be newer than the step. Production's C01-backup still captures fresh"
    cmds:
      - ["sh", "-c", "src=$(ls -1d {captureHome}/rm-backup-prod-2* | sort | tail -n 1) && test -f \"$src/manifest.json\" && cp -al -- \"$src\" {captureHome}/rm-backup-{target}-{runTs} && touch {captureHome}/rm-backup-{target}-{runTs}/manifest.json && echo \"[Q14-backup] linked $src\""]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "manifest.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 5
    changedSince: "v0.10.0"
    before:
      description: "Fresh capture from production's read replica into a new dated directory (never a reused dump)"
      cmds:
        - ["bun", "run", "smoke:capture", "--out", "{captureHome}/rm-backup-{target}-{runTs}"]
      maxMinutes: 30
  - id: "Q15-backup-sums"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Record the sha256 of the encrypted dump files beside the manifest"
    cmds:
      - ["sh", "-c", "cd {captureHome}/rm-backup-{target}-{runTs} && sha256sum -- *.gpg > SHA256SUMS"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "SHA256SUMS", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q16-restore-proof"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Restore proof: restore the Q14-backup dump into a throwaway local Postgres container, record the restore time, drop the container"
    cmds:
      - ["bun", "scripts/release/restore-proof.ts", "--dump", "{captureHome}/rm-backup-{target}-{runTs}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "restore-proof.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 20
  - id: "Q16a-csvb-install"
    standing: ["SV.8"]
    host: "control"
    phase: "qa"
    added: "v0.11.0"
    description: "Install packages/csvb's dependencies in this control checkout, frozen against its bun.lock: scripts/release/sdk-lib.ts runs csvb from this checkout's packages/csvb for the SDK quickstart's fill (Q36/C24), and the sparse clone holds no csvb (as v0.10.0 added it; the template has no such step). Local to the control checkout; nothing on the target changes"
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "packages/csvb"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q17-probe-start"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Start the website probe on the control machine: the public origin's / and /version.json every 2 s, from before the first irreversible step until Q25-probe-grade grades it"
    cmds:
      - ["bun", "scripts/release/probe.ts", "start", "--origin", "{publicOrigin}", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18-migrate"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Migrate every pending file while the previous release serves (Q12-state-baseline refused any pending file that is not compat: additive). The cutover's first irreversible step"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
    onlyFor: "stage"
  - id: "Q18a-maintenance-on"
    standing: ["SC.4", "SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover (spec 8.5, issue 1484): the maintenance page on (maintenance.json, state active, in the instance's web directory). The declared window the probe grade allows opens at the start of this step. Runs only for a release that declares breaking:"
    cmds:
      - ["bun", "scripts/release/maintenance.ts", "on", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18b-smoke-down"
    standing: ["SC.4", "SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover: bun smoke:down --keep-web stops every service of the instance except website-server, so no previous-release service runs against the breaking state while the site keeps answering and nginx serves maintenance.json (issue 1501; the data volume is kept). Runs only for a release that declares breaking:"
    cmds:
      - ["bun", "run", "smoke:down", "--keep-web", "--instance", "{instance}"]
    changedSince: "v0.7.5"
    before:
      description: "Breaking cutover: bun smoke:down stops the whole stack, so no previous-release service runs against the breaking state (the data volume is kept). Runs only for a release that declares breaking:"
      cmds:
        - ["bun", "run", "smoke:down", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q18c-migrate-breaking"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover: migrate every pending file, the breaking ones included, against the stopped stack. The upgrade's first irreversible step for a release that declares breaking: (the rolling migrate does not run); rollback is closed after it (spec 8.4)"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
    onlyFor: "stage"
  - id: "Q19-env-rewrite"
    standing: ["SV.6"]
    host: "target"
    phase: "qa"
    description: "Rewrite ~/.env to the D61 allowlist (rm_owner, never doadmin); every other key, a stray doadmin line included, moves to ~/.env.retired-<ts> (mode 0600); refuses without rm_owner or RM_CREDENTIALS; key names only"
    cmds:
      - ["bun", "scripts/release/env-rewrite.ts", "--run", "{runTs}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "env-rewrite.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q20-set-identity"
    standing: []
    host: "target"
    phase: "qa"
    description: "Report the deployment identity the migrate wrote (prod-init set-identity)"
    cmds:
      - ["bun", "scripts/prod-init.ts", "set-identity", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "set-identity-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q21-tokens"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Service tokens (prod-init provision-tokens): keep every holder whose file still holds its current token, provision only a missing or stale one, so the running holders keep authenticating"
    cmds:
      - ["bun", "scripts/prod-init.ts", "provision-tokens", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "provision-tokens-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q22-rolling-boot"
    standing: ["SP.4", "SC.5"]
    host: "target"
    phase: "qa"
    description: "The rolling boot: bun smoke --static-port replaces api, worker-analytics, system-scheduler and analytics-producer one at a time, each healthy before the next; website-server is never recreated (the boot refuses if it would be)"
    cmds:
      - ["bun", "run", "smoke", "--static-port", "--instance", "{instance}"]
    env: {"PROJECTS_SOURCE": "live"}
    bootEnv: true
