# scripts/release/runbooks/releases/v0.6.2.yaml — the v0.6.2 release runbook
# (D70). A full copy of the kitchen-sink template's steps. A release only ADDS:
# every template step stays, unchanged and in order, and each step this
# release adds carries `added: v0.6.2` (scripts/release/runbook.ts checks it).
# The release's identity, migrations and owner decisions are in
# docs/runbooks/v0-6-2-rollout.md until they move here.
release: v0.6.2
template: kitchen-sink
steps:
  # ── R1 release identity, on both hosts ────────────────────────────────────
  - id: "R1.1"
    standing: ["SP.1"]
    host: "target"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "R1.2"
    standing: ["SP.1"]
    host: "target"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its ledger reconciles with backend/migrations and the bytes at the version the running stack reports (no recorded name the repository lacks, no applied file whose bytes differ from the tag's; never a count or a number order), its identity is absent or matches RM_ENV; before R6.1, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no release step reads doadmin"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--origin", "{publicOrigin}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
  - id: "R1.3"
    standing: ["SP.1"]
    host: "target"
    description: "Target install: bun install --force, root and backend"
    cmds:
      - ["bun", "install", "--force"]
      - ["bun", "install", "--force", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "R1.4"
    standing: ["SP.1"]
    host: "capture"
    description: "Capture checkout (runner-owned, never a release checkout): clone it when missing, fetch the tags, then detach at the go's ref"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "R1.5"
    standing: ["SP.1"]
    host: "capture"
    description: "Capture identity: HEAD is the commit and the tree is clean"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
  - id: "R1.6"
    standing: ["SP.1"]
    host: "capture"
    description: "Capture install: bun install --force, root and backend"
    cmds:
      - ["bun", "install", "--force"]
      - ["bun", "install", "--force", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false


  # ── R2 baseline and backup ────────────────────────────────────────────────
  - id: "R2.1"
    standing: ["SR.0", "SP.2"]
    host: "capture"
    description: "Fresh capture from production's read replica into a new dated directory (never a reused dump)"
    cmds:
      - ["bun", "run", "smoke:capture", "--out", "{captureHome}/rm-backup-{target}-{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "manifest.json", "required": true}
    irreversible: false
    maxMinutes: 30
  - id: "R2.2"
    standing: ["SP.2"]
    host: "capture"
    description: "Record the sha256 of the encrypted dump files beside the manifest"
    cmds:
      - ["sh", "-c", "cd {captureHome}/rm-backup-{target}-{runTs} && sha256sum -- *.gpg > SHA256SUMS"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "SHA256SUMS", "required": true}
    irreversible: false
  - id: "R2.4r"
    standing: ["SP.2"]
    host: "capture"
    description: "Restore proof: restore the R2.1 dump into a throwaway local Postgres container, record the restore time, drop the container"
    cmds:
      - ["bun", "scripts/release/restore-proof.ts", "--dump", "{captureHome}/rm-backup-{target}-{runTs}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "restore-proof.json", "required": true}
    irreversible: false
    maxMinutes: 20
  - id: "R2.3"
    standing: ["SP.3", "SP.6"]
    host: "target"
    description: "Baseline through rm_readonly: ledger, identity, roles, migration 0101's would-clear list, the ledger reconciliation (the pending set, every applied file's bytes against the version the running stack reports), R2.4 counts and size"
    cmds:
      - ["bun", "scripts/release/baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "baseline*", "required": true}
    irreversible: false
  - id: "R2.5"
    standing: ["SP.5"]
    host: "target"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    triage: true


  # ── R6 cutover ────────────────────────────────────────────────────────────
  - id: "R6.1"
    standing: ["SC.2"]
    host: "target"
    description: "Stop the running stack: the one the instance's smoke state names, with bun run smoke:down --instance {instance} (never -v); refuses when the state names no stack; proves no container of its project remains"
    cmds:
      - ["bun", "scripts/release/stop-legacy.ts", "stop", "--instance", "{instance}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "stop-legacy.json", "required": true}
    irreversible: true
  - id: "R6.2"
    standing: ["SV.6"]
    host: "target"
    description: "Rewrite ~/.env to the D61 allowlist (rm_owner, never doadmin); every other key, a stray doadmin line included, moves to ~/.env.retired-<ts> (mode 0600); refuses without rm_owner or RM_CREDENTIALS; key names only"
    cmds:
      - ["bun", "scripts/release/env-rewrite.ts", "--run", "{runTs}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "env-rewrite.json", "required": true}
    irreversible: false
  - id: "R6.3"
    standing: ["SC.2"]
    host: "target"
    description: "The first migrate: 0081 first with the identity RM_ENV implies, then every pending file"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
  - id: "R6.4"
    standing: []
    host: "target"
    description: "Report the deployment identity the migrate wrote (prod-init set-identity)"
    cmds:
      - ["bun", "scripts/prod-init.ts", "set-identity", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "set-identity-*.json", "required": true}
    irreversible: false
  - id: "R6.5"
    standing: []
    host: "target"
    description: "Mint the three service tokens (prod-init provision-tokens)"
    cmds:
      - ["bun", "scripts/prod-init.ts", "provision-tokens", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "provision-tokens-*.json", "required": true}
    irreversible: false
  - id: "R6.7a"
    standing: ["SP.4"]
    host: "target"
    description: "Boot 1: bun smoke --static-port (preflight, replace, readiness, exit)"
    cmds:
      - ["bun", "run", "smoke", "--static-port", "--instance", "{instance}"]
    env: {"PROJECTS_SOURCE": "live"}
    bootEnv: true
    expectExit: 0
    receipts: []
    irreversible: false
    maxMinutes: 15
  - id: "R6.7b"
    standing: ["SV.2"]
    host: "target"
    description: "Status after boot 1"
    cmds:
      - ["bun", "run", "smoke:status", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "R6.9"
    standing: ["SV.2"]
    host: "target"
    description: "Status after boot 2: the receipt as history, the daemon as now"
    cmds:
      - ["bun", "run", "smoke:status", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "R6.10"
    standing: []
    host: "target"
    description: "Site: bun smoke:web (refuses a site whose apiRange excludes the api)"
    cmds:
      - ["bun", "run", "smoke:web", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false


  # ── R7 postflight ─────────────────────────────────────────────────────────
  - id: "R7.1"
    standing: ["SV.1"]
    host: "target"
    description: "Identity: /api/version and /version.json carry the release commit, no +dirty or +unknown; when the go's ref is the rc tag, /api/version carries it as tag (RM_BUILD_TAG)"
    cmds:
      - ["bun", "scripts/release/identity-check.ts", "--origin", "{publicOrigin}", "--commit", "{commit}", "--ref", "{ref}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "identity-check.json", "required": true}
    irreversible: false
  - id: "R7.3"
    standing: ["SV.3"]
    host: "target"
    description: "Product verification, readonly tier"
    cmds:
      - ["bun", "run", "verify:live", "--instance", "{instance}", "--emit-receipt=R7.verify"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "R7.3a"
    standing: ["SV.4"]
    host: "target"
    description: "Log verdict after the release (sessions graded later: the first one publishes hours after the cutover)"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "post-release", "--defer-sessions", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-post-release.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-post-release.*", "required": true}
    irreversible: false
  - id: "R7.3b"
    standing: ["SW.2"]
    host: "target"
    description: "Standing soak checks: record the baseline at READY, then the full run"
    cmds:
      - ["bun", "run", "soak:checks", "--instance", "{instance}", "--record", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/soak-record.md"]
      - ["bun", "run", "soak:checks", "--instance", "{instance}", "--full", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/soak-full.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "soak-record.*", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "soak-full.*", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "soak-baseline.json", "required": false}
    irreversible: false
  - id: "R7.5"
    standing: ["SV.5"]
    host: "target"
    description: "Compare with the R2.3 baseline: row counts only grow, database size within the bound"
    cmds:
      - ["bun", "scripts/release/compare-baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--max-size-ratio", "1.5"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "compare-baseline.json", "required": true}
    irreversible: false
  - id: "R7.7"
    standing: ["SV.6"]
    host: "target"
    description: "Host guards: no container mounts docker.sock, ~/.env keys within the allowlist, token files 0600, no world-readable file under home holds a postgres URL with a password"
    cmds:
      - ["bun", "scripts/release/host-guards.ts", "--instance", "{instance}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-guards.json", "required": true}
    irreversible: false


  # ── W watch: every subject publishes once after READY ─────────────────────
  - id: "W1"
    standing: ["SW.1"]
    host: "target"
    description: "The watch since READY: prod:gate post-release with sessions as the target's watchSessions says (prod graded: every subject publishes a judged session, the judge never restarted; stage deferred)"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "post-release", "--instance", "{instance}", "--since", "{readyIso}", "--min-attendance", "{watchMinAttendance}", "--sessions", "{watchSessions}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-watch.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-watch.*", "required": true}
    irreversible: false
    notBefore: {"afterStep": "R6.9", "hours": "watchHours"}

  - id: "R7.4a"
    standing: ["SW.1"]
    host: "target"
    description: "Schedule parity: 24 h epochs, every session in flight at R2.3 published on its normal close (graded; deferred checks only that no close moved), the regime run at :30, the last parity sweep's duration"
    cmds:
      - ["bun", "scripts/release/schedule-parity.ts", "--instance", "{instance}", "--run", "{runTs}", "--sessions", "{watchSessions}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "schedule-parity.json", "required": true}
    irreversible: false
    notBefore: {"afterStep": "R6.9", "hours": "watchHours"}

  - id: "W3"
    standing: ["SW.3"]
    host: "control"
    description: "Tag the running commit with the release tag and push it (prod only)"
    cmds:
      - ["bun", "scripts/release/tag.ts", "final", "--release", "{release}", "--commit", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
