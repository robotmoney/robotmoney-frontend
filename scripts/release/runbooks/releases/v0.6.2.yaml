# scripts/release/runbooks/releases/v0.6.2.yaml — the v0.6.2 release runbook
# (D70, owner 2026-10-16). A full copy of the kitchen-sink template's steps: Q for stage, P and C
# for production, each production step with a stage twin. A release only ADDS:
# every template step stays, unchanged and in order, and each step this
# release adds carries `added: v0.6.2` (scripts/release/runbook.ts checks it).
# The policy is docs/technical/release-runbooks.md.
release: v0.6.2
template: kitchen-sink
notes: |
  Identity. From v0.6.1 (bca5186e, /root/rm-061, instance rm_prod, ledger through 0119;
  P07-state-baseline reads it from the database). To v0.6.2 at the commit the rc tag names, in a new
  checkout (/root/rm-062), the same instance. Tracking: release v0.6.2 (1305). Before the
  run, the target files' `release` reads v0.6.2 and prod's `checkout` names the new folder.

  Migrations (C05-migrate, under the running v0.6.1; all compat: additive, which P07-state-baseline checks):
  - 0120_maintenance_windows: the maintenance-window event log (issue 1220), insert-only
    for rm_app.
  - 0121_subject_closes_six_hours_apart: the four anchors' times of day become exactly
    21600 s apart on vault's grid; woon, allocation and treasury move 6, 8 and 12 minutes
    earlier. Epochs stay 24 h. C23-subject-spacing asserts the spacing. The one transition window per
    moved subject is 23 h 54 m (woon), 23 h 52 m (allocation), 23 h 48 m (treasury); the
    post-release session report confirms them.
  - 0122_swarm_dormancy_baseline: a singleton counted_from for consecutive missed-session
    counts (issue 1269); removes no seat.
  - 0123_analytics_parity_sweep_daily: the parity sweep runs once a day at 04:47 UTC
    (issue 1375). C23-subject-spacing asserts the schedule.
  - 0124_deactivate_bankr_token_vaults: deactivates the two Bankr lp-fees rows, which are
    tokens and not vaults (issue 1382, owner 2026-10-16); deletes nothing. C32-bankr-token-rows
    asserts none is active.
  - 0125_job_schedules_latest_only_catchup: the CHECK accepts 'latest-only' and the six heavy
    kinds move to it, so a start or a rolling boot enqueues one job per kind (issue 1378). An older
    image reads it as 'all', so it is additive. Q47-latest-only-catchup asserts the six rows.

  Website. website-server/nginx.conf changed since v0.6.1 (the maintenance fallback). Its
  compose configuration did not, so C10-rolling-boot ships it by graceful reload into the running
  container (SC.5); the site never goes down.

  QA session 2026-10-16 (branch qa/0.6.x-2026-10-16). Fixes made on the branch: nine PRs added to
  scope (the range v0.6.1..the QA commit carries 38), with C32-bankr-token-rows for 0124; and two
  external log classifications for a DexScreener HTTP 429 in projects.sync_revenue, which the
  P08-log-baseline gate read in production's v0.6.1 stack on stage and failed as unclassified.

  Member notice. The notice to woon, shodai, zyfai and dualmint about the new close times
  (vault 00:52, woon 06:52, allocation 12:52, treasury 18:52 UTC) waits on the owner's
  word. It is not a step.
recovery: |
  All six migrations (0120 to 0125) are compat: additive and take no grant from a runtime role.
  - Before C05-migrate (the preflight, or C01-backup to C04-probe-start): nothing has changed; fix on a new QA branch
    and cut v0.6.2-rc.(N+1).
  - A failed C05-migrate: resume at C05-migrate; v0.6.1 keeps serving, and the website stays up.
  - After C05-migrate: fix forward on v0.6.3, or restore the C01-backup dump with the write loss it
    implies. v0.6.2 is tagged at C06-version-tag either way (D70).
scope:
  # Every PR v0.6.2 ships (v0.6.1..the QA commit), each with its check or why none
  # (Q05-scope proves the list complete). General checks are the soak's (Q26 to Q34 on stage, C14 to C22 on production).
  - {pr: 1277, what: "release tooling starts from production's v0.6.0 baseline", none: "release tooling: the run itself exercises it"}
  - {pr: 1281, what: "docs: a release that reached production gets its version tag", none: "docs only"}
  - {pr: 1285, what: "docs: production runs only by the rc tag", none: "docs only"}
  - {pr: 1292, what: "docs: the v0.6.0 post-mortem", none: "docs only"}
  - {pr: 1293, what: "rollouts keep the website up: maintenance mode and an off-host fallback page", check: "Q36-maintenance-fallback"}
  - {pr: 1294, what: "the gate describes a container's last stop", none: "gate tooling: P08-log-baseline and C20-soak-gate run it"}
  - {pr: 1296, what: "CI: the member-agent Docker build", none: "CI only"}
  - {pr: 1297, what: "the fixture dataset never reaches a deployed database", check: "Q44-fixture-guard"}
  - {pr: 1300, what: "delete four unreferenced one-shot scripts", none: "repository housekeeping; nothing runs them"}
  - {pr: 1306, what: "the release checkout is cloned when missing", none: "release tooling: P01-checkout exercises it"}
  - {pr: 1307, what: "prod:gate fails a release on a boot-time connect retry", none: "gate rule: C16-log-verdict and C20-soak-gate apply it"}
  - {pr: 1308, what: "subject windows close exactly 6 h apart (migration 0121)", check: "Q35-subject-spacing"}
  - {pr: 1309, what: "a failed post-release gate blocks the soak", none: "release tooling: the run itself exercises it"}
  - {pr: 1313, what: "the production go names the rc tag", none: "release tooling: the go is checked by the runner"}
  - {pr: 1314, what: "the runner holds no past-upgrade facts", none: "release tooling: the run itself exercises it"}
  - {pr: 1315, what: "the migration ledger reconciles with the files", none: "release tooling: P07-state-baseline runs it"}
  - {pr: 1316, what: "prod:gate classifies scanner probes and judge reconnects", none: "gate rule: P08-log-baseline and C20-soak-gate apply it"}
  - {pr: 1324, what: "docs: release runbooks use v0.6.0 as the baseline", none: "docs only"}
  - {pr: 1325, what: "retire RM_ENV and RM_ALLOW_INSECURE from runtime", check: "Q43-rm-env-retired"}
  - {pr: 1329, what: "docs: scheduling columns change by migration", none: "docs only"}
  - {pr: 1330, what: "schedule parity checks the 6 h spacing", check: "Q35-subject-spacing"}
  - {pr: 1334, what: "the starter agent files to every collecting session", check: "Q39-starter-takes"}
  - {pr: 1338, what: "a take naming a closed session is refused", check: "Q38-closed-session-take"}
  - {pr: 1340, what: "the swarm skill and docs carry every take refusal rule", check: "Q45-take-rules"}
  - {pr: 1341, what: "a member can dry-run a take", check: "Q40-dry-run-take"}
  - {pr: 1342, what: "retire RM_ENV from the compose environment", check: "Q43-rm-env-retired"}
  - {pr: 1343, what: "count a seat's consecutive missed sessions (migration 0122)", check: "Q37-missed-sessions"}
  - {pr: 1344, what: "Animoca's and DualMint's brand marks", check: "Q41-brand-marks"}
  - {pr: 1349, what: "the HTTP fetch cache evicts", check: "Q42-fetch-cache"}
  - {pr: 1351, what: "consent-gated GA4 through Cloudflare Zaraz", none: "site change: the consent flow is held by its browser spec (zaraz-consent.spec.ts) in CI, and C12-site ships the files"}
  - {pr: 1355, what: "the release runbook overhaul: five phases, scope, rolling upgrade, short soak", none: "release tooling: the run itself exercises it"}
  - {pr: 1357, what: "admin approval chooses member or judge and records the operator", none: "admin screen: held by its browser spec (admin-view.spec.ts) in CI; no production write belongs in a check"}
  - {pr: 1368, what: "the skill names where an agent reads the takes it has filed", none: "skill wording: C31-take-rules fetches the same served SKILL.md, but no step asserts this line"}
  - {pr: 1376, what: "refresh_wallets skips wallets it cannot read live", none: "log rule: the unclassified error it removed fails C16-log-verdict and C20-soak-gate if it returns"}
  - {pr: 1377, what: "the parity sweep compares in Postgres, once a day (migration 0123)", check: "Q35-subject-spacing"}
  - {pr: 1379, what: "refresh_wallets reads every Base wallet in a few Multicall3 calls", none: "worker behavior: a failed read logs an error that C16-log-verdict and C20-soak-gate fail on"}
  - {pr: 1380, what: "fetch_vaults isolates each vault", none: "worker behavior: an aborted run logs an error that C16-log-verdict and C20-soak-gate fail on"}
  - {pr: 1383, what: "the two Bankr lp-fees token rows are deactivated (migration 0124)", check: "Q46-bankr-token-rows"}
  - {pr: 1381, what: "a start or a rolling boot releases no job burst and orphans no job (migration 0125)", check: "Q47-latest-only-catchup"}
steps:
  # ── QA: stage only, as often as needed. Every step here runs on the stage target and
  # on no other: stage's preparation (Q01 to Q05), then the whole upgrade (checkout, install,
  # baseline, backup and restore proof, migrate, rolling boot, site), then the soak, then the
  # release's version checks. A stage run that passes is the rehearsal production runs after.
  - id: "Q01-lockfile"
    standing: ["SP.9"]
    host: "control"
    phase: "qa"
    description: "Fresh lockfile: every committed bun.lock equals a fresh resolve at the QA commit, so the rc carries one (owner, 2026-10-14); hosts then install it frozen"
    cmds:
      - ["bun", "scripts/release/lockfile.ts", "check", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q02-dump"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage's starting dump: the newest production dump on the capture host that is at most 24 hours old, else a new capture from production's read replica (never a stale dump, never the production database)"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "dump"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q03-stage-up"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage target: replace it with a production-shaped copy restored from that dump, running the version production runs (the running tag, its ledger, its grants); the release checkout is made by Q06-checkout"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "up", "--dump", "newest", "--replace"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 60
  - id: "Q04-role-passwords"
    standing: ["SR.1"]
    host: "control"
    phase: "qa"
    description: "Stage's role passwords: the stage database sets its own doadmin password and role-passwords writes the roles' passwords to the stage host's ~/.env, so the rest of the list reads stage exactly as it reads production (doadmin stays in no file)"
    cmds:
      - ["bash", "-c", "set -o pipefail && bun scripts/release/stage-target.ts doadmin | bun run role-passwords --target {target} --doadmin-stdin"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q05-scope"
    standing: ["SR.2"]
    host: "control"
    phase: "qa"
    description: "Scope: every PR between the version the target runs (on stage, production's tag, which Q03-stage-up booted) and the QA commit is in the release runbook's scope, each with the step that checks it or a reason none does; and nothing the scope lists is missing from the range"
    cmds:
      - ["bun", "scripts/release/scope.ts", "--release", "{release}", "--commit", "{commit}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q06-checkout"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q07-host-identity"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its identity is absent or matches RM_ENV, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no production step reads doadmin. The ledger reconciliation is Q12-state-baseline's"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q08-install"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target install: bun install --frozen-lockfile, root and backend (an install never rewrites the tree Q07-host-identity proved clean)"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q09-capture-checkout"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture checkout (runner-owned, never a release checkout): clone it when missing, fetch the tags, then detach at the go's ref"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q10-capture-identity"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture identity: HEAD is the commit and the tree is clean"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q11-capture-install"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture install: bun install --frozen-lockfile, root and backend"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q12-state-baseline"
    standing: ["SP.3", "SP.6"]
    host: "target"
    phase: "qa"
    description: "Baseline through rm_readonly: ledger, identity, roles, migration 0101's would-clear list, the ledger reconciliation (the pending set, every applied file's bytes against the version the running stack reports), R2.4 counts and size"
    cmds:
      - ["bun", "scripts/release/baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "baseline*", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q13-log-baseline"
    standing: ["SP.5"]
    host: "target"
    phase: "qa"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    triage: true
  - id: "Q14-backup"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Fresh capture from production's read replica into a new dated directory (never a reused dump)"
    cmds:
      - ["bun", "run", "smoke:capture", "--out", "{captureHome}/rm-backup-{target}-{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "manifest.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q15-backup-sums"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Record the sha256 of the encrypted dump files beside the manifest"
    cmds:
      - ["sh", "-c", "cd {captureHome}/rm-backup-{target}-{runTs} && sha256sum -- *.gpg > SHA256SUMS"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "SHA256SUMS", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q16-restore-proof"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Restore proof: restore the Q14-backup dump into a throwaway local Postgres container, record the restore time, drop the container"
    cmds:
      - ["bun", "scripts/release/restore-proof.ts", "--dump", "{captureHome}/rm-backup-{target}-{runTs}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "restore-proof.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 20
  - id: "Q17-probe-start"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Start the website probe on the control machine: the public origin's / and /version.json every 2 s, from before the first irreversible step until Q25-probe-grade grades it"
    cmds:
      - ["bun", "scripts/release/probe.ts", "start", "--origin", "{publicOrigin}", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18-migrate"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Migrate every pending file while the previous release serves (Q12-state-baseline refused any pending file that is not compat: additive). The cutover's first irreversible step"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
    onlyFor: "stage"
  - id: "Q19-env-rewrite"
    standing: ["SV.6"]
    host: "target"
    phase: "qa"
    description: "Rewrite ~/.env to the D61 allowlist (rm_owner, never doadmin); every other key, a stray doadmin line included, moves to ~/.env.retired-<ts> (mode 0600); refuses without rm_owner or RM_CREDENTIALS; key names only"
    cmds:
      - ["bun", "scripts/release/env-rewrite.ts", "--run", "{runTs}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "env-rewrite.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q20-set-identity"
    standing: []
    host: "target"
    phase: "qa"
    description: "Report the deployment identity the migrate wrote (prod-init set-identity)"
    cmds:
      - ["bun", "scripts/prod-init.ts", "set-identity", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "set-identity-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q21-tokens"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Service tokens (prod-init provision-tokens): keep every holder whose file still holds its current token, provision only a missing or stale one, so the running holders keep authenticating"
    cmds:
      - ["bun", "scripts/prod-init.ts", "provision-tokens", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "provision-tokens-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q22-rolling-boot"
    standing: ["SP.4", "SC.5"]
    host: "target"
    phase: "qa"
    description: "The rolling boot: bun smoke --static-port replaces api, worker-analytics, system-scheduler and analytics-producer one at a time, each healthy before the next; website-server is never recreated (the boot refuses if it would be)"
    cmds:
      - ["bun", "run", "smoke", "--static-port", "--instance", "{instance}"]
    env: {"PROJECTS_SOURCE": "live"}
    bootEnv: true
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q23-ready"
    standing: ["SV.2"]
    host: "target"
    phase: "qa"
    description: "Status after the rolling boot: preflight and readiness green. Its end is READY, the soak's start"
    cmds:
      - ["bun", "run", "smoke:status", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q24-site"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Site: bun smoke:web switches web/current atomically and reloads nginx gracefully (refuses a site whose apiRange excludes the api)"
    cmds:
      - ["bun", "run", "smoke:web", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q25-probe-grade"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Stop and grade the website probe: every answer 200 and no gap over the interval from Q17-probe-start to now, or the release fails"
    cmds:
      - ["bun", "scripts/release/probe.ts", "grade", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q26-verify-version"
    standing: ["SV.1"]
    host: "target"
    phase: "qa"
    description: "Identity: /api/version and /version.json carry the release commit, no +dirty or +unknown; when the go's ref is the rc tag, /api/version carries it as tag (RM_BUILD_TAG)"
    cmds:
      - ["bun", "scripts/release/identity-check.ts", "--origin", "{publicOrigin}", "--commit", "{commit}", "--ref", "{ref}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "identity-check.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q27-verify-product"
    standing: ["SV.3"]
    host: "target"
    phase: "qa"
    description: "Product verification, readonly tier"
    cmds:
      - ["bun", "run", "verify:live", "--instance", "{instance}", "--emit-receipt=R7.verify"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q28-log-verdict"
    standing: ["SV.4"]
    host: "target"
    phase: "qa"
    description: "Log verdict after the release (sessions graded later: the first one publishes hours after the cutover)"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "post-release", "--defer-sessions", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-post-release.md"]
    expectExit: 0
    receipts:
