# scripts/release/runbooks/releases/v0.6.3.yaml — the v0.6.3 release runbook
# (D70, owner 2026-10-16). A full copy of the kitchen-sink template's steps: Q for stage, P and C
# for production, each production step with a stage twin. A release only ADDS:
# every template step stays, unchanged and in order, and each step this
# release adds carries `added: v0.6.3` (scripts/release/runbook.ts checks it).
# The policy is docs/technical/release-runbooks.md.
release: v0.6.3
template: kitchen-sink
notes: |
  Identity. From v0.6.2 (1acd5cb7, /root/rm-062, instance rm_prod, ledger through 0125;
  P07-state-baseline reads it from the database). To v0.6.3 at the commit the rc tag names, in a new
  checkout (/root/rm-063), the same instance. Before the run, the target files' `release` reads
  v0.6.3 and prod's `checkout` names the new folder.

  Scope. Six PRs merged into main after v0.6.2 (route (a), merges 2026-10-20 and 2026-10-21).
  Three change the product: the admin avatar upload (1393) and the Monument home page (1388), which
  are site files only, and the judge draw (1406, D71), which is backend code with no migration. The
  other three are docs, two of them pages the site serves.

  Judge draw (1406). The rolling boot replaces the api before system-scheduler; both version mixes
  finalize at the judging deadline (release-runbooks.md §4.7). Answers an old api files during the swap are
  tagged not_judge_of_record, so one session in judging may publish no_consensus. Start the upgrade with
  no session in judging where possible; the soak's session report grades it.

  Migrations. None. C05-migrate applies nothing; P07-state-baseline still proves the ledger
  reconciles and that nothing is pending.

  QA session 2026-10-20 (branches qa/0.6.x-2026-10-20, then qa/0.6.x-2026-10-20-2 after main moved).
  Fixes made on the branch: a classification for worker-analytics waiting for the api at boot (it logs
  the wait and goes on, 1378), and R8.q no longer grades third_party_enabled, which production runs on
  (owner, 2026-10-21). The home view resolves avatars through memberAvatarSrc (1393 meets 1388).

  Website. website-server/ is unchanged since v0.6.2. C12-site ships the new site files by atomic
  switch and graceful reload; the site never goes down. The backend images rebuild with the judge
  draw (1406), and C10-rolling-boot replaces each service one at a time.
recovery: |
  v0.6.3 carries no migration. Its one backend change is the judge draw (1406).
  - Before C05-migrate (the preflight, or C01-backup to C04-probe-start): nothing has changed; fix on a new QA branch
    and cut v0.6.3-rc.(N+1).
  - A failed C05-migrate: resume at C05-migrate; v0.6.2 keeps serving, and the website stays up.
  - After C05-migrate: fix forward on v0.6.4. With no migration, restoring the C01-backup dump buys
    nothing and loses writes; serve the v0.6.2 site from /root/rm-062 with `bun smoke:web` instead.
    v0.6.3 is tagged at C06-version-tag either way (D70).
scope:
  # Every PR v0.6.3 ships (v0.6.2..the QA commit), each with its check or why none
  # (Q05-scope proves the list complete). General checks are the soak's (Q26 to Q34 on stage, C14 to C22 on production).
  - {pr: 1390, what: "docs: referral consent, attribution and reporting spec", none: "docs only"}
  - {pr: 1388, what: "the Monument home page", check: "Q37-home-monument"}
  - {pr: 1393, what: "an admin uploads a swarm member's avatar from the member page", check: "Q35-member-avatar"}
  - {pr: 1394, what: "docs: the judge seat guide (the feed, the answer, the digest, the signature)", none: "site docs and skill wording: C12-site ships the files; no product behavior changes"}
  - {pr: 1395, what: "docs: date the changelog entries for v0.6.0 to v0.6.2", none: "site page: held by its browser spec (changelog.spec.ts) in CI, and C12-site ships the files"}
  - {pr: 1406, what: "every judge judges; the winner is drawn after the judging deadline (D71)", check: "Q36-judge-draw"}
steps:
# every template step stays, unchanged and in order (scripts/release/runbook.ts
# refuses a deletion, an edit or a reorder).
#
# Fields are scripts/release/steps.ts StepTemplate's. Commands are argv
# templates; the target file fills {instance}, {confirmTarget}, ... . The
# step-list hash SP.8 compares is taken over the resolved list.
#
# Three phases (owner, 2026-10-16), each step on one target, its id's letter naming the phase:
#   Q  QA, stage only: preparation (Q01 to Q05), then the upgrade as production will run it, then
#      the soak. A release's version checks follow.
#   P  preflight, production only: read-only gates that assume the QA passed.
#   C  cutover, production only: the release as it happens, then the soak, then the version checks.
# Every P and C step has a Q twin of the same name and commands (runbook.ts twinProblems), so
# production runs only what stage ran. The version tag (C06) has none: stage tags nothing.
# `standing` names the standing runbook rows each step satisfies
# (docs/technical/release-runbooks.md §9).
template: kitchen-sink
steps:
  # ── QA: stage only, as often as needed. Every step here runs on the stage target and
  # on no other: stage's preparation (Q01 to Q05), then the whole upgrade (checkout, install,
  # baseline, backup and restore proof, migrate, rolling boot, site), then the soak, then the
  # release's version checks. A stage run that passes is the rehearsal production runs after.
  - id: "Q01-lockfile"
    standing: ["SP.9"]
    host: "control"
    phase: "qa"
    description: "Fresh lockfile: every committed bun.lock equals a fresh resolve at the QA commit, so the rc carries one (owner, 2026-10-14); hosts then install it frozen"
    cmds:
      - ["bun", "scripts/release/lockfile.ts", "check", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q02-dump"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage's starting dump: the newest production dump on the capture host that is at most 24 hours old, else a new capture from production's read replica (never a stale dump, never the production database)"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "dump"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q03-stage-up"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage target: replace it with a production-shaped copy restored from that dump, running the version production runs (the running tag, its ledger, its grants); the release checkout is made by Q06-checkout"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "up", "--dump", "newest", "--replace"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 60
  - id: "Q04-role-passwords"
    standing: ["SR.1"]
    host: "control"
    phase: "qa"
    description: "Stage's role passwords: the stage database sets its own doadmin password and role-passwords writes the roles' passwords to the stage host's ~/.env, so the rest of the list reads stage exactly as it reads production (doadmin stays in no file)"
    cmds:
      - ["bash", "-c", "set -o pipefail && bun scripts/release/stage-target.ts doadmin | bun run role-passwords --target {target} --doadmin-stdin"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q05-scope"
    standing: ["SR.2"]
    host: "control"
    phase: "qa"
    description: "Scope: every PR between the version the target runs (on stage, production's tag, which Q03-stage-up booted) and the QA commit is in the release runbook's scope, each with the step that checks it or a reason none does; and nothing the scope lists is missing from the range"
    cmds:
      - ["bun", "scripts/release/scope.ts", "--release", "{release}", "--commit", "{commit}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q06-checkout"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q07-host-identity"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its identity is absent or matches RM_ENV, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no production step reads doadmin. The ledger reconciliation is Q12-state-baseline's"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q08-install"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target install: bun install --frozen-lockfile, root and backend (an install never rewrites the tree Q07-host-identity proved clean)"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q09-capture-checkout"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture checkout (runner-owned, never a release checkout): clone it when missing, fetch the tags, then detach at the go's ref"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q10-capture-identity"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture identity: HEAD is the commit and the tree is clean"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q11-capture-install"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture install: bun install --frozen-lockfile, root and backend"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q12-state-baseline"
    standing: ["SP.3", "SP.6"]
    host: "target"
    phase: "qa"
    description: "Baseline through rm_readonly: ledger, identity, roles, migration 0101's would-clear list, the ledger reconciliation (the pending set, every applied file's bytes against the version the running stack reports), R2.4 counts and size"
    cmds:
      - ["bun", "scripts/release/baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "baseline*", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q13-log-baseline"
    standing: ["SP.5"]
    host: "target"
    phase: "qa"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    triage: true
  - id: "Q14-backup"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Fresh capture from production's read replica into a new dated directory (never a reused dump)"
    cmds:
      - ["bun", "run", "smoke:capture", "--out", "{captureHome}/rm-backup-{target}-{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "manifest.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q15-backup-sums"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Record the sha256 of the encrypted dump files beside the manifest"
    cmds:
      - ["sh", "-c", "cd {captureHome}/rm-backup-{target}-{runTs} && sha256sum -- *.gpg > SHA256SUMS"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "SHA256SUMS", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q16-restore-proof"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Restore proof: restore the Q14-backup dump into a throwaway local Postgres container, record the restore time, drop the container"
    cmds:
      - ["bun", "scripts/release/restore-proof.ts", "--dump", "{captureHome}/rm-backup-{target}-{runTs}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "restore-proof.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 20
  - id: "Q17-probe-start"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Start the website probe on the control machine: the public origin's / and /version.json every 2 s, from before the first irreversible step until Q25-probe-grade grades it"
    cmds:
      - ["bun", "scripts/release/probe.ts", "start", "--origin", "{publicOrigin}", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18-migrate"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Migrate every pending file while the previous release serves (Q12-state-baseline refused any pending file that is not compat: additive). The cutover's first irreversible step"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
    onlyFor: "stage"
  - id: "Q19-env-rewrite"
    standing: ["SV.6"]
    host: "target"
    phase: "qa"
    description: "Rewrite ~/.env to the D61 allowlist (rm_owner, never doadmin); every other key, a stray doadmin line included, moves to ~/.env.retired-<ts> (mode 0600); refuses without rm_owner or RM_CREDENTIALS; key names only"
    cmds:
      - ["bun", "scripts/release/env-rewrite.ts", "--run", "{runTs}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "env-rewrite.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q20-set-identity"
    standing: []
    host: "target"
    phase: "qa"
    description: "Report the deployment identity the migrate wrote (prod-init set-identity)"
    cmds:
      - ["bun", "scripts/prod-init.ts", "set-identity", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "set-identity-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q21-tokens"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Service tokens (prod-init provision-tokens): keep every holder whose file still holds its current token, provision only a missing or stale one, so the running holders keep authenticating"
    cmds:
      - ["bun", "scripts/prod-init.ts", "provision-tokens", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "provision-tokens-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q22-rolling-boot"
    standing: ["SP.4", "SC.5"]
    host: "target"
    phase: "qa"
    description: "The rolling boot: bun smoke --static-port replaces api, worker-analytics, system-scheduler and analytics-producer one at a time, each healthy before the next; website-server is never recreated (the boot refuses if it would be)"
    cmds:
      - ["bun", "run", "smoke", "--static-port", "--instance", "{instance}"]
    env: {"PROJECTS_SOURCE": "live"}
    bootEnv: true
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q23-ready"
    standing: ["SV.2"]
    host: "target"
    phase: "qa"
    description: "Status after the rolling boot: preflight and readiness green. Its end is READY, the soak's start"
    cmds:
      - ["bun", "run", "smoke:status", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q24-site"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Site: bun smoke:web switches web/current atomically and reloads nginx gracefully (refuses a site whose apiRange excludes the api)"
    cmds:
      - ["bun", "run", "smoke:web", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q25-probe-grade"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Stop and grade the website probe: every answer 200 and no gap over the interval from Q17-probe-start to now, or the release fails"
    cmds:
      - ["bun", "scripts/release/probe.ts", "grade", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q26-verify-version"
    standing: ["SV.1"]
    host: "target"
    phase: "qa"
    description: "Identity: /api/version and /version.json carry the release commit, no +dirty or +unknown; when the go's ref is the rc tag, /api/version carries it as tag (RM_BUILD_TAG)"
    cmds:
      - ["bun", "scripts/release/identity-check.ts", "--origin", "{publicOrigin}", "--commit", "{commit}", "--ref", "{ref}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "identity-check.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q27-verify-product"
    standing: ["SV.3"]
    host: "target"
    phase: "qa"
    description: "Product verification, readonly tier"
    cmds:
      - ["bun", "run", "verify:live", "--instance", "{instance}", "--emit-receipt=R7.verify"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q28-log-verdict"
    standing: ["SV.4"]
    host: "target"
    phase: "qa"
    description: "Log verdict after the release (sessions graded later: the first one publishes hours after the cutover)"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "post-release", "--defer-sessions", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-post-release.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-post-release.*", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q29-soak-record"
    standing: ["SW.2"]
    host: "target"
    phase: "qa"
    description: "Standing soak checks at READY: record the baseline the soak's end (Q33-soak-checks) compares with"
    cmds:
      - ["bun", "run", "soak:checks", "--instance", "{instance}", "--record", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/soak-record.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "soak-record.*", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "soak-baseline.json", "required": false}
    irreversible: false
    onlyFor: "stage"
  - id: "Q30-compare-baseline"
    standing: ["SV.5"]
    host: "target"
    phase: "qa"
    description: "Compare with the Q12-state-baseline baseline: row counts only grow, database size within the bound"
    cmds:
      - ["bun", "scripts/release/compare-baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--max-size-ratio", "1.5"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "compare-baseline.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q31-host-guards"
    standing: ["SV.6"]
    host: "target"
    phase: "qa"
    description: "Host guards: no container mounts docker.sock, ~/.env keys within the allowlist, token files 0600, no world-readable file under home holds a postgres URL with a password"
    cmds:
      - ["bun", "scripts/release/host-guards.ts", "--instance", "{instance}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-guards.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q32-soak-gate"
    standing: ["SW.1"]
    host: "target"
    phase: "qa"
    description: "The soak since READY: prod:gate post-release, sessions as the target's watchSessions says (deferred by default: they are graded afterwards as a report)"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "post-release", "--instance", "{instance}", "--since", "{readyIso}", "--min-attendance", "{watchMinAttendance}", "--sessions", "{watchSessions}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-watch.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-watch.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    notBefore: {"afterStep": "Q23-ready", "hours": "watchHours"}
  - id: "Q33-soak-checks"
    standing: ["SW.2"]
    host: "target"
    phase: "qa"
    description: "Standing soak checks over the soak window, against the READY baseline Q29-soak-record recorded"
    cmds:
      - ["bun", "run", "soak:checks", "--instance", "{instance}", "--since", "{readyIso}", "--full", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/soak-full.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "soak-full.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    notBefore: {"afterStep": "Q23-ready", "hours": "watchHours"}
  - id: "Q34-collect-logs"
