# scripts/release/runbooks/releases/v0.8.0.yaml — the v0.8.0 release runbook
# (D70, owner 2026-11-12). A full copy of the kitchen-sink template's steps: Q for stage, P and C
# for production, each production step with a stage twin. A release only ADDS:
# every template step stays, unchanged and in order, and each step this
# release adds carries `added: v0.8.0` (scripts/release/runbook.ts checks it).
# Added (added: v0.8.0): Q39/C27-no-jit (PR 1595, carried from the v0.7.4 rc.0 attempt, never
# shipped) and v0.7.1's Q34b/C22a-archive-records carried again.
# The policy is docs/technical/release-runbooks.md.
release: v0.8.0
template: kitchen-sink
notes: |
  Identity. From v0.7.3 (tag v0.7.3 at fe89c5ac, running on production) to v0.8.0 at the commit the rc
  tag names, in a new checkout (/root/rm-080). The target files' `release` reads v0.8.0 and prod's
  `checkout` names the new folder. The platform release: the database work and the JIT fix the
  web-only v0.7.4 dropped. v0.7.4 shipped only the website (web template, 2026-11-12), so production's
  backend, schema and containers are still v0.7.3's. Template: kitchen-sink (owner).

  Scope. releases-0.8.x was cut from main at 2285064e and took main by route (a) before the QA branch
  qa/0.8.x-2026-11-12 was cut. The range v0.7.3..QA commit carries PRs 1582, 1586, 1588, 1589, 1590,
  1592, 1593, 1594, 1595, 1599, 1601, 1604, 1607, 1610, 1618 and 1621
  (1597's fix, PR 1621). 1588, 1589, 1590, 1592, 1593 and 1594 already reached production on 2026-11-12 through
  the web template; they are listed with that reason and need no check.

  Migrations: 0130_jobs_live_index_brief_allocation_stats.sql and 0131_swarm_briefs_allocation_backfill.sql,
  both `compat: additive`. No `breaking:` list; the rolling upgrade applies. 0130 adds three job_id
  indexes, jobs_live_kind_locked_idx (partial), statistics targets 1000 on jobs.status and jobs.kind,
  the nullable column swarm_briefs.allocation with its BEFORE INSERT OR UPDATE trigger (ENABLE ALWAYS),
  and pg_stat_statements only when the role may. 0131 fills allocation for existing briefs. Both set
  lock_timeout = 2s: a lock wait past it fails the file whole (55P03) and the migrate is run again.
  The jobs-table work (1582, 1586) is proven by Q37b-jobs-plans on stage (production's dump).

  JIT (PR 1595, issue 1579). Every app pool opens its sessions with jit=off. The log rule
  known-swarm-seat-silence-jit-statement-timeout carries fixedIn 0.8.0 (PR 1599): the baseline gates
  (Q13, P08) report its statement timeouts as a warning, and every gate after the release (Q28/C16 log
  verdict, Q32/C20 soak gate) FAILS on a recurrence. Q39/C27-no-jit read `SHOW jit` on the running
  api's pool (check carried from v0.7.4-rc.0, never shipped).

  Query statistics (owner decision, 2026-11-10). The admin's `bun run role-passwords --target prod
  --doadmin-stdin` creates pg_stat_statements and grants rm_readonly pg_read_all_stats LATER, not before
  this release. So on production 0130 only logs a NOTICE and C25a-db-stats is EXPECTED TO FAIL; the owner
  accepts it (--accept) and reruns it after role-passwords. On stage, Q04-role-passwords does it with
  stage's disposable doadmin, so Q37a-db-stats is expected to pass there.

  csvb-backup (PR 1610, D82). A new optional, non-gating container in docker-compose.yml. It is NOT in
  FULL_SERVICES or ROLLING_ORDER: no boot, readiness check or preflight waits on it, and `up` starts it
  best effort after the stack. It reads the read replica as rm_readonly through replica.env (needs
  `replica_host` in ~/.env, allowed by env-keys) and pushes with a GitHub deploy key (push-key), both in
  <instance state dir>/csvb-backup. Without those files it idles ("not provisioned"). Provisioning is
  the owner's and no step here proves it; the release does not depend on it.

  Carried check (owner, 2026-11-12). Q34b/C22a-archive-records are v0.7.1's archive check, added again
  (added: v0.8.0) as v0.7.2 to v0.7.4 did; it guards the archive 503 of issue 1508.

  Known run hazards. Q02-dump may hit a transient replica pg_dump conflict: retry. A stage resume at a
  new QA commit needs `--only Q06-checkout` first (issue 1585, open). Q34a-analytics-load hung on the
  v0.7.4 run (issue 1597); the fix (PR 1621) is in this tree.
recovery: |
  Migrations 0130 and 0131 are additive. v0.7.3 runs correctly on the new schema: every swarm_briefs
  INSERT in v0.7.3 names its columns (backend/src/swarm/domain.ts, epoch.ts) and never reads
  allocation; the trigger fills the column on v0.7.3's writes too; the new indexes, statistics targets
  and pg_stat_statements change no query result; no row is removed and no grant changes. v0.7.3's boot
  accepts ledger rows it does not ship when each carries compat additive
  (backend/src/db/schema-compat.ts) and reads the manifest the migrate publishes. The csvb-backup
  container is new compose only: rolling back to the v0.7.3 checkout (/root/rm-073) leaves it running
  or stops it with `docker compose stop csvb-backup`; it holds no state the rollback needs.
  - Before C05-migrate (preflight, or C01-backup to C04-probe-start): nothing has changed. Fix on a new
    QA branch and cut v0.8.0-rc.(N+1).
  - A failed C05-migrate: each file runs in one transaction, so a failed file rolls back whole. A
    lock_timeout (55P03) is a busy table: resume at C05-migrate. v0.7.3 keeps serving and the website
    stays up. Any other failure stops the cutover; v0.7.3 keeps serving on the schema it had plus any
    file that committed, which it runs correctly (above).
  - After C05-migrate: v0.7.3 runs correctly on this schema. A defect found after the cutover is an
    issue against v0.8.1 (policy §3 step 8). Rolling back to /root/rm-073 is a code-only rollback and
    is safe; the schema stays.
scope:
  - {pr: 1582, what: "perf(db): jobs-table scans, prune, brief allocation, query statistics (migration 0130)", check: "Q37b-jobs-plans"}
  - {pr: 1586, what: "fix(db): migration 0130 lock timeout, per-chunk prune commits, dangling job links", check: "Q37b-jobs-plans"}
  - {pr: 1588, what: "Launch polish: the launch date, the early access confirmation and the regime dial", none: "already in production: the web-only v0.7.4 shipped it on 2026-11-12"}
  - {pr: 1589, what: "docs(skill): keep a judge loop running without systemd", none: "already in production: the web-only v0.7.4 shipped it on 2026-11-12"}
  - {pr: 1590, what: "Show a silent seat as a callout on its member page", none: "already in production: the web-only v0.7.4 shipped it on 2026-11-12"}
  - {pr: 1592, what: "docs(audits): Alpine images vs. the OpenSSH musl password-bypass", none: "docs only; already in production via the web-only v0.7.4"}
  - {pr: 1593, what: "chore(release): backport the v0.7.3 release-line fixes to main", none: "backport of the v0.7.3 release-line fixes, shipped in v0.7.3; main's commit enters the range by route (a)"}
  - {pr: 1594, what: "feat(home): the market regime under the model portfolio", none: "already in production: the web-only v0.7.4 shipped it on 2026-11-12"}
  - {pr: 1595, what: "fix(api): jit=off on every app pool (issue 1579)", check: "Q39-no-jit"}
  - {pr: 1599, what: "fix(gate): the 1579 rule is fixed in 0.8.0, not 0.7.4", none: "log-gate rule fixedIn 0.8.0; the gates Q28/C16 and Q32/C20 exercise it"}
  - {pr: 1601, what: "chore(release): backport the v0.7.x release-line code to main", none: "backport of v0.7.1-v0.7.3 release-line code, shipped there; backend/src/analytics is byte-equal to v0.7.3's"}
  - {pr: 1604, what: "fix(release): the web content runner ships the web part of each main commit", none: "web-content runner tooling; not run by this release"}
  - {pr: 1607, what: "fix(release): the web content release runs stage QA first", none: "web-content runner tooling; not run by this release"}
  - {pr: 1610, what: "feat(csvb): a production container takes csvb backups on a schedule", none: "optional non-gating csvb-backup container, idle until provisioned (D82); no step proves it"}
  - {pr: 1618, what: "feat(release): backport the web runbook template, bound log verdicts to the run's window (1617)", none: "release tooling (web template, probe, verdict window); the run itself exercises it"}
  - {pr: 1621, what: "fix(release): analytics-load-check exits after writing its receipt (1597)", check: "Q34a-analytics-load"}

steps:
  # ── QA: stage only, as often as needed. Every step here runs on the stage target and
  # on no other: stage's preparation (Q01 to Q05), then the whole upgrade (checkout, install,
  # baseline, backup and restore proof, migrate, rolling boot, site), then the soak, then the
  # release's version checks. A stage run that passes is the rehearsal production runs after.
  - id: "Q01-lockfile"
    standing: ["SP.9"]
    host: "control"
    phase: "qa"
    description: "Fresh lockfile: every committed bun.lock equals a fresh resolve at the QA commit, so the rc carries one (owner, 2026-10-14); hosts then install it frozen"
    cmds:
      - ["bun", "scripts/release/lockfile.ts", "check", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q02-dump"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage's starting dump: the newest production dump on the capture host that is at most 24 hours old, else a new capture from production's read replica (never a stale dump, never the production database)"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "dump"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q03-stage-up"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage target: replace it with a production-shaped copy restored from that dump, running the version production runs (the running tag, its ledger, its grants); the release checkout is made by Q06-checkout"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "up", "--dump", "newest", "--replace"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 60
  - id: "Q04-role-passwords"
    standing: ["SR.1"]
    host: "control"
    phase: "qa"
    description: "Stage's role passwords: the stage database sets its own doadmin password and role-passwords writes the roles' passwords to the stage host's ~/.env, so the rest of the list reads stage exactly as it reads production (doadmin stays in no file)"
    cmds:
      - ["bash", "-c", "set -o pipefail && bun scripts/release/stage-target.ts doadmin | bun run role-passwords --target {target} --doadmin-stdin"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q05-scope"
    standing: ["SR.2"]
    host: "control"
    phase: "qa"
    description: "Scope: every PR between the version the target runs (on stage, production's tag, which Q03-stage-up booted) and the QA commit is in the release runbook's scope, each with the step that checks it or a reason none does; and nothing the scope lists is missing from the range"
    cmds:
      - ["bun", "scripts/release/scope.ts", "--release", "{release}", "--commit", "{commit}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q06-checkout"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q07-host-identity"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its identity is absent or matches RM_ENV, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no production step reads doadmin. The ledger reconciliation is Q12-state-baseline's"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q08-install"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target install: bun install --frozen-lockfile, root and backend (an install never rewrites the tree Q07-host-identity proved clean)"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q09-capture-checkout"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture checkout (runner-owned, never a release checkout): clone it when missing, fetch the tags, then detach at the go's ref"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q10-capture-identity"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture identity: HEAD is the commit and the tree is clean"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q11-capture-install"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture install: bun install --frozen-lockfile, root and backend"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q12-state-baseline"
    standing: ["SP.3", "SP.6"]
    host: "target"
    phase: "qa"
    description: "Baseline through rm_readonly: ledger, identity, roles, migration 0101's would-clear list, the ledger reconciliation (the pending set, every applied file's bytes against the version the running stack reports), R2.4 counts and size"
    cmds:
      - ["bun", "scripts/release/baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "baseline*", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q13-log-baseline"
    standing: ["SP.5"]
    host: "target"
    phase: "qa"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    triage: true
  - id: "Q14-backup"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Fresh capture from production's read replica into a new dated directory (never a reused dump)"
    cmds:
      - ["bun", "run", "smoke:capture", "--out", "{captureHome}/rm-backup-{target}-{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "manifest.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q15-backup-sums"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Record the sha256 of the encrypted dump files beside the manifest"
    cmds:
      - ["sh", "-c", "cd {captureHome}/rm-backup-{target}-{runTs} && sha256sum -- *.gpg > SHA256SUMS"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "SHA256SUMS", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q16-restore-proof"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Restore proof: restore the Q14-backup dump into a throwaway local Postgres container, record the restore time, drop the container"
    cmds:
      - ["bun", "scripts/release/restore-proof.ts", "--dump", "{captureHome}/rm-backup-{target}-{runTs}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "restore-proof.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 20
  - id: "Q17-probe-start"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Start the website probe on the control machine: the public origin's / and /version.json every 2 s, from before the first irreversible step until Q25-probe-grade grades it"
    cmds:
      - ["bun", "scripts/release/probe.ts", "start", "--origin", "{publicOrigin}", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18-migrate"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Migrate every pending file while the previous release serves (Q12-state-baseline refused any pending file that is not compat: additive). The cutover's first irreversible step"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
    onlyFor: "stage"
  - id: "Q18a-maintenance-on"
    standing: ["SC.4", "SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover (spec 8.5, issue 1484): the maintenance page on (maintenance.json, state active, in the instance's web directory). The declared window the probe grade allows opens at the start of this step. Runs only for a release that declares breaking:"
    cmds:
      - ["bun", "scripts/release/maintenance.ts", "on", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18b-smoke-down"
    standing: ["SC.4", "SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover: bun smoke:down stops the whole stack, so no previous-release service runs against the breaking state (the data volume is kept). Runs only for a release that declares breaking:"
    cmds:
      - ["bun", "run", "smoke:down", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q18c-migrate-breaking"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover: migrate every pending file, the breaking ones included, against the stopped stack. The upgrade's first irreversible step for a release that declares breaking: (the rolling migrate does not run); rollback is closed after it (spec 8.4)"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
    onlyFor: "stage"
  - id: "Q19-env-rewrite"
    standing: ["SV.6"]
    host: "target"
    phase: "qa"
    description: "Rewrite ~/.env to the D61 allowlist (rm_owner, never doadmin); every other key, a stray doadmin line included, moves to ~/.env.retired-<ts> (mode 0600); refuses without rm_owner or RM_CREDENTIALS; key names only"
    cmds:
      - ["bun", "scripts/release/env-rewrite.ts", "--run", "{runTs}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "env-rewrite.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q20-set-identity"
    standing: []
    host: "target"
    phase: "qa"
    description: "Report the deployment identity the migrate wrote (prod-init set-identity)"
    cmds:
      - ["bun", "scripts/prod-init.ts", "set-identity", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "set-identity-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q21-tokens"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Service tokens (prod-init provision-tokens): keep every holder whose file still holds its current token, provision only a missing or stale one, so the running holders keep authenticating"
    cmds:
      - ["bun", "scripts/prod-init.ts", "provision-tokens", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/prod-init", "pattern": "provision-tokens-*.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q22-rolling-boot"
    standing: ["SP.4", "SC.5"]
    host: "target"
    phase: "qa"
    description: "The rolling boot: bun smoke --static-port replaces api, worker-analytics, system-scheduler and analytics-producer one at a time, each healthy before the next; website-server is never recreated (the boot refuses if it would be)"
    cmds:
      - ["bun", "run", "smoke", "--static-port", "--instance", "{instance}"]
    env: {"PROJECTS_SOURCE": "live"}
    bootEnv: true
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q22a-full-boot"
    standing: ["SP.4", "SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover: the full bun smoke --static-port boot of every service on this release, in place of the rolling boot. Runs only for a release that declares breaking:"
    cmds:
      - ["bun", "run", "smoke", "--static-port", "--instance", "{instance}"]
    expectExit: 0
    env: {"PROJECTS_SOURCE": "live"}
    bootEnv: true
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q23-ready"
    standing: ["SV.2"]
    host: "target"
    phase: "qa"
    description: "Status after the rolling boot: preflight and readiness green. Its end is READY, the soak's start"
    cmds:
      - ["bun", "run", "smoke:status", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
