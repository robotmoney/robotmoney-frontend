# scripts/release/runbooks/releases/v0.7.4.yaml — the v0.7.4 release runbook
# (D70, owner 2026-10-16). A full copy of the web template's steps (templates/web.yaml, the
# kitchen-sink subset for a web-only release; owner 2026-11-11): Q for stage, P and C for
# production, each production step with a stage twin. A release only ADDS: every template step
# stays, unchanged and in order, and each step this release adds carries `added: v0.7.4`
# (scripts/release/runbook.ts checks it).
# Added (added: v0.7.4): Q38/C26-public-surface.
# The policy is docs/technical/release-runbooks.md.
release: v0.7.4
template: web
notes: |
  Identity. From v0.7.3 (tag v0.7.3 at fe89c5ac, the squash of qa/0.7.x-2026-11-06 at a9da340c on
  releases-0.7.x) to v0.7.4-rc.1 at the commit the rc tag names, in a new checkout (/root/rm-074).
  The target files' `release` reads v0.7.4 and prod's `checkout` names the new folder.

  Web-only release. v0.7.4 ships only the website. The owner decided (lucky-tensor, 2026-11-11):
  "The web release is a variation of the kitchen sink release." So it runs through the same
  `bun run release:run` with the `web` template: the kitchen-sink steps a web-only release needs,
  unchanged, with every database and backend step removed. No backup, no migrate, no backend boot,
  no soak. The site switches with `bun smoke:web` (Q24/C12-site) under the website probe. The v0.7.3
  backend keeps serving, so Q26/C14-verify-version check the site's /version.json against the
  release commit (`--site-only`) and not /api/version's commit or /version's tag.

  Owner rescope (lucky-tensor, 2026-11-10). All database and backend work moves to v0.8.0.
  v0.7.4-rc.0 (2ca01233, the squash of qa/0.7.x-2026-11-10 at 68cced9e, stage run
  20261110T073335Z) carried that work; it is superseded and never ran on production. Tags never
  move, so the web-only candidate is v0.7.4-rc.1, from the QA branch qa/0.7.x-2026-11-10-2 cut at
  2ca01233. The platform/web tag split this exposed is research issue 1598.

  Scope. releases-0.7.x took main by route (a) at 69a24f4b (merge of main at bfa6bbe2) before
  qa/0.7.x-2026-11-10 was cut. qa/0.7.x-2026-11-10-2 reverts what moves to v0.8.0: PR 1582 (jobs
  indexes, migration 0130, admin job counts, prune, swarm_briefs.allocation, pg_stat_statements in
  role-passwords, db-stats-check.ts, jobs-query-plans.ts, the template's Q37a/Q37b/C25a steps and
  stage-target's pg_stat_statements install), PR 1586 (migration 0131 and its follow-ups), PR 1595
  (jit=off on the app pools) and the rc.0 QA fix 68cced9e (stage gives pg_stat_statements' members
  to doadmin; moot here once 1582's stage install is gone; it still reaches main by the §7
  backport). Their commits stay in the range v0.7.3..QA commit by ancestry, so the scope lists them
  with `none:` (reverted, not shipped).

  What ships: PRs 1588, 1589, 1590 and 1594 (site; 1590 also edits one comment in
  backend/src/swarm/dormancy.ts), 1592 (docs only) and 1593 (the v0.7.3 backport, already shipped).
  Outside frontend/, backend/ differs from v0.7.3 only by that comment, and the log rules by one
  added rule (below). The backend is not rebuilt or restarted, so neither reaches the running api.

  Migrations: none. backend/migrations and the schema snapshot equal v0.7.3's, so nothing is
  breaking, no `breaking:` list is declared, and no role-passwords run is needed before production.

  Issue 1579 stays open on v0.7.4. The log rule known-swarm-seat-silence-jit-statement-timeout is kept
  with fixedIn 0.8.0 (main PR 1599 sets the same). The six-hourly statement timeouts on the member and
  admin pages still happen on v0.7.4: the rule classifies them ahead of the 1035 rule (fixedIn 0.5.2),
  so every gate on v0.7.4 reports them as a warning, not a failure.

  Dropped check. v0.7.1's Q34b/C22a-archive-records, carried by v0.7.2 to the first rc.0 runbook of
  v0.7.4, is a backend check; a web-only release restarts no backend, so it is not carried.

  Added check. Q38/C26-public-surface read one served file per site PR (1588, 1589, 1590, 1594) for
  a text it added that v0.7.3's copy lacks. It is a read with a production twin. With no READY and
  no soak in the web template, it runs right after the log verdict (no notBefore).
recovery: |
  No migration, no schema change and no backend restart: the v0.7.3 backend keeps serving
  throughout, and only the site changes (Q24-site on stage, C12-site on production).
  - Before C12-site (the preflight, or C04-probe-start to C06-version-tag): the site has not
    changed. Fix on a new QA branch and cut v0.7.4-rc.(N+1).
  - At or after C12-site: recovery is `bun smoke:web --rollback --instance <instance>` from the
    release checkout (/root/rm-074), which returns web/current to the previous (v0.7.3) site. The
    v0.7.3 backend never stopped, so nothing else is rolled back. A defect found after the cutover
    is an issue against v0.7.5 (policy §3 step 8).
scope:
  - {pr: 1582, what: "perf(db): jobs-table scans, prune, brief allocations, query statistics (issue 1581)", none: "not shipped: reverted on qa/0.7.x-2026-11-10-2 by the owner's web-only rescope (2026-11-10); moves to v0.8.0"}
  - {pr: 1586, what: "fix(db): migration 0130 lock timeout, per-chunk prune commits, dangling job links (issue 1584)", none: "not shipped: reverted on qa/0.7.x-2026-11-10-2 by the owner's web-only rescope (2026-11-10); moves to v0.8.0"}
  - {pr: 1588, what: "Launch polish: the launch date, the early access confirmation and the regime dial", check: "Q38-public-surface"}
  - {pr: 1589, what: "docs(skill): keep a judge loop running without systemd (the served onboarding SKILL.md)", check: "Q38-public-surface"}
  - {pr: 1590, what: "a silent seat shows as a callout on its member page", check: "Q38-public-surface"}
  - {pr: 1592, what: "docs(audits): Alpine images vs. the OpenSSH musl password-bypass (10.6p2)", none: "docs only: one file under docs/audits, nothing on a target"}
  - {pr: 1593, what: "chore(release): backport the v0.7.3 release-line fixes to main", none: "shipped in v0.7.3 by its squash; main's commit enters the range by the route (a) merge"}
  - {pr: 1594, what: "feat(home): the market regime under the model portfolio, with percentile as the regime scale", check: "Q38-public-surface"}
  - {pr: 1595, what: "fix(api): jit=off on every app pool (issue 1579)", none: "not shipped: reverted on qa/0.7.x-2026-11-10-2 by the owner's web-only rescope (2026-11-10); moves to v0.8.0. Its log rule stays with fixedIn 0.8.0"}
steps:
  # ── QA: stage only, as often as needed. Stage's preparation (Q01 to Q05), then the release
  # checkout and install, the log baseline, the website probe, the site switch, and the checks.
  # No backup, migrate or backend boot: the backend production runs keeps serving.
  - id: "Q01-lockfile"
    standing: ["SP.9"]
    host: "control"
    phase: "qa"
    description: "Fresh lockfile: every committed bun.lock equals a fresh resolve at the QA commit, so the rc carries one (owner, 2026-10-14); hosts then install it frozen"
    cmds:
      - ["bun", "scripts/release/lockfile.ts", "check", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q02-dump"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage's starting dump: the newest production dump on the capture host that is at most 24 hours old, else a new capture from production's read replica (never a stale dump, never the production database)"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "dump"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q03-stage-up"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage target: replace it with a production-shaped copy restored from that dump, running the version production runs (the running tag, its ledger, its grants); the release checkout is made by Q06-checkout"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "up", "--dump", "newest", "--replace"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 60
  - id: "Q04-role-passwords"
    standing: ["SR.1"]
    host: "control"
    phase: "qa"
    description: "Stage's role passwords: the stage database sets its own doadmin password and role-passwords writes the roles' passwords to the stage host's ~/.env, so the rest of the list reads stage exactly as it reads production (doadmin stays in no file)"
    cmds:
      - ["bash", "-c", "set -o pipefail && bun scripts/release/stage-target.ts doadmin | bun run role-passwords --target {target} --doadmin-stdin"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q05-scope"
    standing: ["SR.2"]
    host: "control"
    phase: "qa"
    description: "Scope: every PR between the version the target runs (on stage, production's tag, which Q03-stage-up booted) and the QA commit is in the release runbook's scope, each with the step that checks it or a reason none does; and nothing the scope lists is missing from the range"
    cmds:
      - ["bun", "scripts/release/scope.ts", "--release", "{release}", "--commit", "{commit}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q06-checkout"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q07-host-identity"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its identity is absent or matches RM_ENV, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no production step reads doadmin. The ledger reconciliation is Q12-state-baseline's"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q08-install"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target install: bun install --frozen-lockfile, root and backend (an install never rewrites the tree Q07-host-identity proved clean)"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q13-log-baseline"
    standing: ["SP.5"]
    host: "target"
    phase: "qa"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    triage: true
  - id: "Q17-probe-start"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Start the website probe on the control machine: the public origin's / and /version.json every 2 s, from before the first irreversible step until Q25-probe-grade grades it"
    cmds:
      - ["bun", "scripts/release/probe.ts", "start", "--origin", "{publicOrigin}", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q24-site"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Site: bun smoke:web switches web/current atomically and reloads nginx gracefully (refuses a site whose apiRange excludes the api)"
    cmds:
      - ["bun", "run", "smoke:web", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q25-probe-grade"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Stop and grade the website probe: every answer 200 and no gap over the interval from Q17-probe-start to now, or the release fails"
    cmds:
      - ["bun", "scripts/release/probe.ts", "grade", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q26-verify-version"
    standing: ["SV.1"]
    host: "target"
    phase: "qa"
    description: "Identity, site only (web template): /version.json carries the release commit; /api/version answers 200, and neither it nor /version.json carries +dirty or +unknown. The backend is not restarted, so /api/version's commit and /version's tag stay the running release's and are not compared"
    cmds:
      - ["bun", "scripts/release/identity-check.ts", "--origin", "{publicOrigin}", "--commit", "{commit}", "--ref", "{ref}", "--site-only", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "identity-check.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q27-verify-product"
    standing: ["SV.3"]
    host: "target"
    phase: "qa"
    description: "Product verification, readonly tier"
    cmds:
      - ["bun", "run", "verify:live", "--instance", "{instance}", "--emit-receipt=R7.verify"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q28-log-verdict"
    standing: ["SV.4"]
    host: "target"
    phase: "qa"
    description: "Log verdict after the release (sessions graded later: the first one publishes hours after the cutover)"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "post-release", "--defer-sessions", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-post-release.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-post-release.*", "required": true}
    irreversible: false
    onlyFor: "stage"
  # ── v0.7.4's version check (added: v0.7.4): read-only, after the site checks, with a production twin.
  - id: "Q38-public-surface"
    standing: ["SV.7"]
    host: "target"
    phase: "qa"
    added: "v0.7.4"
    description: "Site (PRs 1588, 1589, 1590, 1594): each site PR's served file carries a text the PR added and v0.7.3's copy lacks (the regime dial on /views/regime.html, the early access confirmation, the onboarding skill's Running without systemd, the silent-seat callout on /views/swarm/member.html, the market regime on /views/home.html); a static file missing answers 404"
    cmds:
      - ["bun", "scripts/release/version-check.ts", "--release", "{release}", "--check", "public-surface", "--instance", "{instance}", "--origin", "{publicOrigin}", "--run", "{runTs}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "version-check-public-surface.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  # ── Preflight: production only, once per rc, at most 60 minutes before the cutover. It
  # assumes every QA step above passed on stage. Read-only: nothing a running service uses changes.
  - id: "P01-checkout"
    standing: ["SP.1"]
    host: "target"
    phase: "preflight"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "P02-host-identity"
    standing: ["SP.1"]
    host: "target"
    phase: "preflight"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its identity is absent or matches RM_ENV, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no production step reads doadmin. The ledger reconciliation is P07-state-baseline's"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "prod"
  - id: "P03-install"
    standing: ["SP.1"]
    host: "target"
    phase: "preflight"
    description: "Target install: bun install --frozen-lockfile, root and backend (an install never rewrites the tree P02-host-identity proved clean)"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
  - id: "P08-log-baseline"
    standing: ["SP.5"]
    host: "target"
    phase: "preflight"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    onlyFor: "prod"
    triage: true
  # ── Cutover: production only. The version tag, the site switch under the website probe,
  # then the checks, as stage ran them.
  - id: "C04-probe-start"
    standing: ["SC.4"]
    host: "control"
    phase: "cutover"
    description: "Start the website probe on the control machine: the public origin's / and /version.json every 2 s, from before the first irreversible step until C13-probe-grade grades it"
    cmds:
      - ["bun", "scripts/release/probe.ts", "start", "--origin", "{publicOrigin}", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
  - id: "C06-version-tag"
    standing: ["SW.3"]
    host: "control"
    phase: "cutover"
    description: "The cutover has started: tag the rc's commit with the version tag and push it (prod only, D70). A later failed check or a rollback never withholds or moves it"
    cmds:
      - ["bun", "scripts/release/tag.ts", "final", "--release", "{release}", "--commit", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
  - id: "C12-site"
    standing: ["SC.5"]
    host: "target"
    phase: "cutover"
    description: "Site: bun smoke:web switches web/current atomically and reloads nginx gracefully (refuses a site whose apiRange excludes the api)"
    cmds:
      - ["bun", "run", "smoke:web", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
  - id: "C13-probe-grade"
    standing: ["SC.4"]
    host: "control"
    phase: "cutover"
    description: "Stop and grade the website probe: every answer 200 and no gap over the interval from C04-probe-start to now, or the release fails"
    cmds:
      - ["bun", "scripts/release/probe.ts", "grade", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
  - id: "C14-verify-version"
    standing: ["SV.1"]
    host: "target"
    phase: "cutover"
    description: "Identity, site only (web template): /version.json carries the release commit; /api/version answers 200, and neither it nor /version.json carries +dirty or +unknown. The backend is not restarted, so /api/version's commit and /version's tag stay the running release's and are not compared"
    cmds:
      - ["bun", "scripts/release/identity-check.ts", "--origin", "{publicOrigin}", "--commit", "{commit}", "--ref", "{ref}", "--site-only", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "identity-check.json", "required": true}
    irreversible: false
    onlyFor: "prod"
  - id: "C15-verify-product"
    standing: ["SV.3"]
    host: "target"
    phase: "cutover"
    description: "Product verification, readonly tier"
    cmds:
      - ["bun", "run", "verify:live", "--instance", "{instance}", "--emit-receipt=R7.verify"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "prod"
  - id: "C16-log-verdict"
    standing: ["SV.4"]
    host: "target"
    phase: "cutover"
    description: "Log verdict after the release (sessions graded later: the first one publishes hours after the cutover)"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "post-release", "--defer-sessions", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-post-release.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-post-release.*", "required": true}
    irreversible: false
    onlyFor: "prod"
  # ── v0.7.4's version check (added: v0.7.4): the production twin of Q38.
  - id: "C26-public-surface"
    standing: ["SV.7"]
    host: "target"
    phase: "cutover"
    added: "v0.7.4"
    description: "Site (PRs 1588, 1589, 1590, 1594): each site PR's served file carries a text the PR added and v0.7.3's copy lacks (the regime dial on /views/regime.html, the early access confirmation, the onboarding skill's Running without systemd, the silent-seat callout on /views/swarm/member.html, the market regime on /views/home.html); a static file missing answers 404"
    cmds:
      - ["bun", "scripts/release/version-check.ts", "--release", "{release}", "--check", "public-surface", "--instance", "{instance}", "--origin", "{publicOrigin}", "--run", "{runTs}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "version-check-public-surface.json", "required": true}
    irreversible: false
    onlyFor: "prod"
    maxMinutes: 10
