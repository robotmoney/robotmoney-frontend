# scripts/release/runbooks/releases/v0.9.0.yaml — the v0.9.0 release runbook
# (D70, owner 2026-11-14: "a 0.9.0 branch, with a runbook which is very specific to these changes").
# A full copy of the kitchen-sink template's steps: Q for stage, P and C for production, each
# production step with a stage twin. A release only ADDS: every template step stays, unchanged and in
# order, and each step this release adds carries `added: v0.9.0` (scripts/release/runbook.ts checks it).
# Added (added: v0.9.0): the first rollout of the immutable web container (Q13a/P08a-site-bundle,
# Q23a/C11a-server-image-build, Q24b/C12b-site-bundle-deploy) and the version checks Q38 to Q44 with their
# production twins C26 to C32 (scripts/release/version-checks/v0.9.0/).
# The policy is docs/technical/release-runbooks.md.
release: v0.9.0
template: kitchen-sink
notes: |
  Identity. From v0.8.0 (tag v0.8.0 at 5c79f796, running on production) to v0.9.0 at the commit the rc
  tag names, in a new checkout (/root/rm-090). The target files' `release` reads v0.9.0 and prod's
  `checkout` names the new folder. Tracking issue 1647 (label release:v0.9.0).

  Template: kitchen-sink. The web template drops every backend step, and this release changes the api
  (the analytics answer store, PR 1635) and the analytics read path (the regime history, PR 1646). The
  web serving rebuild also changes the platform's server config, which web-serving-architecture.md
  section 3.3 makes a platform release.

  Scope. releases-0.9.x and qa/0.9.x-2026-11-14 were cut from main at af3ec970. v0.8.0's tag is a squash
  on releases-0.8.x whose main base is 07eb2668, so the range v0.8.0..QA commit carries exactly the main
  commits 07eb2668..af3ec970: PRs 1620, 1633, 1634, 1635, 1636, 1637, 1638, 1639, 1640, 1642, 1641, 1643,
  1417, 1645 and 1646. 1417 (migration 0132 and its repair) and 1645 (its revert) cancel out: no file of
  either remains in the tree.

  Migrations: none. Nothing under backend/migrations/ or backend/schema/ differs between 07eb2668 and
  af3ec970 (0132 came with 1417 and left with 1645). C05-migrate applies nothing. No `breaking:` list; the
  rolling upgrade applies.

  Owner decision (2026-11-15, relayed on issue 1647): v0.9.0 itself moves the site off nginx. It registers
  the control machine's bundle key and names a signed bundle that this release deploys, so each host's
  first rollout happens in this release's own cutover (web-serving-architecture.md section 5.3).

  Owner decision (2026-11-15): the owner makes one offline backup of the bundle signing private key,
  kept somewhere only the owner controls. The key is ~/.ssh/robotmoney-web-bundle on the control machine
  (pinza), ed25519 SHA256:nfotE6VAd/1wIcTlcmbsPto1W/T2IMvl58EEoZV8+ng. No step makes, checks or waits for
  the backup; it is a release gate box on issue 1647, not a runbook step, and no agent copies, prints or
  moves the key.

  Web serving (epic 1623, P1 to P9). How this run moves a host from nginx to the immutable container:
    - The key. The control machine (pinza, where release:run runs) holds the private key at
      ~/.ssh/robotmoney-web-bundle (mode 600), the path scripts/release/web-release.ts already signs with.
      Its public line, ed25519 SHA256:nfotE6VAd/1wIcTlcmbsPto1W/T2IMvl58EEoZV8+ng, replaces the bootstrap
      entry in website-server/allowed-signers. The bootstrap line was removed: its private half was
      discarded, so no bundle could ever verify against it, and the file's header said to replace it.
    - Q13a-site-bundle (stage) packs and signs the bundle for the QA commit on the control machine with
      W03's commands and records its sha256 (scripts/release/platform-bundle.ts, store
      <journal root>/bundles/v0.9.0/). P08a-site-bundle (production preflight) builds nothing: it refuses
      unless stage deployed that bundle in a run that passed with the rc commit's tree, and its bytes still
      hash to the recorded digest and verify. Production deploys the stage-passed bytes or nothing (R13).
    - Q23a/C11a-server-image-build build robotmoney-website-server:<instance> from this release's
      Dockerfile.caddy, with the new allowed-signers inside. release-runbooks.md section 12 and
      web-serving-architecture.md section 3.2 say the platform release builds it; no boot does.
    - Q24/C12-site (template, --bundle serving) change nothing while nginx serves. Q24b/C12b-site-bundle-deploy
      then run bun smoke:web with the bundle file and the new server image, inside the probe's window, so
      Q25/C13 excuse exactly the swap's recorded gap. The swap keeps the nginx container, stopped, as
      <name>-first-rollout: the rollback target. From then on every boot serves the -current site image.
    - Identity. The bundle's /version.json names the QA commit it was built at. Production runs the rc squash
      commit with the same tree, so scripts/release/identity-check.ts (Q26/C14) now also accepts a
      /version.json commit that differs from the release commit only in check-only paths (journal.ts).
    - Q40/C28-web-image and Q41/C29-web-bundle then require the site image to serve and the served bytes to
      be the signed bundle, verified against the new allowed-signers.
  Gap (next release). A later platform release's Q24/C12-site runs smoke:web --bundle serving, which fetches
  the serving tag's GitHub release (web-v<version> of frontend/package.json, 0.1.0 today). This release
  publishes no such release: a web tag lives on web/releases-A.B.x and is guarded there (section 12). Before
  v0.9.1 either the first web content release publishes web-v0.1.x, or smoke:web learns to keep a bundle
  it cannot fetch when the server image is unchanged. Recorded on issue 1647.

  Regime history (PR 1646, issue 1182, D83). Read path only: each day serves its published figure,
  selected from analytics_output_snapshots when it is read; regime_snapshots keeps its writers. Q43/C31
  check the served line against the target's own ledger, and against production's recorded figures when
  the ledger starts on 2026-09-21. Issue 1647's release gate names stage `csvb audit drift` as the
  evidence; that tool compares runs with the regime_snapshots table, which every run still rewrites by
  design, so it reports drift after the fix too. Q44/C32-regime-frozen is the evidence instead: across a
  real regime run, no ended day changes on the served line.

  Release tooling, exercised only on a breaking cutover (1633, 1634): this release declares no breaking:,
  so Q18a to Q18c, Q22a, Q24a and their C twins are recorded skipped. The probe still asks
  /api/status/maintenance every tick (1633), which a rolling run grades exactly as before.

  Known run hazards. Q44/C32-regime-frozen waits for the next regime run (every 3 h at :30 UTC; cap 200
  minutes) alongside the soak. Q41/C29-web-bundle runs gh on the control machine. Q02-dump may hit a
  transient replica pg_dump conflict: retry.
recovery: |
  v0.9.0 carries no migration, so every rollback is code only and the schema never changes.
  - Before C05-migrate (preflight, or C01-backup to C04-probe-start): nothing has changed. Fix on a new
    QA branch and cut v0.9.0-rc.(N+1).
  - C05-migrate applies nothing (no pending file). A failure there is a ledger or connection fault:
    resume at C05-migrate; v0.8.0 keeps serving.
  - After C05-migrate: a defect is an issue against v0.9.1 (policy section 3 step 8). A code rollback to
    v0.8.0 is safe: run the rolling boot from the v0.8.0 checkout (/root/rm-080, bun smoke --static-port).
    It reloads v0.8.0's nginx.conf (its proxy_cache returns), the api serves the recomputed regime history
    again (no data was changed, so nothing is lost), and the api's answer store is gone with the process.
    Roll the site back first (below); the server image C11a tagged stays and is unused.
  - The web serving change (Q24b/C12b-site-bundle-deploy). A failed swap reverts by itself: smoke:web
    starts the nginx container again and exits non-zero (web-serving-architecture.md section 4 step 6), and
    the cutover stops there with nginx serving. After a successful swap, the rollback is, from the control
    machine:
      bun smoke:web --host rm-frontend-prod-1 --instance rm_prod --rollback --origin https://robotmoney.network
    On this first rollout there is no -previous image, so it starts the stopped nginx container
    <name>-first-rollout again, with its own web/ mount, makes the site image the one previous image, and
    untags -current so a platform boot runs nginx. It refuses a target whose apiRange excludes the running
    api, and its own gap is held to 3 s. A code rollback to v0.8.0 needs this first: v0.8.0's boot knows no
    site image.
  - The regime fix is read-path only: rolling back the code restores the old served line; the frozen
    ledger and regime_snapshots are unchanged either way.
scope:
  - {pr: 1620, what: "docs(web): the web serving architecture (signed bundles in one immutable container)", none: "docs only"}
  - {pr: 1633, what: "fix(release): a breaking cutover keeps the site up (smoke:down --keep-web, probe asks /api/status/maintenance)", none: "release tooling run only on a breaking cutover; v0.9.0 declares no breaking:, so its steps are recorded skipped"}
  - {pr: 1634, what: "fix(release): the probe grade reads the maintenance window of the run's own target", none: "release tooling (probe grade) that matters only inside a declared maintenance window; v0.9.0 declares none"}
  - {pr: 1635, what: "feat(web): P6 the api owns the public analytics cache; nginx stores no api answer", check: "Q42-api-cache"}
  - {pr: 1636, what: "feat(web): P1 the website-server route and header contract", check: "Q38-web-routes"}
  - {pr: 1637, what: "feat(web): P2 Caddy server image (spike made the platform's server)", check: "Q39-server-image"}
  - {pr: 1638, what: "feat(web): P3 signed bundle pack, sign and verify", check: "Q41-web-bundle"}
  - {pr: 1639, what: "feat(web): P4 the read-only immutable website-server image", check: "Q40-web-image"}
  - {pr: 1640, what: "feat(web): P5 swap, rollback and gap measurement (bun smoke:web image mode)", check: "Q40-web-image"}
  - {pr: 1641, what: "feat(web): P7 runbook integration (site steps run the image-mode swap, probe excuses a recorded swap gap)", none: "release tooling the run itself exercises: Q24-site/C12-site and Q25/C13-probe-grade"}
  - {pr: 1642, what: "feat(web): P9 platform boots keep the serving image; each host's first rollout", check: "Q40-web-image"}
  - {pr: 1643, what: "feat(web): P8 smoke:web directory mode removed; nginx kept only as bootstrap and first-rollout target", check: "Q40-web-image"}
  - {pr: 1417, what: "fix(analytics): regime frozen publications by migration 0132 (reverted by 1645)", none: "reverted by PR 1645 in the same range; nothing of it ships"}
  - {pr: 1645, what: "revert: the regime frozen-publications fix 1417", none: "a revert of PR 1417 in the same range; together they change no file"}
  - {pr: 1646, what: "fix(analytics): the regime history serves each day's published figure from the frozen ledger (D83, issue 1182)", check: "Q43-regime-published"}
steps:
# every template step stays, unchanged and in order (scripts/release/runbook.ts
# refuses a deletion, an edit or a reorder).
#
# Fields are scripts/release/steps.ts StepTemplate's. Commands are argv
# templates; the target file fills {instance}, {confirmTarget}, ... . The
# step-list hash SP.8 compares is taken over the resolved list.
#
# Three phases (owner, 2026-10-16), each step on one target, its id's letter naming the phase:
#   Q  QA, stage only: preparation (Q01 to Q05), then the upgrade as production will run it, then
#      the soak. A release's version checks follow.
#   P  preflight, production only: read-only gates that assume the QA passed.
#   C  cutover, production only: the release as it happens, then the soak, then the version checks.
# Every P and C step has a Q twin of the same name and commands (runbook.ts twinProblems), so
# production runs only what stage ran. The version tag (C06) has none: stage tags nothing.
# `standing` names the standing runbook rows each step satisfies
# (docs/technical/release-runbooks.md §9).
template: kitchen-sink
steps:
  # ── QA: stage only, as often as needed. Every step here runs on the stage target and
  # on no other: stage's preparation (Q01 to Q05), then the whole upgrade (checkout, install,
  # baseline, backup and restore proof, migrate, rolling boot, site), then the soak, then the
  # release's version checks. A stage run that passes is the rehearsal production runs after.
  - id: "Q01-lockfile"
    standing: ["SP.9"]
    host: "control"
    phase: "qa"
    description: "Fresh lockfile: every committed bun.lock equals a fresh resolve at the QA commit, so the rc carries one (owner, 2026-10-14); hosts then install it frozen"
    cmds:
      - ["bun", "scripts/release/lockfile.ts", "check", "{commit}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q02-dump"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage's starting dump: the newest production dump on the capture host that is at most 24 hours old, else a new capture from production's read replica (never a stale dump, never the production database)"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "dump"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q03-stage-up"
    standing: ["SR.0"]
    host: "control"
    phase: "qa"
    description: "Stage target: replace it with a production-shaped copy restored from that dump, running the version production runs (the running tag, its ledger, its grants); the release checkout is made by Q06-checkout"
    cmds:
      - ["bun", "scripts/release/stage-target.ts", "up", "--dump", "newest", "--replace"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 60
  - id: "Q04-role-passwords"
    standing: ["SR.1"]
    host: "control"
    phase: "qa"
    description: "Stage's role passwords: the stage database sets its own doadmin password and role-passwords writes the roles' passwords to the stage host's ~/.env, so the rest of the list reads stage exactly as it reads production (doadmin stays in no file)"
    cmds:
      - ["bash", "-c", "set -o pipefail && bun scripts/release/stage-target.ts doadmin | bun run role-passwords --target {target} --doadmin-stdin"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
  - id: "Q05-scope"
    standing: ["SR.2"]
    host: "control"
    phase: "qa"
    description: "Scope: every PR between the version the target runs (on stage, production's tag, which Q03-stage-up booted) and the QA commit is in the release runbook's scope, each with the step that checks it or a reason none does; and nothing the scope lists is missing from the range"
    cmds:
      - ["bun", "scripts/release/scope.ts", "--release", "{release}", "--commit", "{commit}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q06-checkout"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target checkout: clone it when missing, fetch the tags, then detach at the go's ref (the rc tag on prod, the commit on stage), so the host holds the tag the boot reports (D64)"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q07-host-identity"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target identity and precondition: HEAD is the commit, the tree is clean, the tools exist, ~/.env resolves to confirmTarget, the database answers, its identity is absent or matches RM_ENV, ~/.env holds non-empty rm_owner and RM_CREDENTIALS lines and rm_owner logs in (SELECT 1, read-only; refuses with \"run bun run role-passwords --target <target> first\"); no production step reads doadmin. The ledger reconciliation is Q12-state-baseline's"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--confirm-target", "{confirmTarget}", "--receipt-dir", "{home}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q08-install"
    standing: ["SP.1"]
    host: "target"
    phase: "qa"
    description: "Target install: bun install --frozen-lockfile, root and backend (an install never rewrites the tree Q07-host-identity proved clean)"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q09-capture-checkout"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture checkout (runner-owned, never a release checkout): clone it when missing, fetch the tags, then detach at the go's ref"
    cmds:
      - ["git", "fetch", "--tags", "origin"]
      - ["git", "-c", "advice.detachedHead=false", "checkout", "--detach", "{ref}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    cloneFrom: "git@github.com:robotmoney/robotmoney-frontend.git"
  - id: "Q10-capture-identity"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture identity: HEAD is the commit and the tree is clean"
    cmds:
      - ["bun", "scripts/release/host-identity.ts", "--commit", "{commit}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "host-identity.json", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q11-capture-install"
    standing: ["SP.1"]
    host: "capture"
    phase: "qa"
    description: "Capture install: bun install --frozen-lockfile, root and backend"
    cmds:
      - ["bun", "install", "--frozen-lockfile"]
      - ["bun", "install", "--frozen-lockfile", "--cwd", "backend"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q12-state-baseline"
    standing: ["SP.3", "SP.6"]
    host: "target"
    phase: "qa"
    description: "Baseline through rm_readonly: ledger, identity, roles, migration 0101's would-clear list, the ledger reconciliation (the pending set, every applied file's bytes against the version the running stack reports), R2.4 counts and size"
    cmds:
      - ["bun", "scripts/release/baseline.ts", "--instance", "{instance}", "--run", "{runTs}", "--origin", "{publicOrigin}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}/release/{runTs}", "pattern": "baseline*", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q13-log-baseline"
    standing: ["SP.5"]
    host: "target"
    phase: "qa"
    description: "Log baseline of the running stack the instance's smoke state names, graded by prod:gate from the release checkout"
    cmds:
      - ["bun", "run", "prod:gate", "--mode", "baseline", "--instance", "{instance}", "--report", "{home}/.local/state/robotmoney-release/{target}/{runTs}/prod-gate-baseline.md"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "prod-gate-baseline.*", "required": true}
    irreversible: false
    onlyFor: "stage"
    triage: true
  - id: "Q13a-site-bundle"
    standing: ["SC.5"]
    host: "control"
    phase: "qa"
    added: "v0.9.0"
    description: "The signed bundle this release deploys (owner decision 2026-11-15, web-serving-architecture.md section 5.3), on the control machine, which alone holds the bundle key (~/.ssh/robotmoney-web-bundle). Stage: pack and sign the bundle for the release commit with web release W03's commands (scratch worktree, frozen install, scripts/static-assembly.sh, web-bundle.ts pack and sign), verify it against the commit's website-server/allowed-signers and record its sha256 in <journal root>/bundles/<release>/bundle.json; a bundle already built for this commit that verifies is kept. Production: builds nothing and refuses unless the store holds the bundle stage deployed, in a stage run that passed with the production commit's tree, its bytes still hash to that digest and it verifies (R13). Touches no host"
    cmds:
      - ["bun", "scripts/release/platform-bundle.ts", "build", "--release", "{release}", "--target", "{target}", "--commit", "{commit}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q14-backup"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Fresh capture from production's read replica into a new dated directory (never a reused dump)"
    cmds:
      - ["bun", "run", "smoke:capture", "--out", "{captureHome}/rm-backup-{target}-{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "manifest.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 30
  - id: "Q15-backup-sums"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Record the sha256 of the encrypted dump files beside the manifest"
    cmds:
      - ["sh", "-c", "cd {captureHome}/rm-backup-{target}-{runTs} && sha256sum -- *.gpg > SHA256SUMS"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/rm-backup-{target}-{runTs}", "pattern": "SHA256SUMS", "required": true}
    irreversible: false
    onlyFor: "stage"
  - id: "Q16-restore-proof"
    standing: ["SP.2"]
    host: "capture"
    phase: "qa"
    description: "Restore proof: restore the Q14-backup dump into a throwaway local Postgres container, record the restore time, drop the container"
    cmds:
      - ["bun", "scripts/release/restore-proof.ts", "--dump", "{captureHome}/rm-backup-{target}-{runTs}", "--receipt-dir", "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}"]
    expectExit: 0
    receipts:
      - {"dir": "{captureHome}/.local/state/robotmoney-release/{target}/{runTs}", "pattern": "restore-proof.json", "required": true}
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 20
  - id: "Q17-probe-start"
    standing: ["SC.4"]
    host: "control"
    phase: "qa"
    description: "Start the website probe on the control machine: the public origin's / and /version.json every 2 s, from before the first irreversible step until Q25-probe-grade grades it"
    cmds:
      - ["bun", "scripts/release/probe.ts", "start", "--origin", "{publicOrigin}", "--target", "{target}", "--run", "{runTs}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18-migrate"
    standing: ["SC.5"]
    host: "target"
    phase: "qa"
    description: "Migrate every pending file while the previous release serves (Q12-state-baseline refused any pending file that is not compat: additive). The cutover's first irreversible step"
    cmds:
      - ["bun", "run", "migrate", "--instance", "{instance}", "--confirm-target", "{confirmTarget}"]
    expectExit: 0
    receipts:
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-receipt-*.json", "required": true}
      - {"dir": "{home}/.local/state/robotmoney-smoke/{instance}", "pattern": "migrate-journal-*.json", "required": false}
    irreversible: true
    onlyFor: "stage"
  - id: "Q18a-maintenance-on"
    standing: ["SC.4", "SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover (spec 8.5, issue 1484): the maintenance page on (maintenance.json, state active, in the instance's web directory). The declared window the probe grade allows opens at the start of this step. Runs only for a release that declares breaking:"
    cmds:
      - ["bun", "scripts/release/maintenance.ts", "on", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
  - id: "Q18b-smoke-down"
    standing: ["SC.4", "SC.5"]
    host: "target"
    phase: "qa"
    since: "v0.7.0"
    breakingOnly: true
    description: "Breaking cutover: bun smoke:down --keep-web stops every service of the instance except website-server, so no previous-release service runs against the breaking state while the site keeps answering and nginx serves maintenance.json (issue 1501; the data volume is kept). Runs only for a release that declares breaking:"
    cmds:
      - ["bun", "run", "smoke:down", "--keep-web", "--instance", "{instance}"]
    changedSince: "v0.7.5"
    before:
      description: "Breaking cutover: bun smoke:down stops the whole stack, so no previous-release service runs against the breaking state (the data volume is kept). Runs only for a release that declares breaking:"
      cmds:
        - ["bun", "run", "smoke:down", "--instance", "{instance}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "stage"
    maxMinutes: 10
