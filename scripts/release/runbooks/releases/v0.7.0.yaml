# scripts/release/runbooks/releases/v0.7.0.yaml — the v0.7.0 release runbook
# (D70). A full copy of the kitchen-sink template's steps. A release only ADDS:
# every template step stays, unchanged and in order, and each step this
# release adds carries `added: v0.7.0` (scripts/release/runbook.ts checks it).
# S10 to S12 are template steps (since: v0.7.0), so they carry no added.
# The policy is docs/technical/release-runbooks.md.
release: v0.7.0
template: kitchen-sink
notes: |
  Identity. From v0.6.4 (instance rm_prod) to v0.7.0 at the commit the rc tag names, in a new
  checkout. The target files' `release` reads v0.7.0 and prod's `checkout` names the new folder
  before the run. Tracking: the v0.7.0 release issue (1452).

  Scope is regenerated at the QA commit. The `scope:` below was built from
  `git log v0.6.4..origin/main` when this file was written (28 PRs). Q05-scope refuses the QA
  commit if the range then carries a PR the list lacks, so regenerate the list at the QA commit
  and keep the checks it maps. One entry says NO CHECK YET (the referral specification, 1424).

  Migrations (D75, issue 1034):
  - 0126_pipeline_worker_token_and_receipts: compat additive. The pipeline-worker token holder
    and the api's ingestion receipts.
  - 0127_rm_worker_retired: compat BREAKING. rm_worker loses every privilege. The `breaking:`
    list below declares it, and only a release that names a file there may carry a breaking
    pending migration: P07-baseline (which reads the release from RM_RELEASE, set by the runner
    from the target file) refuses any other. D75's accepted costs put a release that carries 0127
    under spec section 8.5's breaking order, and issue 1220 provides the maintenance page and the
    off-host fallback for the window.

  Breaking-order plan (stage only until the owner cuts an rc; nothing here touches production):
  1. Maintenance page on for the window (issue 1220): nginx answers /api/ from the maintenance
     fallback and the off-host fallback page is in place.
  2. bun smoke:down: the stack stops (the previous release no longer serves).
  3. bun run migrate: 0126 and 0127 apply with rm_owner, against the stopped stack.
  4. bun smoke --static-port: the full stack comes up on this release (the website switch and the
     probe grade as in the rolling case).
  5. Maintenance page off. Rollback is closed after the migrate (spec section 8.4): fix forward
     on v0.7.1, or restore the C01-backup dump with the write loss it implies.

  NOT BUILT. The template's cutover steps still run the rolling order: C05-migrate migrates under
  the running release, C10-rolling-boot replaces services one at a time, and C13-probe-grade fails
  the release on any probe answer that is not 200 or any gap, which the maintenance window breaks.
  Making the cutover follow down, migrate, up needs a runner change this release does not carry:
  a breaking-order variant of C04 to C13 (a smoke:down step before the migrate, a full boot in
  place of the rolling one, the maintenance page on and off around them, and a probe grade that
  allows the declared window). P07-baseline accepts the declaration and the steps do not yet
  follow it.

  Added checks. S10 to S12 (SV.8) are the template's: the archive routes, the SDK quickstart
  and the SDK tests, from a sparse clone of the release commit, on the control machine.
  V01 to V05 and V10 read the target (V10 spends this client's rate-limit minute, so it runs
  last). V06 to V09 are the SDK 0.2.0 checks, run on the control machine from the release
  commit; the reference portfolio, prices, holdings and golden are in
  scripts/release/version-checks/v0.7.0/reference/. Every check is read-only against the
  target. V02, V05 and S11 need a published run; on a target with none they fail and name it.
breaking:
  - 0127_rm_worker_retired.sql
recovery: |
  0126 is compat: additive. 0127 is compat: breaking and takes every privilege from rm_worker.
  - Before the migrate step (the preflight, or C01-backup to C04-probe-start): nothing has changed; fix on a
    new QA branch and cut v0.7.0-rc.(N+1).
  - After 0127: code before this release never connects as rm_worker, but a pipeline worker built before
    it does. Rolling back to v0.6.4 means restoring the C01-backup dump with the write loss it implies, or
    regranting rm_worker through a new migration. Fix forward on v0.7.1 otherwise.
  - v0.7.0 is tagged at C06-version-tag either way (D70).
