# scripts/release/runbooks/releases/v0.7.0.yaml — the v0.7.0 release runbook
# (D70, owner 2026-10-16). A full copy of the kitchen-sink template's steps: Q for stage, P and C
# for production, each production step with a stage twin. A release only ADDS:
# every template step stays, unchanged and in order, and each step this
# release adds carries `added: v0.7.0` (scripts/release/runbook.ts checks it).
# Q35 to Q37 and C23 to C25 (the SDK checks) are template steps (since: v0.7.0), so they carry no added.
# The policy is docs/technical/release-runbooks.md.
release: v0.7.0
template: kitchen-sink
notes: |
  Identity. From v0.6.4 (instance rm_prod) to v0.7.0 at the commit the rc tag names, in a new
  checkout. The target files' `release` reads v0.7.0 and prod's `checkout` names the new folder
  before the run. Tracking: the v0.7.0 release issue (1452).

  Scope is regenerated at the QA commit. The `scope:` below was built from
  `git log v0.6.4..origin/main` when this file was written (34 PRs). Q05-scope refuses the QA
  commit if the range then carries a PR the list lacks, so regenerate the list at the QA commit
  and keep the checks it maps.

  Migrations (D75, issue 1034):
  - 0126_pipeline_worker_token_and_receipts: compat additive. The pipeline-worker token holder
    and the api's ingestion receipts.
  - 0127_rm_worker_retired: compat BREAKING. rm_worker loses every privilege. The `breaking:`
    list below declares it, and only a release that names a file there may carry a breaking
    pending migration: Q12-state-baseline and P07-state-baseline (which read the release from
    RM_RELEASE, set by the runner from the target file) refuse any other. D75's accepted costs put
    a release that carries 0127 under spec section 8.5's breaking order, and issue 1220 provides
    the maintenance page and the off-host fallback for the window.

  Breaking cutover (issue 1484; spec section 8.5). Because this runbook declares `breaking:`, the
  runner records Q18-migrate, Q22-rolling-boot and their production twins C05-migrate and
  C10-rolling-boot skipped, and runs the template's breakingOnly steps in this order, on stage first
  and then on production (nothing here has run against either yet):
  1. Q18a-maintenance-on / C05a-maintenance-on: maintenance.json (state active) is written to the
     instance's web directory (issue 1220), so nginx answers /api/status/maintenance from it while
     the api is unreachable. The off-host fallback page is Cloudflare's own error page, served when
     the origin is down, and needs no step.
  2. Q18b-smoke-down / C05b-smoke-down: bun smoke:down stops the whole stack (website-server
     included; the data volume is kept), so no previous-release service runs against the breaking
     state.
  3. Q18c-migrate-breaking / C05c-migrate-breaking: bun run migrate --confirm-target applies 0126
     and 0127 with rm_owner against the stopped stack. Rollback is closed after it (spec section
     8.4): fix forward on v0.7.1, or restore the backup dump with the write loss it implies.
  4. Q19 to Q21 / C06 to C09 as before, then Q22a-full-boot / C10a-full-boot: the full
     bun smoke --static-port boot, then ready and site as before.
  5. Q24a-maintenance-off / C12a-maintenance-off: maintenance.json is removed.
  Q25-probe-grade / C13-probe-grade allow exactly one window, from the start of the maintenance-on
  step to the end of the maintenance-off step (read from the run journal), and still fail on any
  non-200 or gap outside it, or on a window that never closed. Not built: a maintenance_windows row
  (migration 0120) for the window, so the api's own /api/status/maintenance does not announce it.

  Added checks. Q35 to Q37 and their production twins C23 to C25 (SV.8) are the template's: the
  archive routes, the SDK quickstart and the SDK tests, from a sparse clone of the release commit,
  on the control machine. Q38 to Q48 and C26 to C36 are this release's version checks (SV.7).
  Q38 to Q42, Q47 and Q48 read the target (Q47, rate-limit, spends this client's rate-limit minute, so
  it runs last of the analytics checks; Q48, referral-lookup, has its own limiter). Q43 to Q46 are the SDK 0.2.0 checks, run on the control machine from the release
  commit; the reference portfolio, prices, holdings and golden are in
  scripts/release/version-checks/v0.7.0/reference/. Every check is read-only against the
  target, so none is stageOnly and each has a production twin. Q36, Q39 and Q42 need a published run;
  on a target with none they fail and name it.
breaking:
  - 0127_rm_worker_retired.sql
recovery: |
  0126 is compat: additive. 0127 is compat: breaking and takes every privilege from rm_worker.
  - Before C05c-migrate-breaking (the preflight, or C01-backup to C04-probe-start): nothing has changed; fix on a
    new QA branch and cut v0.7.0-rc.(N+1).
  - After C05c-migrate-breaking (0127 applied): code before this release never connects as rm_worker, but a pipeline worker built before
    it does. Rolling back to v0.6.4 means restoring the C01-backup dump with the write loss it implies, or
    regranting rm_worker through a new migration. Fix forward on v0.7.1 otherwise.
  - v0.7.0 is tagged at C06-version-tag either way (D70).
