# scripts/release/runbooks/releases/v0.7.1.yaml — the v0.7.1 release runbook
# (D70, owner 2026-10-16). A full copy of the kitchen-sink template's steps: Q for stage, P and C
# for production, each production step with a stage twin. A release only ADDS:
# every template step stays, unchanged and in order, and each step this
# release adds carries `added: v0.7.1` (scripts/release/runbook.ts checks it).
# Q34a-analytics-load (since: v0.7.1) and the SDK checks Q35 to Q37 and C23 to C25 (since: v0.7.0)
# are template steps, so they carry no added.
# The policy is docs/technical/release-runbooks.md.
release: v0.7.1
template: kitchen-sink
notes: |
  Identity. From v0.7.0 (instance rm_prod, tag v0.7.0 at 8c2690ba, the squash of
  qa/0.7.x-2026-10-27 on releases-0.7.x) to v0.7.1 at the commit the rc tag names, in a new
  checkout. The target files' `release` reads v0.7.1 and prod's `checkout` names the new folder
  (/root/rm-071) before the run. Tracking: the v0.7.1 release issue (1538).
  The QA branch is qa/0.7.x-2026-10-31, cut from releases-0.7.x at 8bd40941 (main merged into
  releases-0.7.x three times: 500b7345, 06c64a42, then 8bd40941 at main 10a244b3). It carries the
  runbook, the stage-up Bun fix and the analytics 5 s budget fix forward from qa/0.7.x-2026-10-29,
  whose stage run never passed.

  Scope is regenerated at the QA commit. The `scope:` below is `git log v0.7.0..8bd40941` (22 PRs,
  every commit subject that names one). Q05-scope refuses the QA commit if the range then carries
  a PR the list lacks.

  Migrations (D75):
  - 0128_asset_prices_overwrite_events: compat additive (PR 1533, review finding API-6). The
    analytics_overwrite_events table_name check admits 'asset_prices', rm_capture_analytics_overwrite()
    keys an asset_prices row, and two triggers (asset_prices_capture_overwrite AFTER UPDATE,
    asset_prices_capture_delete AFTER DELETE, both ENABLE ALWAYS) record each overwrite. v0.7.0's
    upsert keeps its meaning between C05-migrate and C10-rolling-boot; the capture runs through the
    owner's SECURITY DEFINER function. Nothing is removed, reshaped or revoked.
  - 0129_allocation_framework_hard_assets: compat additive (PR 1547, issue 1496). One UPDATE of the
    allocation_framework row id = 1: buckets become 50 / 7 / 29 / 14 with hard_assets (gold) in the
    place of agent_tokens, and asof moves to the first day no session holds yet, so a session open
    at the migrate keeps the agent_tokens list. No schema change. v0.7.0 reads the row the same way
    between C05-migrate and C10-rolling-boot (its dashboard keys an unknown bucket by slug, and its
    take schema keeps its own canonical bucket list). One window to know: a session v0.7.0's
    scheduler opens between C05-migrate and C10-rolling-boot on a day at or after the new asof gets
    a brief whose allocation is the new framework and whose take schema is still v0.7.0's. Start
    the cutover with no session about to open (the D71 advice), and the window holds none.
  No migration is compat: breaking, so this runbook declares no `breaking:`: the runner runs
  Q18-migrate/C05-migrate and the rolling boot, and records the breakingOnly steps skipped.

  Release order: the api before analytics-producer (PR 1533). The new producer's regime run reads
  GET /api/analytics/committed-inputs, which an api before 1533 answers 404, so a new producer on an
  old api fails its regime run. The rolling boot (Q22-rolling-boot/C10-rolling-boot,
  bun smoke --static-port) guarantees the order. It replaces api, worker-analytics and
  system-scheduler one at a time in ROLLING_ORDER (scripts/stack/stack.ts:226), each
  `up -d --no-deps --wait` healthy before the next, and stops at the first that fails.
  analytics-producer is the boot's one deferred service (scripts/lib/smoke-main.ts:1662): the old
  producer is stopped before the seed one-shot, and the new one starts only after it, so after the
  new api is healthy (scripts/tests/unit/stack-rolling.test.ts pins the order). No step is added
  for it. The other mix, an old producer on the new api, is safe: it never
  calls the route and sends no regimeVersionIds, which the api treats as before (issue 1534). A
  website-only or partial boot that replaced analytics-producer alone would break this; no step of
  this runbook does that.

  Owner waiver carried from PR 1524 (issue 1514): the stage load check at production volume was
  moved to this rehearsal, and the production go is withheld until it passes. Q34a-analytics-load
  (template, since v0.7.1, stage only, no production twin) proves it: it waits for the next
  scheduled analytics run on the stage target, which runs production's dump with production's
  connection budget (Q03-stage-up reads max_connections and the reservations from production's
  /health), and fails on any api request of 5 s or more or any db_saturated answer. A stage run
  whose Q34a did not pass is not a pass, and gives no go.

  Added checks. Q34b-archive-records/C22a-archive-records and Q38 to Q40/C26 to C28 are this
  release's version checks (SV.7), all read-only against the target, so each has a production twin:
  - Q34b-archive-records (1524 archive records, issue 1508; 1526, D80) runs after Q34a and before
    Q35-archive-routes, so the database has just carried an analytics run, and the records Q35
    and C23 read are built before they ask. v0.7.0's C23 failed on production (every record 503,
    issue 1508) after stage's Q35 passed on an idle database.
  - Q38-committed-inputs (1533, 1536): the route answers 401 to a request with no credential (an
    api without it answers 404), and the newest regime vintage carries this release's commit. On
    production C26 waits up to 200 minutes for a regime run (every 3 h at :30 UTC); on stage Q34a
    has already waited one out.
  - Q39-migration-ledger (0128): nothing pending, the ledger ends at 0128, the two triggers and the
    validated check are in place.
  - Q39-migration-ledger also proves 0129 (1547): the allocation_framework row is the 50/7/29/14
    Hard Assets framework. The dashboard route serves the seed (the same framework) when its read
    fails, so only the row proves the migration reached the database.
  - Q40-research-series (1524 collection floor and new series): every research-series inventory key
    is in source_value_versions from 2016-01-01 or its inception. It runs after Q38, which has seen
    a regime run of this release, and the regime run is the one that collects them.
  - Q41-public-surface (1546, 1549): the CSP on / names the Google Apps Script and Turnstile
    sources (the rolling boot reloads nginx.conf into the running website-server, it never rebuilds
    it, so the header proves the reload), and GET /api/swarm/participants/health with no credential
    answers 401 (v0.7.0 answers 404).
  The 1524 batch pool is Q34a's (above). The SDK PRs (1499, 1510, 1525) are Q37-sdk-tests' (the SDK
  package tests at the release commit). Q36-sdk-quickstart replays the newest archived run: this
  release carries D78, so a run this release makes replays its whole row byte for byte, but the
  archive seals a UTC day at a time, so at the stage and cutover soaks the newest archived run is
  still a v0.7.0 run (no D78: its numbers differ in the last bits, the 2026-10-29 local archive
  replay recorded on issue 1513), and Q36/C24 assert only its labels. The full-row replay of a
  v0.7.1 run is the post-seal report, run on its own and not a cutover step:
  `bun scripts/release/sdk-check.ts --check post-seal --target stage|prod`.

  Known gaps, carried and not fixed here:
  - Host tools (issue 1528). No step checks a host's Bun before Q08-install/P03-install. The
    lockfile is lockfileVersion 2, which needs Bun 1.4; the images build on oven/bun:1.4.4.
    rm-frontend-stage-2 runs Bun 1.4.4 for stage-server (read 2026-10-29); rm-frontend-prod-1 runs
    Bun 1.4.4 for root since 2026-10-28. Confirm both before the stage run and the preflight.
    The cutover command also needs `--stage-journal <passed stage run dir>` (issue 1528 part 2).
  - The junction check (backend/src/analytics/store/public-archive-store.ts
    loadRowsFollowJunction, lines 716-729). PR 1526 added it (PR 1524 did not touch it, and PR 1533
    does not change the file): the first archive request after an api restart that lists the
    backups runs one 4 s bounded read over every served table's rows past the D80 junction
    (2026-10-28T180400Z), and memoizes the answer only when it succeeds. If that read runs past its
    bound the request fails and the next one runs it again. Q34b times that first listing on its
    own and fails on anything but a 200 under 5 s, and it builds the records before Q35/C23 ask, so
    the SDK steps get the warm path. It is not fixed in this release.
  - Millisecond cutoff rounding (issue 1534 notes). postgres.js binds a timestamptz parameter
    through a JS Date, so loadHistoricalSourceValues(cutoff) and the analytics_data_vintages
    knowledge_time_cutoff insert use the committed read's cutoff truncated to the millisecond: a
    non-regime row inserted in the last millisecond before the read is left out of the vintage, and
    the stored cutoff can be up to 1 ms before the read's clock. The regime members are exact
    (1536 binds the cutoff as text). No issue filed; no check here depends on it.
  - packages/csvb/bun.lock (PR 1526) is not in scripts/release/lockfile.ts LOCKFILE_DIRS, so
    Q01-lockfile does not check it. csvb is an operator tool on the csv-backups host and no step
    installs it on a target.
recovery: |
  0128 and 0129 are compat: additive and take no grant from a runtime role. No migration is breaking.
  - Before C05-migrate (the preflight, or C01-backup to C04-probe-start): nothing has changed; fix on a new QA branch
    and cut v0.7.1-rc.(N+1).
  - A failed C05-migrate: resume at C05-migrate; v0.7.0 keeps serving, and the website stays up.
  - After C05-migrate: v0.7.0 runs correctly on the 0128 schema (its asset_prices upsert also records
    each overwrite) and on 0129's framework row (it reads the row as before). Fix forward on v0.7.2, or restore the C01-backup dump with the write loss it implies.
    v0.7.1 is tagged at C06-version-tag either way (D70).
  - A rolling boot that stops after the api and before the new analytics-producer starts leaves the old producer,
    or none once the seed step stopped it, beside the new api; both are safe (an old producer never calls committed-inputs). Resume at C10-rolling-boot.
