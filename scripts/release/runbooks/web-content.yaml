# scripts/release/runbooks/web-content.yaml — the web content release runbook (D81,
# docs/technical/release-runbooks.md §12). `bun run release:web --commit <main sha>...`
# runs it (loader and steps in ./../web-release-lib.ts).
#
# It is not a platform runbook: no Q/P/C phases and no go file. It reads the
# platform target files (prod.json for where the site is served, stage.json for
# its QA) and sits outside templates/ and releases/, so scripts/release/runbook.ts
# never reads it and the kitchen-sink step-list hash is unchanged.
#
# Stage QA before production (owner, 2026-11-11, D81 amendment): W04 to W06 bring
# the kitchen-sink stage target up at production's running commit from a fresh
# production dump (as Q02-dump and Q03-stage-up do) and deploy production's
# serving bundle there by name, then deploy this release's bundle with smoke:web
# exactly as W10 will on production, and check it there. The pass is recorded for
# the bundle's sha256 digest: no step from W07-tag on writes without it, and W10
# refuses a bundle with any other digest (issue 1630,
# docs/technical/web-serving-architecture.md §5.1).
#
# Each step names a `kind`. The twelve kinds run once each, in this order.
# `irreversible` marks a step that writes to GitHub or switches what production
# serves. The loader refuses an unknown key or kind, a duplicate id, and a kind
# missing, repeated or out of order.
runbook: web-content
steps:
  - id: "W01-preflight"
    kind: "preflight"
    description: "Each --commit is on origin/main and touches web content; every path it touches outside WEB_CONTENT_PATHS is a scripts/tests/ path (carried), a doc or a comment-only JS/TS edit (left out), and each is listed; production's API commit is read from {publicOrigin}/api/version; the WEB_CONTENT_PATHS and test part of each commit is cherry-picked onto web/releases-A.B.x (or the eligibility base) in a scratch worktree; the version in frontend/package.json there is A.B.C and above every web-v* tag; the release tree's own web-client.yml, e2e-web.yml and web-tag-guard.yml can trigger W03 and W08; the release tree differs from the eligibility base (the last web-v* tag when it descends from the API commit, else the API commit) and from the API commit only inside WEB_CONTENT_PATHS and scripts/tests/; a tag the control machine's image journal shows rolled back is refused; production's running website-server (its labels: web tag, commit and bundle digest) and its previous image are read and reported, and W01 refuses when no website-server runs (no rollback target: the swap keeps the serving image, nginx on a host's first rollout, as the previous image); the operator is a repository admin"
    irreversible: false
  - id: "W02-branch"
    kind: "branch"
    description: "Push the cherry-picked commit to web/releases-A.B.x: create it at the eligibility base (production's API commit, or the last web tag on it), or fast-forward it; never force-push, no pull request"
    irreversible: true
  - id: "W03-gate"
    kind: "gate"
    description: "The web-client.yml push run (job web-client) and an e2e-web.yml run the runner dispatches once (workflow_dispatch; job e2e-web, a live stack built from the release tree, whose backend is production's API commit) on the release branch at the commit concluded success; then, on the control machine, the release commit's tree in a scratch worktree, bun install --frozen-lockfile, scripts/static-assembly.sh, and scripts/lib/web-bundle.ts pack and sign with the control machine's bundle key: robotmoney-web-A.B.C-<commit>.tar.gz, its .sha256 digest and its .sha256.sig signature"
    irreversible: false
    maxMinutes: 90
  - id: "W04-stage-up"
    kind: "stage-up"
    description: "The stage target (scripts/release/stage-target.ts, docs/runbooks/stage-target.md) brought up at production's running commit from a fresh production dump, as the kitchen sink's Q02-dump and Q03-stage-up do: stage-target.ts dump, then up --dump newest --replace; then production's serving bundle deployed there by name (bun run smoke:web --host <stage host> --instance stage_target --bundle web-vX.Y.Z --server-image robotmoney-website-server:stage_target --origin <stage origin>), so stage holds a previous image before W05 as production does at W10; while production serves no signed bundle (its first rollout) stage keeps its running image as the rollback target. Done when a stage pass is recorded for this bundle, or the stage origin's /api/version reports production's API commit and stage serves production's bundle"
    irreversible: false
  - id: "W05-stage-deploy"
    kind: "stage-deploy"
    description: "Record the stage api and worker containers and /api/version; then, from the control machine, bun run smoke:web --host <stage host> --instance stage_target --bundle <W03's bundle> --server-image robotmoney-website-server:stage_target --origin <stage origin>, exactly as W10 runs it on production: nothing is cloned, installed or built on the stage host"
    irreversible: false
  - id: "W06-stage-check"
    kind: "stage-check"
    description: "W11's live check against the stage origin; on a pass the runner records the stage pass for the bundle's sha256 digest and tears the stage target down (stage-target.ts down); on a failure stage is left up for inspection and the run stops. W07 onward refuse to write without a pass for this digest"
    irreversible: false
  - id: "W07-tag"
    kind: "tag"
    description: "checkWebTag passes, then the annotated tag web-vA.B.C on the commit is created and pushed; it is never moved or deleted"
    irreversible: true
  - id: "W08-tag-guard"
    kind: "tag-guard"
    description: "The web-tag-guard run for the tag concluded success at the commit"
    irreversible: false
    maxMinutes: 20
  - id: "W09-host-ready"
    kind: "host-ready"
    description: "Over ssh, read only: the production host holds the server image robotmoney-website-server:{instance}, an allowed-signers file inside it with a robotmoney-web-bundle@v1 line, and a rollback target (a running website-server, whose image the swap keeps as the previous image; nginx on a host's first rollout). It installs nothing, builds nothing and runs no git or bun there; a host that is not ready fails the step"
    irreversible: false
  - id: "W10-deploy"
    kind: "deploy"
    description: "Refuse a bundle whose sha256 is not the stage-passed digest; record the api and worker container ids and /api/version; then, from the control machine, bun run smoke:web --host {host} --instance {instance} --bundle <W03's bundle> --server-image robotmoney-website-server:{instance} --origin {publicOrigin}: no database write, no migration, no backend restart"
    irreversible: true
  - id: "W11-live-check"
    kind: "live-check"
    description: "{publicOrigin}/version.json names the tag's version and commit; the running website-server's labels name the bundle's tag, commit and digest; every file in the bundle's manifest is served from {publicOrigin} with its manifest sha256; the platform's header table (security headers and Cache-Control) holds on / and every sitemap route, each answering 200; and the api and worker container ids and /api/version are unchanged; otherwise bun run smoke:web --host {host} --instance {instance} --rollback --origin {publicOrigin}, read {publicOrigin}/version.json again to report what production serves, and fail"
    irreversible: false
  - id: "W12-release"
    kind: "release"
    description: "The GitHub release for the tag, carrying the bundle, its .sha256 digest and its .sha256.sig signature, listing the main commits, the changed paths and each commit's paths outside WEB_CONTENT_PATHS, carried or left out; never marked latest"
    irreversible: true
