<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Not Found</title>
</head>
<body>
  <script>
    // If the iframe navigated here (e.g., via a direct URL or frame escape),
    // redirect back to the wrapper (served at /) with the attempted path as a hash.
    const path = window.location.pathname;
    window.location.href = `/#${path}`;
  </script>
</body>
</html>
