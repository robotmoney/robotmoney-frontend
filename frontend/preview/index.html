<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      background: #f5f5f5;
    }
    #watermark {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to right, #ff6b6b, #ff8787);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 999999;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    #watermark.live {
      background: linear-gradient(to right, #2f6fed, #4f8bff);
    }
    #frame {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100vh - 40px);
      border: none;
    }
  </style>
</head>
<body>
  <div id="watermark">PREVIEW</div>
  <iframe id="frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-presentation"></iframe>

  <script>
    // The wrapper runs the production SPA inside an iframe and decides, per
    // request, who answers GET /api/*:
    //
    //   ?api=fixtures   (default) committed goldens, loaded into memory here.
    //   ?api=prod       the production api.
    //   ?api=stage      the stage api.
    //   ?api=<origin>   any http(s) origin — a developer's own stack.
    //
    // Live modes forward READS only: non-GET /api/* calls are answered with the
    // same {ok:true, mocked:true} no-op as fixtures mode, so a preview can
    // never write to a live api. The SPA is untouched either way — it keeps
    // calling same-origin /api/* (config.js's API_BASE_URL: "") and this
    // interceptor rewrites the origin.
    (async () => {
      const LIVE_ORIGINS = {
        prod: "https://robotmoney.network",
        stage: "https://stage.robotmoney-labs.dev",
      };
      const requested = new URLSearchParams(location.search).get("api") || "fixtures";
      let liveOrigin = null;
      let modeNote = "";
      if (requested !== "fixtures") {
        const candidate = LIVE_ORIGINS[requested] ?? requested;
        try {
          const u = new URL(candidate);
          if (!/^https?:$/.test(u.protocol)) throw new Error("not http(s)");
          liveOrigin = u.origin;
        } catch (e) {
          modeNote = ` — unknown api "${requested}", using fixtures`;
        }
      }
      document.documentElement.dataset.previewApi = liveOrigin ?? "fixtures";

      const watermark = document.getElementById("watermark");
      const [goldens, version] = await Promise.all([
        liveOrigin
          ? Promise.resolve({ routes: {} })
          : fetch("/goldens/api-goldens.json")
              .then((r) => (r.ok ? r.json() : { routes: {} }))
              .catch((e) => {
                console.warn("Failed to load goldens:", e);
                return { routes: {} };
              }),
        fetch("/version.json")
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null),
      ]);
      const versionLabel = version ? ` ${version.name}@${version.version}` : "";
      if (liveOrigin) {
        watermark.classList.add("live");
        watermark.textContent = `PREVIEW${versionLabel} — live API: ${liveOrigin} (reads only)`;
      } else {
        watermark.textContent = `PREVIEW${versionLabel} — snapshot data (not current)${modeNote}`;
      }

      const frame = document.getElementById("frame");
      const frameWin = frame.contentWindow;

      // Patch fetch BEFORE document.open()/write() so the interceptor is in place
      // when the fetched HTML is parsed and run.
      const originalFetch = frameWin.fetch;
      frameWin.fetch = function (resource, init) {
        const url = new URL(typeof resource === "string" ? resource : resource.url, frameWin.location.href);
        const path = url.pathname + url.search;

        if (url.origin === frameWin.location.origin && path.startsWith("/api/")) {
          if (!init || !init.method || init.method === "GET") {
            if (liveOrigin) {
              // Reads go to the live api. No credentials: the public read
              // surface answers cross-origin with `*`, and a preview must never
              // carry a session anywhere.
              return originalFetch.call(frameWin, liveOrigin + path, { ...init, credentials: "omit" });
            }
            // Match by pathname, ignoring query string (goldens are point-in-time snapshots)
            const routePath = url.pathname;
            if (routePath in goldens.routes) {
              return Promise.resolve(
                new Response(JSON.stringify(goldens.routes[routePath]), {
                  status: 200,
                  headers: { "content-type": "application/json" },
                })
              );
            }
            // No golden for this route: 404
            return Promise.resolve(
              new Response(JSON.stringify({ error: "no golden for route", path: routePath }), {
                status: 404,
                headers: { "content-type": "application/json" },
              })
            );
          }
          // Non-GET requests: no-op success, in every mode
          return Promise.resolve(
            new Response(JSON.stringify({ ok: true, mocked: true }), {
              status: 200,
              headers: { "content-type": "application/json" },
            })
          );
        }

        // Other requests pass through to the real server
        return originalFetch.call(frameWin, resource, init);
      };

      // Mirror the iframe's navigation into the parent hash (deep-link mirroring)
      const mirror = (url) => {
        if (!url) return;
        const href = new URL(url, frameWin.location.href).href;
        const iframeOrigin = frameWin.location.origin;
        if (href.startsWith(iframeOrigin)) {
          window.parent.location.hash = href.slice(iframeOrigin.length);
        }
      };
      const originalPushState = frameWin.history.pushState;
      frameWin.history.pushState = function (state, title, url) {
        originalPushState.call(this, state, title, url);
        mirror(url);
      };
      const originalReplaceState = frameWin.history.replaceState;
      frameWin.history.replaceState = function (state, title, url) {
        originalReplaceState.call(this, state, title, url);
        mirror(url);
      };

      // Fetch the production SPA HTML
      let indexHtml = "";
      try {
        const response = await fetch("/index.html");
        indexHtml = await response.text();
      } catch (e) {
        console.error("Failed to fetch /index.html:", e);
        frameWin.document.write("<p>Failed to load preview. See console for details.</p>");
        return;
      }

      // Write the HTML into the iframe, using document.open()/write()/close()
      // which reuses the Window object (Window spec guarantees the patched fetch
      // and history survive this transition).
      frameWin.document.open();
      frameWin.document.write(indexHtml);
      frameWin.document.close();

      // Replay a deep link (#/allocation) into the iframe BEFORE the SPA's
      // module script boots, so its router's first render reads the route.
      if (window.location.hash) {
        const hash = window.location.hash.slice(1);
        frameWin.history.replaceState({}, "", hash || "/");
      }

      // A later hash change in the parent is a navigation: push it and tell
      // the router (which listens for popstate, not for pushState) to render.
      window.addEventListener("hashchange", () => {
        const hash = window.location.hash.slice(1);
        frameWin.history.pushState({}, "", hash || "/");
        frameWin.dispatchEvent(new frameWin.PopStateEvent("popstate"));
      });
    })();
  </script>
</body>
</html>
