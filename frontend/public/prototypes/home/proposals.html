<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Robot Money home: three directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #050608; color: #f3f1ec; font: 400 14px/1.4 "Geist", ui-sans-serif, -apple-system, sans-serif; }
  .bar { position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 1.5rem;
    padding: 0 1rem; background: #0b0c0f; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .bar__t { font: 500 11px "Geist Mono", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #8a877f; white-space: nowrap; }
  .tabs { display: flex; gap: 0.25rem; height: 100%; }
  .tab { position: relative; display: flex; align-items: center; height: 100%; padding: 0 1rem; border: 0; background: none; cursor: pointer;
    font: 500 14px "Geist", ui-sans-serif, sans-serif; color: #9c9991; }
  .tab:hover { color: #f3f1ec; }
  .tab[aria-selected="true"] { color: #f3f1ec; }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 1rem; right: 1rem; bottom: -1px; height: 2px; background: #f3f1ec; }
  .tab:focus-visible { outline: 2px solid #f3f1ec; outline-offset: -4px; }
  .bar__line { margin-left: auto; color: #8a877f; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frames { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #050608; }
  iframe[hidden] { display: none; }
  @media (max-width: 720px) { .bar__t, .bar__line { display: none; } .tab { padding: 0 0.75rem; } }
</style>
</head>
<body>
<header class="bar">
  <span class="bar__t">Robot Money · home · three directions</span>
  <nav class="tabs" role="tablist" aria-label="Directions">
    <button class="tab" role="tab" id="tab-prism" aria-controls="panel-prism" aria-selected="true" data-slug="prism">Prism</button>
    <button class="tab" role="tab" id="tab-murmuration" aria-controls="panel-murmuration" aria-selected="false" data-slug="murmuration">Murmuration</button>
    <button class="tab" role="tab" id="tab-monument" aria-controls="panel-monument" aria-selected="false" data-slug="monument">Monument</button>
  </nav>
  <span class="bar__line" id="line"></span>
</header>
<main class="frames">
  <iframe id="panel-prism" role="tabpanel" aria-labelledby="tab-prism" title="Prism" hidden></iframe>
  <iframe id="panel-murmuration" role="tabpanel" aria-labelledby="tab-murmuration" title="Murmuration" hidden></iframe>
  <iframe id="panel-monument" role="tabpanel" aria-labelledby="tab-monument" title="Monument" hidden></iframe>
</main>
<script src="./proposals.js"></script>
</body>
</html>
