<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 548" fill="#ffffff">
  <!-- EXPLICIT #ffffff, not currentColor. brand-assets/mark.svg is the same
       geometry with fill="currentColor" because it is used INLINE, where it
       inherits the host's colour. This copy is loaded through an <img> by
       memberAvatarMarkup(), and an SVG in an <img> has no parent to inherit
       from: currentColor falls back to the initial `color`, i.e. black, which
       on the dark avatar surface is a black disc on a near-black square.
       Matches /assets/logo.svg, which is white for the same reason.
       (No double hyphens in this comment: XML forbids them, and a malformed
       SVG here fails silently into the derived-mark fallback.)

       Robot Money mark, geometric reconstruction 2026-07-15.
       Source of truth: the handmade lockup (see lockup.svg). This file replaces
       the potrace autotrace with exact primitives: circle r=273.29 centered
       (273.58, 274.3); wedge vertices on-rim at -37.61deg and 90.07deg, inner
       vertex (168.2, 331.9). Verified by overlay against the trace. -->
  <path d="M490.08 107.52 A273.29 273.29 0 1 0 273.26 547.59 L168.2 331.9 Z M490.08 107.52 L273.26 547.59 A273.29 273.29 0 0 0 490.08 107.52 Z"/>
</svg>
