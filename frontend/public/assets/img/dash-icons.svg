<!-- Analytics dashboard icon sprite — issue #379, docs/bot-analytics-ui-port-plan.md
     §3. One <symbol> per lucide-react glyph the ported UI actually imports
     (the plan's glyph list), so a fragment references `#i-<name>` via <use>
     instead of carrying its own inline path data. Simplified stroke-based
     redraws in lucide's own visual language (24x24 viewBox, currentColor
     stroke, round caps/joins, stroke-width 2) — not byte-identical exports
     from the lucide-react package, since no build step vendors that package
     here; downstream view issues that need pixel-exact glyphs can swap an
     individual symbol's path without touching the <use> call sites. -->
