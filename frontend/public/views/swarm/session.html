<!-- Swarm session detail, as a research record (RM-121): a breadcrumb, the
     head, one hairline row of facts, then numbered sections. What the session
     recommended, the reasoning and where members disagreed, each take, and the
     evidence behind the record. The subject page opens the same way, so a
     session and the subject it reviews read as one document.
     Sections render only when the session carries what they draw; the
     numbering is a CSS counter, so a missing section leaves no gap. -->
<section class="cv cv--detail" x-data="swarmSessionDetail()" @hashchange.window="revealHashTake()" @click="researchAnchor($event)">
  <div class="sv__body sv__body--narrow rr pr">
    <p class="sv__loading" x-show="loading">Loading session…</p>
    <template x-if="error && !loading">
      <div class="rr-head">
        <p class="sv__error" x-text="error"></p>
        <p class="rr-links"><button type="button" class="rr-btn" @click="retry()">Try again</button><a class="rr-lnk" href="/swarm">All sessions</a></p>
      </div>
    </template>

    <template x-if="!loading && session">
      <div>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <a :href="subjectHref()" x-text="session.subjectName || session.subjectId"></a><span aria-hidden="true">/</span>
          <span aria-current="page" x-text="formatDate(session.date, 'short')"></span>
        </nav>

        <header class="rr-head">
          <p class="sv__eyebrow sv__eyebrow--quiet" x-text="`${subjectKindOf(subject)} · session`">portfolio · session</p>
          <h1 class="sv__detail-title session-title" x-text="session.subjectName"></h1>
          <p class="rr-when">
            <time :datetime="session.date" x-text="formatDate(session.date, 'long')"></time>
            <template x-if="sessionTime()"><span class="rr-mono" x-text="sessionTime()"></span></template>
            <span :class="phaseClass(session)" x-text="phaseLabel(session)"></span>
          </p>
        </header>

        <div class="rr-meta">
          <span class="rr-meta__i">Takes <b x-text="takes.length"></b></span>
          <template x-if="disagreements().length">
            <span class="rr-meta__i">Disagreements <b x-text="disagreements().length"></b></span>
          </template>
          <template x-if="session.regimeSummary">
            <span class="rr-meta__i">Composite <b x-text="fmtNum(session.regimeSummary?.composite, 3)"></b></span>
          </template>
          <template x-if="session.regimeSummary?.regime">
            <span class="rr-meta__i">Regime
              <i :style="`background:${regimeColor(session.regimeSummary?.regime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.regime)"></b>
            </span>
          </template>
          <template x-if="isFramework()"><a class="rr-lnk" href="/allocation#vaults">Allocation &amp; vaults ↗</a></template>
          <a class="rr-meta__lnk" :href="sessionJsonHref()" target="_blank" rel="noopener">Session JSON ↗</a>
        </div>

        <nav class="rr-jump" aria-label="Session sections">
          <template x-for="j in jumpLinks()" :key="j.id">
            <a :href="`#${j.id}`"><i x-text="j.label"></i><template x-if="j.count != null"><span x-text="j.count"></span></template></a>
          </template>
        </nav>

        <template x-if="!isFramework()">
          <section class="pr-session-view" aria-label="Swarm view">
            <div class="pr-review"><div>
              <p class="rr-k"><span x-text="session.state === 'published' ? 'Swarm view' : 'Member views so far'"></span> <span x-html="researchTooltip('view', 'session-view-tip')"></span></p>
              <h2 class="pr-verdict"><template x-if="leanStance(reviewRow())"><i :style="leanDotStyle(reviewRow())" aria-hidden="true"></i></template><span x-text="researchView(reviewRow())"></span></h2>
              <p class="pr-vote-note" x-text="leadShare(reviewRow()) ? `${leadShare(reviewRow())} members share this stance` : 'No single stance leads'"></p>
              <div x-html="stanceTallyMarkup(reviewRow())"></div>
            </div><div class="pr-context">
              <p class="rr-k">Research on this portfolio</p>
              <p class="rr-note">Member views and proposed actions do not establish that the holdings changed.</p>
              <p class="rr-links"><a class="rr-lnk" href="#takes">Read member takes →</a></p>
            </div></div>
          </section>
        </template>

        <!-- 01 · THE RECOMMENDATION. The decision and its reason on the left,
             the mix on the right. The legend carries each sleeve's move, so the
             full ledger and the sleeve contents wait behind disclosures. -->
        <template x-if="hasRecommendationSection()">
          <section class="rr-sec" id="recommendation" aria-labelledby="rec-h">
            <div class="rr-sec__head"><h2 class="rr-sec__h" id="rec-h" x-text="isFramework() ? 'The recommendation' : 'Proposed actions'">Proposed actions</h2></div>
            <div class="rr-split" :class="isBucketWeights() ? '' : 'rr-split--one'">
              <div>
                <template x-if="outcomeHeadline()">
                  <h3 class="rr-h3" x-text="outcomeHeadline()"></h3>
                </template>
                <template x-if="recommendationRationale()">
                  <div x-data="{ more: false }">
                    <div class="rr-prose" :class="!more && isLong(recommendationRationale(), 520) ? 'is-clamped' : ''" style="--rr-lines:9">
                      <p x-html="inlineMarks(recommendationRationale())"></p>
                    </div>
                    <template x-if="isLong(recommendationRationale(), 520)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                        <span x-text="more ? 'Show less' : 'Read full rationale'"></span><small x-text="`${wordCount(recommendationRationale())} words`"></small>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="authoredActions().length">
                  <dl class="sr__acts">
                    <template x-for="a in authoredActions()" :key="`${a.token}-${a.action}`">
                      <div class="sr__act">
                        <dt x-text="a.token"></dt>
                        <dd><b x-text="a.action"></b><span x-text="a.rationale || ''"></span></dd>
                      </div>
                    </template>
                  </dl>
                </template>
              </div>

              <template x-if="isBucketWeights()">
                <div>
                  <div class="rr-mix">
                    <template x-if="weightDonutSvg(reviewRow())">
                      <figure class="rr-ring">
                        <span class="sv__wdonut-host" role="img" :aria-label="`Recommended weights: ${sessionWeightsLabel(reviewRow())}`"
                              x-html="weightDonutSvg(reviewRow())"></span>
                        <figcaption>Recommended</figcaption>
                      </figure>
                    </template>
                    <ul class="rr-legend">
                      <template x-for="b in bucketRows()" :key="b.id || b.name">
                        <li :class="b.recommended ? '' : 'is-zero'">
                          <i data-mark="series" :style="`background:${b.hue}`" aria-hidden="true"></i>
                          <span x-text="b.name"></span>
                          <b x-text="fmtWeight(b.recommended)"></b>
                          <template x-if="gapBasis() && !targetPostdatesSession()">
                            <small>
                              <span class="alp__mv" :class="changeClass(b.gap)"><i x-text="changeGlyph(b.gap)" aria-hidden="true"></i><span x-text="changeLabel(b.gap)"></span></span>
                              <span x-text="` vs ${gapBasis() === 'actual' ? 'book' : 'target'} ${fmtWeight(gapBasis() === 'actual' ? b.actual : b.target)}`"></span>
                            </small>
                          </template>
                        </li>
                      </template>
                    </ul>
                  </div>
                  <template x-if="outcomeCaption()">
                    <p class="rr-note" data-target-asof x-text="outcomeCaption()"></p>
                  </template>
                  <div style="margin-top:1.5rem">
                    <template x-if="gapBasis()">
                      <div class="rr-disc" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                        <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="rec-ledger" @click="open = !open">
                          Full comparison <small x-text="outcomeColumnsLabel()"></small>
                        </button>
                        <div class="rr-disc__anim" id="rec-ledger" role="region" aria-label="Full comparison" :inert="!open">
                          <div class="rr-disc__clip"><div class="rr-disc__body">
                            <div class="alp__tblwrap sr__ledger">
                              <table class="alp__tbl alp__tbl--led">
                                <thead>
                                  <tr>
                                    <th>Sleeve</th>
                                    <template x-if="hasTargetColumn()"><th>Target</th></template>
                                    <template x-if="hasActualColumn()"><th>Actual</th></template>
                                    <th>Recommended</th>
                                    <th>Change</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  <template x-for="b in bucketRows()" :key="b.id || b.name">
                                    <tr>
                                      <td><i class="alp__dot" data-mark="series" :style="`background:${b.hue}`"></i><span x-text="b.name"></span></td>
                                      <template x-if="hasTargetColumn()"><td class="q" x-text="fmtWeight(b.target)"></td></template>
                                      <template x-if="hasActualColumn()"><td class="q" x-text="fmtWeight(b.actual)"></td></template>
                                      <td x-text="fmtWeight(b.recommended)"></td>
                                      <td><span class="alp__mv" :class="changeClass(b.gap)"><i x-text="changeGlyph(b.gap)" aria-hidden="true"></i><span x-text="changeLabel(b.gap)"></span></span></td>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </div>
                          </div></div>
                        </div>
                      </div>
                    </template>
                    <template x-if="withinBucketWeights().length">
                      <div class="rr-disc" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                        <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="rec-within" @click="open = !open">
                          Inside each sleeve <small>Assets within each sleeve</small>
                        </button>
                        <div class="rr-disc__anim" id="rec-within" role="region" aria-label="Inside each sleeve" :inert="!open">
                          <div class="rr-disc__clip"><div class="rr-disc__body">
                            <div class="alp__cards">
                              <template x-for="b in withinBucketWeights()" :key="b.bucket">
                                <div class="alp__card">
                                  <div class="alp__card-top">
                                    <span class="alp__card-name"><i :style="`background:${b.hue}`"></i><b x-text="b.label"></b></span>
                                    <template x-if="b.weight != null">
                                      <span class="alp__card-w"><b x-text="fmtPctTrim(b.weight)"></b><small>recommended</small></span>
                                    </template>
                                  </div>
                                  <div class="alp__card-body">
                                    <div class="alp__stk" :class="b.weight === 0 ? 'zero' : ''">
                                      <template x-for="c in b.items" :key="`${b.bucket}-${c.name}`">
                                        <span data-mark="series" role="img" :aria-label="`${c.label}, ${fmtPctTrim(c.weight * 100)} of ${b.label}`"
                                              :style="`width:${Math.max(0, Math.min(100, c.weight * 100))}%;background:${c.colour}`"></span>
                                      </template>
                                    </div>
                                    <div class="alp__names">
                                      <template x-for="c in b.items" :key="`${b.bucket}-${c.name}-n`">
                                        <span><i data-mark="series" :style="`background:${c.colour}`"></i><span x-text="c.label"></span><b x-text="fmtPctTrim(c.weight * 100)"></b></span>
                                      </template>
                                    </div>
                                  </div>
                                </div>
                              </template>
                            </div>
                          </div></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </section>
        </template>

        <!-- The book this session reviewed. A framework subject has none. -->
        <template x-if="snapshot">
          <section class="rr-sec" id="holdings" aria-labelledby="hold-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="hold-h">Holdings at review</h2>
              <span class="rr-sec__aside" x-text="`${fmtUsd(snapshot?.totalValueUsd)} · ${snapshot?.date}`"></span>
            </div>
            <div x-data="{ all: false }">
              <div x-html="holdingsMarkup(snapshot, all)"></div>
              <template x-if="portfolioRows(snapshot).length > 8"><button type="button" class="rr-more" @click="all = !all" :aria-expanded="all" x-text="all ? 'Show top 8 positions' : `Show all ${portfolioRows(snapshot).length} positions`"></button></template>
            </div>
            <template x-if="notableItems().length">
              <div class="rr-block" style="margin-top:1.5rem">
                <p class="rr-k">Notable</p>
                <ul class="rr-list" style="margin-top:0.75rem">
                  <template x-for="n in notableItems()" :key="n"><li x-text="n"></li></template>
                </ul>
              </div>
            </template>
          </section>
        </template>

        <!-- 02 · REASONING & DISAGREEMENT. What was written, beside the market
             reading the session was given. -->
        <template x-if="hasDiscussion() || signalRows().length">
          <section class="rr-sec" id="reasoning" aria-labelledby="why-h">
            <div class="rr-sec__head"><h2 class="rr-sec__h" id="why-h">Reasoning &amp; disagreement</h2></div>
            <div class="rr-split">
              <div>
                <template x-if="showSynthesis()">
                  <div class="rr-block" x-data="{ more: false }">
                    <h3 class="rr-h3">Session synthesis</h3>
                    <div class="rr-prose" :class="!more && isLong(session.synthesis, 700) ? 'is-clamped' : ''" style="--rr-lines:10"
                         x-html="linkified(session.synthesis)"></div>
                    <template x-if="isLong(session.synthesis, 700)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                        <span x-text="more ? 'Show less' : 'Read full synthesis'"></span><small x-text="`${wordCount(session.synthesis)} words`"></small>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="consensusItems().length">
                  <div class="rr-block">
                    <h3 class="rr-h3">Where members agree</h3>
                    <ul class="rr-list">
                      <template x-for="item in consensusItems()" :key="item"><li x-html="inlineMarks(item)"></li></template>
                    </ul>
                  </div>
                </template>
                <template x-if="!showSynthesis() && !consensusItems().length && !disagreements().length">
                  <p class="rr-note" style="margin-top:0">No written synthesis for this session. The takes below carry each member's reasoning.</p>
                </template>
              </div>
              <template x-if="signalRows().length">
                <div>
                  <div class="rr-panel">
                    <div class="rr-panel__head">
                      <p class="rr-k">Market context</p>
                      <span class="rr-k" x-text="formatDate(session.date, 'short')"></span>
                    </div>
                    <p class="sr__state">
                      <i :style="`background:${regimeColor(backdrop.regime)}`" aria-hidden="true"></i>
                      <b x-text="regimeLabel(backdrop.regime)"></b>
                      <template x-if="backdrop.compositePercentile !== null"><span x-text="`${ordinal(backdrop.compositePercentile)} percentile`"></span></template>
                    </p>
                    <div class="sig" role="img"
                         :aria-label="`Percentile against its own three-year history: ${signalRows().map((r) => `${r.label} ${ordinal(r.pct)}`).join(', ')}.`">
                      <div class="sig__scale" aria-hidden="true">
                        <span></span>
                        <span class="sig__ticks">
                          <template x-for="z in signalZones()" :key="z.key">
                            <em class="sig__zone" :style="`left:${z.left};width:${z.width}`" x-text="z.label"></em>
                          </template>
                          <b style="left:0">0</b><b style="left:50%">50th</b><b style="left:100%">100</b>
                        </span>
                        <span></span>
                      </div>
                      <template x-for="r in signalRows()" :key="r.key">
                        <div class="sig__row" :class="`is-${r.kind}`">
                          <span class="sig__l" x-text="r.label"></span>
                          <span class="sig__track">
                            <b class="sig__mid"></b>
                            <template x-for="c in signalCuts()" :key="c"><b class="sig__cut" :style="`left:${c}`"></b></template>
                            <i class="sig__dot" :style="`left:${r.at};` + (r.kind === 'context' ? '' : `background:${regimeColor(r.regime)}`)"></i>
                          </span>
                          <span class="sig__v" x-text="ordinal(r.pct)"></span>
                        </div>
                      </template>
                    </div>
                    <p class="sr__foot">Percentile of its own three-year history.<template x-if="!backdropV0"><span> Factor is context, not part of the composite.</span></template></p>
                  </div>
                </div>
              </template>
            </div>

            <template x-if="disagreements().length">
              <div class="rr-block" style="margin-top:2.25rem">
                <h3 class="rr-h3">Where views differ</h3>
                <template x-for="(d, i) in disagreements()" :key="d.topic">
                  <div class="rr-disc rr-q" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                    <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" @click="open = !open">
                      <span><span class="rr-k" x-text="`Question ${i + 1}`"></span><b x-text="d.topic"></b></span>
                      <small x-text="`${(d.positions || []).length} views`"></small>
                    </button>
                    <div class="rr-disc__anim" role="region" :aria-label="d.topic" :inert="!open">
                      <div class="rr-disc__clip"><div class="rr-disc__body">
                        <div class="rr-views">
                          <template x-for="p in (d.positions || [])" :key="`${d.topic}-${p.member_id}`">
                            <div class="rr-view">
                              <a class="rr-lnk" style="justify-self:start" :href="memberHref(p.member_id)" x-text="memberById(p.member_id)?.name || takeOf(p.member_id)?.memberName || p.member_id"></a>
                              <span>
                                <template x-if="takeOf(p.member_id)">
                                  <span class="ss-stance"><i :style="`background:${stanceColor(takeOf(p.member_id)?.stance)}`" aria-hidden="true"></i><span x-text="`${takeOf(p.member_id)?.stance} · ${fmtPct(takeOf(p.member_id)?.confidence)}`"></span></span>
                                </template>
                                <template x-if="!takeOf(p.member_id)"><span class="rr-note" style="margin:0">No take</span></template>
                              </span>
                              <template x-if="!isEcho(p.view)"><p x-html="inlineMarks(p.view)"></p></template>
                              <template x-if="isEcho(p.view) && takeOf(p.member_id)">
                                <p><a class="rr-lnk" :href="`#${takeAnchor(takeOf(p.member_id))}`" @click="revealResearchTake(takeOf(p.member_id))">Read their take →</a></p>
                              </template>
                            </div>
                          </template>
                        </div>
                        <template x-if="d.what_settles">
                          <p class="rr-settles"><span class="rr-k">What would settle it</span><br><span x-text="d.what_settles"></span></p>
                        </template>
                      </div></div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </section>
        </template>

        <!-- 03 · TAKES. How the room voted, then each take, clamped. -->
        <template x-if="takes.length">
          <section class="rr-sec sv__takes-section" id="takes" aria-labelledby="takes-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="takes-h">Member takes</h2>
              <span class="rr-sec__aside" x-text="`${takes.length} ${takes.length === 1 ? 'take' : 'takes'}`"></span>
            </div>
            <template x-if="voteTotal(reviewRow()) && isFramework()">
              <div class="rr-block" style="margin-bottom:1rem">
                <p class="rr-k">How members voted</p>
                <p class="sr__state">
                  <template x-if="leanStance(reviewRow())"><i :style="leanDotStyle(reviewRow())" aria-hidden="true"></i></template>
                  <b x-text="leanLabel(reviewRow())"></b>
                  <span x-text="leadShare(reviewRow())"></span>
                </p>
                <template x-if="hasVoteMembers(reviewRow())">
                  <div class="vote" role="img" :aria-label="`How members voted: ${spreadLabel(reviewRow())}.`">
                    <template x-for="c in voteColumns(reviewRow())" :key="c.stance">
                      <div class="vote__col" :class="{ 'is-lead': c.stance === leanStance(reviewRow()) }">
                        <div class="vote__stack">
                          <template x-for="m in c.members" :key="m.key">
                            <a class="vote__m" :href="m.href || undefined">
                              <i :style="`background:${stanceColor(c.stance)}`" aria-hidden="true"></i><span x-text="m.name"></span>
                            </a>
                          </template>
                        </div>
                        <span class="vote__axis" x-text="c.stance"></span>
                      </div>
                    </template>
                  </div>
                </template>
                <p class="sr__foot">
                  <span x-text="quorumText(reviewRow())"></span><template x-if="meanConfidenceText(reviewRow())"><span x-text="` · ${meanConfidenceText(reviewRow())}`"></span></template>
                  <template x-if="absentNames().length">
                    <span> · absent
                      <template x-for="id in (session.swarmRecommendation?.absent || [])" :key="id">
                        <a class="sv__take-absent-who" :href="memberHref(id)" x-text="memberById(id)?.name || id"></a>
                      </template>
                    </span>
                  </template>
                </p>
              </div>
            </template>

            <template x-if="takes.length">
              <div>
                <div class="pr-controls">
                  <label>Find a member or argument<input type="search" x-model="takeQuery" @input="takeLimit = 6" placeholder="Search names and full takes"></label>
                  <label>Stance<select x-model="takeStance" @change="takeLimit = 6"><option value="">All stances</option><template x-for="stance in takeStances()" :key="stance"><option :value="stance" x-text="stance"></option></template></select></label>
                  <button type="button" class="rr-btn" @click="resetTakeFilter()" :disabled="!takeQuery && !takeStance">Clear</button>
                  <span x-html="researchTooltip('confidence', 'takes-confidence-tip')"></span>
                </div>
                <p class="pr-takes-status" role="status" aria-live="polite" x-text="`${visibleResearchTakes().length} of ${filteredResearchTakes().length} matching takes`"></p>
                <template x-if="!filteredResearchTakes().length"><p class="rr-prose">No takes match these filters.</p></template>
              </div>
            </template>
            <div class="sv__takes--ported">
              <template x-for="t in visibleResearchTakes()" :key="t.memberId || t.id">
                <article class="rr-take" :id="takeAnchor(t)" x-data="{ more: false }">
                  <div class="rr-take__top">
                    <div class="rr-take__who">
                      <a class="sv__avatar sv__avatar--mark" :href="memberHref(t.memberId)" :aria-label="t.memberName"
                         x-html="memberMark(t.memberKeyFingerprint || t.memberId, t.memberName, 36, memberById(t.memberId)?.avatar?.path, memberById(t.memberId)?.handle)"></a>
                      <div>
                        <a class="rr-take__name sv__member-link" :href="memberHref(t.memberId)" x-text="t.memberName"></a>
                        <div class="rr-take__lens sv__take-lens" x-text="memberLens(t.memberId)"></div>
                      </div>
                    </div>
                    <div class="rr-take__stance">
                      <span class="sv__stance-badge" :style="stanceStyle(t.stance)">
                        <i :style="`background:${stanceColor(t.stance)}`"></i><span x-text="t.stance"></span>
                      </span>
                      <template x-if="t.confidence != null && t.confidence !== '' && Number.isFinite(Number(t.confidence))">
                        <span class="mp-conf">Confidence <b x-text="fmtPct(t.confidence)"></b></span>
                      </template>
                    </div>
                  </div>
                  <div class="rr-take__main" :class="takeWeightRows(t).length ? 'has-aside' : ''">
                    <div>
                      <div class="sv__take-body rr-prose" :class="!more && isLong(t.body, 420) ? 'is-clamped' : ''" style="--rr-lines:5" x-html="linkified(t.body || '')"></div>
                      <template x-if="isLong(t.body, 420)">
                        <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                          <span x-text="more ? 'Show less' : 'Read full take'"></span><small x-text="`${wordCount(t.body)} words`"></small>
                        </button>
                      </template>
                    </div>
                    <template x-if="takeWeightRows(t).length">
                      <aside class="rr-take__aside">
                        <p class="rr-k">Proposed weights</p>
                        <ul class="rr-legend" style="margin-top:0.5rem">
                          <template x-for="w in takeWeightRows(t)" :key="w.key">
                            <li :class="w.pct > 0 ? '' : 'is-zero'"><i data-mark="series" :style="`background:${w.colour}`" aria-hidden="true"></i><span x-text="w.label"></span><b x-text="`${fmtPctTrim(w.pct)}`"></b></li>
                          </template>
                        </ul>
                      </aside>
                    </template>
                  </div>
                  <div class="rr-take__foot">
                    <span class="sv__vfy sv__vfy--inline" :class="{ 'sv__vfy--bad': !t.verified && !t.archival, 'sv__vfy--arch': t.archival }"
                          data-verified-badge :data-take-id="t.id" :data-verified-state="verifyLabel(t.verified, t.archival)"
                          :title="verifyTip(t.verified, t.archival)" x-text="verifyLabel(t.verified, t.archival)"></span>
                    <template x-if="source === 'api'"><a :href="takeHref(t)" data-take-permalink>Verification receipt ↗</a></template>
                    <template x-if="t.memoUrl"><a :href="t.memoUrl" target="_blank" rel="noopener noreferrer">Read memo ↗</a></template>
                    <a :href="`#${takeAnchor(t)}`">Link to this take</a>
                    <a :href="memberHref(t.memberId)">Member profile</a>
                  </div>
                </article>
              </template>
            </div>
            <template x-if="visibleResearchTakes().length < filteredResearchTakes().length"><button type="button" class="rr-btn" @click="takeLimit += 6" x-text="`Show more takes (${filteredResearchTakes().length - visibleResearchTakes().length} remaining)`"></button></template>
          </section>
        </template>

        <!-- 04 · EVIDENCE. Whether the takes are signed, what the session was
             handed, and where the raw record lives. -->
        <section class="rr-sec" id="evidence" aria-labelledby="ev-h">
          <div class="rr-sec__head"><h2 class="rr-sec__h" id="ev-h">Evidence &amp; provenance</h2></div>
          <div class="rr-split">
            <div>
              <h3 class="rr-h3" x-text="signatureHeadline()"></h3>
              <p class="rr-prose" style="font-size:0.875rem" x-text="signatureDetail()"></p>
            </div>
            <dl class="rr-dl">
              <template x-if="source === 'api'">
                <div><dt>Consensus receipt</dt><dd>
                  <span x-text="receiptStatus"></span>
                  <template x-if="receiptStatus === 'Verified' || receiptStatus === 'Not verified'">
                    <span> · <a :href="receiptHref()" target="_blank" rel="noopener">Read receipt ↗</a></span>
                  </template>
                </dd></div>
              </template>
              <template x-if="session.generatedAt || session.generated_at">
                <div><dt>Record generated</dt><dd class="rr-mono" x-text="session.generatedAt || session.generated_at"></dd></div>
              </template>
              <template x-if="isFramework() || isBucketWeights()"><div><dt>Target policy</dt><dd x-text="targetPolicyLabel()"></dd></div></template>
              <div><dt>Session record</dt><dd><a :href="sessionJsonHref()" target="_blank" rel="noopener">Session JSON ↗</a></dd></div>
              <template x-if="brief">
                <div><dt>Session inputs</dt><dd><a :href="briefJsonHref()" target="_blank" rel="noopener">Brief JSON ↗</a></dd></div>
              </template>
            </dl>
          </div>

          <template x-if="handoverParts().length">
            <div class="rr-disc" style="margin-top:2.25rem" x-data="{ open: false }" :class="open ? 'is-open' : ''">
              <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="session-handover" @click="open = !open">
                What the swarm was handed <small>The brief this session opened with</small>
              </button>
              <div class="rr-disc__anim" id="session-handover" role="region" aria-label="What the swarm was handed" :inert="!open">
                <div class="rr-disc__clip"><div class="rr-disc__body">
                  <dl class="hand">
                    <template x-for="part in handoverParts()" :key="part.key">
                      <div class="hand__row" :data-part="part.key">
                        <dt x-text="part.label"></dt>
                        <dd>
                          <template x-if="part.quote"><q x-text="part.quote"></q></template>
                          <template x-if="part.facts">
                            <div class="sv__fact-row">
                              <template x-for="f in part.facts" :key="f.key">
                                <span class="sv__fact">
                                  <em x-text="f.k"></em>
                                  <template x-if="f.dot"><i class="sv__fact-dot" :style="`background:${f.dot}`" aria-hidden="true"></i></template>
                                  <b x-text="f.v"></b>
                                </span>
                              </template>
                            </div>
                          </template>
                          <template x-if="part.bars">
                            <div class="sv__sleeves">
                              <template x-for="t in part.bars" :key="t.key">
                                <div class="sv__sleeve">
                                  <span class="sv__sleeve-n"><i class="sv__bucket-dot" :style="`background:${t.hue}`" aria-hidden="true"></i><span x-text="t.label"></span></span>
                                  <span class="sv__sleeve-track"><i :style="`width:${Math.max(0, Math.min(100, t.pct))}%`"></i></span>
                                  <span class="sv__sleeve-v" x-text="`${t.pct}%`"></span>
                                </div>
                              </template>
                            </div>
                          </template>
                          <template x-if="part.links">
                            <ul class="hand__links">
                              <template x-for="l in part.links" :key="l.key">
                                <li>
                                  <template x-if="l.href"><a class="rm-link" :href="l.href" x-text="l.text"></a></template>
                                  <template x-if="!l.href"><span x-text="l.text"></span></template>
                                </li>
                              </template>
                            </ul>
                          </template>
                          <template x-if="part.pills">
                            <span class="hand__pills">
                              <template x-for="p in part.pills" :key="p.key">
                                <span class="hand__pill-wrap">
                                  <template x-if="p.href"><a class="hand__pill hand__pill--link" :href="p.href" x-text="p.text"></a></template>
                                  <template x-if="!p.href"><span class="hand__pill" x-text="p.text"></span></template>
                                </span>
                              </template>
                            </span>
                          </template>
                          <template x-if="part.list">
                            <ul><template x-for="n in part.list" :key="n.key"><li x-text="n.text"></li></template></ul>
                          </template>
                        </dd>
                      </div>
                    </template>
                  </dl>
                </div></div>
              </div>
            </div>
          </template>
        </section>

        <nav class="rr-recnav" aria-label="Session navigation">
          <span><template x-if="neighbours.older"><a :href="sessionHrefOf(neighbours.older)" x-text="`← ${formatDate(neighbours.older.date, 'short')}`"></a></template></span>
          <a :href="subjectHref()">All sessions on this subject</a>
          <span><template x-if="neighbours.newer"><a :href="sessionHrefOf(neighbours.newer)" x-text="`${formatDate(neighbours.newer.date, 'short')} →`"></a></template></span>
        </nav>
      </div>
    </template>

    <!-- The page that prints stances, confidence figures and a recommendation
         is the page that most needs to say a member may hold what it argues
         about. See assets/js/app/lib/swarm-disclaimer.js. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>

  <style>
    /* Page-local: the handful of pieces only this page has. The record's
       components are shared in views.css (.rr-*). */
    .ss-stance { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.75rem; }
    .ss-stance i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .sr__foot .sv__take-absent-who { font-size: inherit; font-weight: 400; color: var(--color-text-soft);
      text-decoration: underline; text-decoration-color: var(--color-border-light); text-underline-offset: 3px; }
    .sr__foot .sv__take-absent-who + .sv__take-absent-who::before { content: ","; display: inline-block;
      margin-right: 0.35em; text-decoration: none; color: var(--color-text-muted); }
    .sv__vfy--inline { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: none; letter-spacing: 0; }
    .rr-split--one { grid-template-columns: minmax(0, 1fr); }
  </style>
</section>
