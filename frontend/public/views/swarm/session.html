<!-- Swarm session detail. It reads in the subject page's vocabulary, because a
     session and the subject it reviews are two views of one thing: the same
     header chips, the same review band (signal, reasoning, then what the
     session recommended and what it was handed), then the takes. -->
<section class="cv cv--detail" x-data="swarmSessionDetail()">
  <div class="sv__body sv__body--narrow">
    <!-- Up, to the subject this session reviewed: the page that lists every
         session on it, and links here from its latest review. /swarm is one
         level further up, in the nav. -->
    <a :href="subjectHref()" class="sv__back" x-text="session?.subjectName || '/swarm'">/swarm</a>

    <p class="sv__loading" x-show="loading">Loading session…</p>
    <template x-if="error"><p class="sv__error" x-text="error"></p></template>

    <template x-if="!loading && session">
      <div>
        <header class="sv__detail-head">
          <!-- The kind comes from the subject record, not from a hardcoded
               word: this said "portfolio" on every session, including the ones
               reviewing a framework that has no portfolio. -->
          <p class="sv__eyebrow sv__eyebrow--quiet"><span x-text="formatDate(session.date, 'long')"></span> · <span x-text="subjectKindOf(subject)">portfolio</span></p>
          <h1 class="sv__detail-title session-title" x-text="session.subjectName"></h1>
          <p class="sv__lede sv__lede--compact" x-show="subject?.thesisBlurb" x-text="subject?.thesisBlurb"></p>
          <!-- Backdrop chips. Label and value are distinct elements: the old
               markup nested a bare <span> inside a bare <span>, and the CSS
               selector matched both, so every value was drawn its own box
               inside the chip's box — the doubled, broken-looking frame. -->
          <div class="sv__fact-row">
            <template x-if="session.regimeSummary">
              <span class="sv__fact"><em>composite</em><b x-text="fmtNum(session.regimeSummary?.composite, 3)"></b></span>
            </template>
            <template x-if="session.regimeSummary">
              <span class="sv__fact">
                <em>regime</em>
                <i class="sv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.regime)}`" aria-hidden="true"></i>
                <b x-text="regimeLabel(session.regimeSummary?.regime)"></b>
              </span>
            </template>
            <template x-if="session.regimeSummary?.macroRegime">
              <span class="sv__fact">
                <em>macro</em>
                <i class="sv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.macroRegime)}`" aria-hidden="true"></i>
                <b x-text="regimeLabel(session.regimeSummary?.macroRegime)"></b>
              </span>
            </template>
            <template x-if="session.regimeSummary?.onchainRegime">
              <span class="sv__fact">
                <em>onchain</em>
                <i class="sv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.onchainRegime)}`" aria-hidden="true"></i>
                <b x-text="regimeLabel(session.regimeSummary?.onchainRegime)"></b>
              </span>
            </template>
            <!-- Always shown, and derived rather than printed raw, so this
                 chip and /swarm read the same phase from the same deadline. -->
            <span class="sv__fact">
              <em>state</em>
              <!-- span, not <b>: `.sv__fact b` repaints its child --color-text,
                   which silently overrode the chip's own phase colour. -->
              <span :class="phaseClass(session)" x-text="phaseLabel(session)"></span>
            </span>
          </div>
        </header>

        <!-- THE REVIEW: the subject page's latest-review band, fed this
             session. What the market said (signal), how the swarm voted
             (reasoning), what it recommended (outcome), and the brief it was
             handed. Each column opens on a one-word state, then the one chart
             that fits its data. Only what the data supports renders. -->
        <template x-if="hasReview() || hasOutcome() || handoverParts().length">
          <section class="sr ss-review" aria-label="The review">
            <template x-if="hasReview()">
              <div class="sr__cols">
                <template x-if="signalRows().length">
                  <div class="sr__col">
                    <p class="sr__k">Signal</p>
                    <p class="sr__state">
                      <i :style="`background:${regimeColor(backdrop.regime)}`" aria-hidden="true"></i>
                      <b x-text="regimeLabel(backdrop.regime)"></b>
                      <template x-if="backdrop.compositePercentile !== null"><span x-text="`${ordinal(backdrop.compositePercentile)} percentile`"></span></template>
                    </p>
                    <div class="sig" role="img"
                         :aria-label="`Percentile against its own three-year history: ${signalRows().map((r) => `${r.label} ${ordinal(r.pct)}`).join(', ')}.`">
                      <div class="sig__scale" aria-hidden="true">
                        <span></span>
                        <span class="sig__ticks">
                          <template x-for="z in signalZones()" :key="z.key">
                            <em class="sig__zone" :style="`left:${z.left};width:${z.width}`" x-text="z.label"></em>
                          </template>
                          <b style="left:0">0</b><b style="left:50%">50th</b><b style="left:100%">100</b>
                        </span>
                        <span></span>
                      </div>
                      <template x-for="r in signalRows()" :key="r.key">
                        <div class="sig__row" :class="`is-${r.kind}`">
                          <span class="sig__l" x-text="r.label"></span>
                          <span class="sig__track">
                            <b class="sig__mid"></b>
                            <template x-for="c in signalCuts()" :key="c"><b class="sig__cut" :style="`left:${c}`"></b></template>
                            <i class="sig__dot" :style="`left:${r.at};` + (r.kind === 'context' ? '' : `background:${regimeColor(r.regime)}`)"></i>
                          </span>
                          <span class="sig__v" x-text="ordinal(r.pct)"></span>
                        </div>
                      </template>
                    </div>
                    <p class="sr__foot">Percentile of its own three-year history.<template x-if="!backdropV0"><span> Factor is context, not part of the composite.</span></template></p>
                  </div>
                </template>
                <template x-if="voteTotal(reviewRow())">
                  <div class="sr__col">
                    <p class="sr__k">Reasoning</p>
                    <p class="sr__state">
                      <template x-if="leanStance(reviewRow())"><i :style="leanDotStyle(reviewRow())" aria-hidden="true"></i></template>
                      <b x-text="leanLabel(reviewRow())"></b>
                      <span x-text="leadShare(reviewRow())"></span>
                    </p>
                    <template x-if="hasVoteMembers(reviewRow())">
                      <div class="vote" role="img" :aria-label="`How members voted: ${spreadLabel(reviewRow())}.`">
                        <template x-for="c in voteColumns(reviewRow())" :key="c.stance">
                          <div class="vote__col" :class="{ 'is-lead': c.stance === leanStance(reviewRow()) }">
                            <div class="vote__stack">
                              <template x-for="m in c.members" :key="m.key">
                                <a class="vote__m" :href="m.href || undefined">
                                  <i :style="`background:${stanceColor(c.stance)}`" aria-hidden="true"></i><span x-text="m.name"></span>
                                </a>
                              </template>
                            </div>
                            <span class="vote__axis" x-text="c.stance"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!hasVoteMembers(reviewRow())">
                      <p class="vote__sq" :aria-label="`How members voted: ${spreadLabel(reviewRow())}.`">
                        <template x-for="q in voteSquares(reviewRow())" :key="q.key"><i :style="`background:${stanceColor(q.stance)}`"></i></template>
                      </p>
                    </template>
                    <p class="sr__foot">
                      <span x-text="quorumText(reviewRow())"></span><template x-if="meanConfidenceText(reviewRow())"><span x-text="` · ${meanConfidenceText(reviewRow())}`"></span></template>
                      <!-- Who could have voted and did not. Resolved to names
                           where the roster knows them; an id it does not know
                           still prints rather than understating who missed it. -->
                      <template x-if="absentNames().length">
                        <span> · absent
                          <template x-for="id in (session.swarmRecommendation?.absent || [])" :key="id">
                            <a class="sv__take-absent-who" :href="memberHref(id)" x-text="memberById(id)?.name || id"></a>
                          </template>
                        </span>
                      </template>
                    </p>
                  </div>
                </template>
              </div>
            </template>

            <!-- OUTCOME: what the session recommended, measured against what it
                 was aiming at. The ring is the one every session card draws
                 for a recommendation; the register beside it is the targets
                 card's, carrying the target, the recommendation and the move. -->
            <template x-if="hasOutcome()">
              <div class="sr__out">
                <p class="sr__k">Outcome</p>
                <template x-if="outcomeState()">
                  <p class="sr__state"><b x-text="outcomeState().label"></b><span x-text="outcomeState().detail"></span></p>
                </template>
                <template x-if="isBucketWeights()">
                  <div class="sr__mix">
                    <template x-if="weightDonutSvg(reviewRow())">
                      <span class="sv__wdonut-host" role="img" :aria-label="`Recommended weights: ${sessionWeightsLabel(reviewRow())}`"
                            x-html="weightDonutSvg(reviewRow())"></span>
                    </template>
                    <div class="sv__sleeves sr__reg" :style="`--n:${outcomeColumns()}`">
                      <div class="sv__sleeve sv__sleeve--head">
                        <span>Sleeve</span>
                        <template x-if="hasTargetColumn()"><span>Target</span></template>
                        <template x-if="hasActualColumn()"><span>Actual</span></template>
                        <span>Recommended</span>
                        <template x-if="gapBasis()"><span x-text="gapBasis() === 'actual' ? 'vs actual' : 'vs target'"></span></template>
                      </div>
                      <template x-for="b in bucketRows()" :key="b.name">
                        <div class="sv__sleeve">
                          <span class="sv__sleeve-n"><i class="sv__bucket-dot" :style="`background:${b.hue}`" aria-hidden="true"></i><span x-text="b.name"></span></span>
                          <template x-if="hasTargetColumn()"><span class="sv__sleeve-v is-ref" x-text="fmtWeight(b.target)"></span></template>
                          <template x-if="hasActualColumn()"><span class="sv__sleeve-v is-ref" x-text="fmtWeight(b.actual)"></span></template>
                          <span class="sv__sleeve-v" x-text="fmtWeight(b.recommended)"></span>
                          <template x-if="gapBasis()"><span class="sv__sleeve-v sr__gap" :class="gapClass(b.gap)" x-text="fmtGap(b.gap)"></span></template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <!-- Actions the members wrote (v0). The hardcoded pair every
                     rollup carried from 2026-08-06 to 09-04 is not drawn: see
                     authoredActions(). -->
                <template x-if="authoredActions().length">
                  <dl class="sr__acts">
                    <template x-for="a in authoredActions()" :key="`${a.token}-${a.action}`">
                      <div class="sr__act">
                        <dt x-text="a.token"></dt>
                        <dd><b x-text="a.action"></b><template x-if="a.rationale"><span x-text="a.rationale"></span></template></dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <template x-if="outcomeCaption()">
                  <p class="sr__foot" data-target-asof x-text="outcomeCaption()"></p>
                </template>
                <template x-if="recommendationRationale()">
                  <p class="sr__why" x-text="recommendationRationale()"></p>
                </template>
                <!-- Inside each sleeve: the item-level half of an allocation
                     recommendation, each sleeve as its own small register. -->
                <template x-if="withinBucketWeights().length">
                  <div class="sr__within">
                    <p class="sr__k">Inside each sleeve</p>
                    <div class="sr__within-grid">
                      <template x-for="b in withinBucketWeights()" :key="b.bucket">
                        <div>
                          <p class="sr__within-h"><i class="sv__bucket-dot" :style="`background:${b.hue}`" aria-hidden="true"></i><span x-text="b.label"></span></p>
                          <div class="sv__sleeves">
                            <template x-for="it in b.items" :key="`${b.bucket}-${it.name}`">
                              <div class="sv__sleeve">
                                <span class="sv__sleeve-n" x-text="it.label"></span>
                                <span class="sv__sleeve-track"><i :style="`width:${Math.max(0, Math.min(100, it.weight * 100))}%`"></i></span>
                                <span class="sv__sleeve-v" x-text="fmtPct1(it.weight)"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- What the swarm was handed: a record of this session's brief,
                 one row per part it actually contains. -->
            <template x-if="handoverParts().length">
              <div class="sp-brief" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                <button type="button" class="sp-brief__sum" :aria-expanded="open ? 'true' : 'false'"
                        aria-controls="session-handover" @click="open = !open">
                  <span class="sp-brief__sum-k">What the swarm was handed</span>
                  <span class="sp-brief__sum-m"><i aria-hidden="true">⌄</i></span>
                </button>
                <div class="sp-brief__anim" id="session-handover" role="region"
                     aria-label="What the swarm was handed" :inert="!open">
                  <div class="sp-brief__clip">
                    <dl class="hand">
                      <template x-for="part in handoverParts()" :key="part.key">
                        <div class="hand__row" :data-part="part.key">
                          <dt x-text="part.label"></dt>
                          <dd>
                            <template x-if="part.quote"><q x-text="part.quote"></q></template>
                            <template x-if="part.facts">
                              <div class="sv__fact-row">
                                <template x-for="f in part.facts" :key="f.key">
                                  <span class="sv__fact">
                                    <em x-text="f.k"></em>
                                    <template x-if="f.dot"><i class="sv__fact-dot" :style="`background:${f.dot}`" aria-hidden="true"></i></template>
                                    <b x-text="f.v"></b>
                                  </span>
                                </template>
                              </div>
                            </template>
                            <template x-if="part.bars">
                              <div class="sv__sleeves">
                                <template x-for="t in part.bars" :key="t.key">
                                  <div class="sv__sleeve">
                                    <span class="sv__sleeve-n"><i class="sv__bucket-dot" :style="`background:${t.hue}`" aria-hidden="true"></i><span x-text="t.label"></span></span>
                                    <span class="sv__sleeve-track"><i :style="`width:${Math.max(0, Math.min(100, t.pct))}%`"></i></span>
                                    <span class="sv__sleeve-v" x-text="`${t.pct}%`"></span>
                                  </div>
                                </template>
                              </div>
                            </template>
                            <template x-if="part.links">
                              <ul class="hand__links">
                                <template x-for="l in part.links" :key="l.key">
                                  <li>
                                    <template x-if="l.href"><a class="rm-link" :href="l.href" x-text="l.text"></a></template>
                                    <template x-if="!l.href"><span x-text="l.text"></span></template>
                                  </li>
                                </template>
                              </ul>
                            </template>
                            <template x-if="part.pills">
                              <span class="hand__pills">
                                <template x-for="p in part.pills" :key="p.key">
                                  <span class="hand__pill-wrap">
                                    <template x-if="p.href"><a class="hand__pill hand__pill--link" :href="p.href" x-text="p.text"></a></template>
                                    <template x-if="!p.href"><span class="hand__pill" x-text="p.text"></span></template>
                                  </span>
                                </template>
                              </span>
                            </template>
                            <template x-if="part.list">
                              <ul><template x-for="n in part.list" :key="n.key"><li x-text="n.text"></li></template></ul>
                            </template>
                          </dd>
                        </div>
                      </template>
                    </dl>
                  </div>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- The book this session reviewed, in the subject page's holdings
             markup. A framework subject has none (see loadApi()). -->
        <template x-if="snapshot">
          <section class="sv__portfolio">
            <div class="sv__panel-head">
              <p class="sv__panel-label">Holdings · <span x-text="fmtUsd(snapshot?.totalValueUsd)"></span> total</p>
              <span class="sv__tag" x-text="snapshot?.date"></span>
            </div>
            <div class="sp-holdings">
              <div class="sv__table-wrap">
                <table class="sv__data-table">
                  <thead><tr><th>Token</th><th>Chain</th><th class="sv__num">Value</th><th class="sv__num">Share</th></tr></thead>
                  <tbody>
                    <template x-for="p in positionRows().slice(0, 8)" :key="`${p.token}-${p.chain}`">
                      <tr>
                        <td><i class="sp-key" :style="`--k:${tokenColor(p.token)}`" aria-hidden="true"></i><span x-text="p.token"></span></td>
                        <td x-text="p.chain"></td>
                        <td class="sv__num" x-text="fmtUsd(p.value_usd)"></td>
                        <td class="sv__num" x-text="fmtPct1(p.share)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            <template x-if="(snapshot?.notable || []).length">
              <div class="sv__notables">
                <p class="sv__panel-label">Notable</p>
                <ul>
                  <template x-for="n in (snapshot?.notable || [])" :key="n"><li x-text="n"></li></template>
                </ul>
              </div>
            </template>
          </section>
        </template>

        <!-- THE DISCUSSION, when somebody wrote it: a v0 session's synthesis,
             consensus and disagreements, or a judge's disagreements. A live
             aggregate's are templates over figures the band already draws. -->
        <template x-if="hasDiscussion()">
          <section class="ss-sec">
            <div class="sv__sec"><div><h2 class="sv__sec-h">Discussion</h2></div></div>
            <template x-if="showSynthesis()">
              <div class="sv__synthesis" x-html="linkified(session.synthesis)"></div>
            </template>
            <template x-if="consensusItems().length">
              <div class="ss-block">
                <p class="sr__k">Consensus</p>
                <!-- inlineMarks, not linkified: consensus entries are single
                     points, so they take bold/links but must not open block
                     elements inside a list item. -->
                <ul class="ss-list">
                  <template x-for="item in consensusItems()" :key="item"><li x-html="inlineMarks(item)"></li></template>
                </ul>
              </div>
            </template>
            <template x-if="disagreements().length">
              <div class="ss-block">
                <p class="sr__k">Disagreements</p>
                <div class="sv__disagreements">
                  <template x-for="d in disagreements()" :key="d.topic">
                    <article class="sv__disagreement">
                      <h3 x-text="d.topic"></h3>
                      <ul>
                        <template x-for="p in d.positions" :key="`${d.topic}-${p.member_id}`">
                          <li>
                            <a :href="memberHref(p.member_id)" x-text="memberById(p.member_id)?.name || takeOf(p.member_id)?.memberName || p.member_id"></a>
                            <!-- Stance and view are SEPARATE grid cells, so the
                                 views are a column a reader can scan down. -->
                            <span class="sv__dis-stance-cell">
                              <template x-if="takeOf(p.member_id)">
                                <span class="sv__dis-stance" :style="stanceStyle(takeOf(p.member_id)?.stance)">
                                  <i :style="`background:${stanceColor(takeOf(p.member_id)?.stance)}`"></i>
                                  <span x-text="`${takeOf(p.member_id)?.stance} · ${fmtPct(takeOf(p.member_id)?.confidence)}`"></span>
                                </span>
                              </template>
                              <template x-if="!takeOf(p.member_id)">
                                <span class="sv__dis-nostance">no take</span>
                              </template>
                            </span>
                            <span class="sv__dis-view">
                              <template x-if="!isEcho(p.view)"><span x-html="inlineMarks(p.view)"></span></template>
                              <!-- A view that is a take body verbatim links to the
                                   take on this page instead of reprinting it. -->
                              <template x-if="isEcho(p.view) && takeOf(p.member_id)">
                                <a class="sv__dis-read" :href="`#${takeAnchor(takeOf(p.member_id))}`">Read their take →</a>
                              </template>
                            </span>
                          </li>
                        </template>
                      </ul>
                      <template x-if="d.what_settles"><p><em>Settles when:</em> <span x-text="d.what_settles"></span></p></template>
                    </article>
                  </template>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- THE TAKES. The index is the way into five long cards: who took
             part, how they voted and how sure they were, each row a jump to
             the card. Keyed on the MEMBER, not the row id (issue #573): a
             member may file several revisions of a take, each an immutable
             row with its own uuid, and the member is what this list has one
             row of. The server resolves latest-per-member (domain.ts
             withTakes); this is the second, independent guarantee. -->
        <template x-if="takes.length">
          <section class="sv__takes-section ss-sec">
            <div class="sv__sec">
              <div><h2 class="sv__sec-h">Takes</h2></div>
              <span class="sv__session-count" x-text="`${takes.length} ${takes.length === 1 ? 'take' : 'takes'}`"></span>
            </div>
            <div class="sv__table-wrap session-submissions">
              <table class="sv__data-table">
                <thead><tr><th>Member</th><th>Stance</th><th class="sv__num">Confidence</th></tr></thead>
                <tbody>
                  <template x-for="t in takes" :key="t.memberId || t.id">
                    <tr>
                      <td><a class="rm-link" :href="`#${takeAnchor(t)}`" x-text="t.memberName"></a></td>
                      <td><span class="ss-stance"><i :style="`background:${stanceColor(t.stance)}`" aria-hidden="true"></i><span x-text="t.stance"></span></span></td>
                      <td class="sv__num" x-text="fmtPct(t.confidence)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="sv__takes sv__takes--ported">
              <template x-for="t in takes" :key="t.memberId || t.id">
                <article class="sv__take sv__take--ported" :id="takeAnchor(t)">
                  <header class="sv__take-head">
                    <div class="sv__take-member">
                      <!-- Seeded `fingerprint || id`, the same expression as the
                           roster row and the profile hero, so one member is one
                           mark everywhere. Locked in step by
                           scripts/tests/unit/member-mark-distinctness.test.ts. -->
                      <!-- BOTH link sites on this page pass the IMMUTABLE id and
                           let memberHref resolve the address (issue #598). -->
                      <a class="sv__avatar sv__avatar--mark" :href="memberHref(t.memberId)" :aria-label="t.memberName"
                         x-html="memberMark(t.memberKeyFingerprint || t.memberId, t.memberName, 40, memberById(t.memberId)?.avatar?.path, memberById(t.memberId)?.handle)"></a>
                      <div>
                        <a class="sv__member-link" :href="memberHref(t.memberId)" x-text="t.memberName"></a>
                        <div class="sv__take-lens" x-text="memberLens(t.memberId)"></div>
                      </div>
                    </div>
                    <span class="sv__stance-badge" :style="stanceStyle(t.stance)">
                      <i :style="`background:${stanceColor(t.stance)}`"></i>
                      <span x-text="`${t.stance} · ${fmtPct(t.confidence)}`"></span>
                    </span>
                    <span class="sv__vfy sv__vfy--pin" :class="{ 'sv__vfy--bad': !t.verified && !t.archival, 'sv__vfy--arch': t.archival }"
                          data-verified-badge :data-take-id="t.id" :data-verified-state="verifyLabel(t.verified, t.archival)"
                          tabindex="0" :aria-label="`${verifyLabel(t.verified, t.archival)}. ${verifyTip(t.verified, t.archival)}`">
                      <svg class="sv__vfy-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <rect x="1.4" y="1.4" width="13.2" height="13.2" stroke="currentColor" stroke-width="1.2"/>
                        <path :d="verifyPath(t.verified, t.archival)" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
                      </svg>
                      <span class="sv__vfy-label" x-show="!t.verified" x-text="verifyLabel(t.verified, t.archival)"></span>
                      <span class="sv__vfy-tip" aria-hidden="true" x-text="verifyTip(t.verified, t.archival)"></span>
                    </span>
                  </header>
                  <div class="sv__take-body" x-html="linkified(t.body || '')"></div>
                  <p class="ss-links" x-show="source === 'api' || t.memoUrl">
                    <a class="sv__memo-link" x-show="source === 'api'" :href="takeHref(t)" data-take-permalink>Verification receipt →</a>
                    <a class="sv__memo-link" x-show="t.memoUrl" :href="t.memoUrl" target="_blank" rel="noopener noreferrer">Read memo ↗</a>
                  </p>
                </article>
              </template>
            </div>
          </section>
        </template>
      </div>
    </template>

    <!-- The page that prints stances, confidence figures and a recommendation
         is the page that most needs to say a member may hold what it argues
         about. See assets/js/app/lib/swarm-disclaimer.js. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>
