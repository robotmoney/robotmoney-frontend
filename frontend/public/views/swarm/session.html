<!-- Swarm session detail, ported from robotmoney-site/src/app/swarm/[date]/[subject]/page.tsx. -->
<section class="cv cv--detail" x-data="icSessionDetail()">
  <div class="sv__body sv__body--narrow">
    <a href="/swarm" class="sv__back">← /swarm</a>

    <p class="sv__loading" x-show="loading">Loading session…</p>
    <p class="sv__error" x-show="error" x-text="error" x-cloak></p>

    <template x-if="!loading && session">
      <div>
        <header class="sv__detail-head">
          <p class="sv__eyebrow"><span x-text="formatDate(session.date, 'long')"></span> · subject</p>
          <h1 class="sv__detail-title session-title" x-text="session.subjectName"></h1>
          <p class="sv__lede sv__lede--compact" x-text="subject?.thesisBlurb || `${session.subjectName} swarm review.`"></p>
          <!-- Backdrop chips. Label and value are distinct elements: the old
               markup nested a bare <span> inside a bare <span>, and the CSS
               selector matched both, so every value was drawn its own box
               inside the chip's box — the doubled, broken-looking frame. -->
          <div class="sv__fact-row">
            <span class="sv__fact" x-show="session.regimeSummary">
              <em>composite</em><b x-text="fmtNum(session.regimeSummary?.composite, 3)"></b>
            </span>
            <span class="sv__fact" x-show="session.regimeSummary">
              <em>bucket</em>
              <i class="sv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.regime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.regime)"></b>
            </span>
            <span class="sv__fact" x-show="session.regimeSummary?.macroRegime">
              <em>macro</em>
              <i class="sv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.macroRegime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.macroRegime)"></b>
            </span>
            <span class="sv__fact" x-show="session.regimeSummary?.onchainRegime">
              <em>onchain</em>
              <i class="sv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.onchainRegime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.onchainRegime)"></b>
            </span>
            <span class="sv__fact" x-show="!session.regimeSummary">
              <em>state</em><b x-text="session.state"></b>
            </span>
          </div>
        </header>

        <!-- Market backdrop. Was two panels: "Regime context" and "Brief" —
             neither of which said what it was, and the Brief held one derived
             sentence ("Subject: X. Regime: Y.") already carried by the <h1> and
             a backdrop chip, in half the page width. One panel now, with a line
             saying what a reader is looking at and why it is on this page. -->
        <template x-if="session.regimeSummary || briefExtra()">
          <section class="sv__panel sv__backdrop" x-show="session.regimeSummary">
            <div class="sv__panel-head">
              <p class="sv__panel-label">Market backdrop</p>
              <span class="sv__tag" x-text="formatDate(session.date, 'short')"></span>
            </div>
            <p class="sv__panel-note">
              The regime read attached to this session's brief: the same market context
              every member was given before writing their take.
            </p>
            <div class="sv__backdrop-grid">
              <div>
                <div class="sv__metric-line">
                  <span>Composite</span>
                  <b x-text="fmtNum(session.regimeSummary?.composite, 3)"></b>
                </div>
                <div class="sv__bar" x-show="session.regimeSummary?.composite != null">
                  <i :style="`width:${clampPct((session.regimeSummary?.composite || 0) * 100)}%`"></i>
                </div>
                <div class="sv__sparkline" x-show="(session.regimeSummary?.history || []).length >= 2" x-html="regimeSparkline()"></div>
                <p class="sv__panel-sub" x-show="(session.regimeSummary?.history || []).length >= 2"
                   x-text="`composite, trailing ${(session.regimeSummary?.history || []).length} sessions`"></p>
              </div>
              <div>
                <p class="sv__panel-sub" x-show="panelInputs().length >= 2">Panels · percentile against own history, 50th marked</p>
                <div class="sv__panel-divergence" x-show="panelInputs().length >= 2" x-html="panelDivergenceBars()"></div>
                <div class="sv__panel-bars" x-show="panelInputs().length === 1">
                  <template x-for="p in panelInputs()" :key="p.label">
                    <div class="sv__panel-bar">
                      <span x-text="p.label"></span>
                      <div><i :style="`width:${clampPct(p.pct * 100)}%`"></i></div>
                      <b x-text="`${Math.round(p.pct * 100)}%`"></b>
                    </div>
                  </template>
                </div>
              </div>
            </div>
            <p class="sv__body-copy" x-show="briefExtra()" x-text="briefExtra()"></p>
          </section>
        </template>

        <section class="sv__portfolio" x-show="snapshot">
          <div class="sv__panel-head">
            <p class="sv__panel-label">Portfolio read · <span x-text="fmtUsd(snapshot?.totalValueUsd)"></span> total</p>
            <span class="sv__tag" x-text="snapshot?.date"></span>
          </div>
          <div class="sv__portfolio-grid">
            <div class="sv__donut-list">
              <template x-for="(p, i) in positionRows().slice(0, 7)" :key="`${p.token}-${p.chain}`">
                <div class="sv__donut-row" :style="donutStyle(p, i)">
                  <i></i>
                  <span x-text="p.token"></span>
                  <b x-text="fmtPct1(p.share)"></b>
                </div>
              </template>
            </div>
            <div class="sv__table-wrap">
              <table class="sv__data-table">
                <thead><tr><th>Token</th><th>Chain</th><th class="sv__num">Value</th><th class="sv__num">Share</th></tr></thead>
                <tbody>
                  <template x-for="p in positionRows().slice(0, 8)" :key="`${p.token}-${p.chain}`">
                    <tr>
                      <td x-text="p.token"></td>
                      <td x-text="p.chain"></td>
                      <td class="sv__num" x-text="fmtUsd(p.value_usd)"></td>
                      <td class="sv__num" x-text="fmtPct1(p.share)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
          <div class="sv__notables" x-show="(snapshot?.notable || []).length">
            <p class="sv__panel-label">Notable</p>
            <ul>
              <template x-for="n in (snapshot?.notable || [])" :key="n"><li x-text="n"></li></template>
            </ul>
          </div>
        </section>

        <section class="sv__recommendation" x-show="session.swarmRecommendation">
          <div class="sv__panel-head">
            <p class="sv__panel-label">Swarm Recommendation</p>
            <span class="sv__tag" x-text="recommendationKind()"></span>
          </div>
          <!-- Verdict first. This block used to open with "3/5" in the largest
               type on the page — turnout, which is procedural — and left the
               reader to tally the stance chips to find the actual result. -->
          <template x-if="isRollupRecommendation()">
            <div class="sv__verdict">
              <p class="sv__verdict-call" :class="{ 'is-split': verdict().split }">
                <i :style="`background:${verdict().color}`" aria-hidden="true"></i>
                <span x-text="verdict().label"></span>
              </p>
              <p class="sv__verdict-detail" x-show="verdict().detail" x-text="verdict().detail"></p>
              <!-- The distribution as one proportional bar: relative weight is
                   the thing being read, and counted chips alone don't show it. -->
              <div class="sv__verdict-bar" role="img" :aria-label="verdict().detail">
                <template x-for="s in stanceSpread()" :key="s.stance">
                  <i :style="`width:${s.pct}%;background:${stanceColor(s.stance)}`" :title="`${s.n} ${s.stance}`"></i>
                </template>
              </div>
              <div class="sv__stances">
                <template x-for="s in stanceSpread()" :key="s.stance">
                  <span class="sv__stance-chip"><i :style="`background:${stanceColor(s.stance)}`"></i><b x-text="s.n"></b> <span x-text="s.stance"></span></span>
                </template>
              </div>
              <dl class="sv__verdict-meta">
                <div><dt>quorum</dt><dd x-text="quorumText()"></dd></div>
                <div x-show="session.swarmRecommendation.meanConfidence != null">
                  <dt>mean confidence</dt><dd x-text="fmtPct(session.swarmRecommendation.meanConfidence)"></dd>
                </div>
                <div x-show="absentNames().length">
                  <dt>absent</dt><dd x-text="absentNames().join(', ')"></dd>
                </div>
              </dl>
            </div>
          </template>
          <!-- WHAT THE SWARM ACTUALLY RECOMMENDED.
               This block was wrapped in <template x-if="!isRollupRecommendation()">,
               and isRollupRecommendation() is true whenever the payload carries
               `quorum` or `stances` — which every published session does. So the
               action table never rendered once, on any session, while the API was
               returning it the whole time: 2 rows, USDC/rotate and rmUSDC/add,
               each with its own rationale. The page showed turnout and a stance
               spread and then simply stopped before the verdict.
               The gate was conflating two independent things. A rollup describes
               HOW the recommendation was reached; `actions` and `bucket_weights`
               are WHAT it says, and both are already self-gating (isBucketWeights()
               requires type === "bucket_weights"; the action row requires a
               non-empty array). Only `rationale` needed the rollup test, and it
               needs it for a different reason — see recommendationRationale(). -->
          <div class="sv__rich-rec" x-show="hasRecommendationDetail()">
            <div class="sv__bucket-bars" x-show="isBucketWeights()">
              <!-- The caption names only the series actually drawn. It used to
                   read "Target open · Actual muted · Recommended accent"
                   unconditionally while the chart rendered Recommended alone,
                   describing two series that were not on screen. -->
              <p class="sv__panel-sub">
                <span x-show="bucketWeights().some(b => b.target != null)">Target open · </span>
                <span x-show="bucketWeights().some(b => b.actual != null)">Actual muted · </span>
                Recommended accent
              </p>
              <div class="sv__bucket-bars-svg" x-html="bucketWeightsBars()"></div>
              <!-- WHICH target. /api/dashboards/allocation serves the single
                   CURRENT framework row, so the target drawn above is dated,
                   and for archived sessions it is frequently dated AFTER the
                   session. Naming its asOf is what keeps the chart a
                   comparison rather than an unqualified claim. -->
              <p class="sv__panel-sub sv__target-asof" data-target-asof
                 x-show="allocationAsOf() && bucketWeights().some(b => b.target != null)">
                Target as published <span x-text="formatDate(allocationAsOf(), 'short')"></span><span
                  x-show="targetPostdatesSession()"> — after this session, so it is shown for reference only</span>
              </p>
              <!-- The finding a reader is here for: did the swarm propose
                   something other than the published target? Withheld when the
                   target postdates the session — see deviatesFromTarget(). -->
              <p class="sv__panel-sub sv__deviates" x-show="deviatesFromTarget()">
                ⚠ deviates from target
              </p>
            </div>
            <p class="sv__body-copy" x-show="recommendationRationale()" x-text="recommendationRationale()"></p>
            <!-- Per-constituent weights. The bucket bars above say how much
                 goes to each bucket; this says what is inside them, which is
                 the question the allocation subject exists to answer. -->
            <div class="sv__within" x-show="withinBucketWeights().length">
              <p class="sv__panel-sub">Within-bucket weights &middot; per-item recommendations</p>
              <template x-for="b in withinBucketWeights()" :key="b.bucket">
                <div class="sv__within-bucket">
                  <p class="sv__within-name" x-text="b.bucket"></p>
                  <ul class="sv__within-list">
                    <template x-for="it in b.items" :key="`${b.bucket}-${it.name}`">
                      <li><span x-text="it.name"></span><b x-text="fmtPct1(it.weight)"></b></li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
            <div class="sv__rec-actions" x-show="recommendationActions().length">
              <template x-for="a in recommendationActions()" :key="`${a.token}-${a.action}`">
                <div class="sv__action-row">
                  <span x-text="a.token"></span>
                  <b x-text="a.action"></b>
                  <p x-text="a.rationale"></p>
                </div>
              </template>
            </div>
          </div>
        </section>

        <section class="sv__discussion" x-show="consensusItems().length || disagreements().length">
          <div class="sv__panel" x-show="consensusItems().length">
            <p class="sv__panel-label">Consensus</p>
            <ul class="sv__bullet-list">
              <!-- inlineMarks, not linkified: consensus entries are single
                   points, so they take bold/links but must not open block
                   elements inside a list item. -->
              <template x-for="item in consensusItems()" :key="item"><li x-html="inlineMarks(item)"></li></template>
            </ul>
          </div>
          <div class="sv__panel sv__panel--accent" x-show="disagreements().length">
            <p class="sv__panel-label">Disagreements</p>
            <div class="sv__disagreements">
              <template x-for="d in disagreements()" :key="d.topic">
                <article class="sv__disagreement">
                  <h3 x-text="d.topic"></h3>
                  <ul>
                    <template x-for="p in d.positions" :key="`${d.topic}-${p.member_id}`">
                      <li>
                        <a :href="`/swarm/members/${p.member_id}`" x-text="memberById(p.member_id)?.name || p.member_id"></a>
                        <!-- The stance spread IS the disagreement — it is what the
                             aggregator sorted on to pick these two members, and it
                             is stated nowhere else in this panel. When the view is
                             an echo of a take printed above, show the spread and
                             link to the take instead of reprinting it. -->
                        <span class="sv__dis-pos">
                          <span class="sv__dis-stance" x-show="takeOf(p.member_id)"
                                :style="stanceStyle(takeOf(p.member_id)?.stance)">
                            <i :style="`background:${stanceColor(takeOf(p.member_id)?.stance)}`"></i>
                            <span x-text="`${takeOf(p.member_id)?.stance} · ${fmtPct(takeOf(p.member_id)?.confidence)}`"></span>
                          </span>
                          <span x-show="!isEcho(p.view)" x-html="inlineMarks(p.view)"></span>
                          <!-- x-if, not x-show: takeHref() throws "missing path
                               param: id" if it is evaluated for a member whose
                               take is not in this response, and x-show still
                               evaluates the binding. -->
                          <template x-if="isEcho(p.view) && takeOf(p.member_id)?.id">
                            <a class="sv__dis-read" x-show="takeHref(takeOf(p.member_id))" :href="takeHref(takeOf(p.member_id))">Read their take →</a>
                          </template>
                        </span>
                      </li>
                    </template>
                  </ul>
                  <p x-show="d.what_settles"><em>Settles when:</em> <span x-text="d.what_settles"></span></p>
                </article>
              </template>
            </div>
          </div>
        </section>

        <section class="sv__takes-section" x-show="takes.length">
          <p class="sv__panel-label">Member submissions</p>
          <div class="sv__table-wrap session-submissions">
            <table class="sv__data-table">
              <thead><tr><th>Member</th><th>Stance</th><th class="sv__num">Confidence</th></tr></thead>
              <tbody>
                <template x-for="t in takes" :key="t.id || t.memberId">
                  <tr><td x-text="t.memberName"></td><td x-text="t.stance"></td><td class="sv__num" x-text="fmtPct(t.confidence)"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <section class="sv__takes-section">
          <p class="sv__panel-label">Member takes</p>
          <div class="sv__takes sv__takes--ported">
            <template x-for="t in takes" :key="t.id || t.memberId">
              <article class="sv__take sv__take--ported">
                <header class="sv__take-head">
                  <div class="sv__take-member">
                    <a class="sv__avatar" :href="`/swarm/members/${t.memberId}`" x-text="initials(t.memberName)"></a>
                    <div>
                      <a class="sv__member-link" :href="`/swarm/members/${t.memberId}`" x-text="t.memberName"></a>
                      <div class="sv__take-lens" x-text="memberLens(t.memberId)"></div>
                    </div>
                  </div>
                  <span class="sv__stance-badge" :style="stanceStyle(t.stance)">
                    <i :style="`background:${stanceColor(t.stance)}`"></i>
                    <span x-text="`${t.stance} · ${fmtPct(t.confidence)}`"></span>
                  </span>
                  <span class="sv__vfy sv__vfy--pin" :class="{ 'sv__vfy--bad': !t.verified && !t.archival, 'sv__vfy--arch': t.archival }"
                        data-verified-badge :data-take-id="t.id" :data-verified-state="verifyLabel(t.verified, t.archival)"
                        tabindex="0" :aria-label="`${verifyLabel(t.verified, t.archival)}. ${verifyTip(t.verified, t.archival)}`">
                    <svg class="sv__vfy-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                      <rect x="1.4" y="1.4" width="13.2" height="13.2" stroke="currentColor" stroke-width="1.2"/>
                      <path :d="verifyPath(t.verified, t.archival)" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
                    </svg>
                    <span class="sv__vfy-label" x-show="!t.verified" x-text="verifyLabel(t.verified, t.archival)"></span>
                    <span class="sv__vfy-tip" aria-hidden="true" x-text="verifyTip(t.verified, t.archival)"></span>
                  </span>
                </header>
                <div class="sv__take-body" x-html="linkified(t.body || '')"></div>
                <a class="sv__memo-link" x-show="source === 'api'" :href="takeHref(t)" data-take-permalink>Verification receipt →</a>
                <a class="sv__memo-link" x-show="t.memoUrl" :href="t.memoUrl" target="_blank" rel="noopener noreferrer">Read memo ↗</a>
              </article>
            </template>
          </div>
        </section>

        <section class="sv__synthesis" x-show="session.synthesis && !synthesisIsEcho()">
          <p class="sv__panel-label">Synthesis</p>
          <div x-html="linkified(session.synthesis)"></div>
        </section>
      </div>
    </template>

    <!-- The page that prints stances, confidence figures and a recommendation
         is the page that most needs to say a member may hold what it argues
         about. See assets/js/app/lib/swarm-disclaimer.js. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>
</section>
