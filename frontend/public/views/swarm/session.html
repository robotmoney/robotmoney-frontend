<!-- Swarm session detail, as a research record (RM-121): a breadcrumb, the
     head, one hairline row of facts, then its sections. What the session
     recommended, the reasoning and where members disagreed, each take, and the
     evidence behind the record. The subject page opens the same way, so a
     session and the subject it reviews read as one document.
     Sections render only when the session carries what they draw. -->
<section class="cv cv--detail" x-data="swarmSessionDetail()">
  <div class="sv__body sv__body--narrow rr">
    <!-- The same skeleton as /swarm and a member's page: it holds the page's
         height, so nothing visible moves when the session lands. -->
    <p class="rm-visually-hidden" role="status" x-show="loading">Loading session</p>
    <div class="sv__skel" x-show="loading" aria-hidden="true">
      <div class="sv__skel-h"></div>
      <div class="sv__skel-cols">
        <div class="sv__skel-box"></div><div class="sv__skel-box"></div><div class="sv__skel-box"></div>
      </div>
      <div class="sv__skel-h"></div>
      <div class="sv__skel-card"></div><div class="sv__skel-card"></div>
    </div>
    <template x-if="error && !loading">
      <div class="rr-head">
        <p class="sv__error" x-text="error"></p>
        <p class="rr-links"><template x-if="!notFound"><button type="button" class="rr-btn" @click="retry()">Try again</button></template><a class="rr-lnk" href="/swarm">All sessions</a></p>
      </div>
    </template>

    <template x-if="!loading && session">
      <div>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <a :href="subjectHref()" x-text="subjectTitle()"></a><span aria-hidden="true">/</span>
          <span aria-current="page" x-text="formatDate(session.date, 'short')"></span>
        </nav>

        <header class="rr-head">
          <p class="sv__eyebrow sv__eyebrow--quiet" x-text="`${subjectKindOf(subject)} · session`">portfolio · session</p>
          <h1 class="sv__detail-title session-title" x-text="subjectTitle()"></h1>
          <p class="rr-when">
            <time :datetime="session.date" x-text="formatDate(session.date, 'long')"></time>
            <template x-if="sessionTime()"><span class="rr-mono" x-text="sessionTime()"></span></template>
            <span :class="phaseClass(session)" x-text="phaseLabel(session)"></span>
          </p>
        </header>

        <div class="rr-meta">
          <span class="rr-meta__i">Takes <b x-text="takes.length"></b></span>
          <template x-if="disagreements().length">
            <span class="rr-meta__i">Disagreements <b x-text="disagreements().length"></b></span>
          </template>
          <template x-if="session.regimeSummary">
            <span class="rr-meta__i">Composite <b x-text="fmtNum(session.regimeSummary?.composite, 3)"></b></span>
          </template>
          <template x-if="session.regimeSummary?.regime">
            <span class="rr-meta__i">Regime
              <i :style="`background:${regimeColor(session.regimeSummary?.regime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.regime)"></b>
            </span>
          </template>
        </div>

        <!-- THE RECOMMENDATION. The mix on the left, the decision and its
             reason on the right: the same arrangement as the subject page's
             latest recommendation, so the explorer sits in one place on both.
             The legend carries each sleeve's move against one basis; the full
             ledger opens only when it holds a figure the legend does not. -->
        <template x-if="hasRecommendationSection()">
          <section class="rr-sec" id="recommendation" aria-labelledby="rec-h">
            <div class="rr-sec__head"><h2 class="rr-sec__h" id="rec-h">The recommendation</h2></div>
            <div class="rr-split" :class="hasExplorer() ? 'rr-split--rule' : 'rr-split--one'">
              <template x-if="hasExplorer()">
                <div>
                  <div class="rr-x" x-data="sleeveExplorer()" @keydown.escape.window="close()" @pointerleave="leave()">
                    <div class="rr-mix">
                      <figure class="rr-ring" @pointerover="overRing($event)" @pointerout="cancelIntent()" @click="clickRing($event)">
                        <span class="sv__wdonut-host" role="img" :aria-label="explorerLabel()"
                              x-html="explorerSvg()"
                              x-effect="active(); $nextTick(() => syncArcs($el))"></span>
                        <figcaption>
                          <b x-show="activeRow() || explorerCenter().value" x-text="activeRow() ? fmtPctTrim(activeRow().pct) : explorerCenter().value"></b>
                          <span x-text="activeRow() ? activeRow().label : explorerCenter().label"></span>
                        </figcaption>
                      </figure>
                      <div class="rr-legend">
                        <template x-for="r in explorerRows()" :key="r.key">
                          <button type="button" class="rr-legend__row" :data-sleeve-btn="r.key"
                                  :class="{ 'is-active': active() === r.key, 'is-zero': !r.pct, 'is-muted': active() && active() !== r.key }"
                                  :aria-expanded="pinned === r.key ? 'true' : 'false'" :aria-controls="`sleeve-${r.key}`"
                                  @pointerenter="preview(r.key, $event)" @pointerleave="cancelIntent()" @focus="preview(r.key)" @blur="leave()" @click="toggle(r.key)">
                            <i data-mark="series" :style="`background:${r.hue}`" aria-hidden="true"></i>
                            <span x-text="r.label"></span>
                            <b x-text="fmtPctTrim(r.pct)"></b>
                            <template x-if="hasBook()"><em class="rr-act" :class="`is-${r.action || 'none'}`" x-text="actionLabel(r.action)"></em></template>
                            <template x-if="r.was != null && r.d">
                              <small>
                                <span class="alp__mv" :class="changeClass(r.d)"><i x-text="changeGlyph(r.d)" aria-hidden="true"></i><span x-text="changeLabel(r.d)"></span></span>
                                <span x-text="` vs ${r.basis} ${fmtPctTrim(r.was)}`"></span>
                              </small>
                            </template>
                          </button>
                        </template>
                      </div>
                    </div>
                    <div class="rr-x__drawer" :class="activeRow() ? 'is-open' : ''" :inert="!activeRow()">
                      <div class="rr-x__clip">
                        <template x-if="panelRow()">
                          <div class="rr-x__panel" :id="`sleeve-${panelRow().key}`" role="region" :aria-label="`${panelRow().label} breakdown`">
                            <div class="rr-x__head">
                              <p><i data-mark="series" :style="`background:${panelRow().hue}`" aria-hidden="true"></i><b x-text="panelRow().label"></b><span x-text="panelRow().meta"></span></p>
                              <template x-if="pinned"><button type="button" class="rr-x__close" @click="close()">Close ×</button></template>
                            </div>
                            <template x-if="panelRow().assets.length">
                              <table class="rr-table rr-x__assets">
                                <thead><tr><th scope="col">Asset</th><th scope="col" class="q">% of sleeve</th><th scope="col" class="q">% of allocation</th></tr></thead>
                                <tbody>
                                  <template x-for="a in panelRow().assets" :key="a.key">
                                    <tr>
                                      <th scope="row"><i data-mark="series" :style="`background:${a.colour}`" aria-hidden="true"></i><span x-text="a.label"></span></th>
                                      <td class="q" x-text="fmtPctTrim(a.ofSleeve)"></td>
                                      <td class="q" x-text="a.ofAllocation == null ? '—' : fmtPctTrim(a.ofAllocation)"></td>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </template>
                            <template x-if="panelRow().action">
                              <p class="rr-x__why"><span x-text="panelRow().rationale"></span></p>
                            </template>
                            <template x-if="!panelRow().assets.length && !panelRow().action">
                              <p class="rr-note" style="margin:0" x-text="hasBook() ? 'No action' : 'No asset weights published'"></p>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                    <span class="rr-sr" role="status" x-text="status"></span>
                  </div>
                  <template x-if="hasBook() && bookDate()">
                    <p class="rr-note" x-text="`Holdings on ${bookDate()}`"></p>
                  </template>
                  <template x-if="hasBook() && notableItems().length">
                    <div class="rr-disc" style="margin-top:1.5rem" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                      <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="book-notable" @click="open = !open">
                        Notable in the book <small x-text="`${notableItems().length} ${notableItems().length === 1 ? 'item' : 'items'}`"></small>
                      </button>
                      <div class="rr-disc__anim" id="book-notable" role="region" aria-label="Notable in the book" :inert="!open">
                        <div class="rr-disc__clip"><div class="rr-disc__body">
                          <ul class="rr-list"><template x-for="n in notableItems()" :key="n"><li x-text="n"></li></template></ul>
                        </div></div>
                      </div>
                    </div>
                  </template>
                  <template x-if="hasLedger()">
                    <div style="margin-top:1.5rem">
                      <div class="rr-disc" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                        <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="rec-ledger" @click="open = !open">
                          Full comparison
                        </button>
                        <div class="rr-disc__anim" id="rec-ledger" role="region" aria-label="Full comparison" :inert="!open">
                          <div class="rr-disc__clip"><div class="rr-disc__body">
                            <!-- The record's compact table, so it fits a phone without a
                                 sideways scroll. The sleeve stays a <td>: the session spec
                                 reads `td:first-child`. -->
                            <div class="rr-tablewrap sr__ledger">
                              <table class="rr-table rr-table--compact">
                                <thead>
                                  <tr>
                                    <th scope="col">Sleeve</th>
                                    <template x-if="hasTargetColumn()"><th scope="col" class="q">Target</th></template>
                                    <template x-if="hasActualColumn()"><th scope="col" class="q">Actual</th></template>
                                    <th scope="col" class="q">Recommended</th>
                                    <th scope="col" class="q">Change</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  <template x-for="b in bucketRows()" :key="b.id || b.name">
                                    <tr>
                                      <td class="sr__sleeve"><i class="alp__dot" data-mark="series" :style="`background:${b.hue}`" aria-hidden="true"></i><span x-text="b.name"></span></td>
                                      <template x-if="hasTargetColumn()"><td class="q" x-text="fmtWeight(b.target)"></td></template>
                                      <template x-if="hasActualColumn()"><td class="q" x-text="fmtWeight(b.actual)"></td></template>
                                      <td class="q" x-text="fmtWeight(b.recommended)"></td>
                                      <td class="q"><span class="alp__mv" :class="changeClass(b.gap)"><i x-text="changeGlyph(b.gap)" aria-hidden="true"></i><span x-text="changeLabel(b.gap)"></span></span></td>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </div>
                          </div></div>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- The subject page's latest-recommendation column: the outcome
                   as a label only where the legend cannot show it (no sleeve
                   moved), then the rationale. The tally and turnout are the
                   vote chart's, below. -->
              <div x-data="{ more: false }">
                <template x-if="outcomeHeadline()">
                  <p class="rr-k rr-sub" x-text="outcomeHeadline()"></p>
                </template>
                <template x-if="recommendationRationale()">
                  <div>
                    <div class="rr-prose" :class="!more && isLong(recommendationRationale(), 480) ? 'is-clamped' : ''" style="--rr-lines:8"
                         x-html="linkified(recommendationRationale())"></div>
                    <template x-if="isLong(recommendationRationale(), 480)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                        <span x-text="more ? 'Show less' : 'Read full rationale'"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="authoredActions().length && !hasBook()">
                  <dl class="sr__acts">
                    <template x-for="a in authoredActions()" :key="`${a.token}-${a.action}`">
                      <div class="sr__act">
                        <dt x-text="a.token"></dt>
                        <dd><em class="rr-act" :class="`is-${String(a.action).toLowerCase()}`" x-text="actionLabel(a.action)"></em><span x-text="a.rationale || ''"></span></dd>
                      </div>
                    </template>
                  </dl>
                </template>
              </div>
            </div>
          </section>
        </template>
        <!-- The same section when a published session drew nothing in it, so
             the page says what every history row linking here says. Before
             publication the phase beside the date says it. -->
        <template x-if="!hasRecommendationSection() && phaseOf(session)?.key === 'published'">
          <section class="rr-sec" id="recommendation" aria-labelledby="rec-h">
            <div class="rr-sec__head"><h2 class="rr-sec__h" id="rec-h">The recommendation</h2></div>
            <p class="rr-note" style="margin-top:0" x-text="session.swarmRecommendation ? 'No position calls published' : 'No recommendation published'"></p>
          </section>
        </template>

        <!-- The book this session reviewed, when the recommendation above did
             not already draw it. A framework subject has none. -->
        <template x-if="snapshot && !hasBook()">
          <section class="rr-sec" id="holdings" aria-labelledby="hold-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="hold-h">Holdings</h2>
              <span class="rr-sec__aside" x-text="[fmtUsd(snapshot?.totalValueUsd), bookDate()].filter(Boolean).join(' · ')"></span>
            </div>
            <!-- The subject page's positions table, every position, largest
                 first: the same book reads the same on both pages. -->
            <div class="rr-tablewrap rr-positions">
              <table class="rr-table rr-table--compact">
                <caption class="rr-sr" x-text="`Positions on ${formatDate(snapshot?.date, 'short')}`"></caption>
                <thead>
                  <tr><th scope="col">Token</th><th scope="col">Chain</th><th scope="col" class="q">Amount</th><th scope="col" class="q">Price</th><th scope="col" class="q">Value</th><th scope="col" class="q">Share</th></tr>
                </thead>
                <tbody>
                  <template x-for="p in positionRows()" :key="`${p.token}-${p.chain}`">
                    <tr>
                      <th scope="row"><i data-mark="series" :style="`background:${holdingColor(p.token)}`" aria-hidden="true"></i><span x-text="p.token"></span></th>
                      <td x-text="chainLabel(p.chain)"></td>
                      <td class="q" :title="p.balance != null ? String(p.balance) : ''" x-text="fmtAmount(p.balance)"></td>
                      <td class="q" x-text="fmtPrice(p.price_usd)"></td>
                      <td class="q" x-text="fmtUsd(p.value_usd)"></td>
                      <td class="q"><span class="rr-share"><i :style="`width:${Math.max(0, Math.min(100, p.share * 100))}%;background:${holdingColor(p.token)}`" aria-hidden="true"></i><span x-text="fmtPct1(p.share)"></span></span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <template x-if="notableItems().length">
              <div class="rr-block" style="margin-top:1.5rem">
                <p class="rr-k rr-sub">Notable</p>
                <ul class="rr-list">
                  <template x-for="n in notableItems()" :key="n"><li x-text="n"></li></template>
                </ul>
              </div>
            </template>
          </section>
        </template>

        <!-- REASONING & DISAGREEMENT. What was written, beside the market
             reading the session was given. -->
        <template x-if="hasDiscussion() || signalRows().length">
          <section class="rr-sec" id="reasoning" aria-labelledby="why-h">
            <div class="rr-sec__head"><h2 class="rr-sec__h" id="why-h">Reasoning &amp; disagreement</h2></div>
            <div class="rr-split">
              <div>
                <template x-if="showSynthesis()">
                  <div class="rr-block" x-data="{ more: false }">
                    <p class="rr-k rr-sub">Synthesis</p>
                    <div class="rr-prose" :class="!more && isLong(session.synthesis, 700) ? 'is-clamped' : ''" style="--rr-lines:10"
                         x-html="linkified(session.synthesis)"></div>
                    <template x-if="isLong(session.synthesis, 700)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                        <span x-text="more ? 'Show less' : 'Read full synthesis'"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="!showSynthesis() && !consensusItems().length && !disagreements().length">
                  <p class="rr-note" style="margin-top:0">No written synthesis</p>
                </template>
              </div>
              <template x-if="signalRows().length">
                <div>
                  <!-- The reading this session was given. The regime label itself
                       is in the facts row at the top; this is its evidence. -->
                  <div class="rr-context">
                    <div class="rr-context__head">
                      <p class="rr-k">Market context</p>
                    </div>
                    <div class="sig" role="img"
                         :aria-label="`Percentile against its own three-year history: ${signalRows().map((r) => `${r.label} ${ordinal(r.pct)}`).join(', ')}.`">
                      <div class="sig__scale" aria-hidden="true">
                        <span></span>
                        <span class="sig__ticks">
                          <template x-for="z in signalZones()" :key="z.key">
                            <em class="sig__zone" :style="`left:${z.left};width:${z.width}`" x-text="z.label"></em>
                          </template>
                          <b style="left:0">0</b><b style="left:50%">50th</b><b style="left:100%">100</b>
                        </span>
                        <span></span>
                      </div>
                      <template x-for="r in signalRows()" :key="r.key">
                        <div class="sig__row" :class="`is-${r.kind}`">
                          <span class="sig__l" x-text="r.label"></span>
                          <span class="sig__track">
                            <b class="sig__mid"></b>
                            <template x-for="c in signalCuts()" :key="c"><b class="sig__cut" :style="`left:${c}`"></b></template>
                            <i class="sig__dot" :style="`left:${r.at};` + (r.kind === 'context' ? '' : `background:${regimeColor(r.regime)}`)"></i>
                          </span>
                          <span class="sig__v" x-text="ordinal(r.pct)"></span>
                        </div>
                      </template>
                    </div>
                    <p class="rr-note">Three-year percentile<template x-if="!backdropV0"><span> · factor not in composite</span></template></p>
                  </div>
                </div>
              </template>
            </div>

            <!-- Where the room agreed and where it split, side by side and
                 closed until asked for: the synthesis above already says what
                 was argued. A disagreement opens onto each member's view. -->
            <template x-if="consensusItems().length || disagreements().length">
              <div class="rr-split rr-pair">
                <template x-if="consensusItems().length">
                  <div class="rr-disc rr-disc--lead" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                    <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="members-agree" @click="open = !open">
                      Where members agree <small x-text="`${consensusItems().length} ${consensusItems().length === 1 ? 'point' : 'points'}`"></small>
                    </button>
                    <div class="rr-disc__anim" id="members-agree" role="region" aria-label="Where members agree" :inert="!open">
                      <div class="rr-disc__clip"><div class="rr-disc__body">
                        <ul class="rr-list">
                          <template x-for="item in consensusItems()" :key="item"><li x-html="inlineMarks(item)"></li></template>
                        </ul>
                      </div></div>
                    </div>
                  </div>
                </template>
                <template x-if="disagreements().length">
                  <div class="rr-disc rr-disc--lead" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                    <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="views-differ" @click="open = !open">
                      Where views differ
                    </button>
                    <div class="rr-disc__anim" id="views-differ" role="region" aria-label="Where views differ" :inert="!open">
                      <div class="rr-disc__clip"><div class="rr-disc__body">
                        <template x-for="d in disagreements()" :key="d.topic">
                          <div class="rr-disc rr-q" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                            <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" @click="open = !open">
                              <span><b x-text="d.topic"></b></span>
                              <small x-text="`${(d.positions || []).length} views`"></small>
                            </button>
                            <div class="rr-disc__anim" role="region" :aria-label="d.topic" :inert="!open">
                              <div class="rr-disc__clip"><div class="rr-disc__body">
                                <div class="rr-views rr-views--stack">
                                  <template x-for="p in (d.positions || [])" :key="`${d.topic}-${p.member_id}`">
                                    <div class="rr-view">
                                      <a class="rr-lnk" style="justify-self:start" :href="memberHref(p.member_id)" x-text="memberById(p.member_id)?.name || takeOf(p.member_id)?.memberName || p.member_id"></a>
                                      <template x-if="!takeOf(p.member_id)"><span class="rr-note" style="margin:0">No take</span></template>
                                      <template x-if="!isEcho(p.view)"><p x-html="inlineMarks(p.view)"></p></template>
                                      <template x-if="isEcho(p.view) && takeOf(p.member_id)">
                                        <p><a class="rr-lnk" :href="`#${takeAnchor(takeOf(p.member_id))}`">Read their take →</a></p>
                                      </template>
                                    </div>
                                  </template>
                                </div>
                                <template x-if="d.what_settles">
                                  <p class="rr-settles"><span class="rr-k">What would settle it</span><br><span x-text="d.what_settles"></span></p>
                                </template>
                              </div></div>
                            </div>
                          </div>
                        </template>
                      </div></div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </section>
        </template>

        <!-- TAKES. How the room voted, then each take, led by its call. -->
        <template x-if="takes.length">
          <section class="rr-sec sv__takes-section" id="takes" aria-labelledby="takes-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="takes-h">Member takes</h2>
            </div>
            <!-- The vote, as a chart: each member placed by the stance they
                 took (across) and how sure they were (up), the mean confidence
                 as a dashed rule. The consensus is stated as a fact above it,
                 not as a headline. Each dot is a way to that member's take. -->
            <template x-if="voteDots().length">
              <figure class="rr-vote" x-data="{ at: null }">
                <figcaption class="rr-vote__sum">
                  <!-- The consensus as the same chip a take's stance wears; a
                       tie reads "split" in the neutral chip. -->
                  <span class="rr-meta__i">Consensus
                    <span class="sv__stance-badge" :style="leanBadgeStyle(reviewRow())" :title="leanStance(reviewRow()) ? null : consensusText()">
                      <template x-if="leanStance(reviewRow())"><i :style="leanDotStyle(reviewRow())" aria-hidden="true"></i></template>
                      <span x-text="leanLabel(reviewRow())"></span>
                    </span>
                    <template x-if="leadShare(reviewRow())"><em class="rr-vote__share" x-text="leadShare(reviewRow())"></em></template>
                  </span>
                  <template x-if="absentNames().length">
                    <span class="rr-meta__i">Absent
                      <template x-for="id in (session.swarmRecommendation?.absent || [])" :key="id">
                        <a class="rr-lnk" :href="memberHref(id)" x-text="memberById(id)?.name || id"></a>
                      </template>
                    </span>
                  </template>
                </figcaption>
                <p class="rr-k rr-vote__ytitle" aria-hidden="true">Confidence</p>
                <div class="rr-area__frame rr-vote__frame">
                  <div class="rr-area__y" aria-hidden="true">
                    <template x-for="t in voteDomain().ticks" :key="t.v"><span :style="`top:${100 - t.pos}%`" x-text="`${t.v}%`"></span></template>
                  </div>
                  <div class="rr-vote__plot" role="img" :aria-label="voteLabel()">
                    <template x-for="t in voteDomain().ticks" :key="`g${t.v}`"><i class="rr-vote__grid" :style="`top:${100 - t.pos}%`" aria-hidden="true"></i></template>
                    <template x-for="c in [1, 2, 3, 4]" :key="`c${c}`"><i class="rr-vote__col" :style="`left:${c * 20}%`" aria-hidden="true"></i></template>
                    <template x-if="voteMean() !== null">
                      <div class="rr-vote__mean" :style="`top:${100 - votePos(voteMean())}%`"><span x-text="`Mean ${voteMean()}%`"></span></div>
                    </template>
                    <template x-for="d in voteDots()" :key="d.key">
                      <a class="rr-vote__dot" :class="{ 'is-flip': d.flip, 'is-dim': at && at !== d.key }" :href="`#${d.anchor}`"
                         :style="`left:${d.x}%;top:${100 - d.pos}%;--c:${d.color}`"
                         @pointerenter="at = d.key" @pointerleave="at = null" @focus="at = d.key" @blur="at = null"
                         :aria-label="`${d.name}, ${d.stance}, ${d.y}% confidence. Read their take.`">
                        <i aria-hidden="true"></i><span x-text="d.name"></span><b x-text="`${d.y}%`"></b>
                      </a>
                    </template>
                  </div>
                  <div class="rr-area__x rr-vote__x" aria-hidden="true">
                    <template x-for="(c, i) in ['bearish', 'cautious', 'neutral', 'constructive', 'bullish']" :key="c">
                      <span :style="`left:${10 + i * 20}%;--c:${stanceColor(c)}`" :class="voteLeanStance() === c ? 'is-on' : ''"><i></i><em x-text="c"></em><em class="is-short" x-text="c.slice(0, 4)"></em></span>
                    </template>
                  </div>
                </div>
              </figure>
            </template>

            <div class="rr-takes">
              <template x-for="t in takes" :key="t.memberId || t.id">
                <article class="rr-take" :id="takeAnchor(t)" x-data="takeCard()">
                  <!-- In a session, the card names WHO filed it; the subject is
                       the page's. On a member's page it names WHAT it was
                       about instead. Everything else is the same card. -->
                  <div class="rr-take__top">
                    <div class="rr-take__who">
                      <a class="sv__avatar sv__avatar--mark" :href="memberHref(t.memberId)" :aria-label="t.memberName"
                         x-html="memberMark(t.memberKeyFingerprint || t.memberId, t.memberName, 36, memberById(t.memberId)?.avatar?.path, memberById(t.memberId)?.handle)"></a>
                      <div>
                        <a class="rr-take__name sv__member-link" :href="memberHref(t.memberId)" x-text="t.memberName"></a>
                        <div class="rr-take__lens sv__take-lens" x-text="memberLens(t.memberId)"></div>
                      </div>
                    </div>
                    <div class="rr-take__stance">
                      <span class="sv__stance-badge" :style="stanceStyle(t.stance)">
                        <i :style="`background:${stanceColor(t.stance)}`"></i><span x-text="t.stance"></span>
                      </span>
                      <template x-if="Number.isFinite(Number(t.confidence))">
                        <span class="rr-conf">Confidence <b x-text="fmtPct(t.confidence)"></b></span>
                      </template>
                      <a class="sv__vfy rr-vfy" :href="takeHref(t) || undefined" :class="{ 'sv__vfy--bad': !t.verified && !t.archival, 'sv__vfy--arch': t.archival }"
                            data-verified-badge :data-take-id="t.id" :data-verified-state="verifyLabel(t.verified, t.archival)"
                            tabindex="0" :aria-label="`${verifyLabel(t.verified, t.archival)}. ${verifyTip(t.verified, t.archival)}`">
                        <svg class="sv__vfy-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                          <rect x="1.4" y="1.4" width="13.2" height="13.2" stroke="currentColor" stroke-width="1.2"/>
                          <path :d="verifyPath(t.verified, t.archival)" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
                        </svg>
                        <span class="sv__vfy-label" x-text="verifyLabel(t.verified, t.archival)"></span>
                        <span class="sv__vfy-tip" aria-hidden="true" x-text="verifyTip(t.verified, t.archival)"></span>
                      </a>
                    </div>
                  </div>
                  <!-- Closed, a structured take leads with the member's CALL, the section
                       about the subject under review, not the regime notes every take opens
                       with. Open, the whole take in its own order. The card grows and shrinks
                       by height (lib/take-card.js). -->
                  <div class="rr-take__main" :class="weightRows(t).length ? 'has-aside' : ''">
                    <div>
                      <div class="rr-take__text" x-ref="text">
                        <!-- No section label over the excerpt: the page names the
                             subject, and "On this portfolio" said it again. -->
                        <template x-if="!open && call(t.body)">
                          <div class="sv__take-body rr-prose" x-html="linkified(call(t.body).text)"></div>
                        </template>
                        <template x-if="open || !call(t.body)">
                          <div class="sv__take-body rr-prose" :class="!open && long(t.body) ? 'is-clamped' : ''" style="--rr-lines:5" x-html="linkified(t.body || '')"></div>
                        </template>
                      </div>
                      <template x-if="call(t.body) || long(t.body)">
                        <button type="button" class="rr-more" @click="toggle()" :aria-expanded="open ? 'true' : 'false'">
                          <span x-text="open ? 'Show less' : 'Read full take'"></span>
                        </button>
                      </template>
                      <!-- A memo the member attached to the take. The shared card
                           dropped it; a live take can carry one. -->
                      <template x-if="memoHref(t.memoUrl)">
                        <a class="rr-lnk sv__memo-link" :href="memoHref(t.memoUrl)" target="_blank" rel="noopener noreferrer">Read memo ↗</a>
                      </template>
                    </div>
                    <template x-if="weightRows(t).length">
                      <aside class="rr-take__aside">
                        <p class="rr-k rr-sub">Proposed weights</p>
                        <ul class="rr-legend">
                          <template x-for="w in weightRows(t)" :key="w.key">
                            <li :class="w.pct > 0 ? '' : 'is-zero'"><i data-mark="series" :style="`background:${w.colour}`" aria-hidden="true"></i><span x-text="w.label"></span><b x-text="pct(w.pct)"></b></li>
                          </template>
                        </ul>
                      </aside>
                    </template>
                  </div>
                </article>
              </template>
            </div>
          </section>
        </template>

        <!-- EVIDENCE. Whether the takes are signed, what the session was
             handed, and where the raw record lives. -->
        <section class="rr-sec" id="evidence" aria-labelledby="ev-h">
          <div class="rr-sec__head"><h2 class="rr-sec__h" id="ev-h">Evidence &amp; provenance</h2></div>
          <div class="rr-split">
            <template x-if="takes.length"><div><p class="rr-k rr-sub" x-text="signatureHeadline()"></p></div></template>
            <dl class="rr-dl">
              <template x-if="source === 'api'">
                <div><dt>Consensus receipt</dt><dd>
                  <span x-text="receiptStatus"></span>
                  <template x-if="receiptStatus === 'Verified' || receiptStatus === 'Not verified'">
                    <span> · <a :href="receiptHref()" target="_blank" rel="noopener">Read receipt ↗</a></span>
                  </template>
                </dd></div>
              </template>
              <template x-if="(session.generatedAt || session.generated_at) && generatedLabel() !== sessionTime()">
                <div><dt>Record generated</dt><dd><time :datetime="session.generatedAt || session.generated_at" x-text="generatedLabel()"></time></dd></div>
              </template>
              <!-- Weights sessions only: a portfolio's targets are in its brief,
                   and this row could only contradict them. -->
              <template x-if="isBucketWeights()"><div><dt>Target</dt><dd x-text="targetPolicyLabel()"></dd></div></template>
              <div><dt>Session record</dt><dd><a :href="sessionJsonHref()" target="_blank" rel="noopener">Session JSON ↗</a></dd></div>
              <template x-if="brief">
                <div><dt>Session inputs</dt><dd><a :href="briefJsonHref()" target="_blank" rel="noopener">Brief JSON ↗</a></dd></div>
              </template>
            </dl>
          </div>

          <template x-if="handoverParts().length">
            <div class="rr-disc" style="margin-top:2.25rem" x-data="{ open: false }" :class="open ? 'is-open' : ''">
              <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="session-handover" @click="open = !open">
                What the swarm was handed
              </button>
              <div class="rr-disc__anim" id="session-handover" role="region" aria-label="What the swarm was handed" :inert="!open">
                <div class="rr-disc__clip"><div class="rr-disc__body">
                  <dl class="hand">
                    <template x-for="part in handoverParts()" :key="part.key">
                      <div class="hand__row" :data-part="part.key">
                        <dt x-text="part.label"></dt>
                        <dd>
                          <template x-if="part.quote"><q x-text="part.quote"></q></template>
                          <template x-if="part.facts">
                            <div class="sv__fact-row">
                              <template x-for="f in part.facts" :key="f.key">
                                <span class="sv__fact">
                                  <em x-text="f.k"></em>
                                  <template x-if="f.dot"><i class="sv__fact-dot" :style="`background:${f.dot}`" aria-hidden="true"></i></template>
                                  <b x-text="f.v"></b>
                                </span>
                              </template>
                            </div>
                          </template>
                          <template x-if="part.bars">
                            <div class="sv__sleeves">
                              <template x-for="t in part.bars" :key="t.key">
                                <div class="sv__sleeve">
                                  <span class="sv__sleeve-n"><i class="sv__bucket-dot" :style="`background:${t.hue}`" aria-hidden="true"></i><span x-text="t.label"></span></span>
                                  <span class="sv__sleeve-track"><i :style="`width:${Math.max(0, Math.min(100, t.pct))}%`"></i></span>
                                  <span class="sv__sleeve-v" x-text="`${t.pct}%`"></span>
                                </div>
                              </template>
                            </div>
                          </template>
                          <template x-if="part.links">
                            <ul class="hand__links">
                              <template x-for="l in part.links" :key="l.key">
                                <li>
                                  <template x-if="l.href"><a class="rm-link" :href="l.href" x-text="l.text"></a></template>
                                  <template x-if="!l.href"><span x-text="l.text"></span></template>
                                </li>
                              </template>
                            </ul>
                          </template>
                          <template x-if="part.pills">
                            <span class="hand__pills">
                              <template x-for="p in part.pills" :key="p.key">
                                <span class="hand__pill-wrap">
                                  <template x-if="p.href"><a class="rr-lnk" :href="p.href" x-text="p.text"></a></template>
                                  <template x-if="!p.href"><span class="hand__pill" x-text="p.text"></span></template>
                                </span>
                              </template>
                            </span>
                          </template>
                          <template x-if="part.list">
                            <ul><template x-for="n in part.list" :key="n.key"><li x-text="n.text"></li></template></ul>
                          </template>
                        </dd>
                      </div>
                    </template>
                  </dl>
                </div></div>
              </div>
            </div>
          </template>
        </section>

        <nav class="rr-recnav" aria-label="Session navigation">
          <span><template x-if="neighbours.older"><a :href="sessionHrefOf(neighbours.older)" x-text="`← ${formatDate(neighbours.older.date, 'short')}`"></a></template></span>
          <a :href="subjectHref()">All sessions on this subject</a>
          <span><template x-if="neighbours.newer"><a :href="sessionHrefOf(neighbours.newer)" x-text="`${formatDate(neighbours.newer.date, 'short')} →`"></a></template></span>
        </nav>
      </div>
    </template>

    <!-- The page that prints stances, confidence figures and a recommendation
         is the page that most needs to say a member may hold what it argues
         about. See assets/js/app/lib/swarm-disclaimer.js. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>

  <style>
    /* Page-local: the handful of pieces only this page has. The record's
       components are shared in views.css (.rr-*). */
    .sr__foot .sv__take-absent-who { font-size: inherit; font-weight: 400; color: var(--color-text-soft);
      text-decoration: underline; text-decoration-color: var(--color-border-light); text-underline-offset: 3px; }
    .sr__foot .sv__take-absent-who + .sv__take-absent-who::before { content: ","; display: inline-block;
      margin-right: 0.35em; text-decoration: none; color: var(--color-text-muted); }
    .sv__vfy--inline { font-family: var(--font-mono); font-size: 0.6875rem; text-transform: none; letter-spacing: 0; }
    .rr-split--one { grid-template-columns: minmax(0, 1fr); }
    /* .rr-positions spaces itself off the subject page's total; here the
       section head above already does. */
    .rr-sec__head + .rr-positions { margin-top: 0; }
    /* The legacy .sv__takes-section margin would stack on .rr-sec's padding;
       the class stays because a spec locates it. */
    .rr-sec.sv__takes-section { margin-top: 0; }
    /* The sleeve is a name, not a figure: set in the text face. */
    .sr__ledger td.sr__sleeve { font-family: var(--font-sans); color: var(--color-text); }
    @media (max-width: 640px) { .sr__ledger .rr-table th, .sr__ledger .rr-table td { padding-inline: 0.375rem; } }
  </style>
</section>
