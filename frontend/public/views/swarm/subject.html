<!-- Public swarm subject page, as a research record (RM-121). It opens the way
     a session opens (breadcrumb, head, one hairline row of facts), then:
     the latest recommendation and why, the book when the subject has one, and
     the recommendation history, one row per session. A session and the subject
     it reviews read as one document.
     Sections render only when the subject carries what they draw. -->
<section class="cv cv--detail" x-data="subjectProfile()">
  <div class="sv__body sv__body--narrow rr">
    <!-- The same skeleton as /swarm and a member's page: it holds the page's
         height, so nothing visible moves when the subject lands. -->
    <p class="rm-visually-hidden" role="status" x-show="loading">Loading subject</p>
    <div class="sv__skel" x-show="loading" aria-hidden="true">
      <div class="sv__skel-h"></div>
      <div class="sv__skel-cols">
        <div class="sv__skel-box"></div><div class="sv__skel-box"></div><div class="sv__skel-box"></div>
      </div>
      <div class="sv__skel-h"></div>
      <div class="sv__skel-card"></div><div class="sv__skel-card"></div>
    </div>
    <!-- x-if, not x-show: a hidden error node is still an error node for a
         reader's find-in-page and for a test's locator. -->
    <template x-if="error"><div class="rr-head"><p class="sv__error" x-text="error"></p><p class="rr-links"><a class="rr-lnk" href="/swarm">Swarm</a></p></div></template>

    <template x-if="!loading && subject">
      <div>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <span aria-current="page" x-text="subject.name"></span>
        </nav>

        <header class="rr-head">
          <!-- The operator is named only when it is not this house: peaq
               running Woon Treasury is the fact the slot exists for. -->
          <p class="sv__eyebrow sv__eyebrow--quiet"><span x-text="subjectKind()">portfolio</span><template x-if="operatorLabel()"><span> · operator <span x-text="operatorLabel()"></span></span></template></p>
          <h1 class="sv__detail-title" x-text="subject.name"></h1>
          <template x-if="subjectLede()"><p class="sv__lede sv__lede--compact" x-text="subjectLede()"></p></template>
          <template x-if="subject.homepage || subject.xHandle">
            <p class="rr-links sp-links">
              <template x-if="subject.homepage">
                <a class="rr-lnk" :href="subject.homepage" rel="noopener noreferrer" target="_blank" x-text="hostOf(subject.homepage)"></a>
              </template>
              <template x-if="subject.xHandle">
                <a class="rr-lnk" :href="`https://x.com/${String(subject.xHandle).replace(/^@/, '')}`" rel="noopener noreferrer" target="_blank"
                   x-text="'@' + String(subject.xHandle).replace(/^@/, '')"></a>
              </template>
            </p>
          </template>
        </header>

        <!-- The facts only this row states. The latest session's date is the
             way into it, below; the book's total is the Holdings figure; and
             with no session the history says so where the list would be. The
             row itself goes when none of its items would draw. -->
        <div class="rr-meta" x-show="sessionCount() || (backdrop && backdrop.composite !== null) || backdrop?.regime || isFramework()">
          <template x-if="sessionCount()"><span class="rr-meta__i">Sessions <b x-text="sessionCount()"></b></span></template>
          <template x-if="backdrop && backdrop.composite !== null">
            <span class="rr-meta__i">Composite <b x-text="fmtNum(backdrop?.composite, 3)"></b></span>
          </template>
          <template x-if="backdrop?.regime">
            <span class="rr-meta__i">Regime
              <i :style="`background:${regimeColor(backdrop?.regime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(backdrop?.regime)"></b>
            </span>
          </template>
          <template x-if="isFramework()">
            <a class="rr-meta__lnk" href="/allocation">Asset allocation</a>
          </template>
        </div>

        <!-- THE LATEST RECOMMENDATION. The mix (or the actions) on the
             left; what it proposes and why on the right, and the one prominent
             way into the session. Before the first session, the ring's bare
             track with the fact inside. -->
        <template x-if="!latest()">
          <section class="rr-sec" id="latest" aria-labelledby="latest-h">
            <div class="rr-sec__head"><h2 class="rr-sec__h" id="latest-h">Latest recommendation</h2></div>
            <figure class="rr-ring rr-ring--empty">
              <svg class="sv__wdonut" viewBox="0 0 42 42" aria-hidden="true" focusable="false"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--color-border)" stroke-width="4"></circle></svg>
              <figcaption><span class="rr-empty__t">No recommendation yet</span></figcaption>
            </figure>
          </section>
        </template>
        <template x-if="latest()">
          <section class="rr-sec" id="latest" aria-labelledby="latest-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="latest-h" x-text="hasLatestRecommendation() ? 'Latest recommendation' : 'Latest session'">Latest recommendation</h2>
            </div>
            <!-- Its newest session set no weights, so the target stood: the
                 recommendation below is the one in force, and this names the
                 newer session and since when, as /swarm and /allocation do. -->
            <template x-if="heldBy()">
              <div class="rr-meta rr-meta--lead">
                <span class="rr-meta__i">Latest session <b><a class="rr-lnk" :href="sessionHref(heldBy())" x-text="formatDate(heldBy().date, 'short')"></a></b></span>
                <span class="rr-meta__i">Recommendation <b>Held since <span x-text="formatDate(latest().date, 'short')"></span></b></span>
              </div>
            </template>
            <div class="rr-split rr-split--rule">
              <div>
                <template x-if="hasExplorer()">
                  <div>
                    <div class="rr-x" x-data="sleeveExplorer()" @keydown.escape.window="close()" @pointerleave="leave()">
                      <div class="rr-mix">
                        <figure class="rr-ring" @pointerover="overRing($event)" @pointerout="cancelIntent()" @click="clickRing($event)">
                          <span class="sv__wdonut-host" role="img" :aria-label="explorerLabel()"
                                x-html="explorerSvg()"
                                x-effect="active(); $nextTick(() => syncArcs($el))"></span>
                          <figcaption>
                            <b x-show="activeRow() || explorerCenter().value" x-text="activeRow() ? fmtPctTrim(activeRow().pct) : explorerCenter().value"></b>
                            <span x-text="activeRow() ? activeRow().label : explorerCenter().label"></span>
                          </figcaption>
                        </figure>
                        <div class="rr-legend" :class="legendBasis() ? 'rr-legend--cols' : ''">
                          <template x-if="legendBasis()">
                            <div class="rr-legend__head" aria-hidden="true"><span></span><span>Sleeve</span><span>Weight</span><span x-text="legendBasis()"></span><span>Change</span></div>
                          </template>
                          <template x-for="r in explorerRows()" :key="r.key">
                            <button type="button" class="rr-legend__row" :data-sleeve-btn="r.key"
                                    :class="{ 'is-active': active() === r.key, 'is-zero': !r.pct, 'is-muted': active() && active() !== r.key }"
                                    :aria-expanded="pinned === r.key ? 'true' : 'false'" :aria-controls="`sleeve-${r.key}`"
                                    @pointerenter="preview(r.key, $event)" @pointerleave="cancelIntent()" @focus="preview(r.key)" @blur="leave()" @click="toggle(r.key)">
                              <i data-mark="series" :style="`background:${r.hue}`" aria-hidden="true"></i>
                              <span><span class="rr-legend__l" x-text="r.label"></span><template x-if="legendBasis() && bucketShort(r.key)"><span class="rr-legend__s" aria-hidden="true" x-text="bucketShort(r.key)"></span></template></span>
                              <b x-text="fmtPctTrim(r.pct)"></b>
                              <template x-if="hasBook()"><em class="rr-act" :class="`is-${r.action || 'none'}`" x-text="actionLabel(r.action)"></em></template>
                              <template x-if="hasBook() && r.worth"><small class="rr-worth" x-text="r.worth"></small></template>
                              <!-- Against the basis, in its own columns: the weight it is set against,
                                   and the move in percentage points (empty when it did not move).
                                   Not while the vault stack's Holdings shows the devnet fixture:
                                   this measures the real book, and the book below is a different one. -->
                              <template x-if="legendBasis()"><span class="rr-legend__was"><span class="rr-sr" x-text="`${legendBasis()} `"></span><span x-text="r.was == null || stackOnDevnet() ? '—' : fmtPctTrim(r.was)"></span></span></template>
                              <template x-if="legendBasis()"><span class="rr-legend__d"><span class="rr-sr" x-show="r.d">Change </span><template x-if="r.d && !stackOnDevnet()"><span class="alp__mv" :class="changeClass(r.d)" x-text="changeLabel(r.d)"></span></template></span></template>
                            </button>
                          </template>
                        </div>
                      </div>
                      <div class="rr-x__drawer" :class="activeRow() ? 'is-open' : ''" :inert="!activeRow()">
                        <div class="rr-x__clip">
                          <template x-if="panelRow()">
                            <div class="rr-x__panel" :id="`sleeve-${panelRow().key}`" role="region" :aria-label="`${panelRow().label} breakdown`">
                              <div class="rr-x__head">
                                <p><i data-mark="series" :style="`background:${panelRow().hue}`" aria-hidden="true"></i><b x-text="panelRow().label"></b><template x-if="bucketNote(panelRow().key)"><span class="rm-tip"><button class="rm-tip__btn" type="button" :aria-label="`About ${panelRow().label}`">i</button><span class="rm-tip__bub" role="tooltip" x-text="bucketNote(panelRow().key)"></span></span></template><span x-text="panelRow().meta"></span></p>
                                <template x-if="pinned"><button type="button" class="rr-x__close" @click="close()">Close ×</button></template>
                              </div>
                              <template x-if="panelRow().assets.length">
                                <table class="rr-table rr-x__assets">
                                  <thead><tr><th scope="col">Asset</th><th scope="col" class="q">% of sleeve</th><th scope="col" class="q">% of allocation</th></tr></thead>
                                  <tbody>
                                    <template x-for="a in panelRow().assets" :key="a.key">
                                      <tr>
                                        <th scope="row"><i data-mark="series" :style="`background:${a.colour}`" aria-hidden="true"></i><span x-text="a.label"></span></th>
                                        <td class="q" x-text="fmtPctTrim(a.ofSleeve)"></td>
                                        <td class="q" x-text="a.ofAllocation == null ? '—' : fmtPctTrim(a.ofAllocation)"></td>
                                      </tr>
                                    </template>
                                  </tbody>
                                </table>
                              </template>
                              <template x-if="panelRow().action">
                                <p class="rr-x__why"><span x-text="panelRow().rationale"></span></p>
                              </template>
                              <template x-if="!panelRow().assets.length && !panelRow().action">
                                <p class="rr-note" style="margin:0" x-text="hasBook() ? 'No action' : 'No asset weights published'"></p>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                      <span class="rr-sr" role="status" x-text="status"></span>
                    </div>
                    <template x-if="hasBook() && String(latestBook()?.date || '').slice(0, 10) !== String(latest().date || '').slice(0, 10)">
                      <p class="rr-note" x-text="`Holdings on ${formatDate(latestBook()?.date, 'short')}`"></p>
                    </template>
                  </div>
                </template>
                <!-- Member-authored actions only: a rollup's two hardcoded rows
                     are left out here as they are on the session page. -->
                <template x-if="authoredActionsOf(latest()).length && !hasBook()">
                  <dl class="sr__acts">
                    <template x-for="a in authoredActionsOf(latest())" :key="`${a.token}-${a.action}`">
                      <div class="sr__act">
                        <dt x-text="a.token"></dt>
                        <dd><em class="rr-act" :class="`is-${String(a.action).toLowerCase()}`" x-text="actionLabel(a.action)"></em><span x-text="a.rationale || ''"></span></dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <!-- A weights subject's session with no weights reads as /swarm
                     reads it: the ring's bare track. -->
                <template x-if="isWeightsSubject() && recommendation(latest())?.kind !== 'weights'">
                  <figure class="rr-ring rr-ring--empty">
                    <svg class="sv__wdonut" viewBox="0 0 42 42" aria-hidden="true" focusable="false"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--color-border)" stroke-width="4"></circle></svg>
                    <figcaption><span class="rr-empty__t" x-text="latest()?.swarmRecommendation ? 'No weights published' : 'No recommendation published'"></span></figcaption>
                  </figure>
                </template>
                <template x-if="!isWeightsSubject() && ((recommendation(latest())?.kind === 'actions' && !authoredActionsOf(latest()).length) || recommendation(latest())?.kind === 'none')">
                  <p class="rr-note" style="margin-top:0">No actions published</p>
                </template>
                <template x-if="!isWeightsSubject() && !recommendation(latest())">
                  <p class="rr-note" style="margin-top:0">No recommendation published</p>
                </template>

                <!-- The weights in force, on the page about them. Behind a
                     disclosure: the latest review already compares against the
                     target its own session was handed. -->
                <template x-if="hasTargetsCard()">
                  <div class="rr-disc" style="margin-top:1.5rem" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                    <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="targets-in-force" @click="open = !open">
                      <span x-text="allocationTitle()">Target weights in force</span>
                      <small x-show="allocationAsOf()" x-text="`Since ${allocationAsOf()}`"></small>
                    </button>
                    <div class="rr-disc__anim" id="targets-in-force" role="region" :aria-label="allocationTitle()" :inert="!open">
                      <div class="rr-disc__clip"><div class="rr-disc__body">
                        <div class="sv__sleeves sp-alloc__body" style="max-width:none">
                          <template x-for="t in allocationTargets()" :key="t.label">
                            <div class="sv__sleeve">
                              <span class="sv__sleeve-n"><i class="sv__bucket-dot" :style="`background:${t.hue}`" aria-hidden="true"></i><span x-text="t.label"></span></span>
                              <template x-if="sleeveBar(t) !== null">
                                <span class="sv__sleeve-track"><i :style="`width:${sleeveBar(t)}%`"></i></span>
                              </template>
                              <template x-if="sleeveBar(t) === null"><span></span></template>
                              <span class="sv__sleeve-v" x-text="t.pct === null ? '—' : `${t.pct}%`"></span>
                            </div>
                          </template>
                        </div>
                      </div></div>
                    </div>
                  </div>
                </template>
              </div>

              <div x-data="{ more: false }">
                <!-- Only what the legend cannot show: that no sleeve moved, or
                     that there was no target to move from. A count of moves
                     or actions is the legend's rows. -->
                <template x-if="recommendation(latest())?.kind === 'weights' && !(latestMoves() || []).length && latestOutcome()">
                  <p class="rr-k rr-sub" x-text="latestOutcome()"></p>
                </template>
                <template x-if="latestProse()">
                  <div>
                    <!-- Words a judge wrote carry its name. -->
                    <template x-if="rationaleJudgeLabel(latest(), judgeRoster)">
                      <p class="rr-k rr-sub" x-html="rationaleJudgeLabel(latest(), judgeRoster)"></p>
                    </template>
                    <div class="rr-prose" :class="!more && isLong(latestProse(), 480) ? 'is-clamped' : ''" style="--rr-lines:8"
                         x-html="linkified(latestProse())"></div>
                    <template x-if="isLong(latestProse(), 480)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                        <span x-text="more ? 'Show less' : (rationaleOf(latest()) ? 'Read full rationale' : 'Read full synthesis')"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="stanceTally(latest()).length">
                  <p class="rr-counts">
                    <template x-for="x in stanceTally(latest())" :key="x.stance">
                      <span :style="`color:${stanceColor(x.stance)}`"><i :style="`background:${stanceColor(x.stance)}`" aria-hidden="true"></i><span x-text="x.stance"></span><b x-text="x.n"></b></span>
                    </template>
                    <em x-text="[latest().swarmRecommendation?.quorum ? quorumText(latest(), judgeRoster) : '', meanConfidenceText(latest())].filter(Boolean).join(' · ')"></em>
                  </p>
                </template>
                <a class="rr-cta" :href="sessionHref(latest())">
                  <span x-text="`Read the ${formatDate(latest().date, 'short')} session`"></span><span aria-hidden="true">→</span>
                </a>
              </div>
            </div>
          </section>
        </template>

        <!-- THE BOOK, when the subject has one: its value and the wallets it is
             read from, then its concentration over time and what is notable
             in it. Today's positions are the latest recommendation's ring.
             The Robot Money Vault (isVaultStack) reads as one book grouped by
             vault: the router and the four vaults it is read from, each
             vault's weight against the weights in force, the positions under
             their vault, and the vaults over time with the target drawn over
             them. -->
        <template x-if="snapshot || chartModel() || trackedWallets().length || nftContracts().length || (isVaultStack() && (stackSnapshot() || stackWallets().length))">
          <section class="rr-sec" id="holdings" aria-labelledby="hold-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="hold-h">Holdings</h2>
              <template x-if="isVaultStack() && vaultStackLabel()"><span class="rr-sec__aside" data-vault-label x-text="vaultStackLabel()"></span></template>
            </div>

            <!-- The book's value beside exactly what it is read from: every
                 tracked wallet and declared contract in one table, so a reader
                 knows what "the book" is before reading about it. -->
            <div class="rr-split rr-bookhead">
              <template x-if="!isVaultStack() && snapshot">
                <div class="rr-stat">
                  <p class="rr-stat__v" x-text="fmtUsd(snapshot?.totalValueUsd)"></p>
                  <template x-if="bookStatSub()"><p class="rr-stat__sub" x-text="bookStatSub()"></p></template>
                </div>
              </template>
              <template x-if="isVaultStack() && stackSnapshot()">
                <div class="rr-stat">
                  <p class="rr-stat__v" x-text="vaultUsd(stackSnapshot()?.totalValueUsd)"></p>
                  <template x-if="vaultStatSub()"><p class="rr-stat__sub" x-text="vaultStatSub()"></p></template>
                  <template x-if="stackRouter()">
                    <p class="rr-stat__sub">Router
                      <template x-if="explorerHref(stackRouter().chain, stackRouter().address)"><a class="rr-lnk" :href="explorerHref(stackRouter().chain, stackRouter().address)" target="_blank" rel="noopener noreferrer" x-text="truncAddress(stackRouter().address)"></a></template>
                      <template x-if="!explorerHref(stackRouter().chain, stackRouter().address)"><span class="sp-addr" x-text="truncAddress(stackRouter().address)"></span></template>
                    </p>
                  </template>
                </div>
              </template>
              <!-- The vault stack's TVL over time, high in Holdings: the figure
                   the team tracks first. The vaults' own rows are the Vaults
                   table below, and the router is the fact under the total. -->
              <template x-if="isVaultStack()">
                <div id="tvl">
                  <template x-if="tvl().points.length < 2">
                    <figure class="rr-area">
                      <figcaption class="rr-area__head"><h3 class="rr-subhead__h">TVL over time</h3></figcaption>
                      <div class="rr-empty rr-empty--chart rm-nodata"><p class="rm-nodata__h" x-text="tvl().points.length ? 'Not enough data yet' : 'No data yet'"></p><p class="rr-empty__t" x-show="tvl().points.length" x-text="'One reading so far'"></p></div>
                    </figure>
                  </template>
                  <template x-if="tvl().points.length > 1">
                    <figure class="rr-area">
                      <figcaption class="rr-area__head">
                        <h3 class="rr-subhead__h">TVL over time</h3>
                        <span class="rr-sec__aside" x-text="tvlCount()"></span>
                      </figcaption>
                      <div class="rr-area__frame">
                        <div class="rr-area__y" aria-hidden="true">
                          <template x-for="t in tvlYTicks()" :key="t.key"><span :style="`top:${t.top}%`" x-text="t.label"></span></template>
                        </div>
                        <div class="rr-area__plot" tabindex="0" role="img" :aria-label="tvlLabel()"
                             @pointermove="tvlMove($event)" @pointerdown="tvlMove($event)" @pointerleave="tvlAt = null" @keydown="tvlKey($event)" @blur="tvlAt = null">
                          <div class="rr-area__svg" x-html="tvlSvg()"></div>
                          <template x-for="p in tvlDots()" :key="p.key">
                            <i class="rr-area__pt" :style="`left:${p.left}%;top:${p.top}%;background:var(--color-text-soft)`" aria-hidden="true"></i>
                          </template>
                          <template x-if="tvlPoint(tvlAt)">
                            <div class="rr-area__cross" :style="`left:${tvlPoint(tvlAt).left}%`"></div>
                          </template>
                          <template x-if="tvlPoint(tvlAt)">
                            <div class="rr-area__tip" :class="tvlPoint(tvlAt).left > 62 ? 'is-left' : ''" :style="`left:${tvlPoint(tvlAt).left}%`">
                              <p class="rr-area__tip-h" style="margin:0"><b x-text="tvlPoint(tvlAt).date"></b><span x-text="tvlPoint(tvlAt).value"></span></p>
                            </div>
                          </template>
                        </div>
                        <div class="rr-area__x" aria-hidden="true">
                          <template x-for="t in tvlXTicks()" :key="t.key"><span :class="[t.cls, t.i === tvlAt ? 'is-on' : '']" :style="`left:${t.left}%`" x-text="t.label"></span></template>
                        </div>
                      </div>
                    </figure>
                  </template>
                </div>
              </template>
              <template x-if="!isVaultStack() && bookSources().length">
                <div>
                  <div class="rr-subhead"><h3 class="rr-subhead__h" x-text="bookSources().some((w) => w.kind !== 'Wallet') ? 'Wallets and contracts' : 'Wallets'">Wallets</h3></div>
                  <div class="rr-tablewrap">
                    <table class="rr-table rr-table--compact rr-sources">
                      <thead><tr><th scope="col">Name</th><th scope="col">Type</th><th scope="col">Chain</th><th scope="col" class="q">Address</th></tr></thead>
                      <tbody>
                        <template x-for="w in bookSources()" :key="`${w.kind}-${w.chain}-${w.address || w.name}`">
                          <tr>
                            <th scope="row" x-text="w.name"></th>
                            <td x-text="w.kind"></td>
                            <td x-text="chainLabel(w.chain)"></td>
                            <td class="q">
                              <template x-if="explorerHref(w.chain, w.address)">
                                <a class="rr-lnk" :href="explorerHref(w.chain, w.address)" target="_blank" rel="noopener noreferrer" x-text="truncAddress(w.address)"></a>
                              </template>
                              <template x-if="!explorerHref(w.chain, w.address)"><span class="sp-addr" x-text="w.address || '—'"></span></template>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>

            <!-- The book over time, full width: share of the book by position,
                 stacked to 100%. The crosshair snaps to a reading and lists
                 every position's share on that date; a legend entry puts its
                 band in focus. -->
            <!-- What the book holds today, exactly: every position, largest
                 first, in the colour its band takes in the chart below. It
                 opens with a title like the Wallets table beside the figure,
                 which is why .rr-positions wraps the scroller rather than
                 being it. -->
            <!-- The vault stack: each vault's weight of the book against the
                 weights in force; a vault opens onto its positions. -->
            <template x-if="isVaultStack() && vaultGroups().length">
              <div class="rr-block" style="margin-top:2.25rem">
                <div class="rr-subhead"><h3 class="rr-subhead__h">Vaults</h3></div>
                <div class="rr-x" x-data="vaultStackExplorer()" @keydown.escape.window="close()" @pointerleave="leave()">
                  <div class="rr-mix">
                    <figure class="rr-ring" @pointerover="overRing($event)" @pointerout="cancelIntent()" @click="clickRing($event)">
                      <span class="sv__wdonut-host" role="img" :aria-label="explorerLabel()"
                            x-html="explorerSvg()"
                            x-effect="active(); $nextTick(() => syncArcs($el))"></span>
                      <figcaption>
                        <b x-show="activeRow() || explorerCenter().value" x-text="activeRow() ? fmtPctTrim(activeRow().pct) : explorerCenter().value"></b>
                        <span x-text="activeRow() ? activeRow().label : explorerCenter().label"></span>
                      </figcaption>
                    </figure>
                    <!-- One table for the vaults: each vault's value, its share
                         of the book, the target in force and the drift between
                         them, as /allocation's Vaults table reads them. -->
                    <div class="rr-legend rr-legend--cols rr-legend--value rr-legend--drift">
                      <div class="rr-legend__head" aria-hidden="true"><span></span><span>Vault</span><span>Value</span><span>Share</span><span>Target</span><span>Drift</span></div>
                      <template x-for="r in explorerRows()" :key="r.key">
                        <button type="button" class="rr-legend__row" :data-sleeve-btn="r.key"
                                :class="{ 'is-active': active() === r.key, 'is-zero': !r.pct, 'is-muted': active() && active() !== r.key }"
                                :aria-expanded="pinned === r.key ? 'true' : 'false'" :aria-controls="`vault-${r.key}`"
                                @pointerenter="preview(r.key, $event)" @pointerleave="cancelIntent()" @focus="preview(r.key)" @blur="leave()" @click="toggle(r.key)">
                          <i data-mark="series" :style="`background:${r.hue}`" aria-hidden="true"></i>
                          <span><span class="rr-legend__l" x-text="r.label"></span></span>
                          <span class="rr-legend__was rr-legend__v"><span class="rr-sr">Value </span><span x-text="vaultUsd(r.value)"></span></span>
                          <b><span class="rr-sr">Share </span><span x-text="fmtPctTrim(r.pct)"></span></b>
                          <span class="rr-legend__was rr-legend__t"><span class="rr-sr">Target </span><span x-text="r.was == null ? '—' : fmtPctTrim(r.was)"></span></span>
                          <span class="rr-legend__d"><span class="rr-sr" x-show="r.d">Drift </span><template x-if="r.d"><span class="alp__mv" :class="changeClass(r.d)" x-text="changeLabel(r.d)"></span></template></span>
                        </button>
                      </template>
                    </div>
                  </div>
                  <div class="rr-x__drawer" :class="activeRow() ? 'is-open' : ''" :inert="!activeRow()">
                    <div class="rr-x__clip">
                      <template x-if="panelRow()">
                        <div class="rr-x__panel" :id="`vault-${panelRow().key}`" role="region" :aria-label="`${panelRow().label} breakdown`">
                          <div class="rr-x__head">
                            <p><i data-mark="series" :style="`background:${panelRow().hue}`" aria-hidden="true"></i><b><a class="rr-lnk" :href="`/vault/${panelRow().key}`" x-text="panelRow().label"></a></b></p>
                            <template x-if="pinned"><button type="button" class="rr-x__close" @click="close()">Close ×</button></template>
                          </div>
                          <template x-if="panelRow().assets.length">
                            <table class="rr-table rr-x__assets">
                              <thead><tr><th scope="col">Position</th><th scope="col" class="q">% of vault</th><th scope="col" class="q">% of total</th></tr></thead>
                              <tbody>
                                <template x-for="a in panelRow().assets" :key="a.key">
                                  <tr>
                                    <th scope="row"><span x-text="a.label"></span></th>
                                    <td class="q" x-text="a.ofSleeve == null ? '—' : fmtPctTrim(a.ofSleeve)"></td>
                                    <td class="q" x-text="a.ofTotal == null ? '—' : fmtPctTrim(a.ofTotal)"></td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </template>
                          <template x-if="!panelRow().assets.length">
                            <p class="rr-note" style="margin:0">No holdings reported</p>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                  <span class="rr-sr" role="status" x-text="status"></span>
                </div>
              </div>
            </template>

            <!-- The vault stack's positions, under their vault: a vault row
                 with its value and share, then what it holds, each by the name
                 its vault's page gives it. Every share is a share of the whole
                 book. The reading's date is the total's line. Chain renders
                 only when positions span chains; it stays the second column,
                 the one .rr-positions drops on a phone. -->
            <template x-if="isVaultStack() && vaultGroups().length">
              <div class="rr-positions">
                <div class="rr-subhead">
                  <h3 class="rr-subhead__h">Positions</h3>
                  <template x-if="posSortKey"><button type="button" class="rr-more" style="margin:0" @click="unsortPositions()">Group by vault</button></template>
                  <template x-if="!posSortKey && stackSnapshot()?.date"><span class="rr-sec__aside" x-text="`Last read on ${formatDate(stackSnapshot().date, 'short')}`"></span></template>
                </div>
                <div class="rr-tablewrap"><table class="rr-table rr-table--compact">
                  <thead>
                    <!-- Amount, price, value and share sort the positions as one list
                         across the vaults; Group by vault puts the book back. -->
                    <tr><th scope="col">Position</th><th scope="col" x-show="stackMultiChain()">Chain</th>
                      <template x-for="c in [['amount', 'Amount'], ['price', 'Price'], ['value', 'Value'], ['share', 'Share']]" :key="c[0]">
                        <th scope="col" class="q" :aria-sort="posSortState(c[0])"><button type="button" class="rr-sort" @click="sortPositions(c[0])" x-text="c[1]"></button></th>
                      </template>
                    </tr>
                  </thead>
                  <template x-if="!posSortKey">
                    <template x-for="g in vaultGroups()" :key="g.slug">
                      <tbody>
                        <tr class="rr-group">
                          <th scope="rowgroup">
                            <template x-if="g.color">
                              <span><i class="rr-dot" data-mark="series" :style="`background:${g.color}`" aria-hidden="true"></i><a class="rr-lnk" :href="`/vault/${g.slug}`" x-text="g.symbol"></a><small x-text="g.name"></small></span>
                            </template>
                            <template x-if="!g.color"><span x-text="g.symbol"></span></template>
                          </th>
                          <td x-show="stackMultiChain()"></td>
                          <td class="q"></td>
                          <td class="q"></td>
                          <td class="q" x-text="vaultUsd(g.value)"></td>
                          <td class="q">
                            <span class="rr-share">
                              <i :data-mark="g.color ? 'series' : null" :style="g.color ? `width:${Math.max(0, Math.min(100, g.share * 100))}%;background:${g.color}` : ''" aria-hidden="true"></i>
                              <span x-text="fmtPct1(g.share)"></span>
                            </span>
                          </td>
                        </tr>
                        <template x-for="p in g.positions" :key="`${g.slug}-${p.token}-${p.chain}`">
                          <tr class="rr-in">
                            <th scope="row"><span x-text="p.label"></span></th>
                            <td x-show="stackMultiChain()" x-text="chainLabel(p.chain)"></td>
                            <td class="q" x-text="fmtAmount(p.balance)"></td>
                            <td class="q" x-text="fmtPrice(p.price_usd)"></td>
                            <td class="q" x-text="vaultUsd(p.value)"></td>
                            <td class="q">
                              <span class="rr-share">
                                <i :data-mark="g.color ? 'series' : null" :style="g.color ? `width:${Math.max(0, Math.min(100, p.share * 100))}%;background:${g.color}` : ''" aria-hidden="true"></i>
                                <span x-text="fmtPct1(p.share)"></span>
                              </span>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </template>
                  </template>
                  <template x-if="posSortKey">
                    <tbody>
                      <template x-for="p in sortedPositions()" :key="`${p.group.slug}-${p.token}-${p.chain}`">
                        <tr>
                          <th scope="row">
                            <span><i class="rr-dot" :data-mark="p.group.color ? 'series' : null" :style="p.group.color ? `background:${p.group.color}` : ''" aria-hidden="true"></i><span x-text="p.label"></span><small x-text="p.group.symbol"></small></span>
                          </th>
                          <td x-show="stackMultiChain()" x-text="chainLabel(p.chain)"></td>
                          <td class="q" x-text="fmtAmount(p.balance)"></td>
                          <td class="q" x-text="fmtPrice(p.price_usd)"></td>
                          <td class="q" x-text="vaultUsd(p.value)"></td>
                          <td class="q">
                            <span class="rr-share">
                              <i :data-mark="p.group.color ? 'series' : null" :style="p.group.color ? `width:${Math.max(0, Math.min(100, p.share * 100))}%;background:${p.group.color}` : ''" aria-hidden="true"></i>
                              <span x-text="fmtPct1(p.share)"></span>
                            </span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </template>
                </table></div>
              </div>
            </template>

            <!-- Any other book, or a vault stack with no vault in it: the plain
                 positions table, empty when there is no reading. -->
            <template x-if="!isVaultStack() || !vaultGroups().length">
              <div class="rr-positions">
                <div class="rr-subhead">
                  <h3 class="rr-subhead__h">Positions</h3>
                  <template x-if="snapshot?.date"><span class="rr-sec__aside" x-text="`Last read on ${formatDate(snapshot.date, 'short')}`"></span></template>
                </div>
                <div class="rr-tablewrap"><table class="rr-table rr-table--compact">
                  <thead>
                    <tr><th scope="col">Token</th><th scope="col">Chain</th><th scope="col" class="q">Amount</th><th scope="col" class="q">Price</th><th scope="col" class="q">Value</th><th scope="col" class="q">Share</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="p in positionRows()" :key="`${p.token}-${p.chain}`">
                      <tr>
                        <th scope="row"><i data-mark="series" :style="`background:${positionColor(p.token)}`" aria-hidden="true"></i><span x-text="p.token"></span></th>
                        <td x-text="chainLabel(p.chain)"></td>
                        <td class="q" x-text="fmtAmount(p.balance)"></td>
                        <td class="q" x-text="fmtPrice(p.price_usd)"></td>
                        <td class="q" x-text="fmtUsd(p.value_usd)"></td>
                        <td class="q"><span class="rr-share"><i :style="`width:${Math.max(0, Math.min(100, p.share * 100))}%;background:${positionColor(p.token)}`" aria-hidden="true"></i><span x-text="fmtPct1(p.share)"></span></span></td>
                      </tr>
                    </template>
                    <template x-if="!positionRows().length">
                      <tr><td class="rr-table__empty" colspan="6"><span class="rr-empty__t" x-text="snapshot ? 'No positions' : 'No holdings read yet'"></span></td></tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <!-- A line needs two readings: with one, the chart's frame says so.
                 With none, the positions table above already has. -->
            <template x-if="!chartModel() && snapshot">
              <figure class="rr-area" style="margin-top:2.25rem">
                <figcaption class="rr-area__head"><h3 class="rr-subhead__h" x-text="isVaultStack() ? 'Vaults over time' : 'Positions over time'">Positions over time</h3></figcaption>
                <div class="rr-empty rr-empty--chart rm-nodata"><p class="rm-nodata__h" x-text="chartEmptyTitle()"></p><p class="rr-empty__t" x-text="chartEmptyLabel()"></p></div>
              </figure>
            </template>
            <template x-if="chartModel()">
              <figure class="rr-area" style="margin-top:2.25rem">
                <figcaption class="rr-area__head">
                  <h3 class="rr-subhead__h" x-text="isVaultStack() ? 'Vaults over time' : 'Positions over time'">Positions over time</h3>
                  <span class="rr-sec__aside" x-text="chartSpan()"></span>
                </figcaption>
                <div class="rr-area__frame">
                  <div class="rr-area__y" aria-hidden="true">
                    <template x-for="t in [100, 75, 50, 25, 0]" :key="t"><span :style="`top:${100 - t}%`" x-text="`${t}%`"></span></template>
                  </div>
                  <div class="rr-area__plot" tabindex="0" role="img" :aria-label="chartLabel()"
                       @pointermove="chartMove($event)" @pointerdown="chartMove($event)" @pointerleave="chartAt = null" @keydown="chartKey($event)" @blur="chartAt = null">
                    <div class="rr-area__svg" x-html="chartSvg()" x-effect="chartFocus; $nextTick(() => syncBands($el))"></div>
                    <template x-if="chartPoint(chartAt)">
                      <div class="rr-area__cross" :style="`left:${chartPoint(chartAt).left}%`"></div>
                    </template>
                    <template x-if="chartPoint(chartAt)">
                      <div class="rr-area__tip" :class="chartPoint(chartAt).left > 62 ? 'is-left' : ''" :style="`left:${chartPoint(chartAt).left}%`">
                        <p class="rr-area__tip-h"><b x-text="chartPoint(chartAt).date"></b><span x-text="chartPoint(chartAt).total"></span></p>
                        <ul>
                          <template x-for="it in chartPoint(chartAt).items" :key="it.token">
                            <li :class="chartFocus && chartFocus !== it.token ? 'is-muted' : ''"><i :style="`background:${it.color}`" :data-mark="it.mark"></i><span x-text="it.label"></span><b x-text="it.pct"></b></li>
                          </template>
                        </ul>
                      </div>
                    </template>
                  </div>
                  <div class="rr-area__x" aria-hidden="true">
                    <template x-for="t in chartXTicks()" :key="t.key"><span :class="[t.cls, t.i === chartAt ? 'is-on' : '']" :style="`left:${t.left}%`" x-text="t.label"></span></template>
                  </div>
                </div>
                <ul class="rr-area__legend">
                  <template x-for="l in concentrationLegend()" :key="l.token">
                    <li :class="chartFocus && chartFocus !== l.token ? 'is-muted' : ''" @pointerenter="chartFocus = l.target ? null : l.token" @pointerleave="chartFocus = null">
                      <i :class="l.target ? 'is-target' : ''" :style="l.target ? '' : `background:${l.color}`" :data-mark="l.mark" aria-hidden="true"></i><span x-text="l.label"></span>
                    </li>
                  </template>
                </ul>
              </figure>
            </template>

            <!-- Not for the vault stack: its archived notes restate the target
                 weights and name internal files. -->
            <template x-if="!isVaultStack() && (snapshot?.notable || []).length">
              <div class="rr-block rr-area__notes">
                <div class="rr-subhead"><h3 class="rr-subhead__h">Highlights</h3></div>
                <ul class="rr-list">
                  <template x-for="n in (snapshot?.notable || [])" :key="n"><li x-text="n"></li></template>
                </ul>
              </div>
            </template>
          </section>
        </template>

        <!-- ACTIVITY: every vault's deposits and withdrawals, newest first,
             ten to a page, as a vault's own page lists its own. Only where a
             source serves activity (the Base feed does not). -->
        <template x-if="isVaultStack() && stackActivity">
          <section class="rr-sec" id="activity" aria-labelledby="sact-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="sact-h">Activity</h2>
            </div>
            <div class="rr-tablewrap"><table class="rr-table rr-table--compact rr-activity" :class="stackActivityHasTx() ? 'has-tx' : ''">
              <thead>
                <tr><th scope="col">Date</th><th scope="col">Vault</th><th scope="col">Event</th><th scope="col" class="q">Amount</th><th scope="col" class="q">Value</th><th scope="col" class="q rr-activity__tx">Transaction</th></tr>
              </thead>
              <tbody>
                <template x-for="(a, i) in stackActivityRows()" :key="`${stackActivityPage}-${i}-${a.vault}-${a.t}`">
                  <tr>
                    <th scope="row" x-text="formatDate(a.t, 'short')"></th>
                    <td><i class="rr-dot" data-mark="series" :style="`background:${a.color}`" aria-hidden="true"></i><a class="rr-lnk" :href="`/vault/${a.vault}`" x-text="a.symbol"></a></td>
                    <td x-text="activityEvent(a)"></td>
                    <td class="q" x-text="activityAmount(a)"></td>
                    <td class="q" x-text="activityValue(a)"></td>
                    <td class="q rr-activity__tx">
                      <template x-if="a.tx && explorerHref('base', a.tx)"><a class="rr-lnk" :href="explorerHref('base', a.tx)" target="_blank" rel="noopener noreferrer" x-text="truncAddress(a.tx)"></a></template>
                      <template x-if="!a.tx"><span>—</span></template>
                    </td>
                  </tr>
                </template>
                <template x-if="!stackActivity.length">
                  <tr><td class="rr-table__empty" colspan="6"><span class="rr-empty__t">No activity yet</span></td></tr>
                </template>
              </tbody>
            </table></div>
            <template x-if="stackActivityPaged()">
              <nav class="rr-pager" aria-label="Activity pages">
                <span role="status" x-text="stackActivityRange()"></span>
                <div>
                  <button type="button" class="rr-btn" :disabled="stackActivityPage === 0" @click="stackActivityPage -= 1">Newer</button>
                  <button type="button" class="rr-btn" :disabled="(stackActivityPage + 1) * 10 >= stackActivity.length" @click="stackActivityPage += 1">Older</button>
                </div>
              </nav>
            </template>
          </section>
        </template>

        <!-- THE RECOMMENDATION HISTORY. One row per published session, newest
             first, paged: a session is the process, the recommendation is what
             it produced, and a session that produced none says so. A weights
             subject shows each mix and its moves against the target THAT
             session was handed; a portfolio shows how the room leaned, the
             outcome, and the positions it moved. -->
        <section class="rr-sec sp-sessions" id="history" aria-labelledby="hist-h" :aria-busy="historyBusy ? 'true' : 'false'">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="hist-h">Recommendation history</h2>
            <!-- Only where the API searches this subject's sessions before
                 it pages them (#1007). The browser-side index and the archive
                 have no search to offer, so they show no box. -->
            <template x-if="historyMode === 'server'">
              <div class="rr-search" role="search">
                <label class="rm-visually-hidden" for="history-q">Search the recommendation history</label>
                <input class="rr-search__in" id="history-q" type="search" maxlength="200" placeholder="Date or reasoning"
                       autocomplete="off" spellcheck="false"
                       @input.debounce.250ms="searchHistory($event.target.value)" @search="searchHistory($event.target.value)">
              </div>
            </template>
          </div>

          <template x-if="isWeightsSubject()">
            <div class="rr-tablewrap rr-tablewrap--tips">
              <table class="rr-table sp-weights" :style="`--sleeves:${sleeveColumns().length}`">
                <thead>
                  <tr>
                    <th scope="col">Session</th>
                    <template x-for="c in sleeveColumns()" :key="c.key">
                      <th scope="col" class="q"><span class="sp-h" x-text="c.label"></span><span class="sp-h-short" aria-hidden="true" x-text="c.short"></span><template x-if="bucketNote(c.key)"><span class="rm-tip rm-tip--end"><button class="rm-tip__btn" type="button" :aria-label="`About ${c.label}`">i</button><span class="rm-tip__bub" role="tooltip" x-text="bucketNote(c.key)"></span></span></template></th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in sessions" :key="row.id">
                    <tr class="sv__session-card">
                      <th scope="row">
                        <a class="rr-lnk sv__session-title" :href="sessionHref(row)" x-text="formatDate(row.date, 'short')"></a>
                        <small x-text="[rowTime(row), row.takes == null ? '' : `${row.takes} ${row.takes === 1 ? 'take' : 'takes'}`].filter(Boolean).join(' · ')"></small>
                        <template x-if="rowState(row)"><small class="sp-state" x-text="rowState(row)"></small></template>
                      </th>
                      <!-- Each sleeve's weight, and under it its move against the
                           target that session was handed, in percentage points. -->
                      <template x-for="(v, i) in rowWeights(row)" :key="i">
                        <td class="q" :class="v === 0 ? 'is-zero' : ''">
                          <span x-text="v == null ? '—' : pctLabel(v)"></span>
                          <template x-if="moveAt(row, i)">
                            <span class="alp__mv sp-move" :class="changeClass(moveAt(row, i).d)" x-text="changeLabel(moveAt(row, i).d)"></span>
                          </template>
                        </td>
                      </template>
                    </tr>
                  </template>
                  <template x-if="!sessions.length">
                    <tr><td class="rr-table__empty" :colspan="sleeveColumns().length + 1"><span class="rr-empty__t" x-text="historyEmptyLabel()"></span></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="!isWeightsSubject()">
            <div class="rr-tablewrap">
              <table class="rr-table rr-stack" style="min-width:36rem">
                <thead>
                  <tr><th scope="col">Session</th><th scope="col">Consensus</th><th scope="col">Recommendation</th></tr>
                </thead>
                <tbody>
                  <template x-for="row in sessions" :key="row.id">
                    <tr class="sv__session-card">
                      <th scope="row">
                        <a class="rr-lnk sv__session-title" :href="sessionHref(row)" x-text="formatDate(row.date, 'short')"></a>
                        <small x-text="[rowTime(row), row.takes == null ? '' : `${row.takes} ${row.takes === 1 ? 'take' : 'takes'}`].filter(Boolean).join(' · ')"></small>
                      </th>
                      <td>
                        <template x-if="lean(row)">
                          <span class="sv__stance-badge" :style="leanBadgeStyle(row)"><i x-show="leanStance(row)" :style="leanDotStyle(row)"></i><span x-text="leanLabel(row)"></span></span>
                        </template>
                        <template x-if="!lean(row)"><span>—</span></template>
                      </td>
                      <!-- What moved, then how many positions it held: the moves are
                           what a reader scans a history for. -->
                      <td class="rr-rowacts">
                        <template x-if="row.failed"><span class="rr-note" style="margin:0">This session could not be loaded</span></template>
                        <template x-if="!row.failed && !recommendation(row)"><span class="rr-note" style="margin:0">No recommendation published</span></template>
                        <template x-for="a in rowActions(row)" :key="`${a.token}-${a.action}`">
                          <span><em class="rr-act" :class="`is-${a.action}`" x-text="a.label"></em><span x-text="a.token"></span></span>
                        </template>
                        <template x-if="rowHeld(row).length && rowActions(row).length">
                          <span class="rm-tip rm-tip--label rm-tip--end rr-held"><button class="rm-tip__btn rm-tip__btn--text" type="button" x-text="`${rowHeld(row).length} held`"></button><span class="rm-tip__bub" role="tooltip" x-text="`Held: ${rowHeld(row).join(', ')}`"></span></span>
                        </template>
                        <template x-if="rowHeld(row).length && !rowActions(row).length">
                          <span class="rm-tip rm-tip--label rm-tip--end rr-held"><button class="rm-tip__btn rm-tip__btn--text" type="button" x-text="`All ${rowHeld(row).length} held`"></button><span class="rm-tip__bub" role="tooltip" x-text="`Held: ${rowHeld(row).join(', ')}`"></span></span>
                        </template>
                        <template x-if="recommendation(row)?.kind === 'text'"><span class="rr-rowtext" x-text="recommendation(row).text"></span></template>
                        <template x-if="recommendation(row) && recommendation(row).kind !== 'text' && !rowActions(row).length && !rowHeld(row).length"><span class="rr-note" style="margin:0">No actions</span></template>
                      </td>
                    </tr>
                  </template>
                  <template x-if="!sessions.length">
                    <tr><td class="rr-table__empty" colspan="3"><span class="rr-empty__t" x-text="historyEmptyLabel()"></span></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="historyError"><p class="rr-note" role="alert" x-text="historyError"></p></template>
          <template x-if="hasPages()">
            <nav class="rr-pager" aria-label="History pages">
              <span role="status" x-text="historyBusy ? 'Loading…' : historyRange()"></span>
              <div>
                <button type="button" class="rr-btn" :disabled="historyBusy || historyPage === 0" @click="goHistory(historyPage - 1)">Newer</button>
                <button type="button" class="rr-btn" :disabled="historyBusy || !hasOlder()" @click="goHistory(historyPage + 1)">Older</button>
              </div>
            </nav>
          </template>
        </section>
      </div>
    </template>

    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>

  <style>
    /* An address with no explorer to link: whole, wrapping anywhere. */
    .sp-addr { overflow-wrap: anywhere; }
    /* Page-local: the book's chart and wallet list. The record's components
       are shared in views.css (.rr-*). */
    .sp-wallets li { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .sp-wallet__label { font-size: 0.8rem; }
    .sp-wallets code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-text-muted); }
    .sp-sessions .sv__session-card { display: table-row; border: 0; padding: 0; background: none; }
    /* The reset above outranks views.css's .rr-stack row on a phone, so the
       portfolio history gives each session back its grid, padding and rule. */
    @media (max-width: 640px) {
      .sp-sessions .rr-stack tbody tr.sv__session-card { display: grid; padding: 0.75rem 0; border-bottom: 1px solid var(--color-border); }
    }
    .sp-sessions .sv__session-title { font-family: var(--font-sans); font-size: 0.8125rem; text-transform: none; letter-spacing: 0; }
    /* Five columns fit any page width now the change column is gone, so the
       table never scrolls, and its header tips are never clipped. */
    .sp-sessions .sp-weights { min-width: 0; }
    .sp-sessions .sp-weights .sp-h-short { display: none; }
    /* A sleeve's move sits under its weight, in its own column. */
    .sp-sessions .sp-weights .sp-move { display: block; margin-top: 0.125rem; font-size: 0.6875rem; }
    .sp-sessions .sp-weights .sp-state { display: block; margin-top: 0.125rem; color: var(--color-text-muted); }
    /* The weights history on a phone: the date and the sleeve figures stay
       side by side on one grid line (a sleeve's head keeps its swatch, and its
       move sits under it), so nothing scrolls sideways. */
    @media (max-width: 640px) {
      .sp-sessions .sp-weights thead tr, .sp-sessions .sp-weights tbody tr.sv__session-card { display: grid; grid-template-columns: 6.5rem repeat(var(--sleeves, 4), minmax(0, 1fr)); }
      .sp-sessions .sp-weights tbody tr.sv__session-card { align-items: baseline; border-bottom: 1px solid var(--color-border); }
      /* Every head cell runs the band's full height, its name set at the
         bottom, so a two-line short name does not step the band. */
      .sp-sessions .sp-weights thead tr { align-items: stretch; }
      .sp-sessions .sp-weights thead th { display: flex; flex-direction: column; justify-content: flex-end; }
      .sp-sessions .sp-weights thead th.q { align-items: flex-end; }
      /* A phone heads each column with its short name; the full name stays
         for screen readers, and the tip is left to the desktop table. */
      .sp-sessions .sp-weights thead th.q .sp-h { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .sp-sessions .sp-weights thead th.q .sp-h-short { display: inline; }
      .sp-sessions .sp-weights thead th.q .rm-tip { display: none; }
      .sp-sessions .sp-weights th, .sp-sessions .sp-weights td { padding-inline: 0.375rem; border-bottom: 0; }
      .sp-sessions .sp-weights tbody th a { white-space: nowrap; }
    }
  </style>
</section>
