<!-- Public swarm subject page, as a research record (RM-121). It opens the way
     a session opens (breadcrumb, head, one hairline row of facts), then:
     the latest recommendation and why, the book when the subject has one, and
     the recommendation history, one row per session. A session and the subject
     it reviews read as one document.
     Sections render only when the subject carries what they draw. -->
<section class="cv cv--detail" x-data="subjectProfile()">
  <div class="sv__body sv__body--narrow rr">
    <!-- The same skeleton as /swarm and a member's page: it holds the page's
         height, so nothing visible moves when the subject lands. -->
    <p class="rm-visually-hidden" role="status" x-show="loading">Loading subject</p>
    <div class="sv__skel" x-show="loading" aria-hidden="true">
      <div class="sv__skel-h"></div>
      <div class="sv__skel-cols">
        <div class="sv__skel-box"></div><div class="sv__skel-box"></div><div class="sv__skel-box"></div>
      </div>
      <div class="sv__skel-h"></div>
      <div class="sv__skel-card"></div><div class="sv__skel-card"></div>
    </div>
    <!-- x-if, not x-show: a hidden error node is still an error node for a
         reader's find-in-page and for a test's locator. -->
    <template x-if="error"><div class="rr-head"><p class="sv__error" x-text="error"></p><p class="rr-links"><a class="rr-lnk" href="/swarm">Swarm</a></p></div></template>

    <template x-if="!loading && subject">
      <div>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <span aria-current="page" x-text="subject.name"></span>
        </nav>

        <header class="rr-head">
          <!-- The operator is named only when it is not this house: peaq
               running Woon Treasury is the fact the slot exists for. -->
          <p class="sv__eyebrow sv__eyebrow--quiet"><span x-text="subjectKind()">portfolio</span><template x-if="operatorLabel()"><span> · operator <span x-text="operatorLabel()"></span></span></template></p>
          <h1 class="sv__detail-title" x-text="subject.name"></h1>
          <template x-if="subject.thesisBlurb"><p class="sv__lede sv__lede--compact" x-text="subject.thesisBlurb"></p></template>
          <template x-if="subject.homepage || subject.xHandle">
            <p class="rr-links sp-links">
              <template x-if="subject.homepage">
                <a class="rr-lnk" :href="subject.homepage" rel="noopener noreferrer" target="_blank" x-text="hostOf(subject.homepage) + ' ↗'"></a>
              </template>
              <template x-if="subject.xHandle">
                <a class="rr-lnk" :href="`https://x.com/${String(subject.xHandle).replace(/^@/, '')}`" rel="noopener noreferrer" target="_blank"
                   x-text="'@' + String(subject.xHandle).replace(/^@/, '') + ' ↗'"></a>
              </template>
            </p>
          </template>
        </header>

        <!-- The facts only this row states. The latest session's date is the
             way into it, below; the book's total is the Holdings figure; and
             with no session the history says so where the list would be. The
             row itself goes when none of its items would draw. -->
        <div class="rr-meta" x-show="sessionCount() || (backdrop && backdrop.composite !== null) || backdrop?.regime || isFramework()">
          <template x-if="sessionCount()"><span class="rr-meta__i">Sessions <b x-text="sessionCount()"></b></span></template>
          <template x-if="backdrop && backdrop.composite !== null">
            <span class="rr-meta__i">Composite <b x-text="fmtNum(backdrop?.composite, 3)"></b></span>
          </template>
          <template x-if="backdrop?.regime">
            <span class="rr-meta__i">Regime
              <i :style="`background:${regimeColor(backdrop?.regime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(backdrop?.regime)"></b>
            </span>
          </template>
          <template x-if="isFramework()">
            <a class="rr-meta__lnk" href="/allocation">Asset allocation</a>
          </template>
        </div>

        <!-- THE LATEST RECOMMENDATION. The mix (or the actions) on the
             left; what it proposes and why on the right, and the one prominent
             way into the session. -->
        <template x-if="latest()">
          <section class="rr-sec" id="latest" aria-labelledby="latest-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="latest-h" x-text="recommendation(latest()) ? 'Latest recommendation' : 'Latest session'">Latest recommendation</h2>
            </div>
            <div class="rr-split rr-split--rule">
              <div>
                <template x-if="hasExplorer()">
                  <div>
                    <div class="rr-x" x-data="sleeveExplorer()" @keydown.escape.window="close()" @pointerleave="leave()">
                      <div class="rr-mix">
                        <figure class="rr-ring" @pointerover="overRing($event)" @pointerout="cancelIntent()" @click="clickRing($event)">
                          <span class="sv__wdonut-host" role="img" :aria-label="explorerLabel()"
                                x-html="explorerSvg()"
                                x-effect="active(); $nextTick(() => syncArcs($el))"></span>
                          <figcaption>
                            <b x-show="activeRow() || explorerCenter().value" x-text="activeRow() ? fmtPctTrim(activeRow().pct) : explorerCenter().value"></b>
                            <span x-text="activeRow() ? activeRow().label : explorerCenter().label"></span>
                          </figcaption>
                        </figure>
                        <div class="rr-legend">
                          <template x-for="r in explorerRows()" :key="r.key">
                            <button type="button" class="rr-legend__row" :data-sleeve-btn="r.key"
                                    :class="{ 'is-active': active() === r.key, 'is-zero': !r.pct, 'is-muted': active() && active() !== r.key }"
                                    :aria-expanded="pinned === r.key ? 'true' : 'false'" :aria-controls="`sleeve-${r.key}`"
                                    @pointerenter="preview(r.key, $event)" @pointerleave="cancelIntent()" @focus="preview(r.key)" @blur="leave()" @click="toggle(r.key)">
                              <i data-mark="series" :style="`background:${r.hue}`" aria-hidden="true"></i>
                              <span x-text="r.label"></span>
                              <b x-text="fmtPctTrim(r.pct)"></b>
                              <template x-if="hasBook()"><em class="rr-act" :class="`is-${r.action || 'none'}`" x-text="actionLabel(r.action)"></em></template>
                              <template x-if="r.was != null && r.d">
                                <small>
                                  <span class="alp__mv" :class="changeClass(r.d)"><i x-text="changeGlyph(r.d)" aria-hidden="true"></i><span x-text="changeLabel(r.d)"></span></span>
                                  <span x-text="` vs ${r.basis} ${fmtPctTrim(r.was)}`"></span>
                                </small>
                              </template>
                            </button>
                          </template>
                        </div>
                      </div>
                      <div class="rr-x__drawer" :class="activeRow() ? 'is-open' : ''" :inert="!activeRow()">
                        <div class="rr-x__clip">
                          <template x-if="panelRow()">
                            <div class="rr-x__panel" :id="`sleeve-${panelRow().key}`" role="region" :aria-label="`${panelRow().label} breakdown`">
                              <div class="rr-x__head">
                                <p><i data-mark="series" :style="`background:${panelRow().hue}`" aria-hidden="true"></i><b x-text="panelRow().label"></b><span x-text="panelRow().meta"></span></p>
                                <template x-if="pinned"><button type="button" class="rr-x__close" @click="close()">Close ×</button></template>
                              </div>
                              <template x-if="panelRow().assets.length">
                                <table class="rr-table rr-x__assets">
                                  <thead><tr><th scope="col">Asset</th><th scope="col" class="q">% of sleeve</th><th scope="col" class="q">% of allocation</th></tr></thead>
                                  <tbody>
                                    <template x-for="a in panelRow().assets" :key="a.key">
                                      <tr>
                                        <th scope="row"><i data-mark="series" :style="`background:${a.colour}`" aria-hidden="true"></i><span x-text="a.label"></span></th>
                                        <td class="q" x-text="fmtPctTrim(a.ofSleeve)"></td>
                                        <td class="q" x-text="a.ofAllocation == null ? '—' : fmtPctTrim(a.ofAllocation)"></td>
                                      </tr>
                                    </template>
                                  </tbody>
                                </table>
                              </template>
                              <template x-if="panelRow().action">
                                <p class="rr-x__why"><span x-text="panelRow().rationale"></span></p>
                              </template>
                              <template x-if="!panelRow().assets.length && !panelRow().action">
                                <p class="rr-note" style="margin:0" x-text="hasBook() ? 'No action' : 'No asset weights published'"></p>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                      <span class="rr-sr" role="status" x-text="status"></span>
                    </div>
                    <template x-if="hasBook() && String(latestBook()?.date || '').slice(0, 10) !== String(latest().date || '').slice(0, 10)">
                      <p class="rr-note" x-text="`Holdings on ${formatDate(latestBook()?.date, 'short')}`"></p>
                    </template>
                  </div>
                </template>
                <!-- Member-authored actions only: a rollup's two hardcoded rows
                     are left out here as they are on the session page. -->
                <template x-if="authoredActionsOf(latest()).length && !hasBook()">
                  <dl class="sr__acts">
                    <template x-for="a in authoredActionsOf(latest())" :key="`${a.token}-${a.action}`">
                      <div class="sr__act">
                        <dt x-text="a.token"></dt>
                        <dd><em class="rr-act" :class="`is-${String(a.action).toLowerCase()}`" x-text="actionLabel(a.action)"></em><span x-text="a.rationale || ''"></span></dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <template x-if="(recommendation(latest())?.kind === 'actions' && !authoredActionsOf(latest()).length) || recommendation(latest())?.kind === 'none'">
                  <p class="rr-note" style="margin-top:0">No position calls</p>
                </template>
                <template x-if="!recommendation(latest())">
                  <p class="rr-note" style="margin-top:0">No recommendation published</p>
                </template>

                <!-- The weights in force, on the page about them. Behind a
                     disclosure: the latest review already compares against the
                     target its own session was handed. -->
                <template x-if="hasTargetsCard()">
                  <div class="rr-disc" style="margin-top:1.5rem" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                    <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="targets-in-force" @click="open = !open">
                      <span x-text="allocationTitle()">Target weights in force</span>
                      <small x-show="allocationAsOf()" x-text="`Since ${allocationAsOf()}`"></small>
                    </button>
                    <div class="rr-disc__anim" id="targets-in-force" role="region" :aria-label="allocationTitle()" :inert="!open">
                      <div class="rr-disc__clip"><div class="rr-disc__body">
                        <div class="sv__sleeves sp-alloc__body" style="max-width:none">
                          <template x-for="t in allocationTargets()" :key="t.label">
                            <div class="sv__sleeve">
                              <span class="sv__sleeve-n"><i class="sv__bucket-dot" :style="`background:${t.hue}`" aria-hidden="true"></i><span x-text="t.label"></span></span>
                              <template x-if="sleeveBar(t) !== null">
                                <span class="sv__sleeve-track"><i :style="`width:${sleeveBar(t)}%`"></i></span>
                              </template>
                              <template x-if="sleeveBar(t) === null"><span></span></template>
                              <span class="sv__sleeve-v" x-text="t.pct === null ? '—' : `${t.pct}%`"></span>
                            </div>
                          </template>
                        </div>
                      </div></div>
                    </div>
                  </div>
                </template>
              </div>

              <div x-data="{ more: false }">
                <!-- Only what the legend cannot show: that no sleeve moved, or
                     that there was no target to move from. A count of moves
                     or actions is the legend's rows. -->
                <template x-if="recommendation(latest())?.kind === 'weights' && !(latestMoves() || []).length && latestOutcome()">
                  <p class="rr-k rr-sub" x-text="latestOutcome()"></p>
                </template>
                <template x-if="rationaleOf(latest()) || latest().synthesis">
                  <div>
                    <div class="rr-prose" :class="!more && isLong(rationaleOf(latest()) || latest().synthesis, 480) ? 'is-clamped' : ''" style="--rr-lines:8"
                         x-html="linkified(rationaleOf(latest()) || latest().synthesis)"></div>
                    <template x-if="isLong(rationaleOf(latest()) || latest().synthesis, 480)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                        <span x-text="more ? 'Show less' : (rationaleOf(latest()) ? 'Read full rationale' : 'Read full synthesis')"></span>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="stanceTally(latest()).length">
                  <p class="rr-counts">
                    <template x-for="x in stanceTally(latest())" :key="x.stance">
                      <span :style="`color:${stanceColor(x.stance)}`"><i :style="`background:${stanceColor(x.stance)}`" aria-hidden="true"></i><span x-text="x.stance"></span><b x-text="x.n"></b></span>
                    </template>
                    <em x-text="[latest().swarmRecommendation?.quorum ? quorumText(latest()) : '', meanConfidenceText(latest())].filter(Boolean).join(' · ')"></em>
                  </p>
                </template>
                <a class="rr-cta" :href="sessionHref(latest())">
                  <span x-text="`Read the ${formatDate(latest().date, 'short')} session`"></span><span aria-hidden="true">→</span>
                </a>
              </div>
            </div>
          </section>
        </template>

        <!-- THE BOOK, when the subject has one: its value and the wallets it is
             read from, then its concentration over time and what is notable
             in it. Today's positions are the latest recommendation's ring. -->
        <template x-if="snapshot || chartModel() || trackedWallets().length || nftContracts().length">
          <section class="rr-sec" id="holdings" aria-labelledby="hold-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="hold-h">Holdings</h2>
            </div>

            <!-- The book's value beside exactly what it is read from: every
                 tracked wallet and declared contract in one table, so a reader
                 knows what "the book" is before reading about it. -->
            <div class="rr-split rr-bookhead">
              <template x-if="snapshot">
                <div class="rr-stat">
                  <p class="rr-stat__v" x-text="fmtUsd(snapshot?.totalValueUsd)"></p>
                  <template x-if="bookStatSub()"><p class="rr-stat__sub" x-text="bookStatSub()"></p></template>
                </div>
              </template>
              <template x-if="bookSources().length">
                <div>
                  <p class="rr-k rr-sub">Read from</p>
                  <div class="rr-tablewrap">
                    <table class="rr-table rr-table--compact rr-sources">
                      <thead><tr><th scope="col">Name</th><th scope="col">Type</th><th scope="col">Chain</th><th scope="col" class="q">Address</th></tr></thead>
                      <tbody>
                        <template x-for="w in bookSources()" :key="`${w.kind}-${w.chain}-${w.address || w.name}`">
                          <tr>
                            <th scope="row" x-text="w.name"></th>
                            <td x-text="w.kind"></td>
                            <td x-text="chainLabel(w.chain)"></td>
                            <td class="q">
                              <template x-if="explorerHref(w.chain, w.address)">
                                <a class="rr-lnk" :href="explorerHref(w.chain, w.address)" target="_blank" rel="noopener noreferrer" :title="w.address" x-text="`${truncAddress(w.address)} ↗`"></a>
                              </template>
                              <template x-if="!explorerHref(w.chain, w.address)"><span :title="w.address" x-text="truncAddress(w.address) || '—'"></span></template>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>

            <!-- The book over time, full width: share of the book by position,
                 stacked to 100%. The crosshair snaps to a reading and lists
                 every position's share on that date; a legend entry puts its
                 band in focus. -->
            <!-- What the book holds today, exactly: every position, largest
                 first, in the colour its band takes in the chart below. It
                 opens with a label like the Read from table beside the figure,
                 which is why .rr-positions wraps the scroller rather than
                 being it. -->
            <template x-if="positionRows().length">
              <div class="rr-positions">
                <p class="rr-k rr-sub" x-text="`Positions on ${formatDate(snapshot?.date, 'short')}`"></p>
                <div class="rr-tablewrap"><table class="rr-table rr-table--compact">
                  <thead>
                    <tr><th scope="col">Token</th><th scope="col">Chain</th><th scope="col" class="q">Amount</th><th scope="col" class="q">Price</th><th scope="col" class="q">Value</th><th scope="col" class="q">Share</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="p in positionRows()" :key="`${p.token}-${p.chain}`">
                      <tr>
                        <th scope="row"><i data-mark="series" :style="`background:${positionColor(p.token)}`" aria-hidden="true"></i><span x-text="p.token"></span></th>
                        <td x-text="chainLabel(p.chain)"></td>
                        <td class="q" :title="p.balance != null ? String(p.balance) : ''" x-text="fmtAmount(p.balance)"></td>
                        <td class="q" x-text="fmtPrice(p.price_usd)"></td>
                        <td class="q" x-text="fmtUsd(p.value_usd)"></td>
                        <td class="q"><span class="rr-share"><i :style="`width:${Math.max(0, Math.min(100, p.share * 100))}%;background:${positionColor(p.token)}`" aria-hidden="true"></i><span x-text="fmtPct1(p.share)"></span></span></td>
                      </tr>
                    </template>
                  </tbody>
                </table></div>
              </div>
            </template>

            <template x-if="chartModel()">
              <figure class="rr-area" style="margin-top:2.25rem">
                <figcaption class="rr-area__head">
                  <p class="rr-k">Share of the book by position</p>
                  <span class="rr-k" x-text="chartSpan()"></span>
                </figcaption>
                <div class="rr-area__frame">
                  <div class="rr-area__y" aria-hidden="true">
                    <template x-for="t in [100, 75, 50, 25, 0]" :key="t"><span :style="`top:${100 - t}%`" x-text="`${t}%`"></span></template>
                  </div>
                  <div class="rr-area__plot" tabindex="0" role="img" :aria-label="chartLabel()"
                       @pointermove="chartMove($event)" @pointerdown="chartMove($event)" @pointerleave="chartAt = null" @keydown="chartKey($event)" @blur="chartAt = null">
                    <div class="rr-area__svg" x-html="chartSvg()" x-effect="chartFocus; $nextTick(() => syncBands($el))"></div>
                    <template x-if="chartPoint(chartAt)">
                      <div class="rr-area__cross" :style="`left:${chartPoint(chartAt).left}%`"></div>
                    </template>
                    <template x-if="chartPoint(chartAt)">
                      <div class="rr-area__tip" :class="chartPoint(chartAt).left > 62 ? 'is-left' : ''" :style="`left:${chartPoint(chartAt).left}%`">
                        <p class="rr-area__tip-h"><b x-text="chartPoint(chartAt).date"></b><span x-text="chartPoint(chartAt).total"></span></p>
                        <ul>
                          <template x-for="it in chartPoint(chartAt).items" :key="it.token">
                            <li :class="chartFocus && chartFocus !== it.token ? 'is-muted' : ''"><i :style="`background:${it.color}`"></i><span x-text="it.label"></span><b x-text="it.pct"></b></li>
                          </template>
                        </ul>
                      </div>
                    </template>
                  </div>
                  <div class="rr-area__x" aria-hidden="true">
                    <template x-for="t in chartXTicks()" :key="t.key"><span :class="[t.cls, t.i === chartAt ? 'is-on' : '']" :style="`left:${t.left}%`" x-text="t.label"></span></template>
                  </div>
                </div>
                <ul class="rr-area__legend">
                  <template x-for="l in concentrationLegend()" :key="l.token">
                    <li :class="chartFocus && chartFocus !== l.token ? 'is-muted' : ''" @pointerenter="chartFocus = l.token" @pointerleave="chartFocus = null">
                      <i :style="`background:${l.color}`" aria-hidden="true"></i><span x-text="l.label"></span>
                    </li>
                  </template>
                </ul>
              </figure>
            </template>

            <template x-if="(snapshot?.notable || []).length">
              <div class="rr-block rr-area__notes">
                <p class="rr-k rr-sub">Notable</p>
                <ul class="rr-list">
                  <template x-for="n in (snapshot?.notable || [])" :key="n"><li x-text="n"></li></template>
                </ul>
              </div>
            </template>
          </section>
        </template>

        <!-- THE RECOMMENDATION HISTORY. One row per published session, newest
             first, paged: a session is the process, the recommendation is what
             it produced, and a session that produced none says so. A weights
             subject shows each mix and its moves against the target THAT
             session was handed; a portfolio shows how the room leaned, the
             outcome, and the positions it moved. -->
        <section class="rr-sec sp-sessions" id="history" aria-labelledby="hist-h" :aria-busy="historyBusy ? 'true' : 'false'">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="hist-h">Recommendation history</h2>
            <!-- Only where the API searches this subject's sessions before
                 it pages them (#1007). The browser-side index and the archive
                 have no search to offer, so they show no box. -->
            <template x-if="historyMode === 'server'">
              <div class="rr-search" role="search">
                <label class="rm-visually-hidden" for="history-q">Search the recommendation history</label>
                <input class="rr-search__in" id="history-q" type="search" maxlength="200" placeholder="Date or reasoning"
                       autocomplete="off" spellcheck="false"
                       @input.debounce.250ms="searchHistory($event.target.value)" @search="searchHistory($event.target.value)">
              </div>
            </template>
          </div>

          <template x-if="!sessions.length && !historyQuery">
            <p class="sv__empty">No published session yet.</p>
          </template>
          <template x-if="!sessions.length && historyQuery">
            <p class="sv__empty">No sessions match</p>
          </template>

          <template x-if="sessions.length && isWeightsSubject()">
            <div class="rr-tablewrap">
              <table class="rr-table sp-weights" :style="`--sleeves:${sleeveColumns().length}`">
                <thead>
                  <tr>
                    <th scope="col">Session</th>
                    <template x-for="c in sleeveColumns()" :key="c.key">
                      <th scope="col" class="q"><i data-mark="series" :style="`background:${c.hue}`" aria-hidden="true"></i><span x-text="c.label"></span></th>
                    </template>
                    <th scope="col">Change vs session target</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in sessions" :key="row.id">
                    <tr class="sv__session-card">
                      <th scope="row">
                        <a class="rr-lnk sv__session-title" :href="sessionHref(row)" x-text="formatDate(row.date, 'short')"></a>
                        <small x-text="[rowTime(row), row.takes == null ? '' : `${row.takes} ${row.takes === 1 ? 'take' : 'takes'}`].filter(Boolean).join(' · ')"></small>
                      </th>
                      <template x-for="(v, i) in rowWeights(row)" :key="i">
                        <td class="q" :class="v === 0 ? 'is-zero' : ''" x-text="v == null ? '—' : pctLabel(v)"></td>
                      </template>
                      <td class="rr-out">
                        <template x-if="rowMoves(row) && rowMoves(row).length">
                          <div>
                            <template x-for="m in rowMoves(row)" :key="m.key">
                              <span><span x-text="`${m.label} `"></span><span class="alp__mv" :class="changeClass(m.d)"><i x-text="changeGlyph(m.d)" aria-hidden="true"></i><span x-text="changeLabel(m.d)"></span></span></span>
                            </template>
                          </div>
                        </template>
                        <template x-if="!(rowMoves(row) && rowMoves(row).length)">
                          <span class="rr-note" style="margin:0" x-text="row.failed ? 'This session could not be loaded' : recommendation(row) ? rowOutcome(row) : 'No recommendation published'"></span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="sessions.length && !isWeightsSubject()">
            <div class="rr-tablewrap">
              <table class="rr-table rr-stack" style="min-width:36rem">
                <thead>
                  <tr><th scope="col">Session</th><th scope="col">Consensus</th><th scope="col">Recommendation</th></tr>
                </thead>
                <tbody>
                  <template x-for="row in sessions" :key="row.id">
                    <tr class="sv__session-card">
                      <th scope="row">
                        <a class="rr-lnk sv__session-title" :href="sessionHref(row)" x-text="formatDate(row.date, 'short')"></a>
                        <small x-text="[rowTime(row), row.takes == null ? '' : `${row.takes} ${row.takes === 1 ? 'take' : 'takes'}`].filter(Boolean).join(' · ')"></small>
                      </th>
                      <td>
                        <template x-if="lean(row)">
                          <span class="sv__stance-badge" :style="leanBadgeStyle(row)"><i x-show="leanStance(row)" :style="leanDotStyle(row)"></i><span x-text="leanLabel(row)"></span></span>
                        </template>
                        <template x-if="!lean(row)"><span>—</span></template>
                      </td>
                      <!-- What moved, then how many positions it held: the moves are
                           what a reader scans a history for. -->
                      <td class="rr-rowacts">
                        <template x-if="row.failed"><span class="rr-note" style="margin:0">This session could not be loaded</span></template>
                        <template x-if="!row.failed && !recommendation(row)"><span class="rr-note" style="margin:0">No recommendation published</span></template>
                        <template x-for="a in rowActions(row)" :key="`${a.token}-${a.action}`">
                          <span><em class="rr-act" :class="`is-${a.action}`" x-text="a.label"></em><span x-text="a.token"></span></span>
                        </template>
                        <template x-if="rowHeld(row).length && rowActions(row).length">
                          <span class="rr-held" :title="`Held: ${rowHeld(row).join(', ')}`" x-text="`${rowHeld(row).length} held`"></span>
                        </template>
                        <template x-if="rowHeld(row).length && !rowActions(row).length">
                          <span class="rr-held" :title="`Held: ${rowHeld(row).join(', ')}`" x-text="`All ${rowHeld(row).length} held`"></span>
                        </template>
                        <template x-if="recommendation(row)?.kind === 'text'"><span class="rr-rowtext" x-text="recommendation(row).text"></span></template>
                        <template x-if="recommendation(row) && recommendation(row).kind !== 'text' && !rowActions(row).length && !rowHeld(row).length"><span class="rr-note" style="margin:0">No position calls</span></template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="historyError"><p class="rr-note" role="alert" x-text="historyError"></p></template>
          <template x-if="hasPages()">
            <nav class="rr-pager" aria-label="History pages">
              <span role="status" x-text="historyBusy ? 'Loading…' : historyRange()"></span>
              <div>
                <button type="button" class="rr-btn" :disabled="historyBusy || historyPage === 0" @click="goHistory(historyPage - 1)">Newer</button>
                <button type="button" class="rr-btn" :disabled="historyBusy || !hasOlder()" @click="goHistory(historyPage + 1)">Older</button>
              </div>
            </nav>
          </template>
        </section>
      </div>
    </template>

    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>

  <style>
    /* Page-local: the book's chart and wallet list. The record's components
       are shared in views.css (.rr-*). */
    .sp-wallets li { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .sp-wallet__label { font-size: 0.8rem; }
    .sp-wallets code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-text-muted); }
    .sp-sessions .sv__session-card { display: table-row; border: 0; padding: 0; background: none; }
    /* The reset above outranks views.css's .rr-stack row on a phone, so the
       portfolio history gives each session back its grid, padding and rule. */
    @media (max-width: 640px) {
      .sp-sessions .rr-stack tbody tr.sv__session-card { display: grid; padding: 0.75rem 0; border-bottom: 1px solid var(--color-border); }
    }
    .sp-sessions .sv__session-title { font-family: var(--font-sans); font-size: 0.8125rem; text-transform: none; letter-spacing: 0; }
    /* The weights history on a phone: the date and the sleeve figures stay
       side by side on one grid line (a sleeve's head keeps its swatch), and
       the moves run full width under them, so nothing scrolls sideways. */
    @media (max-width: 640px) {
      .sp-sessions .sp-weights { min-width: 0; }
      .sp-sessions .sp-weights thead tr, .sp-sessions .sp-weights tbody tr.sv__session-card { display: grid; grid-template-columns: 6.5rem repeat(var(--sleeves, 4), minmax(0, 1fr)); align-items: baseline; }
      .sp-sessions .sp-weights tbody tr.sv__session-card { border-bottom: 1px solid var(--color-border); }
      .sp-sessions .sp-weights thead th:last-child { grid-column: 1 / -1; padding-top: 0; }
      .sp-sessions .sp-weights thead th.q span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .sp-sessions .sp-weights th, .sp-sessions .sp-weights td { padding-inline: 0.375rem; border-bottom: 0; }
      .sp-sessions .sp-weights tbody td.rr-out { grid-column: 1 / -1; padding-top: 0; }
      .sp-sessions .sp-weights .rr-out > div { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; }
      .sp-sessions .sp-weights tbody th a { white-space: nowrap; }
    }
  </style>
</section>
