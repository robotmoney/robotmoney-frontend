<!-- Public swarm subject page, as a research record (RM-121). It opens the way
     a session opens (breadcrumb, head, one hairline row of facts), then:
     the latest recommendation and why, the book when the subject has one, and
     the recommendation history, one row per session. A session and the subject
     it reviews read as one document.
     Sections render only when the subject carries what they draw; the
     numbering is a CSS counter, so a missing section leaves no gap. -->
<section class="cv cv--detail" x-data="subjectProfile()">
  <div class="sv__body sv__body--narrow rr">
    <p class="sv__loading" x-show="loading">Loading subject…</p>
    <!-- x-if, not x-show: a hidden error node is still an error node for a
         reader's find-in-page and for a test's locator. -->
    <template x-if="error"><p class="sv__error" x-text="error"></p></template>

    <template x-if="!loading && subject && isFramework()">
      <div>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <span aria-current="page" x-text="subject.name"></span>
        </nav>

        <header class="rr-head">
          <!-- The operator is named only when it is not this house: peaq
               running Woon Treasury is the fact the slot exists for. -->
          <p class="sv__eyebrow sv__eyebrow--quiet"><span x-text="subjectKind()">portfolio</span><template x-if="operatorLabel()"><span> · operator <span x-text="operatorLabel()"></span></span></template></p>
          <h1 class="sv__detail-title" x-text="subject.name"></h1>
          <template x-if="subject.thesisBlurb"><p class="sv__lede sv__lede--compact" x-text="subject.thesisBlurb"></p></template>
          <template x-if="subject.homepage || subject.xHandle">
            <p class="rr-links sp-links">
              <template x-if="subject.homepage">
                <a class="rr-lnk" :href="subject.homepage" rel="noopener noreferrer" target="_blank" x-text="hostOf(subject.homepage) + ' ↗'"></a>
              </template>
              <template x-if="subject.xHandle">
                <a class="rr-lnk" :href="`https://x.com/${String(subject.xHandle).replace(/^@/, '')}`" rel="noopener noreferrer" target="_blank"
                   x-text="'@' + String(subject.xHandle).replace(/^@/, '') + ' ↗'"></a>
              </template>
            </p>
          </template>
        </header>

        <div class="rr-meta">
          <template x-if="lastReviewedLabel()">
            <span class="rr-meta__i">Latest review <b x-text="lastReviewedLabel()"></b></span>
          </template>
          <span class="rr-meta__i">Sessions <b x-text="sessionIndex.length"></b></span>
          <!-- x-if on `snapshot` alone: a framework subject is never given one
               (see subjectProfile.init), so "holdings" cannot reach a subject
               that has no book. -->
          <template x-if="snapshot">
            <span class="rr-meta__i">Holdings <b x-text="fmtUsd(snapshot?.totalValueUsd)"></b></span>
          </template>
          <template x-if="backdrop && backdrop.composite !== null">
            <span class="rr-meta__i">Composite <b x-text="fmtNum(backdrop?.composite, 3)"></b></span>
          </template>
          <template x-if="backdrop?.regime">
            <span class="rr-meta__i">Regime
              <i :style="`background:${regimeColor(backdrop?.regime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(backdrop?.regime)"></b>
            </span>
          </template>
          <template x-if="isFramework()">
            <a class="rr-meta__lnk" href="/allocation">Allocation &amp; vaults ↗</a>
          </template>
        </div>

        <!-- 01 · THE LATEST RECOMMENDATION. The mix (or the actions) on the
             left; what it proposes and why on the right, and the one prominent
             way into the session. -->
        <template x-if="latest()">
          <section class="rr-sec" id="latest" aria-labelledby="latest-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="latest-h">Latest recommendation</h2>
              <time class="rr-sec__aside" :datetime="latest().date" x-text="formatDate(latest().date, 'short')"></time>
            </div>
            <div class="rr-split rr-split--rule">
              <div>
                <template x-if="recommendation(latest())?.kind === 'weights'">
                  <div>
                    <div class="rr-mix">
                      <figure class="rr-ring">
                        <span class="sv__wdonut-host" role="img" :aria-label="`Recommended weights: ${sessionWeightsLabel(latest())}`"
                              x-html="weightDonutSvg(latest())"></span>
                        <figcaption>Recommended</figcaption>
                      </figure>
                      <ul class="rr-legend">
                        <template x-for="r in latestLegend()" :key="r.key">
                          <li :class="r.pct > 0 ? '' : 'is-zero'">
                            <i data-mark="series" :style="`background:${r.hue}`" aria-hidden="true"></i>
                            <span x-text="r.label"></span>
                            <b x-text="pctLabel(r.pct)"></b>
                            <template x-if="latest().reference">
                              <small>
                                <span class="alp__mv" :class="changeClass(r.d)"><i x-text="changeGlyph(r.d)" aria-hidden="true"></i><span x-text="changeLabel(r.d)"></span></span>
                                <span x-text="` vs target ${pctLabel(r.was)}`"></span>
                              </small>
                            </template>
                          </li>
                        </template>
                      </ul>
                    </div>
                    <p class="rr-note" x-text="latest().reference ? 'Target as handed to this session.' : 'This session did not record the target it was handed, so no change is shown.'"></p>
                  </div>
                </template>
                <template x-if="recommendation(latest())?.kind === 'actions'">
                  <dl class="sr__acts">
                    <template x-for="a in (latest().swarmRecommendation?.actions || []).filter((x) => x && x.action)" :key="`${a.token}-${a.action}`">
                      <div class="sr__act">
                        <dt x-text="a.token"></dt>
                        <dd><b x-text="a.action"></b><span x-text="a.rationale || ''"></span></dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <template x-if="!recommendation(latest())">
                  <p class="rr-note" style="margin-top:0">No recommendation was published for this session.</p>
                </template>

                <!-- The weights in force, on the page about them. Behind a
                     disclosure: the latest review already compares against the
                     target its own session was handed. -->
                <template x-if="hasTargetsCard()">
                  <div class="rr-disc" style="margin-top:1.5rem" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                    <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="targets-in-force" @click="open = !open">
                      <span x-text="allocationTitle()">Target weights in force</span>
                      <small x-show="allocationAsOf()" x-text="`Since ${allocationAsOf()}`"></small>
                    </button>
                    <div class="rr-disc__anim" id="targets-in-force" role="region" :aria-label="allocationTitle()" :inert="!open">
                      <div class="rr-disc__clip"><div class="rr-disc__body">
                        <div class="sv__sleeves sp-alloc__body" style="max-width:none">
                          <template x-for="t in allocationTargets()" :key="t.label">
                            <div class="sv__sleeve">
                              <span class="sv__sleeve-n"><i class="sv__bucket-dot" :style="`background:${t.hue}`" aria-hidden="true"></i><span x-text="t.label"></span></span>
                              <template x-if="sleeveBar(t) !== null">
                                <span class="sv__sleeve-track"><i :style="`width:${sleeveBar(t)}%`"></i></span>
                              </template>
                              <template x-if="sleeveBar(t) === null"><span></span></template>
                              <span class="sv__sleeve-v" x-text="t.pct === null ? '—' : `${t.pct}%`"></span>
                            </div>
                          </template>
                        </div>
                        <p class="rr-note" x-show="allocationNote()" x-text="allocationNote()"></p>
                        <p class="rr-note"><a class="rr-lnk" href="/allocation">See the allocation page</a></p>
                      </div></div>
                    </div>
                  </div>
                </template>
              </div>

              <div x-data="{ more: false }">
                <template x-if="recommendation(latest())?.kind === 'weights'">
                  <p class="rr-k" style="margin-bottom:1rem" x-text="rowOutcome(latest())"></p>
                </template>
                <template x-if="latest().swarmRecommendation?.rationale || latest().synthesis">
                  <div>
                    <div class="rr-prose" :class="!more && isLong(latest().swarmRecommendation?.rationale || latest().synthesis, 480) ? 'is-clamped' : ''" style="--rr-lines:8"
                         x-html="linkified(latest().swarmRecommendation?.rationale || latest().synthesis)"></div>
                    <template x-if="isLong(latest().swarmRecommendation?.rationale || latest().synthesis, 480)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more ? 'true' : 'false'">
                        <span x-text="more ? 'Show less' : 'Read full rationale'"></span><small x-text="`${wordCount(latest().swarmRecommendation?.rationale || latest().synthesis)} words`"></small>
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="stanceTally(latest()).length">
                  <p class="rr-counts">
                    <template x-for="x in stanceTally(latest())" :key="x.stance">
                      <span :style="`color:${stanceColor(x.stance)}`"><i :style="`background:${stanceColor(x.stance)}`" aria-hidden="true"></i><span x-text="x.stance"></span><b x-text="x.n"></b></span>
                    </template>
                    <em x-text="[quorumText(latest()), meanConfidenceText(latest())].filter(Boolean).join(' · ')"></em>
                  </p>
                </template>
                <a class="rr-cta" :href="sessionHref(latest())">
                  <span x-text="`Read the ${formatDate(latest().date, 'short')} session`"></span><span aria-hidden="true">→</span>
                </a>
              </div>
            </div>
          </section>
        </template>

        <!-- THE BOOK, when the subject has one: concentration over time, the
             holdings today, and the wallets they are read from. -->
        <template x-if="snapshot || concentrationArea() || trackedWallets().length || nftContracts().length">
          <section class="rr-sec" id="holdings" aria-labelledby="hold-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="hold-h">Holdings</h2>
              <template x-if="snapshot"><span class="rr-sec__aside" x-text="`${fmtUsd(snapshot?.totalValueUsd)} · ${snapshot?.date}`"></span></template>
            </div>
            <div class="rr-split">
              <div>
                <template x-if="concentrationArea()">
                  <div class="sp-chart">
                    <p class="rr-k" x-text="`Top positions as % of NAV · ${spanLabel()}`"></p>
                    <div class="sp-chart__body">
                      <div class="sp-chart__svg" x-html="concentrationArea()"></div>
                      <ul class="sp-legend">
                        <template x-for="l in concentrationLegend()" :key="l.token">
                          <li>
                            <i class="sp-legend__key" :style="`--k:${l.color}`" aria-hidden="true"></i>
                            <span class="sp-legend__token" x-text="l.token"></span>
                            <span class="sp-legend__pct" x-text="l.pct"></span>
                          </li>
                        </template>
                      </ul>
                    </div>
                  </div>
                </template>
              </div>
              <div>
                <template x-if="snapshot">
                  <div class="sv__table-wrap sv__portfolio" style="margin:0">
                    <table class="sv__data-table">
                      <thead><tr><th>Token</th><th>Chain</th><th class="sv__num">Value</th><th class="sv__num">Share</th></tr></thead>
                      <tbody>
                        <template x-for="p in positionRows().slice(0, 8)" :key="`${p.token}-${p.chain}`">
                          <tr>
                            <td><i class="sp-key" :style="`--k:${seriesColor(p.token)}`" aria-hidden="true"></i><span x-text="p.token"></span></td>
                            <td x-text="p.chain"></td>
                            <td class="sv__num" x-text="fmtUsd(p.value_usd)"></td>
                            <td class="sv__num" x-text="fmtPct1(p.share)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="(snapshot?.notable || []).length">
                  <div class="rr-block" style="margin-top:1.5rem">
                    <p class="rr-k">Notable</p>
                    <ul class="rr-list" style="margin-top:0.75rem">
                      <template x-for="n in (snapshot?.notable || [])" :key="n"><li x-text="n"></li></template>
                    </ul>
                  </div>
                </template>
              </div>
            </div>
            <template x-if="trackedWallets().length">
              <div class="rr-disc" style="margin-top:1.5rem" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="tracked-wallets" @click="open = !open">
                  Tracked wallets <small x-text="trackedWallets().length"></small>
                </button>
                <div class="rr-disc__anim" id="tracked-wallets" role="region" aria-label="Tracked wallets" :inert="!open">
                  <div class="rr-disc__clip"><div class="rr-disc__body">
                    <ul class="sv__bullet-list sp-wallets">
                      <template x-for="w in trackedWallets()" :key="`${w.chain}-${w.address}`">
                        <li>
                          <span class="sp-wallet__label" x-text="w.label || 'wallet'"></span>
                          <span class="sv__tag" x-text="w.chain"></span>
                          <code x-text="truncAddress(w.address)"></code>
                        </li>
                      </template>
                    </ul>
                  </div></div>
                </div>
              </div>
            </template>
            <template x-if="nftContracts().length">
              <div class="rr-disc" x-data="{ open: false }" :class="open ? 'is-open' : ''">
                <button type="button" class="rr-disc__btn" :aria-expanded="open ? 'true' : 'false'" aria-controls="nft-contracts" @click="open = !open">
                  NFT contracts <small>Declared by the operator, not valued</small>
                </button>
                <div class="rr-disc__anim" id="nft-contracts" role="region" aria-label="NFT contracts" :inert="!open">
                  <div class="rr-disc__clip"><div class="rr-disc__body">
                    <ul class="sv__bullet-list">
                      <template x-for="n in nftContracts()" :key="`${n.chain}-${n.name}`">
                        <li><span x-text="n.name"></span> <span class="sv__tag" x-text="n.chain"></span></li>
                      </template>
                    </ul>
                  </div></div>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- THE HISTORY. One row per published session, newest first, paged.
             A weights subject shows each recommended mix and its moves against
             the target THAT session was handed; any other subject shows how
             the room leaned and what it recommended. -->
        <section class="rr-sec sp-sessions" id="history" aria-labelledby="hist-h" :aria-busy="historyBusy ? 'true' : 'false'">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="hist-h" x-text="isWeightsSubject() ? 'Recommendation history' : 'Session history'">Session history</h2>
            <span class="rr-sec__aside sv__session-count" x-text="`${sessionIndex.length} ${sessionIndex.length === 1 ? 'session' : 'sessions'}`"></span>
          </div>

          <template x-if="!sessionIndex.length">
            <p class="sv__empty">No published session yet.</p>
          </template>

          <template x-if="sessionIndex.length && isWeightsSubject()">
            <div class="rr-tablewrap">
              <table class="rr-table">
                <caption class="sr-only">Recommended sleeve weights by session, percent of the allocation, with each session's moves against the target it was handed.</caption>
                <thead>
                  <tr>
                    <th scope="col">Session</th>
                    <template x-for="c in sleeveColumns()" :key="c.key">
                      <th scope="col" class="q"><i data-mark="series" :style="`background:${c.hue}`" aria-hidden="true"></i><span x-text="c.label"></span></th>
                    </template>
                    <th scope="col">vs session target</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in sessions" :key="row.id">
                    <tr class="sv__session-card">
                      <th scope="row">
                        <a class="rr-lnk sv__session-title" :href="sessionHref(row)" x-text="formatDate(row.date, 'short')"></a>
                        <small x-text="[rowTime(row), `${row.takes || 0} ${row.takes === 1 ? 'take' : 'takes'}`].filter(Boolean).join(' · ')"></small>
                      </th>
                      <template x-for="(v, i) in rowWeights(row)" :key="i">
                        <td class="q" :class="v === 0 ? 'is-zero' : ''" x-text="v == null ? '—' : pctLabel(v)"></td>
                      </template>
                      <td class="rr-out">
                        <template x-if="rowMoves(row) && rowMoves(row).length">
                          <div>
                            <template x-for="m in rowMoves(row)" :key="m.key">
                              <span><span x-text="`${m.label} `"></span><span class="alp__mv" :class="changeClass(m.d)"><i x-text="changeGlyph(m.d)" aria-hidden="true"></i><span x-text="changeLabel(m.d)"></span></span></span>
                            </template>
                          </div>
                        </template>
                        <template x-if="!(rowMoves(row) && rowMoves(row).length)">
                          <span class="rr-note" style="margin:0" x-text="rowOutcome(row)"></span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="sessionIndex.length && !isWeightsSubject()">
            <div class="rr-tablewrap">
              <table class="rr-table" style="min-width:36rem">
                <thead>
                  <tr><th scope="col">Session</th><th scope="col">Consensus</th><th scope="col">Recommendation</th></tr>
                </thead>
                <tbody>
                  <template x-for="row in sessions" :key="row.id">
                    <tr class="sv__session-card">
                      <th scope="row">
                        <a class="rr-lnk sv__session-title" :href="sessionHref(row)" x-text="formatDate(row.date, 'short')"></a>
                        <small x-text="[rowTime(row), `${row.takes || 0} ${row.takes === 1 ? 'take' : 'takes'}`].filter(Boolean).join(' · ')"></small>
                      </th>
                      <td>
                        <template x-if="lean(row)">
                          <span class="sv__stance-badge" :style="leanBadgeStyle(row)"><i x-show="leanStance(row)" :style="leanDotStyle(row)"></i><span x-text="leanLabel(row)"></span></span>
                        </template>
                        <template x-if="!lean(row)"><span>—</span></template>
                      </td>
                      <td style="font-family:var(--font-sans);white-space:normal">
                        <template x-if="recommendation(row)?.kind === 'actions'">
                          <span x-text="recommendation(row).actions.map((a) => `${a.action} ${a.token}`).join(' · ') + (recommendation(row).more ? ` · +${recommendation(row).more} more` : '')"></span>
                        </template>
                        <template x-if="recommendation(row)?.kind === 'text'"><span x-text="recommendation(row).text"></span></template>
                        <template x-if="!recommendation(row)"><span class="rr-note" style="margin:0">No recommendation published</span></template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="historyError"><p class="rr-note" role="alert" x-text="historyError"></p></template>
          <template x-if="historyPageCount() > 1">
            <nav class="rr-pager" aria-label="History pages">
              <span role="status" x-text="historyBusy ? 'Loading…' : historyRange()"></span>
              <div>
                <button type="button" class="rr-btn" :disabled="historyBusy || historyPage === 0" @click="goHistory(historyPage - 1)">Newer</button>
                <button type="button" class="rr-btn" :disabled="historyBusy || historyPage >= historyPageCount() - 1" @click="goHistory(historyPage + 1)">Older</button>
              </div>
            </nav>
          </template>
          <template x-if="isWeightsSubject() && sessionIndex.length">
            <p class="rr-note">These are recommendations, not a record of executed holdings. A session without a recorded target shows no moves.</p>
          </template>
        </section>
      </div>
    </template>

    <!-- Portfolio research has its own hierarchy. The Allocation framework
         keeps its existing composition above. Both use the shared record UI. -->
    <template x-if="!loading && subject && !isFramework()">
      <div class="rr pr" data-portfolio-overview @click="researchAnchor($event)">
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">
            Swarm
          </a>
          <span aria-hidden="true">
            /
          </span>
          <span aria-current="page" x-text="subject.name">
          </span>
        </nav>
        <header class="rr-head">
          <p class="sv__eyebrow sv__eyebrow--quiet">
            <span x-text="subjectKind()">
            </span>
            · swarm research
            <template x-if="operatorLabel()">
              <span x-text="` · ${operatorLabel()}`">
              </span>
            </template>
          </p>
          <h1 class="sv__detail-title" x-text="subject.name">
          </h1>
          <div x-data="{ more: false }">
            <p class="rr-prose pr-intro" :class="!more && isLong(subject.thesisBlurb, 300) ? 'is-clamped' : ''" style="--rr-lines:3" x-text="subject.thesisBlurb">
            </p>
            <template x-if="isLong(subject.thesisBlurb, 300)">
              <button class="rr-more" type="button" @click="more = !more" :aria-expanded="more">
                <span x-text="more ? 'Show less' : 'About this portfolio'">
                </span>
              </button>
            </template>
          </div>
          <p class="rr-links">
            <template x-if="subject.homepage">
              <a class="rr-lnk" :href="subject.homepage" target="_blank" rel="noopener noreferrer" x-text="`${hostOf(subject.homepage)} ↗`">
              </a>
            </template>
            <template x-if="subject.xHandle">
              <a class="rr-lnk" :href="`https://x.com/${String(subject.xHandle).replace(/^@/, '')}`" target="_blank" rel="noopener noreferrer" x-text="'@' + String(subject.xHandle).replace(/^@/, '') + ' ↗'">
              </a>
            </template>
          </p>
        </header>
        <div class="rr-meta">
          <span class="rr-meta__i">
            Sessions available
            <b x-text="sessionIndex.length">
            </b>
          </span>
          <template x-if="latest()">
            <span class="rr-meta__i">
              Last reviewed
              <b x-text="formatDate(latest().date, 'short')">
              </b>
            </span>
          </template>
          <template x-if="trackedWallets().length">
            <span class="rr-meta__i">
              Tracked wallets
              <b x-text="trackedWallets().length">
              </b>
            </span>
          </template>
        </div>
        <nav class="rr-jump" aria-label="Subject sections">
          <a href="#latest-review">
            Latest review
          </a>
          <a href="#holdings">
            Recorded holdings
          </a>
          <a href="#history">
            Session history
          </a>
          <a href="#mandate">
            Review mandate
          </a>
        </nav>
        <section class="rr-sec" id="latest-review" aria-labelledby="portfolio-review-h">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="portfolio-review-h">
              Latest review
            </h2>
            <template x-if="latest()">
              <span class="rr-sec__aside" x-text="formatDate(latest().date, 'long')">
              </span>
            </template>
          </div>
          <template x-if="latest()">
            <div class="pr-review">
              <div>
                <p class="rr-k">
                  Swarm view
                  <span x-html="researchTooltip('view', 'subject-view-tip')">
                  </span>
                </p>
                <h3 class="pr-verdict">
                  <template x-if="leanStance(latest())">
                    <i :style="leanDotStyle(latest())" aria-hidden="true">
                    </i>
                  </template>
                  <span x-text="researchView(latest())">
                  </span>
                </h3>
                <p class="pr-vote-note" x-text="leadShare(latest()) ? `${leadShare(latest())} members share this stance` : 'No single stance leads'">
                </p>
                <div x-html="stanceTallyMarkup(latest())">
                </div>
                <template x-if="researchRationale(latest())">
                  <div class="pr-rationale" x-data="{ more: false }">
                    <div class="rr-prose" :class="!more && isLong(researchRationale(latest()), 500) ? 'is-clamped' : ''" style="--rr-lines:6" x-html="inlineMarks(researchRationale(latest()))">
                    </div>
                    <template x-if="isLong(researchRationale(latest()), 500)">
                      <button type="button" class="rr-more" @click="more = !more" :aria-expanded="more" x-text="more ? 'Show less' : 'Read full rationale'">
                      </button>
                    </template>
                  </div>
                </template>
                <template x-if="researchActions(latest()).length">
                  <dl class="pr-actions">
                    <template x-for="(a, i) in researchActions(latest()).slice(0, 3)" :key="i">
                      <div>
                        <dt x-text="a.token">
                        </dt>
                        <dd x-text="a.action">
                        </dd>
                      </div>
                    </template>
                  </dl>
                </template>
                <a class="rr-cta" :href="sessionHref(latest())">
                  <span>
                    Read the session
                    &amp;
                    member takes
                  </span>
                  <span aria-hidden="true">
                    →
                  </span>
                </a>
              </div>
              <aside class="pr-context" aria-label="Review context">
                <p class="rr-k">
                  Participation
                </p>
                <p class="pr-context__value" x-text="quorumText(latest()) || 'Not recorded'">
                </p>
                <template x-if="meanConfidenceText(latest())">
                  <p class="rr-note">
                    <span x-text="meanConfidenceText(latest())">
                    </span>
                    <span x-html="researchTooltip('confidence', 'subject-confidence-tip')">
                    </span>
                  </p>
                </template>
                <template x-if="backdrop?.regime">
                  <div class="pr-context__section">
                    <p class="rr-k">
                      Market at review
                    </p>
                    <p class="pr-regime">
                      <i :style="`background:${regimeColor(backdrop.regime)}`" aria-hidden="true">
                      </i>
                      <span x-text="regimeLabel(backdrop.regime)">
                      </span>
                    </p>
                    <p class="rr-note" x-text="formatDate(latest().date, 'short')">
                    </p>
                  </div>
                </template>
                <template x-if="sessionWeights(latest())?.length">
                  <div class="pr-context__section">
                    <p class="rr-k">
                      Proposed sleeve weights
                    </p>
                    <ul class="rr-legend">
                      <template x-for="w in sessionWeights(latest())" :key="w.key">
                        <li>
                          <i data-mark="series" :style="`background:${w.colour}`" aria-hidden="true">
                          </i>
                          <span x-text="w.label">
                          </span>
                          <b x-text="pctLabel(w.pct)">
                          </b>
                        </li>
                      </template>
                    </ul>
                  </div>
                </template>
              </aside>
            </div>
          </template>
          <template x-if="!latest()">
            <p class="rr-prose">
              No published review available.
            </p>
          </template>
        </section>
        <section class="rr-sec" id="holdings" aria-labelledby="portfolio-holdings-h" x-data="{ all: false, history: false, notes: false }">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="portfolio-holdings-h">
              Recorded holdings
            </h2>
            <span x-html="researchTooltip('holdings', 'subject-holdings-tip')">
            </span>
          </div>
          <template x-if="snapshot">
            <div>
              <div class="pr-book-meta">
                <p>
                  <b x-text="snapshot.totalValueUsd == null ? 'Not reported' : fmtUsd(snapshot.totalValueUsd)">
                  </b>
                  <span>
                    book value
                  </span>
                </p>
                <p>
                  <b x-text="formatDate(snapshot.date, 'short')">
                  </b>
                  <span>
                    snapshot date
                  </span>
                </p>
                <p>
                  <b x-text="portfolioRows(snapshot).length">
                  </b>
                  <span>
                    positions
                  </span>
                </p>
              </div>
              <div x-html="holdingsMarkup(snapshot, all)">
              </div>
              <template x-if="portfolioRows(snapshot).length > 8">
                <button type="button" class="rr-more" @click="all = !all" :aria-expanded="all" x-text="all ? 'Show top 8 positions' : `Show all ${portfolioRows(snapshot).length} positions`">
                </button>
              </template>
              <template x-if="concentrationArea()">
                <div class="rr-disc pr-disclosure" :class="history ? 'is-open' : ''">
                  <button type="button" class="rr-disc__btn" @click="history = !history" :aria-expanded="history" aria-controls="portfolio-concentration">
                    Concentration over time
                    <small x-text="`${windowed().length} readings`">
                    </small>
                  </button>
                  <div class="rr-disc__anim" id="portfolio-concentration" :inert="!history">
                    <div class="rr-disc__clip">
                      <div class="rr-disc__body">
                        <p class="rr-note" x-text="spanLabel()">
                        </p>
                        <div class="sp-chart__body">
                          <div class="sp-chart__svg" x-html="concentrationArea()">
                          </div>
                          <ul class="sp-legend">
                            <template x-for="l in concentrationLegend()" :key="l.token">
                              <li>
                                <i class="sp-legend__key" :style="`--k:${l.color}`" aria-hidden="true">
                                </i>
                                <span class="sp-legend__token" x-text="l.token">
                                </span>
                                <span class="sp-legend__pct" x-text="l.pct">
                                </span>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
              <template x-if="snapshot.notable?.length">
                <div class="rr-disc pr-disclosure" :class="notes ? 'is-open' : ''">
                  <button type="button" class="rr-disc__btn" @click="notes = !notes" :aria-expanded="notes" aria-controls="portfolio-notes">
                    Snapshot notes
                  </button>
                  <div class="rr-disc__anim" id="portfolio-notes" :inert="!notes">
                    <div class="rr-disc__clip">
                      <div class="rr-disc__body">
                        <ul class="rr-list">
                          <template x-for="(n,i) in snapshot.notable" :key="i">
                            <li x-text="n">
                            </li>
                          </template>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <template x-if="!snapshot">
            <p class="rr-prose">
              No holdings snapshot available.
            </p>
          </template>
        </section>
        <section class="rr-sec" id="history" aria-labelledby="portfolio-history-h" :aria-busy="historyBusy">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="portfolio-history-h">
              Session history
            </h2>
            <span class="rr-sec__aside" x-text="`${sessionIndex.length} available`">
            </span>
          </div>
          <form class="pr-controls" @submit.prevent="searchHistory()">
            <label>
              Find a session by date
              <input type="search" x-model="historyQuery" placeholder="June 2026 or 2026-06-22" :disabled="historyBusy">
            </label>
            <button type="submit" class="rr-btn" :disabled="historyBusy">
              Find sessions
            </button>
            <button type="button" class="rr-btn" @click="historyQuery = ''; searchHistory()" :disabled="historyBusy || !historyQuery">
              Clear
            </button>
          </form>
          <template x-if="historyError">
            <p role="alert" class="sv__error" x-text="historyError">
            </p>
          </template>
          <div class="pr-history" :class="historyBusy ? 'is-loading' : ''">
            <div class="pr-history__labels" aria-hidden="true">
              <span>
                Session
              </span>
              <span>
                Swarm view
              </span>
              <span>
                Proposed action
              </span>
              <span>
                Takes
              </span>
            </div>
            <template x-for="s in sessions" :key="s.id">
              <article class="pr-history__row">
                <a :href="sessionHref(s)" class="pr-history__date">
                  <time :datetime="s.date" x-text="formatDate(s.date, 'short')">
                  </time>
                  <small x-text="rowTime(s)">
                  </small>
                </a>
                <span class="pr-history__view">
                  <template x-if="leanStance(s)">
                    <i :style="leanDotStyle(s)" aria-hidden="true">
                    </i>
                  </template>
                  <span x-text="researchView(s)">
                  </span>
                </span>
                <p class="pr-history__decision" x-text="researchDecision(s)">
                </p>
                <a :href="`${sessionHref(s)}#takes`" class="pr-history__takes" :aria-label="`${takesCount(s)} takes, ${formatDate(s.date, 'short')}`">
                  <b x-text="takesCount(s)">
                  </b>
                  <span aria-hidden="true">
                    ↗
                  </span>
                </a>
              </article>
            </template>
          </div>
          <template x-if="!sessions.length && !historyBusy">
            <p class="rr-note">
              No sessions match this date.
            </p>
          </template>
          <div class="rr-pager">
            <span role="status" aria-live="polite" x-text="historyBusy ? 'Loading sessions…' : `${historyRange()} sessions`">
            </span>
            <div>
              <button type="button" class="rr-btn" @click="goHistory(historyPage - 1)" :disabled="historyBusy || historyPage === 0">
                Previous
              </button>
              <button type="button" class="rr-btn" @click="goHistory(historyPage + 1)" :disabled="historyBusy || historyPage + 1 >= historyPageCount()">
                Next
              </button>
            </div>
          </div>
        </section>
        <section class="rr-sec" id="mandate" aria-labelledby="portfolio-mandate-h">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="portfolio-mandate-h">
              Review mandate
            </h2>
          </div>
          <p class="rr-prose">
            The swarm publishes views on this portfolio. Proposed actions do not establish that its holdings changed.
          </p>
          <template x-if="structuralNotesOf(subject).length">
            <div class="rr-disc pr-disclosure" x-data="{ open: false }" :class="open ? 'is-open' : ''">
              <button type="button" class="rr-disc__btn" @click="open = !open" :aria-expanded="open" aria-controls="portfolio-instructions">
                Operator instructions
              </button>
              <div class="rr-disc__anim" id="portfolio-instructions" :inert="!open">
                <div class="rr-disc__clip">
                  <div class="rr-disc__body">
                    <ul class="rr-list">
                      <template x-for="(n,i) in structuralNotesOf(subject)" :key="i">
                        <li x-text="n">
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </template>
          <template x-if="trackedWallets().length">
            <div class="rr-disc pr-disclosure" x-data="{ open: false }" :class="open ? 'is-open' : ''">
              <button type="button" class="rr-disc__btn" @click="open = !open" :aria-expanded="open" aria-controls="portfolio-wallets">
                Tracked wallets
                <small x-text="trackedWallets().length">
                </small>
              </button>
              <div class="rr-disc__anim" id="portfolio-wallets" :inert="!open">
                <div class="rr-disc__clip">
                  <div class="rr-disc__body">
                    <dl class="rr-dl">
                      <template x-for="(w,i) in trackedWallets()" :key="i">
                        <div>
                          <dt x-text="`${w.label || 'Wallet'} · ${w.chain}`">
                          </dt>
                          <dd>
                            <code x-text="w.address">
                            </code>
                          </dd>
                        </div>
                      </template>
                    </dl>
                  </div>
                </div>
              </div>
            </div>
          </template>
          <template x-if="nftContracts().length">
            <div class="rr-disc pr-disclosure" x-data="{ open: false }" :class="open ? 'is-open' : ''">
              <button type="button" class="rr-disc__btn" @click="open = !open" :aria-expanded="open" aria-controls="portfolio-nfts">
                NFT contracts
              </button>
              <div class="rr-disc__anim" id="portfolio-nfts" :inert="!open">
                <div class="rr-disc__clip">
                  <div class="rr-disc__body">
                    <p class="rr-note">
                      Declared by the operator. Valuations are not included.
                    </p>
                    <ul class="rr-list">
                      <template x-for="(n,i) in nftContracts()" :key="i">
                        <li x-text="`${n.name} · ${n.chain}`">
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </template>
          <p class="rr-links">
            <a class="rr-lnk" href="/swarm/subjects/robotmoney-allocation">
              Robot Money Allocation research →
            </a>
          </p>
        </section>
      </div>
    </template>

    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>

  <style>
    /* Page-local: the book's chart and wallet list. The record's components
       are shared in views.css (.rr-*). */
    .sp-chart__body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.5rem 1.5rem; margin: 1rem 0 0; }
    .sp-chart__svg { flex: 1 1 300px; min-width: 0; }
    .sp-chart__svg svg { display: block; width: 100%; height: auto; }
    .sp-legend { flex: 0 1 auto; list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.9; }
    .sp-legend li { display: flex; align-items: baseline; gap: 0.5rem; white-space: nowrap; }
    .sp-legend__key { flex: none; width: 0.5rem; height: 0.5rem; background: var(--k, var(--color-border)); transform: translateY(1px); }
    .sp-legend__token { color: var(--color-text); }
    .sp-legend__pct { margin-left: auto; padding-left: 0.75rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
    @media (max-width: 620px) {
      .sp-legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; width: 100%; }
      .sp-legend__pct { margin-left: 0; padding-left: 0; }
    }
    .sp-wallets li { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .sp-wallet__label { font-size: 0.8rem; }
    .sp-wallets code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-text-muted); }
    .sp-sessions .sv__session-card { display: table-row; border: 0; padding: 0; background: none; }
    .sp-sessions .sv__session-title { font-family: var(--font-sans); font-size: 0.8125rem; text-transform: none; letter-spacing: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</section>
