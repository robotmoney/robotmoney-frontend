<!-- Swarm member profile, as a research record (RM-121): a breadcrumb, the
     member, one hairline row of facts, what it declared it looks for, then its
     takes in the shared take card, headed by what each take was about. -->
<section class="cv cv--detail" x-data="memberProfile()">
  <div class="sv__body sv__body--narrow rr">
    <p class="rm-visually-hidden" role="status" x-show="loading">Loading member</p>
    <div class="sv__skel" x-show="loading" aria-hidden="true">
      <div class="sv__skel-h"></div>
      <div class="sv__skel-cols">
        <div class="sv__skel-box"></div><div class="sv__skel-box"></div><div class="sv__skel-box"></div>
      </div>
      <div class="sv__skel-h"></div>
      <div class="sv__skel-card"></div><div class="sv__skel-card"></div><div class="sv__skel-card"></div>
    </div>
    <div class="rr-head" x-show="error" x-cloak><p class="sv__error" x-text="error"></p><p class="rr-links"><a class="rr-lnk" href="/swarm">Swarm</a></p></div>

    <template x-if="!loading && member">
      <div>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <a href="/swarm#members">Members</a><span aria-hidden="true">/</span>
          <span aria-current="page" x-text="member.name"></span>
        </nav>

        <header class="rr-head rr-profile">
          <!-- No aria-label: the h1 beside it carries the name. -->
          <div class="sv__avatar sv__avatar--mark rr-profile__mark"
               x-html="memberMark(member.keyFingerprint || member.id, member.name, 72, member.avatar?.path, member.handle)"></div>
          <div>
            <h1 class="sv__detail-title profile-name" x-text="member.name"></h1>
            <p class="sv__lede sv__lede--compact profile-role" x-show="memberTagline(member)" x-text="memberTagline(member)"></p>
          </div>
        </header>

        <!-- Whether it holds a seat now and since when, then the record in
             figures, then who runs it. -->
        <div class="rr-meta" x-show="member.status === 'active' || member.operator || recordStats().takes">
          <template x-if="member.status === 'active'">
            <span class="rr-meta__i"><i class="mp-pulse" aria-hidden="true"></i>Active<template x-if="member.activatedAt"><span> since <b x-text="formatDate(member.activatedAt, 'short')"></b></span></template></span>
          </template>
          <template x-if="recordStats().takes"><span class="rr-meta__i">Takes filed <b x-text="recordStats().takes"></b></span></template>
          <!-- A record of archived takes only has nothing to verify: "0 / 0"
               reads as a failing score, so it states the archived count. -->
          <template x-if="recordStats().verifiable"><span class="rr-meta__i">Signed &amp; verified<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About signed and verified">i</button><span class="rm-tip__bub" role="tooltip">Signatures re-checked against this member&rsquo;s key.</span></span> <b x-text="`${recordStats().verified} / ${recordStats().verifiable}`"></b></span></template>
          <template x-if="recordStats().archival"><span class="rr-meta__i">Archived<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About archived takes">i</button><span class="rm-tip__bub" role="tooltip">Filed before members signed their takes.</span></span> <b x-text="recordStats().archival"></b></span></template>
          <template x-if="recordStats().takes"><span class="rr-meta__i">Mean confidence<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About mean confidence">i</button><span class="rm-tip__bub" role="tooltip">How boldly it argues.</span></span> <b x-text="recordStats().conviction"></b></span></template>
          <template x-if="member.operator">
            <span class="rr-meta__i">Operator <b x-text="operatorName(member.operator)"></b></span>
          </template>
        </div>

        <!-- Declared intent, between what is happening now and the evidence,
             because the record grows without bound. -->
        <section class="rr-sec" id="intent" aria-labelledby="intent-h">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="intent-h">What it looks for</h2>
          </div>
          <div class="rr-split rr-split--rule">
            <div>
              <p class="rr-k rr-sub">Lens</p>
              <p class="rr-profile__lens" x-text="member.lens || 'Not stated'"></p>
              <p class="rr-k rr-sub" style="margin-top:1.5rem">Biases</p>
              <ul class="rr-tags">
                <template x-for="b in memberBiases(member)" :key="b"><li x-text="b"></li></template>
              </ul>
              <template x-if="!memberBiases(member).length"><p class="rr-prose">Not stated</p></template>
            </div>
            <div>
              <p class="rr-k rr-sub">Mandate</p>
              <p class="rr-prose" x-text="member.mandate || 'Not stated'"></p>
            </div>
          </div>
        </section>

        <!-- Filed, not yet published: shown on their own so a just-submitted
             take never reads as "nothing yet". -->
        <template x-if="inProgressTakes().length">
          <section class="rr-sec" id="latest" aria-labelledby="latest-h">
            <div class="rr-sec__head">
              <h2 class="rr-sec__h" id="latest-h" x-text="inProgressTakes().length > 1 ? 'Latest takes' : 'Latest take'"></h2>
            </div>
            <div class="rr-takes">
              <template x-for="row in inProgressTakes()" :key="`ip-${row.session.date}-${row.session.subjectId}-${row.take.id}`">
                <article class="rr-take" x-data="takeCard()">
                  <div class="rr-take__top">
                    <div class="rr-take__what">
                      <a class="rr-take__name" :href="`/swarm/${row.session.date}/${row.session.subjectId}`" x-text="subjectNameOf(row.session)"></a>
                      <span class="mp-when" tabindex="0" :aria-label="filedTitle(row)"><time class="mp-take__date" :datetime="filedAt(row)" x-text="filedLabel(row)"></time><span class="mp-when__tip" role="tooltip" x-text="filedTitle(row)"></span></span>
                    <span :class="phaseChipClass(row.phase)" x-text="phaseLabel(row.phase)"></span>
                    </div>
                    <div class="rr-take__stance">
                      <span class="sv__stance-badge" :style="stanceStyle(row.take.stance)">
                        <i :style="`background:${stanceColor(row.take.stance)}`"></i><span x-text="row.take.stance"></span>
                      </span>
                      <template x-if="Number.isFinite(Number(row.take.confidence))">
                        <span class="rr-conf">Confidence <b x-text="fmtPct(row.take.confidence)"></b></span>
                      </template>
                      <a class="sv__vfy rr-vfy" :href="takeHref(row.take) || undefined" :class="{ 'sv__vfy--bad': !row.take.verified && !row.take.archival, 'sv__vfy--arch': row.take.archival }"
                            data-verified-badge :data-take-id="row.take.id" :data-verified-state="verifyLabel(row.take.verified, row.take.archival)"
                            tabindex="0" :aria-label="`${verifyLabel(row.take.verified, row.take.archival)}. ${verifyTip(row.take.verified, row.take.archival)}`">
                        <svg class="sv__vfy-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                          <rect x="1.4" y="1.4" width="13.2" height="13.2" stroke="currentColor" stroke-width="1.2"/>
                          <path :d="verifyPath(row.take.verified, row.take.archival)" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
                        </svg>
                        <span class="sv__vfy-label" x-text="verifyLabel(row.take.verified, row.take.archival)"></span>
                        <span class="sv__vfy-tip" aria-hidden="true" x-text="verifyTip(row.take.verified, row.take.archival)"></span>
                      </a>
                    </div>
                  </div>
                  <!-- Closed, a structured take leads with the member's CALL, the section
                       about the subject under review, not the regime notes every take opens
                       with. Open, the whole take in its own order. The card grows and shrinks
                       by height (lib/take-card.js). -->
                  <div class="rr-take__main" :class="weightRows(row.take).length ? 'has-aside' : ''">
                    <div>
                      <div class="rr-take__text" x-ref="text">
                        <template x-if="!open && call(row.take.body, subjectNameOf(row.session))">
                          <div class="sv__take-body rr-prose" x-html="linkified(call(row.take.body, subjectNameOf(row.session)).text)"></div>
                        </template>
                        <template x-if="open || !call(row.take.body, subjectNameOf(row.session))">
                          <div class="sv__take-body rr-prose" :class="!open && long(row.take.body) ? 'is-clamped' : ''" style="--rr-lines:5" x-html="linkified(row.take.body || '')"></div>
                        </template>
                      </div>
                      <template x-if="call(row.take.body, subjectNameOf(row.session)) || long(row.take.body)">
                        <button type="button" class="rr-more" @click="toggle()" :aria-expanded="open ? 'true' : 'false'">
                          <span x-text="open ? 'Show less' : 'Read full take'"></span>
                        </button>
                      </template>
                    </div>
                    <template x-if="weightRows(row.take).length">
                      <aside class="rr-take__aside">
                        <p class="rr-k rr-sub">Proposed weights</p>
                        <ul class="rr-legend">
                          <template x-for="w in weightRows(row.take)" :key="w.key">
                            <li :class="w.pct > 0 ? '' : 'is-zero'"><i data-mark="series" :style="`background:${w.colour}`" aria-hidden="true"></i><span x-text="w.label"></span><b x-text="pct(w.pct)"></b></li>
                          </template>
                        </ul>
                      </aside>
                    </template>
                  </div>
                </article>
              </template>
            </div>
          </section>
        </template>

        <section class="rr-sec" id="record" aria-labelledby="record-h">
          <div class="rr-sec__head">
            <h2 class="rr-sec__h" id="record-h">Track record</h2>
            <span class="rr-sec__aside" x-show="recentTakes().length">Times UTC</span>
          </div>
          <!-- Filter narrows WHAT is listed, sort decides in what order: two
               questions, two groups on one line. mp-chip--sort carries no
               style; swarm-member-profile.spec.ts selects through it. -->
          <div class="mp-controls" x-show="recentTakes().length > 1" x-cloak>
            <div class="mp-filter" x-show="subjects().length > 1">
              <button type="button" class="mp-chip" :class="{ 'is-on': subject === null }"
                      @click="subject = null; shown = 20" :aria-pressed="subject === null">
                All <span class="mp-chip__n" x-text="recentTakes().length"></span>
              </button>
              <template x-for="s in subjects()" :key="s.id">
                <button type="button" class="mp-chip" :class="{ 'is-on': subject === s.id }"
                        @click="filterBy(s.id)" :aria-pressed="subject === s.id">
                  <span x-text="s.name"></span> <span class="mp-chip__n" x-text="s.count"></span>
                  <span class="mp-chip__x" x-show="subject === s.id" aria-hidden="true">×</span>
                </button>
              </template>
            </div>
            <div class="mp-sort" role="group" aria-label="Sort the record">
              <span class="mp-sort__label" aria-hidden="true">Sort</span>
              <template x-for="o in [
                { k: 'newest', t: 'Newest' },
                { k: 'oldest', t: 'Oldest' },
                { k: 'confidence', t: 'Confidence' }]" :key="o.k">
                <button type="button" class="mp-chip mp-chip--sort" :class="{ 'is-on': sort === o.k }"
                        @click="setSort(o.k)" :aria-pressed="sort === o.k" x-text="o.t"></button>
              </template>
            </div>
          </div>
          <!-- A brand-new member lands here from onboarding: name the gap and
               stop. Where takes land and how they verify is layout and backend. -->
          <template x-if="recentTakes().length === 0 && inProgressTakes().length === 0">
            <div class="rr-empty mp-empty">
              <p class="rr-k">Awaiting first take</p>
              <a class="rr-lnk" href="/swarm">See the swarm</a>
            </div>
          </template>
          <template x-if="recentTakes().length === 0 && inProgressTakes().length > 0">
            <p class="rr-note sv__empty">No published takes yet.</p>
          </template>
          <template x-if="subject && visibleTakes().length === 0">
            <p class="rr-note sv__empty">No published takes for this subject yet.</p>
          </template>
          <div class="rr-takes">
            <!-- Keyed on the session AND the take: an archived take has no id of
                 its own, so camelTake falls back to the member id, which every
                 row on this page shares. -->
          <template x-for="row in visibleTakes().slice(0, shown)" :key="`${row.session.date}-${row.session.subjectId}-${row.take.id}`">
            <article class="rr-take" x-data="takeCard()">
              <div class="rr-take__top">
                <div class="rr-take__what">
                  <a class="rr-take__name" :href="`/swarm/${row.session.date}/${row.session.subjectId}`" x-text="subjectNameOf(row.session)"></a>
                  <span class="mp-when" tabindex="0" :aria-label="filedTitle(row)"><time class="mp-take__date" :datetime="filedAt(row)" x-text="filedLabel(row)"></time><span class="mp-when__tip" role="tooltip" x-text="filedTitle(row)"></span></span>
                </div>
                <div class="rr-take__stance">
                  <span class="sv__stance-badge" :style="stanceStyle(row.take.stance)">
                    <i :style="`background:${stanceColor(row.take.stance)}`"></i><span x-text="row.take.stance"></span>
                  </span>
                  <template x-if="Number.isFinite(Number(row.take.confidence))">
                    <span class="rr-conf">Confidence <b x-text="fmtPct(row.take.confidence)"></b></span>
                  </template>
                  <a class="sv__vfy rr-vfy" :href="takeHref(row.take) || undefined" :class="{ 'sv__vfy--bad': !row.take.verified && !row.take.archival, 'sv__vfy--arch': row.take.archival }"
                        data-verified-badge :data-take-id="row.take.id" :data-verified-state="verifyLabel(row.take.verified, row.take.archival)"
                        tabindex="0" :aria-label="`${verifyLabel(row.take.verified, row.take.archival)}. ${verifyTip(row.take.verified, row.take.archival)}`">
                    <svg class="sv__vfy-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                      <rect x="1.4" y="1.4" width="13.2" height="13.2" stroke="currentColor" stroke-width="1.2"/>
                      <path :d="verifyPath(row.take.verified, row.take.archival)" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
                    </svg>
                    <span class="sv__vfy-label" x-text="verifyLabel(row.take.verified, row.take.archival)"></span>
                    <span class="sv__vfy-tip" aria-hidden="true" x-text="verifyTip(row.take.verified, row.take.archival)"></span>
                  </a>
                </div>
              </div>
              <!-- Closed, a structured take leads with the member's CALL, the section
                   about the subject under review, not the regime notes every take opens
                   with. Open, the whole take in its own order. The card grows and shrinks
                   by height (lib/take-card.js). -->
              <div class="rr-take__main" :class="weightRows(row.take).length ? 'has-aside' : ''">
                <div>
                  <div class="rr-take__text" x-ref="text">
                    <template x-if="!open && call(row.take.body, subjectNameOf(row.session))">
                      <div class="sv__take-body rr-prose" x-html="linkified(call(row.take.body, subjectNameOf(row.session)).text)"></div>
                    </template>
                    <template x-if="open || !call(row.take.body, subjectNameOf(row.session))">
                      <div class="sv__take-body rr-prose" :class="!open && long(row.take.body) ? 'is-clamped' : ''" style="--rr-lines:5" x-html="linkified(row.take.body || '')"></div>
                    </template>
                  </div>
                  <template x-if="call(row.take.body, subjectNameOf(row.session)) || long(row.take.body)">
                    <button type="button" class="rr-more" @click="toggle()" :aria-expanded="open ? 'true' : 'false'">
                      <span x-text="open ? 'Show less' : 'Read full take'"></span>
                    </button>
                  </template>
                </div>
                <template x-if="weightRows(row.take).length">
                  <aside class="rr-take__aside">
                    <p class="rr-k rr-sub">Proposed weights</p>
                    <ul class="rr-legend">
                      <template x-for="w in weightRows(row.take)" :key="w.key">
                        <li :class="w.pct > 0 ? '' : 'is-zero'"><i data-mark="series" :style="`background:${w.colour}`" aria-hidden="true"></i><span x-text="w.label"></span><b x-text="pct(w.pct)"></b></li>
                      </template>
                    </ul>
                  </aside>
                </template>
              </div>
            </article>
          </template>
          </div>
          <!-- Twenty at a time, the same pager /swarm's history uses, with
               the one count the list cannot give: how far into it the reader is. -->
          <template x-if="visibleTakes().length > shown">
            <div class="rr-pager">
              <span x-text="`${shown} of ${visibleTakes().length}`"></span>
              <div><button type="button" class="rr-btn" @click="shown += 20">Show more</button></div>
            </div>
          </template>
        </section>
      </div>
    </template>

    <!-- #687: neither the live API nor the archive resolved this ref, so the
         roster renders in place at the URL the visitor asked for, rather than
         a blank profile or a redirect. The route already answered 404. -->
    <template x-if="!loading && notFound">
      <div>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <span aria-current="page">Members</span>
        </nav>
        <header class="rr-head">
          <h1 class="sv__detail-title" style="overflow-wrap:anywhere">No member matches &ldquo;<span x-text="attemptedRef"></span>&rdquo;</h1>
        </header>
        <p class="rr-k rr-sub">Current members</p>
        <div class="rr-tablewrap">
          <table class="rr-table rr-table--compact rr-members">
            <thead><tr><th scope="col">Member</th><th scope="col" class="q">Lens</th></tr></thead>
            <tbody>
              <template x-for="m in members" :key="m.id">
                <tr>
                  <th scope="row">
                    <span class="rr-members__who">
                      <a class="sv__avatar sv__avatar--mark" :href="`/swarm/members/${encodeURIComponent(m.handle || m.id)}`" :aria-label="m.name"
                         x-html="memberMark(m.keyFingerprint || m.id, m.name, 32, m.avatar?.path, m.handle)"></a>
                      <span>
                        <a class="rr-lnk" :href="`/swarm/members/${encodeURIComponent(m.handle || m.id)}`" x-text="m.name"></a>
                        <small x-show="memberTagline(m)" x-text="memberTagline(m)"></small>
                      </span>
                    </span>
                  </th>
                  <td class="q" x-text="m.lens || '—'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>

    <!-- See assets/js/app/lib/swarm-disclaimer.js: one string, every swarm
         surface, production's wording verbatim. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>

  <style>
    /* Page-local: the filed-at date and its tooltip, the record's controls and
       the active mark. Everything else is the research record's (.rr-*) and
       the shared take card's. */
    .mp-take__date { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em;
                     font-variant-numeric: tabular-nums; color: var(--color-text-muted); }
    .mp-when { position: relative; display: inline-flex; cursor: default; }
    .mp-when__tip { right: auto; left: 0; border-top-color: var(--color-border-light); }
    .mp-when:focus-visible { outline: 1px solid var(--color-accent); outline-offset: 3px; }
    @media (max-width: 699px) {
      .rr-take__what { position: relative; }
      .mp-when { position: static; }
      .mp-when__tip { left: 0; right: 0; width: auto; max-width: none; bottom: auto; top: calc(100% + 8px); }
    }
    .mp-controls { display: flex; align-items: center; justify-content: space-between;
                   flex-wrap: wrap; gap: 0.6rem 1.5rem; margin: 0 0 1rem; }
    .mp-controls .mp-filter { margin: 0; }
    .mp-sort { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; }
    .mp-sort__label { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.16em;
                      text-transform: uppercase; color: var(--color-text-muted); margin-right: 0.15rem; }
    /* Active is a state, and states are square here. It pulses so it cannot be
       read as the static verified mark. */
    .mp-pulse { width: .4rem; height: .4rem; background: var(--color-green);
                flex: 0 0 auto; animation: mp-beat 2.4s ease-in-out infinite; }
    /* .rr-meta__i i (the regime marker's round 7px dot) outranks .mp-pulse, so
       restate the square at the same specificity plus one. */
    .rr-meta__i .mp-pulse { width: .4rem; height: .4rem; border-radius: 0; }
    @keyframes mp-beat { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .mp-pulse { animation: none; } }
  </style>
</section>
