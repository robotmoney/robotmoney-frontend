<!-- Public, server-verified swarm take receipt (issue #207), as a research
     record (RM-121): a breadcrumb, the head, one hairline row of facts, the
     take itself, then who signed it. The member's page and a session page
     draw the same take in the shared card; this is its permanent address. -->
<section class="cv cv--detail" x-data="swarmTakeReceipt()" data-swarm-take-receipt>
  <div class="sv__body sv__body--narrow rr">
    <p class="rm-visually-hidden" role="status" x-show="loading">Verifying take</p>
    <div class="sv__skel" x-show="loading" aria-hidden="true">
      <div class="sv__skel-h"></div>
      <div class="sv__skel-cols">
        <div class="sv__skel-box"></div><div class="sv__skel-box"></div><div class="sv__skel-box"></div>
      </div>
      <div class="sv__skel-card"></div>
    </div>
    <template x-if="error && !loading">
      <div class="rr-head"><p class="sv__error" x-text="error"></p><p class="rr-links"><a class="rr-lnk" href="/swarm">Swarm</a></p></div>
    </template>

    <template x-if="!loading && take">
      <article>
        <nav class="rr-crumbs" aria-label="Breadcrumb">
          <a href="/swarm">Swarm</a><span aria-hidden="true">/</span>
          <a href="/swarm#members">Members</a><span aria-hidden="true">/</span>
          <a :href="signerHref()" x-text="signer?.name || take.memberName"></a><span aria-hidden="true">/</span>
          <span aria-current="page">Take</span>
        </nav>

        <header class="rr-head">
          <p class="sv__eyebrow sv__eyebrow--quiet">Verification receipt</p>
          <!-- The signer's name is the page's subject, so it is the way to
               their record. -->
          <h1 class="sv__detail-title"><a class="tk-who" :href="signerHref()" x-text="signer?.name || take.memberName"></a></h1>
          <!-- A receipt with no filing time is not a receipt. -->
          <p class="rr-when" x-show="take.receivedAt">
            <span>Filed <time :datetime="take.receivedAt" x-text="formatDate(take.receivedAt, 'short')"></time></span>
            <span class="rr-mono" x-text="new Date(take.receivedAt).toISOString().slice(11,16) + ' UTC'"></span>
            <template x-if="take.revision > 1"><span class="rr-mono" x-text="`revision ${take.revision}`"></span></template>
          </p>
        </header>

        <!-- The take in figures, as its card sets them: stance, confidence and
             the signature's state (the seal's tip says what that state means). -->
        <div class="rr-meta">
          <template x-if="take.stance">
            <span class="rr-meta__i">Stance
              <span class="sv__stance-badge" :style="stanceStyle(take.stance)"><i :style="`background:${stanceColor(take.stance)}`"></i><span x-text="take.stance"></span></span>
            </span>
          </template>
          <template x-if="Number.isFinite(Number(take.confidence))">
            <span class="rr-meta__i">Confidence <b x-text="fmtPct(take.confidence)"></b></span>
          </template>
          <span class="rr-meta__i">Signature
            <span class="sv__vfy rr-vfy" :class="{ 'sv__vfy--bad': !take.verified && !take.archival, 'sv__vfy--arch': take.archival }"
                  data-verified-badge :data-take-id="take.id" :data-verified-state="verifyLabel(take.verified, take.archival)"
                  tabindex="0" :aria-label="`${verifyLabel(take.verified, take.archival)}. ${verifyTip(take.verified, take.archival)}`">
              <svg class="sv__vfy-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="1.4" y="1.4" width="13.2" height="13.2" stroke="currentColor" stroke-width="1.2"/>
                <path :d="verifyPath(take.verified, take.archival)" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
              </svg>
              <span class="sv__vfy-label" x-text="verifyLabel(take.verified, take.archival)"></span>
              <span class="sv__vfy-tip" aria-hidden="true" x-text="verifyTip(take.verified, take.archival)"></span>
            </span>
          </span>
        </div>

        <!-- SUPERSEDED, NOT REPLACED (issue #573, ADR D32). This URL still
             resolves, still verifies, and still shows the exact bytes that were
             signed when it says they were filed: an amendment is a NEW row at a
             NEW permalink, never an edit of this one. Saying a later revision
             exists, and linking to it, keeps a receipt shared as proof of
             participation from silently changing meaning. -->
        <template x-if="supersededBy">
          <p class="rr-note tk-superseded">A later revision of this take was filed in the same session. <a class="rr-lnk" :href="`/swarm/takes/${supersededBy?.id}`" x-text="`Revision ${supersededBy?.revision}`"></a></p>
        </template>

        <!-- The signed text, whole: a receipt shows every byte it verifies. The
             member's proposed weights sit beside it, as on the take card. -->
        <section class="rr-sec" id="take" aria-labelledby="take-h" x-data="takeCard()">
          <div class="rr-sec__head"><h2 class="rr-sec__h" id="take-h">The take</h2></div>
          <div class="rr-split" :class="weightRows(take).length ? 'rr-split--rule' : ''">
            <div>
              <div class="sv__take-body rr-prose" x-html="linkified(take.body || '')"></div>
              <template x-if="memoHref(take.memoUrl)">
                <a class="rr-lnk rr-take__act" :href="memoHref(take.memoUrl)" target="_blank" rel="noopener noreferrer">Read memo ↗</a>
              </template>
            </div>
            <template x-if="weightRows(take).length">
              <aside>
                <p class="rr-k rr-sub">Proposed weights</p>
                <ul class="rr-legend">
                  <template x-for="w in weightRows(take)" :key="w.key">
                    <li :class="w.pct > 0 ? '' : 'is-zero'"><i data-mark="series" :style="`background:${w.colour}`" aria-hidden="true"></i><span x-text="w.label"></span><b x-text="pct(w.pct)"></b></li>
                  </template>
                </ul>
              </aside>
            </template>
          </div>
        </section>

        <!-- A memo the member hosted with us, when it says more than the take:
             the backend can store the take's own text as its memo (memoIsEcho). -->
        <template x-if="memo && !memoIsEcho()">
          <section class="rr-sec" id="memo" aria-labelledby="memo-h">
            <div class="rr-sec__head"><h2 class="rr-sec__h" id="memo-h" x-text="memo?.title || 'Memo'"></h2></div>
            <div class="sv__take-body rr-prose" x-html="linkified(memo?.body || '')"></div>
          </section>
        </template>

        <!-- Who signed it: the identity the payload was signed over, and the key
             it verifies against. -->
        <section class="rr-sec" id="signer" aria-labelledby="signer-h">
          <div class="rr-sec__head"><h2 class="rr-sec__h" id="signer-h">Signer</h2></div>
          <dl class="rr-dl">
            <div><dt>Member</dt><dd><a :href="signerHref()" x-text="signer?.name || take.memberName"></a></dd></div>
            <div><dt>Member id</dt><dd class="rr-mono" x-text="signer?.id || take.memberId"></dd></div>
            <div><dt>Public key fingerprint</dt><dd class="rr-mono tk-fp" x-text="signer?.publicKeyFingerprint || 'Unavailable'"></dd></div>
          </dl>
        </section>

        <!-- Where a reader goes next: the member's record, the swarm, and how
             a signature is checked. -->
        <nav class="rr-recnav tk-next" aria-label="Related">
          <a :href="signerHref()" x-text="`${signer?.name || take.memberName}'s record`"></a>
          <a href="/swarm">The swarm</a>
          <a href="/docs/investment-swarm/how-it-works">How verification works</a>
        </nav>
      </article>
    </template>

    <!-- See assets/js/app/lib/swarm-disclaimer.js: one string, every swarm
         surface, production's wording verbatim. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="swarmDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>

  <style>
    .tk-who { color: inherit; text-decoration: none; }
    .tk-superseded { margin: 1.25rem 0 0; font-size: 0.875rem; }
    /* A fingerprint is one unbreakable token; on a phone it wraps anywhere
       rather than widening the page. */
    .tk-fp { overflow-wrap: anywhere; white-space: normal; }
    .tk-next { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; }
  </style>
</section>
