<!-- Committee session detail, ported from robotmoney-site/src/app/committee/[date]/[subject]/page.tsx. -->
<section class="cv cv--detail" x-data="icSessionDetail()">
  <div class="cv__body cv__body--narrow">
    <a href="/committee" class="cv__back">← /committee</a>

    <p class="cv__loading" x-show="loading">Loading session…</p>
    <p class="cv__error" x-show="error" x-text="error" x-cloak></p>

    <template x-if="!loading && session">
      <div>
        <header class="cv__detail-head">
          <p class="cv__eyebrow"><span x-text="formatDate(session.date, 'long')"></span> · subject</p>
          <h1 class="cv__detail-title session-title" x-text="session.subjectName"></h1>
          <p class="cv__lede cv__lede--compact" x-text="subject?.thesisBlurb || `${session.subjectName} committee review.`"></p>
          <!-- Backdrop chips. Label and value are distinct elements: the old
               markup nested a bare <span> inside a bare <span>, and the CSS
               selector matched both, so every value was drawn its own box
               inside the chip's box — the doubled, broken-looking frame. -->
          <div class="cv__fact-row">
            <span class="cv__fact" x-show="session.regimeSummary">
              <em>composite</em><b x-text="fmtNum(session.regimeSummary?.composite, 3)"></b>
            </span>
            <span class="cv__fact" x-show="session.regimeSummary">
              <em>bucket</em>
              <i class="cv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.regime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.regime)"></b>
            </span>
            <span class="cv__fact" x-show="session.regimeSummary?.macroRegime">
              <em>macro</em>
              <i class="cv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.macroRegime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.macroRegime)"></b>
            </span>
            <span class="cv__fact" x-show="session.regimeSummary?.onchainRegime">
              <em>onchain</em>
              <i class="cv__fact-dot" :style="`background:${regimeColor(session.regimeSummary?.onchainRegime)}`" aria-hidden="true"></i>
              <b x-text="regimeLabel(session.regimeSummary?.onchainRegime)"></b>
            </span>
            <span class="cv__fact" x-show="!session.regimeSummary">
              <em>state</em><b x-text="session.state"></b>
            </span>
          </div>
        </header>

        <!-- Market backdrop. Was two panels: "Regime context" and "Brief" —
             neither of which said what it was, and the Brief held one derived
             sentence ("Subject: X. Regime: Y.") already carried by the <h1> and
             a backdrop chip, in half the page width. One panel now, with a line
             saying what a reader is looking at and why it is on this page. -->
        <template x-if="session.regimeSummary || briefExtra()">
          <section class="cv__panel cv__backdrop" x-show="session.regimeSummary">
            <div class="cv__panel-head">
              <p class="cv__panel-label">Market backdrop</p>
              <span class="cv__tag" x-text="formatDate(session.date, 'short')"></span>
            </div>
            <p class="cv__panel-note">
              The regime read attached to this session's brief: the same market context
              every member was given before writing their take.
            </p>
            <div class="cv__backdrop-grid">
              <div>
                <div class="cv__metric-line">
                  <span>Composite</span>
                  <b x-text="fmtNum(session.regimeSummary?.composite, 3)"></b>
                </div>
                <div class="cv__bar" x-show="session.regimeSummary?.composite != null">
                  <i :style="`width:${clampPct((session.regimeSummary?.composite || 0) * 100)}%`"></i>
                </div>
                <div class="cv__sparkline" x-show="(session.regimeSummary?.history || []).length >= 2" x-html="regimeSparkline()"></div>
                <p class="cv__panel-sub" x-show="(session.regimeSummary?.history || []).length >= 2"
                   x-text="`composite, trailing ${(session.regimeSummary?.history || []).length} sessions`"></p>
              </div>
              <div>
                <p class="cv__panel-sub" x-show="panelInputs().length >= 2">Panels · percentile against own history, 50th marked</p>
                <div class="cv__panel-divergence" x-show="panelInputs().length >= 2" x-html="panelDivergenceBars()"></div>
                <div class="cv__panel-bars" x-show="panelInputs().length === 1">
                  <template x-for="p in panelInputs()" :key="p.label">
                    <div class="cv__panel-bar">
                      <span x-text="p.label"></span>
                      <div><i :style="`width:${clampPct(p.pct * 100)}%`"></i></div>
                      <b x-text="`${Math.round(p.pct * 100)}%`"></b>
                    </div>
                  </template>
                </div>
              </div>
            </div>
            <p class="cv__body-copy" x-show="briefExtra()" x-text="briefExtra()"></p>
          </section>
        </template>

        <section class="cv__portfolio" x-show="snapshot">
          <div class="cv__panel-head">
            <p class="cv__panel-label">Portfolio read · <span x-text="fmtUsd(snapshot?.totalValueUsd)"></span> total</p>
            <span class="cv__tag" x-text="snapshot?.date"></span>
          </div>
          <div class="cv__portfolio-grid">
            <div class="cv__donut-list">
              <template x-for="(p, i) in positionRows().slice(0, 7)" :key="`${p.token}-${p.chain}`">
                <div class="cv__donut-row" :style="donutStyle(p, i)">
                  <i></i>
                  <span x-text="p.token"></span>
                  <b x-text="fmtPct1(p.share)"></b>
                </div>
              </template>
            </div>
            <div class="cv__table-wrap">
              <table class="cv__data-table">
                <thead><tr><th>Token</th><th>Chain</th><th class="cv__num">Value</th><th class="cv__num">Share</th></tr></thead>
                <tbody>
                  <template x-for="p in positionRows().slice(0, 8)" :key="`${p.token}-${p.chain}`">
                    <tr>
                      <td x-text="p.token"></td>
                      <td x-text="p.chain"></td>
                      <td class="cv__num" x-text="fmtUsd(p.value_usd)"></td>
                      <td class="cv__num" x-text="fmtPct1(p.share)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
          <div class="cv__notables" x-show="(snapshot?.notable || []).length">
            <p class="cv__panel-label">Notable</p>
            <ul>
              <template x-for="n in (snapshot?.notable || [])" :key="n"><li x-text="n"></li></template>
            </ul>
          </div>
        </section>

        <section class="cv__recommendation" x-show="session.committeeRecommendation">
          <div class="cv__panel-head">
            <p class="cv__panel-label">Committee Recommendation</p>
            <span class="cv__tag" x-text="recommendationKind()"></span>
          </div>
          <!-- Verdict first. This block used to open with "3/5" in the largest
               type on the page — turnout, which is procedural — and left the
               reader to tally the stance chips to find the actual result. -->
          <template x-if="isRollupRecommendation()">
            <div class="cv__verdict">
              <p class="cv__verdict-call" :class="{ 'is-split': verdict().split }">
                <i :style="`background:${verdict().color}`" aria-hidden="true"></i>
                <span x-text="verdict().label"></span>
              </p>
              <p class="cv__verdict-detail" x-show="verdict().detail" x-text="verdict().detail"></p>
              <!-- The distribution as one proportional bar: relative weight is
                   the thing being read, and counted chips alone don't show it. -->
              <div class="cv__verdict-bar" role="img" :aria-label="verdict().detail">
                <template x-for="s in stanceSpread()" :key="s.stance">
                  <i :style="`width:${s.pct}%;background:${stanceColor(s.stance)}`" :title="`${s.n} ${s.stance}`"></i>
                </template>
              </div>
              <div class="cv__stances">
                <template x-for="s in stanceSpread()" :key="s.stance">
                  <span class="cv__stance-chip"><i :style="`background:${stanceColor(s.stance)}`"></i><b x-text="s.n"></b> <span x-text="s.stance"></span></span>
                </template>
              </div>
              <dl class="cv__verdict-meta">
                <div><dt>quorum</dt><dd x-text="quorumText()"></dd></div>
                <div x-show="session.committeeRecommendation.meanConfidence != null">
                  <dt>mean confidence</dt><dd x-text="fmtPct(session.committeeRecommendation.meanConfidence)"></dd>
                </div>
                <div x-show="absentNames().length">
                  <dt>absent</dt><dd x-text="absentNames().join(', ')"></dd>
                </div>
              </dl>
            </div>
          </template>
          <!-- WHAT THE COMMITTEE ACTUALLY RECOMMENDED.
               This block was wrapped in <template x-if="!isRollupRecommendation()">,
               and isRollupRecommendation() is true whenever the payload carries
               `quorum` or `stances` — which every published session does. So the
               action table never rendered once, on any session, while the API was
               returning it the whole time: 2 rows, USDC/rotate and rmUSDC/add,
               each with its own rationale. The page showed turnout and a stance
               spread and then simply stopped before the verdict.
               The gate was conflating two independent things. A rollup describes
               HOW the recommendation was reached; `actions` and `bucket_weights`
               are WHAT it says, and both are already self-gating (isBucketWeights()
               requires type === "bucket_weights"; the action row requires a
               non-empty array). Only `rationale` needed the rollup test, and it
               needs it for a different reason — see recommendationRationale(). -->
          <div class="cv__rich-rec" x-show="hasRecommendationDetail()">
            <div class="cv__bucket-bars" x-show="isBucketWeights()">
              <p class="cv__panel-sub">Target open · Actual muted · Recommended accent</p>
              <div class="cv__bucket-bars-svg" x-html="bucketWeightsBars()"></div>
            </div>
            <p class="cv__body-copy" x-show="recommendationRationale()" x-text="recommendationRationale()"></p>
            <!-- Per-constituent weights. The bucket bars above say how much
                 goes to each bucket; this says what is inside them, which is
                 the question the allocation subject exists to answer. -->
            <div class="cv__within" x-show="withinBucketWeights().length">
              <p class="cv__panel-sub">Within-bucket weights &middot; per-item recommendations</p>
              <template x-for="b in withinBucketWeights()" :key="b.bucket">
                <div class="cv__within-bucket">
                  <p class="cv__within-name" x-text="b.bucket"></p>
                  <ul class="cv__within-list">
                    <template x-for="it in b.items" :key="`${b.bucket}-${it.name}`">
                      <li><span x-text="it.name"></span><b x-text="fmtPct1(it.weight)"></b></li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
            <div class="cv__rec-actions" x-show="recommendationActions().length">
              <template x-for="a in recommendationActions()" :key="`${a.token}-${a.action}`">
                <div class="cv__action-row">
                  <span x-text="a.token"></span>
                  <b x-text="a.action"></b>
                  <p x-text="a.rationale"></p>
                </div>
              </template>
            </div>
          </div>
        </section>

        <section class="cv__discussion" x-show="consensusItems().length || disagreements().length">
          <div class="cv__panel" x-show="consensusItems().length">
            <p class="cv__panel-label">Consensus</p>
            <ul class="cv__bullet-list">
              <!-- inlineMarks, not linkified: consensus entries are single
                   points, so they take bold/links but must not open block
                   elements inside a list item. -->
              <template x-for="item in consensusItems()" :key="item"><li x-html="inlineMarks(item)"></li></template>
            </ul>
          </div>
          <div class="cv__panel cv__panel--accent" x-show="disagreements().length">
            <p class="cv__panel-label">Disagreements</p>
            <div class="cv__disagreements">
              <template x-for="d in disagreements()" :key="d.topic">
                <article class="cv__disagreement">
                  <h3 x-text="d.topic"></h3>
                  <ul>
                    <template x-for="p in d.positions" :key="`${d.topic}-${p.member_id}`">
                      <li>
                        <a :href="`/committee/members/${p.member_id}`" x-text="memberById(p.member_id)?.name || p.member_id"></a>
                        <!-- The stance spread IS the disagreement — it is what the
                             aggregator sorted on to pick these two members, and it
                             is stated nowhere else in this panel. When the view is
                             an echo of a take printed above, show the spread and
                             link to the take instead of reprinting it. -->
                        <span class="cv__dis-pos">
                          <span class="cv__dis-stance" x-show="takeOf(p.member_id)"
                                :style="stanceStyle(takeOf(p.member_id)?.stance)">
                            <i :style="`background:${stanceColor(takeOf(p.member_id)?.stance)}`"></i>
                            <span x-text="`${takeOf(p.member_id)?.stance} · ${fmtPct(takeOf(p.member_id)?.confidence)}`"></span>
                          </span>
                          <span x-show="!isEcho(p.view)" x-html="inlineMarks(p.view)"></span>
                          <!-- x-if, not x-show: takeHref() throws "missing path
                               param: id" if it is evaluated for a member whose
                               take is not in this response, and x-show still
                               evaluates the binding. -->
                          <template x-if="isEcho(p.view) && takeOf(p.member_id)?.id">
                            <a class="cv__dis-read" x-show="takeHref(takeOf(p.member_id))" :href="takeHref(takeOf(p.member_id))">Read their take →</a>
                          </template>
                        </span>
                      </li>
                    </template>
                  </ul>
                  <p x-show="d.what_settles"><em>Settles when:</em> <span x-text="d.what_settles"></span></p>
                </article>
              </template>
            </div>
          </div>
        </section>

        <section class="cv__takes-section" x-show="takes.length">
          <p class="cv__panel-label">Member submissions</p>
          <div class="cv__table-wrap session-submissions">
            <table class="cv__data-table">
              <thead><tr><th>Member</th><th>Stance</th><th class="cv__num">Confidence</th></tr></thead>
              <tbody>
                <template x-for="t in takes" :key="t.id || t.memberId">
                  <tr><td x-text="t.memberName"></td><td x-text="t.stance"></td><td class="cv__num" x-text="fmtPct(t.confidence)"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <section class="cv__takes-section">
          <p class="cv__panel-label">Member takes</p>
          <div class="cv__takes cv__takes--ported">
            <template x-for="t in takes" :key="t.id || t.memberId">
              <article class="cv__take cv__take--ported">
                <header class="cv__take-head">
                  <div class="cv__take-member">
                    <a class="cv__avatar" :href="`/committee/members/${t.memberId}`" x-text="initials(t.memberName)"></a>
                    <div>
                      <a class="cv__member-link" :href="`/committee/members/${t.memberId}`" x-text="t.memberName"></a>
                      <div class="cv__take-lens" x-text="memberLens(t.memberId)"></div>
                    </div>
                  </div>
                  <span class="cv__stance-badge" :style="stanceStyle(t.stance)">
                    <i :style="`background:${stanceColor(t.stance)}`"></i>
                    <span x-text="`${t.stance} · ${fmtPct(t.confidence)}`"></span>
                  </span>
                  <span class="cv__vfy cv__vfy--pin" :class="{ 'cv__vfy--bad': !t.verified }"
                        data-verified-badge :data-take-id="t.id" :data-verified-state="verifyLabel(t.verified)"
                        tabindex="0" :aria-label="`${verifyLabel(t.verified)}. ${verifyTip(t.verified)}`">
                    <svg class="cv__vfy-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                      <rect x="1.4" y="1.4" width="13.2" height="13.2" stroke="currentColor" stroke-width="1.2"/>
                      <path :d="verifyPath(t.verified)" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
                    </svg>
                    <span class="cv__vfy-label" x-show="!t.verified" x-text="verifyLabel(t.verified)"></span>
                    <span class="cv__vfy-tip" aria-hidden="true" x-text="verifyTip(t.verified)"></span>
                  </span>
                </header>
                <div class="cv__take-body" x-html="linkified(t.body || '')"></div>
                <a class="cv__memo-link" x-show="source === 'api'" :href="takeHref(t)" data-take-permalink>Verification receipt →</a>
                <a class="cv__memo-link" x-show="t.memoUrl" :href="t.memoUrl" target="_blank" rel="noopener noreferrer">Read memo ↗</a>
              </article>
            </template>
          </div>
        </section>

        <section class="cv__synthesis" x-show="session.synthesis && !synthesisIsEcho()">
          <p class="cv__panel-label">Synthesis</p>
          <div x-html="linkified(session.synthesis)"></div>
        </section>
      </div>
    </template>

    <!-- The page that prints stances, confidence figures and a recommendation
         is the page that most needs to say a member may hold what it argues
         about. See assets/js/app/lib/committee-disclaimer.js. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="committeeDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>
</section>
