<!-- Public committee subject profile. The reader-facing counterpart to the
     admin subject page (#159), and the surface production robotmoney.net has
     published per subject all along: what portfolio is under review, what it
     holds today, which wallets are tracked, and every session about it.
     Conventions are member.html's — same cv__ shell, same portfolio block as
     session.html so a holdings read looks identical wherever it appears. -->
<section class="cv cv--detail" x-data="subjectProfile()">
  <div class="cv__body cv__body--narrow">
    <a href="/committee" class="cv__back">← /committee</a>

    <p class="cv__loading" x-show="loading">Loading subject…</p>
    <p class="cv__error" x-show="error" x-text="error" x-cloak></p>

    <template x-if="!loading && subject">
      <div>
        <header class="cv__profile-head">
          <div class="cv__avatar cv__avatar--xl sp-mark" :style="`--sp-subject:${subjectDot(subject.id)}`"
               x-text="initials(subject.name)"></div>
          <div class="cv__profile-main">
            <p class="cv__eyebrow">ic subject<span x-show="subject.operator"> · operator <span x-text="subject.operator"></span></span></p>
            <h1 class="cv__detail-title" x-text="subject.name"></h1>
            <p class="cv__lede cv__lede--compact" x-show="subject.thesisBlurb" x-text="subject.thesisBlurb"></p>
            <p class="sp-links" x-show="subject.homepage || subject.xHandle">
              <a x-show="subject.homepage" :href="subject.homepage" rel="noopener noreferrer" target="_blank"
                 x-text="hostOf(subject.homepage) + ' ↗'"></a>
              <a x-show="subject.xHandle" :href="`https://x.com/${String(subject.xHandle).replace(/^@/, '')}`"
                 rel="noopener noreferrer" target="_blank" x-text="'@' + String(subject.xHandle).replace(/^@/, '') + ' ↗'"></a>
            </p>
          </div>
        </header>

        <!-- Figures before prose, as on the member profile: what the book is
             worth, how concentrated it is, and how long we have been reading it. -->
        <dl class="rm-stats">
          <div class="rm-stat">
            <dt>Book value</dt><dd x-text="recordStats().total"></dd>
          </div>
          <div class="rm-stat">
            <dt>Top position</dt><dd x-text="recordStats().top"></dd>
          </div>
          <div class="rm-stat">
            <dt>Sessions</dt><dd x-text="recordStats().sessions"></dd>
          </div>
        </dl>

        <!-- Concentration over time. A holdings table is a single day; the
             question a reader actually has is whether the book is getting more
             concentrated or less, which only a series answers. One line per
             position, oldest to newest, sharing the legend's colours. Lines and
             not a stacked area on purpose: see concentrationLines(). -->
        <section class="cv__panel sp-chart" x-show="concentrationLines()">
          <div class="cv__panel-head">
            <p class="cv__panel-label">Concentration · top positions as % of NAV</p>
            <span class="cv__tag" x-text="spanLabel()"></span>
          </div>
          <div class="sp-chart__svg" x-html="concentrationLines()"></div>
          <div class="cv__donut-list sp-legend">
            <template x-for="(row, i) in legendRows()" :key="row.token">
              <div class="cv__donut-row" :style="donutStyle(row, i)">
                <i></i>
                <span x-text="row.token"></span>
                <b x-text="fmtPct1(row.share)"></b>
              </div>
            </template>
          </div>
        </section>

        <!-- Same markup as session.html's portfolio read, deliberately: the two
             surfaces show the same kind of thing and must not teach two
             different readings of it. -->
        <section class="cv__portfolio" x-show="snapshot">
          <div class="cv__panel-head">
            <p class="cv__panel-label">Latest read · <span x-text="fmtUsd(snapshot?.totalValueUsd)"></span> total</p>
            <span class="cv__tag" x-text="snapshot?.date"></span>
          </div>
          <div class="cv__portfolio-grid">
            <div class="cv__donut-list">
              <template x-for="(p, i) in positionRows().slice(0, 7)" :key="`${p.token}-${p.chain}`">
                <div class="cv__donut-row" :style="donutStyle(p, i)">
                  <i></i>
                  <span x-text="p.token"></span>
                  <b x-text="fmtPct1(p.share)"></b>
                </div>
              </template>
            </div>
            <div class="cv__table-wrap">
              <table class="cv__data-table">
                <thead><tr><th>Token</th><th>Chain</th><th class="cv__num">Value</th><th class="cv__num">Share</th></tr></thead>
                <tbody>
                  <template x-for="p in positionRows().slice(0, 8)" :key="`${p.token}-${p.chain}`">
                    <tr>
                      <td x-text="p.token"></td>
                      <td x-text="p.chain"></td>
                      <td class="cv__num" x-text="fmtUsd(p.value_usd)"></td>
                      <td class="cv__num" x-text="fmtPct1(p.share)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
          <div class="cv__notables" x-show="(snapshot?.notable || []).length">
            <p class="cv__panel-label">Notable</p>
            <ul>
              <template x-for="n in (snapshot?.notable || [])" :key="n"><li x-text="n"></li></template>
            </ul>
          </div>
        </section>

        <div class="cv__rail-grid cv__rail-grid--compact">
          <section class="cv__panel" x-show="trackedWallets().length">
            <p class="cv__panel-label">Tracked wallets (<span x-text="trackedWallets().length"></span>)</p>
            <ul class="cv__bullet-list sp-wallets">
              <template x-for="w in trackedWallets()" :key="`${w.chain}-${w.address}`">
                <li>
                  <span class="sp-wallet__label" x-text="w.label || 'wallet'"></span>
                  <span class="cv__tag" x-text="w.chain"></span>
                  <code x-text="truncAddress(w.address)"></code>
                </li>
              </template>
            </ul>
          </section>
          <section class="cv__panel" x-show="nftContracts().length">
            <p class="cv__panel-label">NFT contracts</p>
            <p class="cv__body-copy sp-note">Declared by the operator, not valued in v1.</p>
            <ul class="cv__bullet-list">
              <template x-for="n in nftContracts()" :key="`${n.chain}-${n.name}`">
                <li><span x-text="n.name"></span> <span class="cv__tag" x-text="n.chain"></span></li>
              </template>
            </ul>
          </section>
        </div>

        <!-- camelSubject defaults this to [], which is truthy — a plain
             x-show on the field renders an empty panel on every subject that
             has none. Gate on length, and render the list it actually is. -->
        <section class="cv__panel" x-show="structuralNotes().length">
          <p class="cv__panel-label">Structural notes</p>
          <ul class="cv__bullet-list">
            <template x-for="n in structuralNotes()" :key="n"><li x-text="n"></li></template>
          </ul>
        </section>

        <section class="sp-sessions">
          <div class="cv__sessions-head">
            <p class="cv__panel-label">Sessions (<span x-text="sessions.length"></span>)</p>
          </div>

          <p class="cv__empty" x-show="!sessions.length" x-cloak>
            No published session yet. Every session the committee holds on this subject lands here.
          </p>

          <div class="cv__session-list cv__session-list--compact">
            <template x-for="s in sessions" :key="`${s.date}-${s.subjectId}`">
              <article class="cv__session-card" :style="`--mp-subject:${subjectDot(s.subjectId)}`">
                <div class="cv__session-top">
                  <div class="cv__session-titleline">
                    <span class="cv__date" x-text="formatDate(s.date, 'short')"></span>
                    <a class="cv__session-title" :href="`/committee/${s.date}/${encodeURIComponent(s.subjectId)}`"
                       x-text="takeCountLabel(s)"></a>
                  </div>
                </div>
                <div class="cv__take-body" x-show="s.synthesis" x-html="linkified(s.synthesis || '')"></div>
              </article>
            </template>
          </div>
        </section>
      </div>
    </template>

    <!-- The committee disclaimer belongs here too, and production carries it on
         every committee surface. It is deliberately NOT in this change: the
         shared string lands with fix/committee-parity-and-status-page, and
         duplicating it here would fork the wording. Once that merges this page
         takes the same four lines the other three surfaces use:
           <section class="rm-disclaimer" role="note" aria-label="Disclaimer"
                    x-data="committeeDisclaimer()"> … </section>
         Tracked so it cannot be forgotten: this page is the fifth surface. -->
  </div>

  <style>
    /* The subject mark is a SQUARE, matching the committee tree's grammar: a
       round dot is a reading, a square one is an identity. subjectDot() already
       returns this subject's identity colour everywhere else on the site, so the
       avatar seams with it rather than inventing a second colour for the page. */
    /* Record strip. Figures before prose, the same idea the member profile
       carries, but styled here rather than borrowed: the shared .rm-stats rule
       lands with the committee-parity change and does not exist on main, so
       depending on it would ship this page with an unstyled stack of numbers.
       Mono and tabular, seamed with a cyan line and never filled by one. */
    .rm-stats { display: grid; grid-template-columns: 1fr; gap: 1px; margin: 22px 0 0;
                background: var(--color-border); border: 1px solid var(--color-border);
                border-top: 1px solid var(--color-accent); }
    @media (min-width: 640px) { .rm-stats { grid-template-columns: repeat(3, 1fr); } }
    .rm-stat { background: var(--color-surface, #10141c); padding: 13px 16px; margin: 0; }
    .rm-stat dt { font-family: var(--font-mono, ui-monospace, monospace); font-size: 9.5px;
                  letter-spacing: .14em; text-transform: uppercase; color: var(--color-text-dim); }
    .rm-stat dd { font-family: var(--font-mono, ui-monospace, monospace); font-size: 1.15rem;
                  font-variant-numeric: tabular-nums; color: var(--color-text); margin: 6px 0 0; }
    .sp-sessions { margin-top: 34px; }
    .sp-mark { border-radius: 0; border-color: var(--sp-subject, var(--color-border)); }
    /* Set the colour explicitly. Left to the UA these render as default-blue
       underlined links, which is not a house colour and reads as unstyled. */
    .sp-links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px;
                font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; }
    .sp-links a { color: var(--color-accent); text-decoration: none;
                  border-bottom: 1px solid transparent; }
    .sp-links a:hover, .sp-links a:focus-visible { border-bottom-color: var(--color-accent); }
    .sp-chart__svg { margin: 12px 0 4px; }
    .sp-chart__svg svg { display: block; width: 100%; height: auto; }
    .sp-legend { margin-top: 10px; }
    .sp-wallets li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sp-wallet__label { font-size: 12.5px; }
    .sp-wallets code { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11.5px;
                       color: var(--color-text-muted); }
    .sp-note { font-size: 12.5px; color: var(--color-muted, #7E889E); margin-bottom: 8px; }
  </style>
</section>
