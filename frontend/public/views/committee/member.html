<!-- Committee Member Profile Page
     Dynamic route: /committee/members/[id]
     Ported from robotmoney-site/src/app/committee/members/[id]/page.tsx
-->

<section class="section section--member-profile" x-data="memberProfile()">
  <div class="container">
    <!-- Back link -->
    <a href="/committee" class="breadcrumb">← Back to Committee</a>

    <!-- Profile Card -->
    <div class="profile-card">
      <img :src="avatar" :alt="name" class="profile-avatar" />
      <div class="profile-info">
        <h1 class="profile-name" x-text="name"></h1>
        <p class="profile-role" x-text="role"></p>
        <div class="profile-meta">
          <div class="meta-item">
            <span class="meta-label">Sessions</span>
            <span class="meta-value" x-text="totalSessions"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Submissions</span>
            <span class="meta-value" x-text="totalSubmissions"></span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Participation</span>
            <span class="meta-value" x-text="participationRate + '%'"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bio -->
    <div class="member-section">
      <h3 class="section-subtitle">About</h3>
      <p class="member-bio" x-text="bio"></p>
    </div>

    <!-- Voting History -->
    <div class="member-section">
      <h3 class="section-subtitle">Recent Submissions</h3>
      <div class="table-wrapper">
        <table class="submissions-table">
          <thead>
            <tr>
              <th>Session</th>
              <th>Date</th>
              <th class="align-center">Allocation A</th>
              <th class="align-center">Allocation B</th>
              <th class="align-center">Allocation C</th>
              <th class="align-right">Confidence</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="submission in recentSubmissions" :key="submission.id">
              <tr>
                <td>
                  <a :href="'/committee/' + submission.sessionDate + '/' + submission.sessionSlug" class="link">
                    <strong x-text="submission.sessionTitle"></strong>
                  </a>
                </td>
                <td x-text="formatDate(submission.date)"></td>
                <td class="align-center" x-text="submission.a + '%'"></td>
                <td class="align-center" x-text="submission.b + '%'"></td>
                <td class="align-center" x-text="submission.c + '%'"></td>
                <td class="align-right" x-text="submission.confidence + '%'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Stats & Charts -->
    <div class="member-stats">
      <div class="stat-box">
        <h4 class="stat-title">Average Allocation Pattern</h4>
        <div class="stat-chart">
          <canvas id="avgAllocationChart" x-ref="avgAllocationChart"></canvas>
        </div>
      </div>

      <div class="stat-box">
        <h4 class="stat-title">Confidence Over Time</h4>
        <div class="stat-chart">
          <canvas id="confidenceChart" x-ref="confidenceChart"></canvas>
        </div>
      </div>
    </div>

    <div class="section__footer">
      <p class="section__note">
        Profile for <strong x-text="name"></strong>. Member of Robot Money Investment Committee since <span x-text="joinDate"></span>.
      </p>
    </div>
  </div>
</section>
