<!-- Committee member profile, ported from robotmoney-site/src/app/committee/members/[id]/page.tsx. -->
<section class="cv cv--detail" x-data="memberProfile()">
  <div class="cv__body cv__body--narrow">
    <a href="/committee" class="cv__back">← /committee</a>

    <p class="cv__loading" x-show="loading">Loading member...</p>
    <p class="cv__error" x-show="error" x-text="error" x-cloak></p>

    <template x-if="!loading && member">
      <div>
        <header class="cv__detail-head cv__member-hero">
          <div class="cv__avatar cv__avatar--large" x-text="initials(member.name)"></div>
          <div>
            <p class="cv__eyebrow">committee member</p>
            <h1 class="cv__detail-title" x-text="member.name"></h1>
            <p class="cv__lede cv__lede--compact" x-text="member.tagline || member.lens"></p>
          </div>
        </header>

        <section class="cv__context-grid">
          <div class="cv__panel">
            <p class="cv__panel-label">Mandate</p>
            <p class="cv__body-copy" x-text="member.mandate || member.tagline"></p>
          </div>
          <div class="cv__panel">
            <p class="cv__panel-label">Biases</p>
            <ul class="cv__bullet-list">
              <template x-for="bias in member.biases || []" :key="bias"><li x-text="bias"></li></template>
            </ul>
          </div>
        </section>

        <section class="cv__portfolio">
          <div class="cv__panel-head">
            <p class="cv__panel-label">Plugin metadata</p>
            <span class="cv__tag" x-text="member.status || 'active'"></span>
          </div>
          <div class="cv__metadata-grid">
            <div><span>lens</span><b x-text="member.lens || '-'"></b></div>
            <div><span>mode</span><b x-text="member.mode || '-'"></b></div>
            <div><span>operator</span><b x-text="member.operator || '-'"></b></div>
            <div><span>voice doc</span><b x-text="member.voice_doc || '-'"></b></div>
          </div>
        </section>

        <section class="cv__takes-section">
          <p class="cv__panel-label">Recent takes</p>
          <p class="cv__empty" x-show="!takes.length">No sessions yet.</p>
          <div class="cv__takes cv__takes--ported">
            <template x-for="t in takes" :key="`${t.date}-${t.subjectId}`">
              <article class="cv__take cv__take--ported">
                <header class="cv__take-head">
                  <div>
                    <a class="cv__member-link" :href="`/committee/${t.date}/${t.subjectId}`" x-text="t.subjectName"></a>
                    <div class="cv__take-lens" x-text="t.date"></div>
                  </div>
                  <span class="cv__stance-badge"><span x-text="`${t.stance} / ${fmtPct(t.confidence)}`"></span></span>
                </header>
                <div class="cv__take-body" x-html="linkified(t.body || '')"></div>
              </article>
            </template>
          </div>
        </section>
      </div>
    </template>
  </div>
</section>
