<section class="contract" id="buy">
  <div class="contract__container container">
    <div class="contract__inner">
      <!-- Label -->
      <div class="contract__label">Official Contract</div>

      <h2 class="contract__heading">
        <span class="contract__heading-serif">Only use the</span>
        <span class="contract__heading-bold text-gradient">official address.</span>
      </h2>

      <p class="contract__lede">
        Always verify before interacting. This is the only legitimate
        $ROBOTMONEY contract on Base. Do not trust any other address.
      </p>

      <!-- Contract address box -->
      <div
        class="contract__address-box"
        x-data="{ copied: false }"
      >
        <div class="contract__address">
          <div class="contract__address-label">$ROBOTMONEY on Base</div>
          <code class="contract__address-code">0x65021a79AeEF22b17cdc1B768f5e79a8618bEbA3</code>
        </div>
        <button
          type="button"
          class="contract__copy"
          @click="navigator.clipboard.writeText('0x65021a79AeEF22b17cdc1B768f5e79a8618bEbA3'); copied = true; setTimeout(() => copied = false, 2000)"
        >
          <span x-show="!copied">Copy</span>
          <span x-show="copied" x-cloak>Copied!</span>
        </button>
      </div>

      <!-- Action links -->
      <div class="contract__actions">
        <a
          class="contract__action contract__action--arrow"
          href="https://dexscreener.com/base/0x65021a79AeEF22b17cdc1B768f5e79a8618bEbA3"
          target="_blank"
          rel="noopener noreferrer"
        >
          View on DexScreener
          <span class="contract__action-arrow">&rarr;</span>
        </a>
        <a
          class="contract__action"
          href="https://basescan.org/token/0x65021a79AeEF22b17cdc1B768f5e79a8618bEbA3"
          target="_blank"
          rel="noopener noreferrer"
        >
          Verify on BaseScan
        </a>
      </div>
    </div>
  </div>
</section>
