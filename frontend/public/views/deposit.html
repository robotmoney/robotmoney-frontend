<!-- Deposit (RM-146, under RM-205). Built to the design canvas, the source of
     truth: https://claude.ai/artifact/JwVUy2W8WJbj8B4hxSb3MY (boards 1 to 5,
     8, 9, 13 to 16, 19, 22 to 25). PRD: https://claude.ai/artifact/HBQ4utcPSrv5ULHDjQ7yWG

     Early access first: depositGate() (lib/deposit/access.js) asks for a
     personal code before the page loads anything. The gate is its own canvas
     (https://claude.ai/artifact/BbcnTLm9uYxtj8PrXpfM5V): the early access
     page's photograph, lit as that page lights it, with the form on its night
     sky; on a phone the photograph sits above the form. The same block opens
     Your requests (deposit-requests.html): change both together.

     The vault on the left, the action on the right: the panel stays in view
     on desktop while the vault details scroll (review finding P2). Review,
     Signing and Requested are ONE dialog whose content changes; no dialog ever
     opens on top of another (board 12).

     Contracts 0.9.0: a request names an amount, never a price; the batch sets
     the price, so the panel shows an estimate at today's price and the time
     the request locks. Exit in kind shows only while the vault winds down.

     The data source is the live vault on Base when lib/deposit/manifest.js has
     Deploy 4's addresses, and the simulator otherwise; the eyebrow says
     "Sample data" and the simulation bar shows only then.
     Factory: depositView() (alpine/views/deposit.js). -->

<section class="dp" x-data="depositGate()">

  <!-- Early access gate -->
  <template x-if="!open">
    <div class="dpg-wrap">
      <header class="dpg">
        <div class="dpg__viz" x-data="litPlateHero(0.74, 0.3)" aria-hidden="true">
          <img class="dpg__still" src="/assets/img/early-access/stairs.jpg" alt="" width="1672" height="941" fetchpriority="high" decoding="async" />
          <canvas class="dpg__canvas"></canvas>
        </div>
        <div class="dpg__inner">
          <div class="dpg__col">
            <h1 class="dpg__title">Early access to the vault</h1>
            <p class="dpg__lede">The Robot Money vault on Base opens to the early access list first, a few depositors at a time.</p>
            <label class="dpg__label" for="dp-code">Have an invite code? Enter it below.</label>
            <div class="dpg__code" :class="'is-' + state">
              <span class="dpg__rm" aria-hidden="true">RM</span>
              <template x-for="i in [0, 1, 2, 3, 4]" :key="i"><span class="dpg__box" :class="boxClass(i)" x-text="box(i)" aria-hidden="true"></span></template>
              <span class="dpg__dash" aria-hidden="true"></span>
              <template x-for="i in [5, 6, 7, 8, 9]" :key="i"><span class="dpg__box" :class="boxClass(i)" x-text="box(i)" aria-hidden="true"></span></template>
              <input id="dp-code" class="dpg__input" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24" x-init="focusFirst($el)" @input="onInput($event)" @focus="focused = true" @blur="focused = false" :aria-invalid="state === 'wrong' ? 'true' : 'false'" aria-describedby="dp-code-msg" />
            </div>
            <p class="dpg__msg" id="dp-code-msg" role="status" :class="'is-' + state" x-text="msg()"></p>
            <p class="dpg__fine">Not on the list yet? <a href="/early-access">Request early access</a></p>
          </div>
        </div>
      </header>
    </div>
  </template>

  <template x-if="open">
  <div x-data="depositView()" @keydown.escape.window="menuOpen = false; closeDialog()">
  <div class="dp__wrap">
    <div class="dp__cols">

      <!-- The vault -->
      <div class="dp__main">
        <header class="dp__head">
          <p class="dp__eyebrow"><span class="dp__chain"><img :src="BASE_MARK" src="/assets/img/brand/base-square.svg" width="14" height="14" alt=""><span>Base</span></span><template x-if="sample()"><span class="dp__tag">Sample data</span></template></p>
          <!-- The vault is one execution of the model portfolio, not the portfolio itself (David, 25 Nov): it tracks the swarm's mix with what it can hold on Base. -->
          <h1 class="dp__title">Robot Money Vault</h1>
          <p class="dp__lede">A vault on Base that tracks the swarm's model portfolio with the assets it can hold on chain.</p>
        </header>

        <p class="dp__err" x-show="loadError" x-text="loadError" x-cloak></p>

        <div class="dp__facts">
          <div class="dp__fact"><span class="dp__lbl">TVL</span><b :class="vault ? '' : 'is-wait'" x-text="tvl()">—</b></div>
          <div class="dp__fact"><span class="dp__lbl">Share price</span><b :class="vault ? '' : 'is-wait'" x-text="price()">—</b></div>
          <div class="dp__fact"><span class="dp__lbl">Remaining capacity<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About Remaining capacity">i</button><span class="rm-tip__bub" role="tooltip" x-text="capTip()"></span></span></span><b :class="vault ? '' : 'is-wait'" x-text="roomLabel()">—</b></div>
        </div>

        <section class="dp__sec dp__sec--first" aria-labelledby="hold-h">
          <div class="dp__sechead">
            <h2 class="dp__h2" id="hold-h">Holdings</h2>
            <a class="dp__lbl dp__lbl--link" href="/model-portfolio">Model portfolio</a>
          </div>
          <!-- The placeholder and the holdings share one grid cell, so nothing below moves when they land (.impeccable.md). -->
          <div class="dp__load" :class="vault ? 'is-ready' : ''">
          <div class="dp__skel dp__skel--hold" aria-hidden="true"><span class="dp__skelring"></span><span class="dp__skelrows"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
          <!-- The ring and its legend: the same explorer as the vault's subject page and the home page. Its centre names the largest holding; a row lights its arc. The full table (value, target, drift) belongs to the vault page (IA agreed 25 Nov). -->
          <div class="dp__hold dp__live">
            <div class="rr-x dp__mix" x-data="sleeveExplorer()" @keydown.escape.window="close()" @pointerleave="leave()">
              <div class="rr-mix">
                <figure class="rr-ring" @pointerover="overRing($event)" @pointerout="cancelIntent()" @click="clickRing($event)">
                  <span class="sv__wdonut-host" role="img" :aria-label="explorerLabel()" x-html="explorerSvg()" x-effect="active(); $nextTick(() => syncArcs($el))"></span>
                  <figcaption>
                    <b x-show="activeRow() || explorerCenter().value" x-text="activeRow() ? fmtPctTrim(activeRow().pct) : explorerCenter().value"></b>
                    <span x-text="activeRow() ? activeRow().label : explorerCenter().label"></span>
                  </figcaption>
                </figure>
                <div class="rr-legend">
                  <template x-for="r in explorerRows()" :key="r.key">
                    <button type="button" class="rr-legend__row" :data-sleeve-btn="r.key"
                            :class="{ 'is-active': active() === r.key, 'is-zero': !r.pct, 'is-muted': active() && active() !== r.key }"
                            @pointerenter="preview(r.key, $event)" @pointerleave="cancelIntent()" @focus="preview(r.key)" @blur="leave()" @click="toggle(r.key)">
                      <i data-mark="series" :style="`background:${r.hue}`" aria-hidden="true"></i>
                      <span class="rr-legend__l" x-text="r.label"></span>
                      <b x-text="fmtPctTrim(r.pct)"></b>
                    </button>
                  </template>
                  <a class="dp__lbl dp__lbl--link dp__holdmore" href="/vault">All holdings</a>
                </div>
              </div>
            </div>
          </div>
          </div>
        </section>

        <!-- The queue, for every depositor: what waits for a batch and when batches run. -->
        <section class="dp__sec" aria-labelledby="queue-h">
          <h2 class="dp__h2" id="queue-h">Queue</h2>
          <!-- The next batch's cycle as one line: it fills as the hour runs, a mark where its requests lock, the batch at the end. -->
          <div class="dp__cycle" x-show="queue()" x-transition.opacity.duration.300ms x-cloak>
            <p class="dp__countdown dp__countdown--lg" :title="`Next batch at ${fmtWhen(cycle().batch)}`"><span class="dp__lbl">Next batch in</span> <b x-text="cycle().batch > tick ? batchClock() : 'due now'"></b></p>
            <div class="dp__cyclebar" role="img" :aria-label="`The next batch runs ${cycle().toBatch}; requests made from ${when(cycle().lock)} still join it, but can no longer be cancelled`"><i class="dp__cyclefill" :style="`width:${cycle().fill}%`"></i><i class="dp__cycletick" :style="`left:${cycle().lockAt}%`"></i></div>
            <div class="dp__cyclelbl"><span><span x-text="cycle().locked ? 'Locked' : 'Requests lock'"></span> <b x-text="when(cycle().lock)"></b></span><span>Batch <b x-text="when(cycle().batch)"></b></span></div>
          </div>
          <div class="dp__facts dp__facts--plain">
            <div class="dp__fact"><span class="dp__lbl">Waiting to deposit<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About Waiting to deposit">i</button><span class="rm-tip__bub" role="tooltip">USDC in requests no batch has filled yet, from every depositor.</span></span></span><b :class="queue() ? '' : 'is-wait'" x-text="queue() ? fmtUsdc(queue().depositUsdc) : '—'">—</b></div>
            <div class="dp__fact"><span class="dp__lbl">Waiting to redeem<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About Waiting to redeem">i</button><span class="rm-tip__bub" role="tooltip">rmFUND in redemption requests no batch has filled yet, from every holder.</span></span></span><b :class="queue() ? '' : 'is-wait'" x-text="queue() ? fmtRm(queue().redeemShares) : '—'">—</b></div>
            <div class="dp__fact"><span class="dp__lbl">Last batch</span><b :class="queue() ? '' : 'is-wait'" x-text="queue() ? queueBatchLast() : '—'">—</b></div>
          </div>
          <p class="dp__fine dp__late" x-show="batchLate()" x-transition.opacity.duration.300ms x-cloak x-text="batchLate() ? `The batch due at ${fmtWhenShort(batchLate())} has not run yet. Requests wait in the queue until it does.` : ''"></p>
        </section>

        <section class="dp__sec" aria-labelledby="land-h">
          <h2 class="dp__h2" id="land-h">How deposits work</h2>
          <div class="dp__steps">
            <div><p class="dp__lbl">Request</p><p class="dp__when">Any time</p><p class="dp__desc">Cancel until it locks, <span x-text="lockLead()"></span> before its batch.</p></div>
            <div><p class="dp__lbl">Batch<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the batch">i</button><span class="rm-tip__bub" role="tooltip" x-text="priceTip()"></span></span></p><p class="dp__when">Every <span x-text="epochLabel()"></span></p><p class="dp__desc">Sets the price and matches deposits with redemptions.</p></div>
            <div><p class="dp__lbl">Hold</p><p class="dp__when" x-text="holdLabel()"></p><p class="dp__desc">Protects every holder from a manipulated price.</p></div>
            <div><p class="dp__lbl">Claim<span class="rm-tip rm-tip--end"><button class="rm-tip__btn" type="button" aria-label="About when you can claim">i</button><span class="rm-tip__bub" role="tooltip" x-text="landTip()"></span></span></p><p class="dp__when"><span x-text="waitLabel()"></span> after</p><p class="dp__desc">Your rmFUND is ready to claim.</p></div>
          </div>
        </section>

        <section class="dp__sec dp__sec--last" aria-labelledby="facts-h">
          <h2 class="dp__h2" id="facts-h">Before you deposit</h2>
          <!-- Closed by default (David, 25 Nov): the detail is there for whoever looks, not in everyone's way. -->
          <div class="dp__faq">
            <details class="dp__faqrow" id="faq-custody"><summary>Who holds my money?</summary><div class="dp__faqa">Non-custodial. Your wallet signs every step, and Robot Money never holds your keys.</div></details>
            <details class="dp__faqrow" id="faq-price"><summary>How is the price set?</summary><div class="dp__faqa">Set by the batch, from the vault's holdings at market prices, after requests lock. Nobody can see it when they request.</div></details>
            <details class="dp__faqrow" id="faq-getting-out"><summary>How do I get my money out?</summary><div class="dp__faqa">Redeem to USDC <span x-text="redeemWaitLabel()"></span> after you request, at the price the batch sets, less the exit fee.</div></details>
            <details class="dp__faqrow" id="faq-mix"><summary>Who sets the mix?</summary><div class="dp__faqa">The swarm recommends it, a multisig applies it through a timelock, and the vault moves toward it in small steps.</div></details>
            <details class="dp__faqrow" id="faq-limits"><summary>What are the limits?</summary><div class="dp__faqa dp__mono" x-text="limits()"></div></details>
            <details class="dp__faqrow" id="faq-fees"><summary>What are the fees?</summary><div class="dp__faqa dp__mono" x-text="fees()"></div></details>
            <details class="dp__faqrow" id="faq-contracts"><summary>Which contracts does it use?</summary><div class="dp__faqa"><template x-if="fundAddr()"><span>Vault <span class="dp__addrx"><a :href="addrHref(fundAddr())" target="_blank" rel="noopener noreferrer" x-text="shortAddr(fundAddr())"></a><button type="button" class="dp__copyi" title="Copy address" aria-label="Copy address" @click.stop="copyAddr(fundAddr(), $el)"><svg class="dp__copyi-c" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3.6" y="3.6" width="6.8" height="6.8"></rect><path d="M8.4 1.6H1.6v6.8"></path></svg><svg class="dp__copyi-k" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 6.4 4.6 9 10 3.2"></path></svg></button></span> · Queue <span class="dp__addrx"><a :href="addrHref(queueAddr())" target="_blank" rel="noopener noreferrer" x-text="shortAddr(queueAddr())"></a><button type="button" class="dp__copyi" title="Copy address" aria-label="Copy address" @click.stop="copyAddr(queueAddr(), $el)"><svg class="dp__copyi-c" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3.6" y="3.6" width="6.8" height="6.8"></rect><path d="M8.4 1.6H1.6v6.8"></path></svg><svg class="dp__copyi-k" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 6.4 4.6 9 10 3.2"></path></svg></button></span></span></template><template x-if="!fundAddr()"><span>Not on Base yet</span></template></div></details>
            <details class="dp__faqrow" id="faq-audit"><summary>Is it audited?</summary><div class="dp__faqa">[AUDIT STATUS]</div></details>
            <details class="dp__faqrow" id="faq-risks"><summary>What are the risks?</summary><div class="dp__faqa">Deposits are not insured and can lose value. <a href="/disclaimer">Read the risks</a> and how <a href="/smart-contract-risks">DeFi vaults get exploited</a>.</div></details>
          </div>
        </section>
      </div>

      <!-- The panel -->
      <aside class="dp__aside" aria-label="Deposit and redeem">
        <!-- The connected wallet sits above the panel, outside it: the panel holds the action only (David, 23 Nov). -->
        <template x-if="connected() || restoring()">
            <div class="dp__walletrow" @click.outside="menuOpen = false">
              <span class="dp__chip dp__chip--wait" x-show="!connected()" aria-hidden="true"><i class="dp__skelinline"></i></span>
              <button type="button" class="dp__chip" x-show="connected()" :aria-expanded="menuOpen ? 'true' : 'false'" aria-haspopup="menu" @click="menuOpen = !menuOpen">
                <template x-if="onBase()"><img class="dp__chainmark" :src="BASE_MARK" width="12" height="12" alt=""></template>
                <template x-if="!onBase()"><i class="dp__dot is-off" aria-hidden="true"></i></template><span x-text="short()"></span><span class="dp__muted" x-text="onBase() ? 'Base' : 'Wrong network'"></span>
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 3.5l3 3 3-3"></path></svg>
              </button>
              <div class="dp__menu" role="menu" x-show="menuOpen" x-cloak>
                <div class="dp__menuhead">
                  <span class="dp__lbl" x-text="`Connected with ${walletName() || 'a wallet'}`"></span>
                  <span class="dp__addr" x-text="address()"></span>
                  <span class="dp__menulinks"><button type="button" class="dp__txt" @click="copyAddress()" x-text="copied ? 'Copied' : 'Copy'"></button><a class="dp__txt" :href="explorerAddress()" target="_blank" rel="noopener noreferrer">Basescan</a></span>
                </div>
                <a role="menuitem" class="dp__menuitem" href="/deposit/requests"><span>Your position</span><span class="dp__muted" x-show="inQueue() > 0" x-text="`${fmtRm(inQueue())} queued`"></span></a>
                <button role="menuitem" type="button" class="dp__menuitem" @click="menuOpen = false; connect()">Switch wallet</button>
                <button role="menuitem" type="button" class="dp__menuitem" @click="disconnect()">Disconnect</button>
              </div>
            </div>
          </template>
        <div class="dp__mhead" aria-hidden="true"><span class="dp__mtitle" x-text="tab === 'redeem' ? 'Redeem' : 'Deposit'">Deposit</span><span class="dp__mono dp__muted" x-text="vault ? `${vault.priceUsdc.toFixed(4)} USDC a share` : ''"></span></div>
        <div class="dp__panel">

          <div class="dp__tabs" role="tablist" aria-label="Action">
            <button type="button" role="tab" class="dp__tab" :class="tab === 'deposit' ? 'is-on' : ''" :aria-selected="tab === 'deposit' ? 'true' : 'false'" @click="tab = 'deposit'">Deposit</button>
            <button type="button" role="tab" class="dp__tab" :class="tab === 'redeem' ? 'is-on' : ''" :aria-selected="tab === 'redeem' ? 'true' : 'false'" @click="tab = 'redeem'">Redeem</button>
          </div>

          <!-- What stops the vault right now: the cause, when it ends, and what still works. -->
          <template x-if="stop()">
            <div class="dp__note" role="status"><b x-text="stop().title"></b><p x-text="stop().body"></p></div>
          </template>

          <!-- Deposit -->
          <div x-show="tab === 'deposit'" class="dp__pane" role="tabpanel">
            <div class="dp__field" :class="amountError() ? 'is-err' : ''">
              <div class="dp__fieldtop">
                <label class="dp__lbl" for="dp-amt">You deposit</label>
                <template x-if="!connected() && !restoring()"><button type="button" class="dp__txt" @click="connect()">Connect wallet</button></template><template x-if="(connected() || restoring()) && !acctData"><span class="dp__lbl">Balance <i class="dp__skelinline" aria-hidden="true"></i></span></template>
                <template x-if="acctData"><span class="dp__lbl">Balance <span class="dp__bal" x-text="floorTo(acctData.usdc, 2).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })"></span><button type="button" class="dp__txt dp__txt--gap" @click="setMax()">Max</button></span></template>
              </div>
              <div class="dp__amt">
                <input id="dp-amt" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" x-model="amount" :aria-invalid="amountError() ? 'true' : 'false'" aria-describedby="dp-amt-msg">
                <span class="dp__tok"><img class="dp__tokimg" src="/assets/img/tokens/usdc.svg" alt="" width="24" height="24">USDC</span>
              </div>
            </div>
            <p class="dp__err dp__err--tight" id="dp-amt-msg" x-show="amountError() || maxWhy" :class="amountError() ? '' : 'is-hint'" x-text="amountError() || maxWhy" x-cloak></p>

            <div class="dp__kvs" :class="dqLoading ? 'is-stale' : ''">
              <div class="dp__kv"><span>You receive (estimate)<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the estimate">i</button><span class="rm-tip__bub" role="tooltip" x-text="receiveTip()"></span></span></span><b x-text="estShares()"></b></div>
              <div class="dp__kv"><span><span x-text="cancelKv(lockAt()).label"></span><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the cancel deadline">i</button><span class="rm-tip__bub" role="tooltip" x-text="cancelTip('deposit', lockAt())"></span></span></span><b x-text="cancelKv(lockAt()).value"></b></div>
              <div class="dp__kv"><span>Next batch in<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the next batch">i</button><span class="rm-tip__bub" role="tooltip" x-text="batchTip()"></span></span></span><b x-text="soon(batchAt())"></b></div>
              <div class="dp__kv"><span>Ready to claim in<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About when you can claim">i</button><span class="rm-tip__bub" role="tooltip" x-text="arriveTip()"></span></span></span><b x-text="soon(sharesAt())"></b></div>
            </div>

            <template x-if="!connected() && !restoring()">
              <div class="dp__stack">
                <button type="button" class="btn-primary dp__btn" @click="connect()" :disabled="walletLoading()" x-text="walletLoading() ? 'Opening…' : 'Connect wallet'"></button>
                <p class="dp__fine">Any wallet on Base, a Safe included.<template x-if="simulated()"><span> <button type="button" class="dp__txt" @click="useTestAddress()">Use a test address</button></span></template></p>
                <p class="dp__err dp__err--tight" x-show="walletError()" x-text="walletError()" x-cloak></p>
                <p class="dp__legal">By connecting a wallet you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
              </div>
            </template>
            <template x-if="connected() && !onBase()">
              <div class="dp__stack">
                <button type="button" class="btn-primary dp__btn" @click="switchToBase()">Switch to Base</button>
                <p class="dp__fine">The vault is on Base. Your wallet is on another network.</p>
                <p class="dp__err dp__err--tight" x-show="walletError()" x-text="walletError()" x-cloak></p>
              </div>
            </template>
            <!-- While the kit reconnects, the connected layout already holds its place (no taller "Connect" block that then collapses). -->
            <template x-if="(connected() && onBase()) || restoring()">
              <button type="button" class="btn-primary dp__btn" :disabled="restoring() || !canReview()" @click="openReview('deposit')" x-text="restoring() ? 'Reconnecting…' : 'Review deposit'"></button>
            </template>
          </div>

          <!-- Redeem (board 8) -->
          <div x-show="tab === 'redeem'" class="dp__pane" role="tabpanel" x-cloak>
            <div class="dp__field" :class="redeemError() ? 'is-err' : ''">
              <div class="dp__fieldtop">
                <label class="dp__lbl" for="dp-sh">You redeem</label>
                <template x-if="!connected() && !restoring()"><button type="button" class="dp__txt" @click="connect()">Connect wallet</button></template><template x-if="(connected() || restoring()) && !acctData"><span class="dp__lbl">Balance <i class="dp__skelinline" aria-hidden="true"></i></span></template>
                <template x-if="acctData"><span class="dp__lbl">Balance <span class="dp__bal" x-text="fmtShares(floorTo(acctData.shares, 4))"></span><button type="button" class="dp__txt dp__txt--gap" @click="redeemMax()">Max</button></span></template>
              </div>
              <div class="dp__amt">
                <input id="dp-sh" type="text" inputmode="decimal" autocomplete="off" placeholder="0" x-model="shares" :aria-invalid="redeemError() ? 'true' : 'false'">
                <span class="dp__tok">rmFUND</span>
              </div>
            </div>
            <p class="dp__err dp__err--tight" x-show="redeemError()" x-text="redeemError()" x-cloak></p>

            <template x-if="exitMode === 'queue'">
              <div class="dp__stack dp__stack--tight">
                <div class="dp__kvs">
                  <div class="dp__kv"><span>You receive (estimate)<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the estimate">i</button><span class="rm-tip__bub" role="tooltip" x-text="redeemReceiveTip()"></span></span></span><b x-text="estUsdc()"></b></div>
                  <div class="dp__kv"><span>Exit fee<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the exit fee">i</button><span class="rm-tip__bub" role="tooltip" x-text="exitFeeTip(sharesN(), exitFeeBps())"></span></span></span><b x-text="rq || vault ? exitFeeSays(sharesN(), exitFeeBps()) : '—'"></b></div>
                  <div class="dp__kv"><span><span x-text="cancelKv(redeemLockAt()).label"></span><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the cancel deadline">i</button><span class="rm-tip__bub" role="tooltip" x-text="cancelTip('redeem', redeemLockAt())"></span></span></span><b x-text="cancelKv(redeemLockAt()).value"></b></div>
                  <div class="dp__kv"><span>USDC ready in<span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About when USDC is ready">i</button><span class="rm-tip__bub" role="tooltip" x-text="usdcReadyTip()"></span></span></span><b x-text="soon(usdcAt())"></b></div>
                </div>
              </div>
            </template>
            <!-- Wind-down only (D18): the one way out while no batch runs. -->
            <template x-if="exitMode === 'inkind'">
              <div class="dp__choice is-on">
                <span class="dp__choicehead"><span>Exit in kind</span></span>
                <span class="dp__choicep">At once, your slice of each holding as it is. Nothing is sold.</span>
                <template x-for="l in inKindSummary()" :key="l.key"><span class="dp__kv"><span class="dp__asset"><template x-if="tokenIcon(l.label)"><img class="dp__tokimg" :src="tokenIcon(l.label)" alt="" width="24" height="24"></template><span x-text="l.label"></span></span><b x-text="l.amount"></b></span></template>
              </div>
            </template>

            <template x-if="!connected() && !restoring()"><button type="button" class="btn-primary dp__btn" @click="connect()" :disabled="walletLoading()" x-text="walletLoading() ? 'Opening…' : 'Connect wallet'"></button></template>
            <template x-if="connected() && !onBase()"><button type="button" class="btn-primary dp__btn" @click="switchToBase()">Switch to Base</button></template>
            <template x-if="(connected() && onBase()) || restoring()">
              <button type="button" class="btn-primary dp__btn" :disabled="restoring() || !canRedeem()" @click="openReview(exitMode === 'queue' ? 'redeem' : 'inkind')" x-text="restoring() ? 'Reconnecting…' : exitMode === 'queue' ? 'Review redemption' : 'Review exit in kind'"></button>
            </template>
          </div>

          <!-- The way back to this wallet's requests: its own row at the foot of the panel, with where they stand. -->
          <template x-if="(connected() && onBase()) || restoring()">
            <a class="dp__reqrow" href="/deposit/requests"><span class="dp__reqrow-l">Your position</span><span class="dp__reqrow-r" x-text="connected() ? requestsSummary() : ''"></span></a>
          </template>
        </div>
      </aside>
    </div>

  </div>

  <!-- The dialog: review, then signing, then requested -->
  <div class="dp__scrim" x-show="dlg.open" x-cloak x-transition.opacity.duration.150ms @click.self="closeDialog()">
    <div class="dp__dlg" role="dialog" aria-modal="true" aria-labelledby="dp-dlg-h" x-init="easeDialog($el)">
      <div class="dp__dlgin">
      <div class="dp__dlghead">
        <div class="dp__stack dp__stack--tight">
          <template x-if="dlg.phase === 'requested'"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#10b981" stroke-width="1.8" aria-hidden="true"><path d="M5 14.5l6 6L23 8"></path></svg></template>
          <span class="dp__lbl" x-show="stepLabel()" x-text="stepLabel()"></span>
          <h2 class="dp__dlgtitle" id="dp-dlg-h" tabindex="-1" x-ref="dlgTitle" x-text="dlgTitle()"></h2>
        </div>
        <button type="button" class="dp__x" aria-label="Close" @click="closeDialog()" x-show="dlg.phase === 'review'"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14"></path></svg></button>
      </div>

      <!-- Review (board 3, with the checks of board 22) -->
      <template x-if="dlg.phase === 'review'">
        <div class="dp__dlgbody">
          <template x-if="dlg.kind === 'deposit'">
            <div class="dp__stack dp__stack--tight"><span class="dp__lbl">You deposit</span><p class="dp__bignum" x-text="fmtUsdc(dlg.amount)"></p><p class="dp__soft">for about <b class="dp__mono dp__strong" x-text="estShares(dlg.amount)"></b><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the estimate">i</button><span class="rm-tip__bub" role="tooltip" x-text="dlgEstTip()"></span></span></p></div>
          </template>
          <template x-if="dlg.kind !== 'deposit'">
            <div class="dp__stack dp__stack--tight"><span class="dp__lbl">You redeem</span><p class="dp__bignum" x-text="fmtRm(dlg.amount)"></p>
              <template x-if="dlg.kind === 'redeem'"><p class="dp__soft">for about <b class="dp__mono dp__strong" x-text="estUsdc(dlg.amount)"></b>, <span x-text="exitFeeWords(dlg.amount, dlg.quote?.feeBps ?? vault?.exitFeeBps)"></span><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the estimate">i</button><span class="rm-tip__bub" role="tooltip" x-text="dlgEstTip()"></span></span></p></template>
              <template x-if="dlg.kind === 'inkind'"><p class="dp__soft">and receive your slice of each holding, at once</p></template>
            </div>
          </template>

          <div class="dp__kvs dp__kvs--rule">
            <template x-if="dlg.quote && dlg.kind !== 'inkind'"><div class="dp__kv"><span><span x-text="dlg.kind === 'deposit' ? 'rmFUND ready in' : 'USDC ready in'"></span><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About when it is ready">i</button><span class="rm-tip__bub" role="tooltip" x-text="dlgReadyTip()"></span></span></span><b x-text="soon(dlg.quote.readyAt)"></b></div></template>
            <template x-if="dlg.quote && dlg.kind !== 'inkind'"><div class="dp__kv"><span><span x-text="cancelKv(dlg.quote.lockAt).label"></span><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the cancel deadline">i</button><span class="rm-tip__bub" role="tooltip" x-text="cancelTip(dlg.kind === 'deposit' ? 'deposit' : 'redeem', dlg.quote.lockAt)"></span></span></span><b x-text="cancelKv(dlg.quote.lockAt).value"></b></div></template>
            <template x-if="dlg.kind === 'deposit' && vault?.entryFeeBps > 0"><div class="dp__kv"><span>Entry fee</span><b x-text="fmtFee(vault?.entryFeeBps)"></b></div></template>
            <template x-if="dlg.kind === 'inkind'"><template x-for="l in inKindSummary()" :key="`r${l.key}`"><div class="dp__kv"><span class="dp__asset"><template x-if="tokenIcon(l.label)"><img class="dp__tokimg" :src="tokenIcon(l.label)" alt="" width="24" height="24"></template><span x-text="l.label"></span></span><b x-text="l.amount"></b></div></template></template>
            <div class="dp__kv"><span>From</span><b><span class="dp__addrx"><a :href="addrHref(address())" target="_blank" rel="noopener noreferrer" x-text="shortAddr(address())"></a><button type="button" class="dp__copyi" title="Copy address" aria-label="Copy address" @click.stop="copyAddr(address(), $el)"><svg class="dp__copyi-c" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="3.6" y="3.6" width="6.8" height="6.8"></rect><path d="M8.4 1.6H1.6v6.8"></path></svg><svg class="dp__copyi-k" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 6.4 4.6 9 10 3.2"></path></svg></button></span> on Base</b></div>
          </div>

          <!-- What the wallet will ask, in one line (David, 25 Nov: the queue's workings live in the tooltips above). -->
          <p class="dp__soft dp__small"><span x-text="walletLine()"></span><template x-if="walletTip()"><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About the approval">i</button><span class="rm-tip__bub" role="tooltip" x-text="walletTip()"></span></span></template></p>

          <!-- Checks before the wallet opens (board 22): only shown when one fails. -->
          <template x-if="failedChecks().length">
            <div class="dp__checks" role="status">
              <span class="dp__lbl">One thing first</span>
              <template x-for="c in dlg.checks" :key="c.key">
                <div class="dp__check">
                  <template x-if="c.ok"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#10b981" stroke-width="1.8" aria-hidden="true"><path d="M4 10.5l4 4 8-9"></path></svg></template>
                  <template x-if="!c.ok"><i class="dp__pt" aria-hidden="true"></i></template>
                  <span x-text="c.text"></span><span class="dp__mono dp__muted dp__right" x-text="c.aside || ''"></span>
                </div>
              </template>
              <template x-for="c in failedChecks()" :key="`n${c.key}`"><p class="dp__soft dp__small" x-show="c.note" x-text="c.note"></p></template>
              <p class="dp__fine">Your wallet opens only once every check passes. This checks again on its own.</p>
            </div>
          </template>

          <template x-if="accountSwitched()">
            <p class="dp__err dp__err--tight">Your wallet switched to another account. Close this and review again for the new address.</p>
          </template>

          <template x-if="needsAck()">
            <label class="dp__ack">
              <input type="checkbox" x-model="dlg.ack">
              <span>I have read the <a href="/terms" target="_blank" rel="noopener">Terms</a> and the <a href="/disclaimer" target="_blank" rel="noopener">risks</a>. My deposit buys rmFUND at the price its batch sets, is not insured, can lose value, and settles in batches. [ELIGIBILITY LINE, counsel]</span>
            </label>
          </template>

          <div class="dp__btnrow">
            <button type="button" class="dp__btn2" @click="closeDialog()">Back</button>
            <button type="button" class="btn-primary dp__btn dp__grow" :disabled="!canConfirm()" @click="confirm()">Confirm in wallet</button>
          </div>
        </div>
      </template>

      <!-- Signing (boards 4, 15, 16) -->
      <template x-if="dlg.phase === 'signing'">
        <div class="dp__dlgbody">
          <p class="dp__soft" x-show="!dlg.error" x-text="signingLede()"></p>
          <div>
            <template x-for="(st, i) in dlg.steps" :key="i">
              <div class="dp__srow">
                <span class="dp__mark" aria-hidden="true">
                  <template x-if="st.state === 'done'"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#10b981" stroke-width="1.6"><path d="M4 10.5l4 4 8-9"></path></svg></template>
                  <template x-if="st.state === 'wallet' || st.state === 'sent'"><svg class="dp__spin" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#f2f4f9" stroke-width="1.6"><circle cx="10" cy="10" r="7" stroke="#2e3a4e"></circle><path d="M10 3a7 7 0 0 1 7 7"></path></svg></template>
                  <template x-if="st.state === 'idle'"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2e3a4e" stroke-width="1.6"><circle cx="10" cy="10" r="7"></circle></svg></template>
                </span>
                <div class="dp__grow"><p x-text="st.label"></p><p class="dp__fine" x-text="stepWords(st)"></p></div>
                <template x-if="hashUrl(st.hash)"><a class="dp__ext" :href="hashUrl(st.hash)" target="_blank" rel="noopener noreferrer">Basescan</a></template>
              </div>
            </template>
          </div>
          <template x-if="dlg.error">
            <div class="dp__stack">
              <p class="dp__err dp__err--tight" role="alert" x-text="dlg.error"></p>
              <div class="dp__btnrow"><button type="button" class="dp__btn2" @click="closeDialog()">Close</button><button type="button" class="btn-primary dp__btn dp__grow" @click="retry()">Try again</button></div>
            </div>
          </template>
          <template x-if="!dlg.error">
            <div class="dp__stack dp__stack--tight dp__rule">
              <p class="dp__fine"><span x-text="closeNote().text"></span><template x-if="closeNote().tip"><span class="rm-tip"><button class="rm-tip__btn" type="button" aria-label="About closing">i</button><span class="rm-tip__bub" role="tooltip" x-text="closeNote().tip"></span></span></template></p>
              <button type="button" class="dp__txt dp__self-start" @click="dlg.open = false">Close and keep waiting</button>
            </div>
          </template>
        </div>
      </template>

      <!-- Requested (board 5) -->
      <template x-if="dlg.phase === 'requested'">
        <div class="dp__dlgbody">
          <template x-if="dlg.kind === 'inkind'"><p class="dp__soft">Your slice of each holding is in your wallet.</p></template>
          <template x-if="dlg.kind !== 'inkind'">
            <ol class="dp__tl dp__tl--steps" aria-label="What happens next">
              <template x-for="n in track()" :key="n.key"><li :class="n.cls"><span x-text="n.label"></span><span class="dp__mono" :title="n.title" x-text="n.when"></span></li></template>
            </ol>
          </template>
          <template x-if="dlg.kind !== 'inkind' && dlg.quote?.lockAt > now">
            <p class="dp__soft dp__small" x-text="`You can cancel for ${soon(dlg.quote.lockAt)}, from Your position.`"></p>
          </template>
          <template x-if="dlg.kind !== 'inkind' && dlg.result?.id">
            <p class="dp__follow"><a class="dp__ext" :href="statusLink()" target="_blank" rel="noopener" x-text="`Request #${dlg.result.id}`"></a></p>
          </template>
          <div class="dp__btnrow">
            <button type="button" class="dp__btn2" @click="closeDialog()">Done</button>
            <a class="btn-primary dp__btn dp__grow" href="/deposit/requests">View your position</a>
          </div>
        </div>
      </template>
      </div>
    </div>
  </div>

  <!-- Simulation only: the clock and states the simulated queue runs on. -->
  <template x-if="simulated()">
    <aside class="dp__sim" aria-label="Simulation controls">
      <p><b>Simulated vault</b> Nothing is sent to any chain.</p>
      <p>Clock <b class="dp__mono" x-text="simClock()"></b> <span x-text="simAhead()"></span></p>
      <div class="dp__simb">
        <button type="button" class="dp__btn2 dp__btn2--sm" @click="simNext()">Run next batch</button>
        <button type="button" class="dp__btn2 dp__btn2--sm" @click="simAdvance(1)">+1 h</button>
        <button type="button" class="dp__txt" @click="simToggleDeposits()" x-text="simState().deposits ? 'Resume deposits' : 'Stop deposits'"></button>
        <button type="button" class="dp__txt" @click="simToggleBlocked()" x-text="simState().blocked ? 'Unblock batches' : 'Block batches'"></button>
        <button type="button" class="dp__txt" @click="simToggleWindDown()" x-text="simState().windDown ? 'Restore' : 'Wind down'"></button>
        <template x-if="!resetAsk"><button type="button" class="dp__txt" @click="resetAsk = true">Reset</button></template>
        <template x-if="resetAsk"><span>Clear every simulated request? <button type="button" class="dp__txt" @click="simReset()">Yes</button> <button type="button" class="dp__txt" @click="resetAsk = false">No</button></span></template>
      </div>
    </aside>
  </template>
  </div>
  </template>
</section>
