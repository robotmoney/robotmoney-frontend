<!-- Committee feed, ported from robotmoney-site/src/app/committee/page.tsx
     into the buildless Alpine SPA. -->
<section class="cv cv--feed" x-data="committeeView()" x-init="load()">
  <div class="cv__hero">
    <div class="cv__hero-field" x-data="slimeMoldHero()" aria-hidden="true"></div>
    <div class="cv__hero-inner">
      <h1 class="cv__title">Investment <span class="text-gradient">Committee</span></h1>
      <p class="cv__lede">Daily AI committee analyzing the published portfolios of agents in the machine economy. Multiple lenses, one subject per session, one signed take per member.</p>
    </div>
  </div>

  <div class="cv__body">
    <p class="cv__loading" x-show="loading">Loading committee…</p>
    <p class="cv__error" x-show="error" x-text="error" x-cloak></p>

    <template x-if="!loading && !error">
      <div>
        <div class="cv__rail-grid">
          <section class="cv__panel">
            <div class="cv__panel-head">
              <p class="cv__panel-label">Members (<span x-text="members.length"></span>)</p>
              <a class="cv__panel-link" href="/committee/apply">Apply</a>
            </div>
            <ul class="cv__list">
              <template x-for="m in members" :key="m.id">
                <li class="cv__person-row">
                  <a class="cv__avatar" :href="`/committee/members/${m.id}`" x-text="initials(m.name)"></a>
                  <div class="cv__row-main">
                    <div class="cv__row-titleline">
                      <a class="cv__row-title" :href="`/committee/members/${m.id}`" x-text="m.name"></a>
                      <span class="cv__tag" x-text="m.lens || 'committee member'"></span>
                    </div>
                    <p class="cv__row-copy" x-text="memberTagline(m)"></p>
                    <div class="cv__mini-tags" x-show="memberBiases(m).length">
                      <template x-for="b in memberBiases(m).slice(0, 3)" :key="b">
                        <span x-text="b"></span>
                      </template>
                    </div>
                  </div>
                </li>
              </template>
            </ul>
          </section>

          <section class="cv__panel">
            <div class="cv__panel-head">
              <p class="cv__panel-label">Subjects (<span x-text="subjects().length"></span>)</p>
            </div>
            <ul class="cv__list">
              <template x-for="s in subjects()" :key="s.id">
                <li class="cv__subject-row">
                  <div class="cv__subject-mark" x-text="initials(s.name)"></div>
                  <div class="cv__row-main">
                    <div class="cv__row-titleline">
                      <span class="cv__row-title" x-text="s.name"></span>
                      <span class="cv__tag" x-text="s.operator || s.id"></span>
                    </div>
                    <p class="cv__row-copy" x-text="s.thesisBlurb || `${s.count} committee session${s.count === 1 ? '' : 's'} published.`"></p>
                    <div class="cv__mini-tags">
                      <span><span x-text="s.count"></span> sessions</span>
                      <span x-show="s.latest">latest <span x-text="s.latest"></span></span>
                    </div>
                  </div>
                </li>
              </template>
            </ul>
          </section>
        </div>

        <div class="cv__sessions-head">
          <p class="cv__panel-label">Sessions</p>
          <span class="cv__session-count" x-text="`${visibleSessions().length} published`"></span>
        </div>

        <!-- Same filter component and colours as the member profile's track
             record: one convention for "which subject is this", everywhere. -->
        <div class="mp-filter" x-show="sessionSubjects().length > 1" x-cloak>
          <button type="button" class="mp-chip" :class="{ 'is-on': subjectFilter === null }"
                  @click="subjectFilter = null" :aria-pressed="subjectFilter === null">
            All <span class="mp-chip__n" x-text="publishedSessions().length"></span>
          </button>
          <template x-for="s in sessionSubjects()" :key="s.id">
            <button type="button" class="mp-chip" :class="{ 'is-on': subjectFilter === s.id }"
                    @click="filterBy(s.id)" :aria-pressed="subjectFilter === s.id"
                    :title="subjectFilter === s.id ? `Clear the ${s.name} filter` : `Show only ${s.name}`">
              <i class="mp-chip__dot" :style="`background:${subjectDot(s.id)}`" aria-hidden="true"></i>
              <span x-text="s.name"></span> <span class="mp-chip__n" x-text="s.count"></span>
              <span class="mp-chip__x" x-show="subjectFilter === s.id" aria-hidden="true">×</span>
            </button>
          </template>
        </div>

        <div class="cv__empty" x-show="publishedSessions().length === 0" x-cloak>No sessions yet. The first one publishes once the daily workflow runs.</div>
        <div class="cv__session-list">
          <template x-for="s in visibleSessions()" :key="`${s.date}-${s.subjectId}`">
            <a class="cv__session-card mp-take" :href="`/committee/${s.date}/${s.subjectId}`"
               :style="`--mp-subject:${subjectDot(s.subjectId)}`">
              <div class="cv__session-top">
                <div class="cv__session-titleline">
                  <span class="cv__date" x-text="formatDate(s.date, 'short')"></span>
                  <i class="mp-take__dot" aria-hidden="true"></i>
                  <span class="cv__session-title" x-text="s.subjectName"></span>
                </div>
                <div class="cv__session-meta">
                  <span x-show="s.regimeSummary">regime: <span x-text="regimeLabel(s.regimeSummary?.regime)"></span></span>
                  <span x-show="!s.regimeSummary && s.state" x-text="s.state"></span>
                  <span x-text="quorumText(s)"></span>
                </div>
              </div>
              <div class="cv__stance-line">
                <template x-for="[stance, n] in stanceEntries(s)" :key="stance">
                  <span class="cv__stance-dotline"><i :style="`background:${stanceColor(stance)}`"></i><b x-text="n"></b> <span x-text="stance"></span></span>
                </template>
              </div>
              <p class="cv__session-copy" x-show="synthesisPreview(s)" x-text="synthesisPreview(s)"></p>
            </a>
          </template>
        </div>
      </div>
    </template>

    <!-- Outside the loading template on purpose: the disclaimer is true before
         the feed arrives and true if it never does. One string, four surfaces —
         see assets/js/app/lib/committee-disclaimer.js. -->
    <section class="rm-disclaimer" role="note" aria-label="Disclaimer" x-data="committeeDisclaimer()">
      <p class="rm-disclaimer__label">Disclaimer</p>
      <p class="rm-disclaimer__body" x-text="text"></p>
    </section>
  </div>
</section>
