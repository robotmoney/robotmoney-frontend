<!-- Projects — "Agentic Economy Ecosystem" directory
     Ported from robotmoney-bot-analytics/src/pages/Projects.tsx (Supabase → the
     new Bun/Postgres backend, issue #70). Buildless: the table is driven by the
     boot-registered projectsView() factory (alpine/views.js) over /api/projects.
     Uses the a2 design tokens (shared with /performance + /allocation). Inline
     <style> applies when the router injects this fragment; the inline factory is
     registered at boot, not here (router injects via innerHTML — scripts are dead).
-->

<section class="a2 container" x-data="projectsView()" x-init="load()">

  <!-- Header -->
  <header class="a2-section__head pj-head">
    <span class="a2-eyebrow">Analytics</span>
    <h1 class="pj-title">Agentic Economy <span class="a2-grad">Ecosystem</span></h1>
    <p class="a2-section__lede">
      Zero Human Companies, onchain AI agents, and other AI-native economics
      experiments. Every metric maps to a concrete row in the backend and a
      specific ingestion pipeline.
    </p>
  </header>

  <!-- States -->
  <p x-show="loading" class="pj-status">Loading…</p>
  <p x-show="error" x-text="error" class="pj-status pj-status--error" x-cloak></p>
  <p x-show="!loading && !error && rows.length === 0" class="pj-status" x-cloak>
    No projects yet.
  </p>

  <!-- Directory table -->
  <div class="a2-table__scroll pj-scroll" x-show="!loading && rows.length > 0" x-cloak>
    <table class="a2-table pj-table">
      <thead>
        <tr>
          <th class="a2-sticky">
            <button type="button" class="pj-sort" :class="isSort('name') && 'pj-sort--active'" @click="sortBy('name')">
              Project <span class="pj-sort__i" x-text="sortIcon('name')"></span>
            </button>
          </th>
          <th>
            <button type="button" class="pj-sort" :class="isSort('mcap') && 'pj-sort--active'" @click="sortBy('mcap')">
              Market Cap <span class="pj-sort__i" x-text="sortIcon('mcap')"></span>
            </button>
          </th>
          <th>
            <button type="button" class="pj-sort" :class="isSort('fdv') && 'pj-sort--active'" @click="sortBy('fdv')">
              FDV <span class="pj-sort__i" x-text="sortIcon('fdv')"></span>
            </button>
          </th>
          <th>MC/FDV</th>
          <th>
            <button type="button" class="pj-sort" :class="isSort('pct24h') && 'pj-sort--active'" @click="sortBy('pct24h')">
              24h % <span class="pj-sort__i" x-text="sortIcon('pct24h')"></span>
            </button>
          </th>
          <th>30d</th>
          <th>
            <button type="button" class="pj-sort" :class="isSort('score') && 'pj-sort--active'" @click="sortBy('score')">
              Data Quality <span class="pj-sort__i" x-text="sortIcon('score')"></span>
            </button>
          </th>
          <th class="pj-l">Description</th>
          <th class="pj-l">Website</th>
          <th class="pj-l">Social</th>
          <th class="pj-l">
            <button type="button" class="pj-sort" :class="isSort('facets') && 'pj-sort--active'" @click="sortBy('facets')">
              Facets <span class="pj-sort__i" x-text="sortIcon('facets')"></span>
            </button>
          </th>
          <th>
            <button type="button" class="pj-sort" :class="isSort('revenue') && 'pj-sort--active'" @click="sortBy('revenue')">
              Revenue 30d <span class="pj-sort__i" x-text="sortIcon('revenue')"></span>
            </button>
          </th>
          <th>
            <button type="button" class="pj-sort" :class="isSort('wallet') && 'pj-sort--active'" @click="sortBy('wallet')">
              Wallet Balance <span class="pj-sort__i" x-text="sortIcon('wallet')"></span>
            </button>
          </th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in sortedRows" :key="row.p.id">
          <tr>
            <!-- Project -->
            <td class="a2-sticky pj-name">
              <div class="pj-name__inner">
                <template x-if="row.p.logoUrl">
                  <img :src="row.p.logoUrl" alt="" class="pj-logo" loading="lazy" />
                </template>
                <template x-if="!row.p.logoUrl">
                  <span class="pj-logo pj-logo--fallback" x-text="initials(row.p.displayName)"></span>
                </template>
                <span class="pj-name__text" x-text="row.p.displayName"></span>
              </div>
            </td>

            <!-- Market Cap (per coin) -->
            <td class="a2-r">
              <template x-if="row.p.coins.length > 0">
                <div>
                  <template x-for="c in row.p.coins" :key="c.id + '-mc'">
                    <div class="pj-coinline"><i x-text="c.ticker || '?'"></i> <span x-text="fmtUsd(c.marketCap)"></span></div>
                  </template>
                </div>
              </template>
              <span x-show="row.p.coins.length === 0" class="a2-dim">—</span>
            </td>

            <!-- FDV (per coin) -->
            <td class="a2-r">
              <template x-if="row.p.coins.length > 0">
                <div>
                  <template x-for="c in row.p.coins" :key="c.id + '-fdv'">
                    <div class="pj-coinline"><i x-text="c.ticker || '?'"></i> <span x-text="fmtUsd(c.fdv)"></span></div>
                  </template>
                </div>
              </template>
              <span x-show="row.p.coins.length === 0" class="a2-dim">—</span>
            </td>

            <!-- MC/FDV -->
            <td class="a2-r" x-text="mcFdvPct(row.p)"></td>

            <!-- 24h % (per coin) -->
            <td class="a2-r">
              <template x-if="row.p.coins.length > 0">
                <div>
                  <template x-for="c in row.p.coins" :key="c.id + '-pct'">
                    <div class="pj-coinline" :style="`color:${pctColor(c.percentChange24h)}`" x-text="pctText(c.percentChange24h)"></div>
                  </template>
                </div>
              </template>
              <span x-show="row.p.coins.length === 0" class="a2-dim">—</span>
            </td>

            <!-- 30d sparkline -->
            <td class="pj-c"><span x-html="sparkSvg(row.p.sparkline)"></span></td>

            <!-- Data quality -->
            <td class="a2-r pj-score" x-text="row.p.dataCoverageScore ?? '—'"></td>

            <!-- Description -->
            <td class="pj-l pj-desc"><span x-text="row.p.description || '—'"></span></td>

            <!-- Website -->
            <td class="pj-l">
              <template x-if="row.p.websiteUrl">
                <a :href="row.p.websiteUrl" target="_blank" rel="noreferrer" class="pj-link" x-text="cleanUrl(row.p.websiteUrl)"></a>
              </template>
              <span x-show="!row.p.websiteUrl" class="a2-dim">—</span>
            </td>

            <!-- Social -->
            <td class="pj-l">
              <template x-if="row.p.twitterHandle">
                <a :href="twitterUrl(row.p.twitterHandle)" target="_blank" rel="noreferrer" class="pj-link" x-text="twitterLabel(row.p.twitterHandle)"></a>
              </template>
              <span x-show="!row.p.twitterHandle" class="a2-dim">—</span>
            </td>

            <!-- Facets -->
            <td class="pj-l">
              <div class="pj-facets">
                <template x-for="f in facetPills(row.p)" :key="f.label">
                  <span class="pj-pill" :class="f.on ? 'pj-pill--on' : 'pj-pill--off'" :title="f.hint" x-text="f.label"></span>
                </template>
              </div>
            </td>

            <!-- Revenue 30d -->
            <td class="a2-r" x-text="fmtUsd(row.p.revenue30d)"></td>

            <!-- Wallet balance -->
            <td class="a2-r">
              <template x-if="row.p.wallets.length > 0">
                <div :title="row.p.wallets.map(w => w.label + ' (' + (w.chain || '?') + '): ' + fmtUsd(w.balanceUsd)).join('\n')">
                  <span x-text="fmtUsd(row.p.walletTotalUsd)"></span>
                  <i x-text="row.p.wallets.length + (row.p.wallets.length !== 1 ? ' wallets' : ' wallet')"></i>
                </div>
              </template>
              <span x-show="row.p.wallets.length === 0" class="a2-dim">—</span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

</section>

<style>
