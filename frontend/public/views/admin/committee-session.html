<!-- Admin — session detail (/admin/committee/sessions/:id): UTC-first timeline,
     roster matrix (expected/excused/submitted/absent) with a collapsed
     signature/canonical-payload disclosure, read-only aggregate, and guarded
     lifecycle action controls. No control here can edit or delete an accepted
     recommendation. Issue #159. Buildless — factory registered at boot
     (alpine/views/admin/committee-session.js). -->
<section class="container adm" x-data="adminCommitteeSession" x-init="init()">

  <header class="adm-head">
    <a href="/admin/committee" class="cv__back">← /admin/committee</a>
    <h1 class="adm-title">
      Session <span x-text="session?.date"></span> · <span x-text="session?.subjectName || session?.subjectId"></span>
    </h1>
  </header>

  <div x-show="!authed" class="adm-login" x-cloak>
    <h2 class="adm-login__title">Sign in</h2>
    <p x-show="sessionExpired" x-text="'Session expired — sign in again.'" class="rm-error adm-msg"></p>
    <form @submit.prevent="loginAndLoad(() => load())" class="adm-login__form">
      <input type="password" x-model="password" class="adm-input" placeholder="Admin password" aria-label="Admin password" />
      <button type="submit" class="adm-btn">Sign in</button>
    </form>
    <p x-show="loginError" x-text="loginError" class="rm-error adm-msg" x-cloak></p>
  </div>

  <div x-show="authed" x-cloak>
    <span x-show="loading" class="rm-loading">Loading…</span>
    <span x-show="error" x-text="error" class="rm-error"></span>

    <template x-if="session">
      <div>
        <p><span :class="stateClass(session.state)" x-text="session.state"></span></p>

        <h2 class="adm-h2">Timeline (UTC — local secondary)</h2>
        <dl class="adm-meta-grid">
          <dt>Brief opens</dt><dd><span x-text="fmtUtc(session.briefOpensAt)"></span> <span class="adm-dim" x-text="'(' + fmtLocal(session.briefOpensAt) + ' local)'"></span></dd>
          <dt>Window closes</dt><dd><span x-text="fmtUtc(session.windowClosesAt)"></span> <span class="adm-dim" x-text="'(' + fmtLocal(session.windowClosesAt) + ' local)'"></span></dd>
          <dt>Publish at</dt><dd><span x-text="fmtUtc(session.publishAt)"></span> <span class="adm-dim" x-text="'(' + fmtLocal(session.publishAt) + ' local)'"></span></dd>
          <dt>Published</dt><dd x-text="session.publishedAt ? fmtUtc(session.publishedAt) : '—'"></dd>
          <dt>Version</dt><dd x-text="session.version"></dd>
        </dl>

        <h3 class="adm-h2 adm-h2--flush">Linked jobs</h3>
        <div class="rm-table-scroll">
          <table class="rm-table adm-table">
            <thead><tr><th>Action</th><th>Job id</th><th>Status</th><th>Run after</th></tr></thead>
            <tbody>
              <template x-for="j in (session.jobs || [])" :key="j.action">
                <tr><td x-text="j.action"></td><td x-text="j.jobId ?? '—'"></td><td x-text="j.status ?? '—'"></td><td x-text="fmtUtc(j.runAfter)"></td></tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- ── Lifecycle actions — only server-legal transitions are enabled ── -->
        <h2 class="adm-h2">Actions</h2>
        <div class="adm-toolbar">
          <template x-for="action in ['publish_brief', 'close_window', 'reopen_window', 'aggregate', 'publish', 'cancel']" :key="action">
            <button type="button" class="adm-btn" :class="!isLegalAction(action) && 'adm-btn--ghost'"
              :disabled="!isLegalAction(action)" @click="openActionConfirm(action)"
              :data-testid="'session-action-' + action">
              <span x-text="actionLabel(action)"></span>
            </button>
          </template>
        </div>
        <p x-show="actionResult" class="adm-dim" data-testid="action-result">
          Job <span x-text="actionResult?.jobId"></span><span x-show="actionResult?.existing"> (idempotent: reused an existing queued job)</span>
        </p>
        <p x-show="actionError" x-text="actionError" class="rm-error" data-testid="action-error"></p>

        <div x-show="actionConfirm" x-cloak class="adm-modal" data-testid="session-action-confirm">
          <div class="adm-modal__panel">
            <h3>Confirm <span x-text="actionConfirm ? actionLabel(actionConfirm.action) : ''"></span></h3>
            <p class="adm-dim">Enqueues the same worker kind used by scheduled actions and returns a job id (202).</p>
            <label class="adm-field" x-show="actionConfirm?.action === 'reopen_window'">
              <span>New window-close time (ISO instant)</span>
              <input type="text" x-model="actionConfirm.windowClosesAt" class="adm-input" data-testid="action-window-closes" />
            </label>
            <label class="adm-field">
              <span>Reason</span>
              <textarea x-model="actionConfirm.reason" class="adm-input" rows="2" placeholder="10–500 characters" data-testid="action-reason"></textarea>
            </label>
            <div class="adm-toolbar">
              <button type="button" class="adm-btn" :disabled="actionSubmitting" @click="submitActionConfirm()" data-testid="action-confirm-submit">Confirm</button>
              <button type="button" class="adm-btn adm-btn--ghost" @click="cancelActionConfirm()">Cancel</button>
            </div>
          </div>
        </div>

        <!-- ── Roster matrix ─────────────────────────────────────────────── -->
        <h2 class="adm-h2">Roster (<span x-text="(session.roster || []).length"></span>)</h2>
        <div class="adm-toolbar">
          <select x-model="rosterFilter" class="adm-input" data-testid="roster-filter">
            <option value="all">All</option>
            <option value="expected">Expected</option>
            <option value="excused">Excused</option>
            <option value="submitted">Submitted</option>
            <option value="absent">Absent</option>
          </select>
          <select x-model="rosterSort" class="adm-input" data-testid="roster-sort">
            <option value="member">Sort: member</option>
            <option value="stance">Sort: stance</option>
            <option value="confidence">Sort: confidence</option>
            <option value="receivedAt">Sort: received</option>
          </select>
          <span class="adm-toolbar__spacer"></span>
          <button type="button" class="adm-btn adm-btn--ghost" x-show="rosterEditable()" @click="openRosterForm('add')" data-testid="roster-add">Add member</button>
        </div>

        <div x-show="rosterForm" x-cloak class="adm-modal" data-testid="roster-form">
          <div class="adm-modal__panel">
            <h3>Roster: <span x-text="rosterForm?.operation"></span></h3>
            <label class="adm-field">
              <span>Member id</span>
              <input type="text" x-model="rosterForm.memberId" class="adm-input" data-testid="roster-member-id" />
            </label>
            <label class="adm-field">
              <span>Reason</span>
              <textarea x-model="rosterForm.reason" class="adm-input" rows="2" placeholder="10–500 characters" data-testid="roster-reason"></textarea>
            </label>
            <span x-show="rosterError" x-text="rosterError" class="rm-error"></span>
            <div class="adm-toolbar">
              <button type="button" class="adm-btn" :disabled="rosterSubmitting" @click="submitRosterForm()" data-testid="roster-submit">Confirm</button>
              <button type="button" class="adm-btn adm-btn--ghost" @click="cancelRosterForm()">Cancel</button>
            </div>
          </div>
        </div>

        <div class="rm-table-scroll" data-testid="roster-table">
          <table class="rm-table adm-table">
            <thead><tr><th>Member</th><th>State</th><th>Stance</th><th>Confidence</th><th>Received</th><th></th></tr></thead>
            <tbody>
              <template x-for="row in rosterRows()" :key="row.memberId">
                <tr>
                  <td x-text="row.memberName || row.memberId"></td>
                  <td x-text="row.status"></td>
                  <td x-text="row.recommendation?.stance || '—'"></td>
                  <td x-text="row.recommendation?.confidence ?? '—'"></td>
                  <td x-text="row.recommendation?.receivedAt ? fmtUtc(row.recommendation.receivedAt) : '—'"></td>
                  <td>
                    <button type="button" class="adm-btn adm-btn--ghost" x-show="row.recommendation" @click="toggleDisclosure(row.memberId)" :data-testid="'disclosure-toggle-' + row.memberId">
                      <span x-text="expandedRecommendation === row.memberId ? 'Hide' : 'Signature/payload'"></span>
                    </button>
                    <button type="button" class="adm-btn adm-btn--ghost" x-show="rosterEditable() && row.status === 'expected'" @click="openRosterForm('excuse', row.memberId)" :data-testid="'roster-excuse-' + row.memberId">Excuse</button>
                    <button type="button" class="adm-btn adm-btn--ghost" x-show="rosterEditable() && row.status === 'excused'" @click="openRosterForm('restore', row.memberId)" :data-testid="'roster-restore-' + row.memberId">Restore</button>
                  </td>
                </tr>
              </template>
              <template x-for="row in rosterRows()" :key="row.memberId + '-disclosure'">
                <tr x-show="expandedRecommendation === row.memberId && row.recommendation" :data-testid="'disclosure-row-' + row.memberId">
                  <td colspan="6">
                    <p><strong>Body:</strong> <span x-text="row.recommendation?.body || '—'"></span></p>
                    <p><strong>Memo:</strong> <span x-text="row.recommendation?.memoUrl || '—'"></span></p>
                    <p><strong>Nonce:</strong> <code x-text="row.recommendation?.nonce"></code></p>
                    <p><strong>Signature:</strong> <code x-text="row.recommendation?.signature"></code></p>
                    <p><strong>Canonical payload:</strong></p>
                    <pre class="adm-log" x-text="row.recommendation?.canonicalPayload"></pre>
                  </td>
                </tr>
              </template>
              <tr x-show="rosterRows().length === 0"><td class="adm-dim" colspan="6">No roster rows for this filter.</td></tr>
            </tbody>
          </table>
        </div>

        <!-- ── Aggregate (read-only; no edit/delete control exists) ───────── -->
        <template x-if="session.aggregate">
          <div>
            <h2 class="adm-h2">Aggregate</h2>
            <dl class="adm-meta-grid">
              <dt>Expected</dt><dd x-text="session.aggregate.expectedCount"></dd>
              <dt>Submitted</dt><dd x-text="session.aggregate.submittedCount"></dd>
              <dt>Absent</dt><dd x-text="session.aggregate.absentCount"></dd>
              <dt>Mean confidence</dt><dd x-text="session.aggregate.meanConfidence ?? '—'"></dd>
            </dl>
            <h3 class="adm-h2 adm-h2--flush">Stances</h3>
            <ul class="adm-bullet-list">
              <template x-for="[stance, count] in Object.entries(session.aggregate.stances || {})" :key="stance">
                <li><span x-text="stance"></span>: <span x-text="count"></span></li>
              </template>
            </ul>
            <h3 class="adm-h2 adm-h2--flush">Consensus</h3>
            <ul class="adm-bullet-list">
              <template x-for="c in (session.aggregate.consensus || [])" :key="c"><li x-text="c"></li></template>
            </ul>
            <h3 class="adm-h2 adm-h2--flush">Source recommendation ids</h3>
            <p class="adm-dim" x-text="(session.aggregate.sourceRecommendationIds || []).join(', ') || '—'"></p>
          </div>
        </template>
      </div>
    </template>
  </div>

</section>
