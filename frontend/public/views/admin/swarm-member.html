<!-- Admin — member detail (/admin/swarm/members/:id): profile edit (#567),
     activate/deactivate/reactivate/rotate-key/reject behind a confirm dialog,
     and a one-time credential reveal. The dialog asks for a reason on every
     action EXCEPT approve (RM-45) — see REASON_REQUIRED in the factory for why.
     The edit form's reason is optional for the same reason and PERSISTED,
     which is the half RM-45 said was missing.
     Never renders token_hash or a bearer token in the detail JSON.
     Issue #159. Buildless — factory registered at boot
     (alpine/views/admin/swarm-member.js).

     Participation history and active-key metadata were dropped from this page
     (PR #172 review): the real backend (issue #152/PR #169) has no endpoint
     that joins a member to its cross-session recommendations, and never
     surfaces swarm_member_keys metadata over the admin API — building
     those sections would mean fabricating data with no backing route. -->
<section class="container adm" x-data="adminSwarmMember" x-init="init()">

  <header class="adm-head">
    <a href="/admin/swarm" class="sv__back">← /admin/swarm</a>
    <h1 class="adm-title">Member <span x-text="memberId"></span></h1>
  </header>

  <div x-show="!authed" class="adm-login" x-cloak>
    <h2 class="adm-login__title">Sign in</h2>
    <p x-show="sessionExpired" x-text="'Session expired — sign in again.'" class="rm-error adm-msg"></p>
    <form @submit.prevent="loginAndLoad(() => load())" class="adm-login__form">
      <input type="password" x-model="password" class="adm-input" placeholder="Admin password"
        autocomplete="current-password" aria-label="Admin password" />
      <button type="submit" class="adm-btn">Sign in</button>
      <button type="button" class="adm-btn adm-btn--ghost" @click="loginWithPasskeyAndLoad(() => load())" :disabled="passkeyLoading">
        <span x-show="!passkeyLoading">Sign in with Passkey</span>
        <span x-show="passkeyLoading" class="rm-loading">Waiting for passkey…</span>
      </button>
    </form>
    <p x-show="loginError" x-text="loginError" class="rm-error adm-msg" x-cloak></p>
  </div>

  <div x-show="authed" x-cloak>
    <span x-show="loading" class="rm-loading">Loading…</span>
    <span x-show="error" x-text="error" class="rm-error"></span>

    <template x-if="member">
      <div>
        <dl class="adm-meta-grid" x-show="!editing">
          <dt>Name</dt><dd x-text="member.name"></dd>
          <dt>Status</dt><dd x-text="member.status"></dd>
          <dt>Application</dt><dd x-text="pendingApplication ? pendingApplication.status : '—'"></dd>
          <dt>Contact email</dt><dd x-text="member.contactEmail || '—'"></dd>
          <dt>Lens</dt><dd x-text="member.lens || '—'"></dd>
          <dt>Tagline</dt><dd x-text="member.tagline || '—'"></dd>
          <dt>Biases</dt><dd x-text="memberBiases().length ? memberBiases().join(', ') : '—'" data-testid="member-biases"></dd>
          <dt>Applied</dt><dd x-text="member.appliedAt || '—'"></dd>
          <dt>Activated</dt><dd x-text="member.activatedAt || '—'"></dd>
        </dl>

        <div class="adm-toolbar" x-show="!editing">
          <button type="button" class="adm-btn" x-show="canEdit()" @click="startEdit()" data-testid="member-edit-toggle">Edit profile</button>
          <button type="button" class="adm-btn" x-show="canActivate()" @click="openConfirm('activate')" data-testid="member-activate">Activate</button>
          <button type="button" class="adm-btn adm-btn--ghost" x-show="canDeactivate()" @click="openConfirm('deactivate')" data-testid="member-deactivate">Deactivate</button>
          <button type="button" class="adm-btn" x-show="canReactivate()" @click="openConfirm('reactivate')" data-testid="member-reactivate">Reactivate</button>
          <button type="button" class="adm-btn" x-show="canRotateKey()" @click="openConfirm('rotate-key')" data-testid="member-rotate-key">Rotate key</button>
          <button type="button" class="adm-btn adm-btn--ghost" x-show="canReject()" @click="openConfirm('reject')" data-testid="member-reject">Reject</button>
        </div>

        <!-- Profile edit (#567). Everything here is a correction an operator
             makes to a record the member itself cannot change: `name`, `lens`
             and `contactEmail` are refused by the self-service profile route
             on purpose, and the rest is null on every member that arrived
             through the funnel. An empty field is a CLEAR, not a no-op, and
             only changed fields are sent. -->
        <form x-show="editing" x-cloak @submit.prevent="submitEdit()" class="adm-form" data-testid="member-edit-form">
          <label class="adm-field">
            <span>Name</span>
            <input type="text" x-model="editForm.name" class="adm-input" data-testid="edit-member-name" />
            <span x-show="editErrors.name" x-text="editErrors.name" class="rm-error"></span>
          </label>
          <label class="adm-field">
            <span>Lens</span>
            <input type="text" x-model="editForm.lens" class="adm-input" data-testid="edit-member-lens" />
            <span class="adm-dim">Set at apply time by the operator, and not editable by the member.</span>
            <span x-show="editErrors.lens" x-text="editErrors.lens" class="rm-error"></span>
          </label>
          <label class="adm-field">
            <span>Contact email</span>
            <input type="text" x-model="editForm.contactEmail" class="adm-input" data-testid="edit-member-contact" />
            <span x-show="editErrors.contactEmail" x-text="editErrors.contactEmail" class="rm-error"></span>
          </label>
          <label class="adm-field">
            <span>Tagline</span>
            <textarea x-model="editForm.tagline" class="adm-input" rows="2" data-testid="edit-member-tagline"></textarea>
            <span x-show="editErrors.tagline" x-text="editErrors.tagline" class="rm-error"></span>
          </label>
          <label class="adm-field">
            <span>Biases</span>
            <textarea x-model="editForm.biases" class="adm-input" rows="4" placeholder="One per line" data-testid="edit-member-biases"></textarea>
            <span class="adm-dim">One per line, up to 20. Empty clears them.</span>
            <span x-show="editErrors.biases" x-text="editErrors.biases" class="rm-error"></span>
          </label>
          <label class="adm-field">
            <span>Mandate</span>
            <textarea x-model="editForm.mandate" class="adm-input" rows="3" data-testid="edit-member-mandate"></textarea>
          </label>
          <label class="adm-field">
            <span>Operator</span>
            <input type="text" x-model="editForm.operator" class="adm-input" data-testid="edit-member-operator" />
          </label>
          <label class="adm-field">
            <span>Mode</span>
            <input type="text" x-model="editForm.mode" class="adm-input" data-testid="edit-member-mode" />
          </label>
          <label class="adm-field">
            <span>Reason (optional)</span>
            <textarea x-model="editForm.reason" class="adm-input" rows="2" placeholder="Recorded in the audit trail" data-testid="edit-member-reason"></textarea>
            <span x-show="editErrors.reason" x-text="editErrors.reason" class="rm-error"></span>
          </label>
          <span x-show="editErrors.form" x-text="editErrors.form" class="rm-error adm-msg"></span>
          <div class="adm-toolbar">
            <button type="submit" class="adm-btn" :disabled="submitting" data-testid="edit-member-submit">Save</button>
            <button type="button" class="adm-btn adm-btn--ghost" @click="cancelEdit()" data-testid="edit-member-cancel">Cancel</button>
          </div>
        </form>

        <div x-show="confirm" x-cloak class="adm-modal" data-testid="member-action-confirm">
          <div class="adm-modal__panel">
            <h3>Confirm <span x-text="confirm?.action"></span> for <span x-text="member.name"></span></h3>
            <p class="adm-dim">This changes swarm membership state; existing recommendations and roster snapshots are never rewritten.</p>
            <label class="adm-field" x-show="confirm?.action === 'rotate-key'">
              <span>New public key (optional — omit to rotate the credential against the existing on-file key)</span>
              <input type="text" x-model="confirm.publicKey" class="adm-input" data-testid="member-action-public-key" />
            </label>
            <label class="adm-field" x-show="reasonRequired()">
              <span>Reason</span>
              <textarea x-model="confirm.reason" class="adm-input" rows="2" placeholder="10–500 characters" data-testid="member-action-reason"></textarea>
            </label>
            <span x-show="confirmError" x-text="confirmError" class="rm-error"></span>
            <div class="adm-toolbar">
              <button type="button" class="adm-btn" :disabled="submitting" @click="submitConfirm()" data-testid="member-action-submit">Confirm</button>
              <button type="button" class="adm-btn adm-btn--ghost" @click="cancelConfirm()">Cancel</button>
            </div>
          </div>
        </div>

        <div x-show="credentialReveal" x-cloak class="adm-modal" data-testid="credential-modal">
          <div class="adm-modal__panel">
            <h3>New bearer token</h3>
            <p class="adm-dim">This token is shown once and cannot be retrieved later.</p>
            <pre class="adm-log" x-text="credentialReveal?.token" data-testid="credential-token"></pre>
            <div class="adm-toolbar">
              <button type="button" class="adm-btn" :data-copy="credentialReveal?.token">Copy</button>
              <button type="button" class="adm-btn adm-btn--ghost" @click="dismissCredential()" data-testid="credential-dismiss">I've copied it — dismiss</button>
            </div>
          </div>
        </div>

        <h2 class="adm-h2" x-show="!editing">Detail (redacted)</h2>
        <pre class="adm-log" x-show="!editing" x-text="memberJson()" data-testid="member-json"></pre>
      </div>
    </template>
  </div>

</section>
