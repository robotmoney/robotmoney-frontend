<!-- Admin — member detail (/admin/swarm/members/:id): activate/deactivate/
     reactivate/rotate-key/reject behind a confirm dialog, and a one-time
     credential reveal. The dialog asks for a reason on every action EXCEPT
     approve (RM-45) — see REASON_REQUIRED in the factory for why.
     Never renders token_hash or a bearer token in the detail JSON.
     Issue #159. Buildless — factory registered at boot
     (alpine/views/admin/swarm-member.js).

     Participation history and active-key metadata were dropped from this page
     (PR #172 review): the real backend (issue #152/PR #169) has no endpoint
     that joins a member to its cross-session recommendations, and never
     surfaces swarm_member_keys metadata over the admin API — building
     those sections would mean fabricating data with no backing route. -->
<section class="container adm" x-data="adminSwarmMember" x-init="init()">

  <header class="adm-head">
    <a href="/admin/swarm" class="sv__back">← /admin/swarm</a>
    <h1 class="adm-title">Member <span x-text="memberId"></span></h1>
  </header>

  <div x-show="!authed" class="adm-login" x-cloak>
    <h2 class="adm-login__title">Sign in</h2>
    <p x-show="sessionExpired" x-text="'Session expired — sign in again.'" class="rm-error adm-msg"></p>
    <form @submit.prevent="loginAndLoad(() => load())" class="adm-login__form">
      <input type="password" x-model="password" class="adm-input" placeholder="Admin password" aria-label="Admin password" />
      <button type="submit" class="adm-btn">Sign in</button>
    </form>
    <p x-show="loginError" x-text="loginError" class="rm-error adm-msg" x-cloak></p>
  </div>

  <div x-show="authed" x-cloak>
    <span x-show="loading" class="rm-loading">Loading…</span>
    <span x-show="error" x-text="error" class="rm-error"></span>

    <template x-if="member">
      <div>
        <dl class="adm-meta-grid">
          <dt>Name</dt><dd x-text="member.name"></dd>
          <dt>Status</dt><dd x-text="member.status"></dd>
          <dt>Application</dt><dd x-text="pendingApplication ? pendingApplication.status : '—'"></dd>
          <dt>Contact email</dt><dd x-text="member.contactEmail || '—'"></dd>
          <dt>Lens</dt><dd x-text="member.lens || '—'"></dd>
          <dt>Applied</dt><dd x-text="member.appliedAt || '—'"></dd>
          <dt>Activated</dt><dd x-text="member.activatedAt || '—'"></dd>
        </dl>

        <div class="adm-toolbar">
          <button type="button" class="adm-btn" x-show="canActivate()" @click="openConfirm('activate')" data-testid="member-activate">Activate</button>
          <button type="button" class="adm-btn adm-btn--ghost" x-show="canDeactivate()" @click="openConfirm('deactivate')" data-testid="member-deactivate">Deactivate</button>
          <button type="button" class="adm-btn" x-show="canReactivate()" @click="openConfirm('reactivate')" data-testid="member-reactivate">Reactivate</button>
          <button type="button" class="adm-btn" x-show="canRotateKey()" @click="openConfirm('rotate-key')" data-testid="member-rotate-key">Rotate key</button>
          <button type="button" class="adm-btn adm-btn--ghost" x-show="canReject()" @click="openConfirm('reject')" data-testid="member-reject">Reject</button>
        </div>

        <div x-show="confirm" x-cloak class="adm-modal" data-testid="member-action-confirm">
          <div class="adm-modal__panel">
            <h3>Confirm <span x-text="confirm?.action"></span> for <span x-text="member.name"></span></h3>
            <p class="adm-dim">This changes swarm membership state; existing recommendations and roster snapshots are never rewritten.</p>
            <label class="adm-field" x-show="confirm?.action === 'rotate-key'">
              <span>New public key (optional — omit to rotate the credential against the existing on-file key)</span>
              <input type="text" x-model="confirm.publicKey" class="adm-input" data-testid="member-action-public-key" />
            </label>
            <label class="adm-field" x-show="reasonRequired()">
              <span>Reason</span>
              <textarea x-model="confirm.reason" class="adm-input" rows="2" placeholder="10–500 characters" data-testid="member-action-reason"></textarea>
            </label>
            <span x-show="confirmError" x-text="confirmError" class="rm-error"></span>
            <div class="adm-toolbar">
              <button type="button" class="adm-btn" :disabled="submitting" @click="submitConfirm()" data-testid="member-action-submit">Confirm</button>
              <button type="button" class="adm-btn adm-btn--ghost" @click="cancelConfirm()">Cancel</button>
            </div>
          </div>
        </div>

        <div x-show="credentialReveal" x-cloak class="adm-modal" data-testid="credential-modal">
          <div class="adm-modal__panel">
            <h3>New bearer token</h3>
            <p class="adm-dim">This token is shown once and cannot be retrieved later.</p>
            <pre class="adm-log" x-text="credentialReveal?.token" data-testid="credential-token"></pre>
            <div class="adm-toolbar">
              <button type="button" class="adm-btn" :data-copy="credentialReveal?.token">Copy</button>
              <button type="button" class="adm-btn adm-btn--ghost" @click="dismissCredential()" data-testid="credential-dismiss">I've copied it — dismiss</button>
            </div>
          </div>
        </div>

        <h2 class="adm-h2">Detail (redacted)</h2>
        <pre class="adm-log" x-text="memberJson()" data-testid="member-json"></pre>
      </div>
    </template>
  </div>

</section>
