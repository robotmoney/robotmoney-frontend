# CONTAINER LABELS — the reap-by-label channel (scripts/stack/naming.ts).
#
# Every service below carries the same three labels, as do the pgdata volume
# and default network at the bottom of this file:
#
#   robotmoney.demo.project=<compose project>  which RUN created it
#   robotmoney.env=ci|local                    which ENVIRONMENT CLASS created it
#   robotmoney.env.hash=<10 hex>               which environment INSTANCE — one
#                                              GitHub Actions job (stable across
#                                              every step in that job, distinct
#                                              across runs/attempts/workflows),
#                                              or one local boot.
#
# Names encode the same facts (`rm_ci_stack_<hash>` / `rm_demo_stack_<hash>`) so
# `docker ps` is readable, but tools must select on these LABELS: name-substring
# matching is the fragile channel, and on this host — which runs the standing
# stage demo, the self-hosted CI runner and local evals at once — getting a
# selector wrong means killing the live site.
#
# The two RM_STACK_* values are set by scripts/stack/config.ts's buildComposeEnv
# and reproduced from .agents/demo-state.json by demo:down / demo:status.
services:
  postgres:
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}
      robotmoney.env: ${RM_STACK_ENV_CLASS}
      robotmoney.env.hash: ${RM_STACK_ENV_HASH}

  api:
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}
      robotmoney.env: ${RM_STACK_ENV_CLASS}
      robotmoney.env.hash: ${RM_STACK_ENV_HASH}
    environment:
      RM_ALLOW_INSECURE: "1"
      # Data-path knobs (issue #50, made unconditional by issue #147 — the
      # DEMO_HERMETIC hermetic opt-in and the base-rpc-stub service were
      # removed entirely; every boot, local or CI, is production-parity LIVE).
      # With no env set, every knob resolves EMPTY so backend config.ts /
      # analytics/index.ts fall through to their own live production defaults
      # (BASE_RPC_URL -> https://mainnet.base.org, ANALYTICS_SOURCE -> live,
      # BASE_RPC_SOURCE -> live). scripts/lib/demo-env.ts (the resolver
      # `bun run demo` actually goes through) pins these explicitly instead of
      # relying on this raw-compose fallback; this file's own defaults only
      # matter for a bare `docker compose -f ... -f docker-compose.demo.yml up`
      # that bypasses scripts/demo.ts. An explicit override always wins.
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BASE_RPC_SOURCE: ${BASE_RPC_SOURCE:-}
      ANALYTICS_SOURCE: ${ANALYTICS_SOURCE:-}
      # Projects data source (backend/src/projects/access/select.ts). The demo
      # deliberately stays on the offline fixture directory (unset), which is
      # allowed in demo/ephemeral; only RM_ENV=prod fail-closes on it and
      # requires an explicit PROJECTS_SOURCE=live. Passthrough so an operator
      # can opt a standing demo into the live providers.
      PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}
      # Cold-DB floor seed: load the vendored real raw floor ONCE so a fresh LIVE
      # boot doesn't re-fetch years of history (esp. ~200 EDGAR requests).
      # Idempotent (no-op once warm). scripts/lib/demo-env.ts defaults this to 1
      # on every demo boot now. Raw compose (no demo.ts) leaves it off, matching
      # the prod default.
      ANALYTICS_FLOOR_SEED: ${ANALYTICS_FLOOR_SEED:-}
      FLOOR_SEED_PATH: ${FLOOR_SEED_PATH:-}
      # Shared demo/smoke orchestration supplies one-hour capability TTLs.
      FETCH_CACHE_DIR: ${FETCH_CACHE_DIR:-}
      HTTP_FETCH_CACHE_TTL_MS: ${HTTP_FETCH_CACHE_TTL_MS:-}
      TOKEN_PRICE_CACHE_TTL_MS: ${TOKEN_PRICE_CACHE_TTL_MS:-}
      # PINNED off (issue #208): repo demo/e2e never auto-runs the swarm.*
      # session crons — the demo drives lifecycle jobs itself via the explicit
      # admin enqueue-job endpoint (unaffected by this issue). This overrides
      # docker-compose.yml's prod-shaped default (enabled) regardless of
      # whatever SWARM_SCHEDULES_ENABLED the invoking shell happens to have.
      SWARM_SCHEDULES_ENABLED: "0"

  # Internal worker lanes share demo data-path knobs for their remaining queue
  # work: worker-swarm owns lifecycle jobs and worker-analytics owns chain/
  # projects samplers. worker-research remains only for unreachable legacy rows;
  # the independent analytics-producer owns regime/research compute and cadence.
  # The share-price sampler still reads the vault over eth_call.
  worker-swarm: &demo-worker
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}
      robotmoney.env: ${RM_STACK_ENV_CLASS}
      robotmoney.env.hash: ${RM_STACK_ENV_HASH}
    environment:
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BASE_RPC_SOURCE: ${BASE_RPC_SOURCE:-}
      ANALYTICS_SOURCE: ${ANALYTICS_SOURCE:-}
      # Same PROJECTS_SOURCE passthrough as api — the analytics worker runs the
      # projects.* pipelines (unset = offline fixture directory; demo-legal).
      PROJECTS_SOURCE: ${PROJECTS_SOURCE:-}
      ANALYTICS_FLOOR_SEED: ${ANALYTICS_FLOOR_SEED:-}
      FLOOR_SEED_PATH: ${FLOOR_SEED_PATH:-}
      FETCH_CACHE_DIR: ${FETCH_CACHE_DIR:-}
      HTTP_FETCH_CACHE_TTL_MS: ${HTTP_FETCH_CACHE_TTL_MS:-}
      TOKEN_PRICE_CACHE_TTL_MS: ${TOKEN_PRICE_CACHE_TTL_MS:-}

  worker-analytics: *demo-worker

  worker-research: *demo-worker

  # The independent producer performs the heavy analytics HTTP fetches. Token
  # price caching is irrelevant to this service.
  analytics-producer:
    environment:
      HTTP_FETCH_CACHE_TTL_MS: ${HTTP_FETCH_CACHE_TTL_MS:-}

  # Onboarding eval (docs/architecture.md §11 R8, Stage 5): a vanilla OpenCode
  # agent container, no Robot Money tooling preinstalled (see
  # scripts/lib/member-agent/Dockerfile). This is a TEMPLATE, not a standing
  # service — `bun run demo` never starts one via plain `up` (the `member-agent`
  # profile is never active by default). scripts/lib/onboarding-eval.ts launches
  # one short-lived instance per admission with `docker compose run`, naming the
  # service explicitly (which starts it regardless of profile gating) so a bare
  # `docker compose up` / `bun run demo` boot never builds or runs it for
  # nothing.
  #
  # Egress this service needs: the `api` service (compose network — the
  # swarm REST API the agent applies against; D21 retired the MCP server),
  # GitHub Releases (github.com + objects.githubusercontent.com, for the `rmpc`
  # binary and the swarm-onboarding skill the agent installs itself), and
  # OpenCode Zen (the real model API). Real inference is the NORMAL case (§11 R8).
  #
  # Which agent runs here is switchable per environment by AGENT_MODEL, resolved
  # against the versioned registry in scripts/lib/model-registry.ts — a family
  # name (`deepseek`, `kimi`) takes that family's pinned default, `family/model`
  # (`kimi/k2.6`) pins one exactly, and unset takes the repo default
  # (`opencode/deepseek-v4-flash`). The environment carries the SELECTOR only;
  # the model ids themselves stay in source, one code review away.
  #
  # Both values reach the container by explicit `-e` injection from
  # scripts/agent/member-agent.ts at `docker compose run` time — a container
  # inherits no ambient environment. There is deliberately no service-level
  # environment fallback: a manual invocation must also supply the intended
  # model selector and, when funded, its one credential explicitly.
  member-agent:
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}
      robotmoney.env: ${RM_STACK_ENV_CLASS}
      robotmoney.env.hash: ${RM_STACK_ENV_HASH}
    build:
      context: .
      dockerfile: scripts/lib/member-agent/Dockerfile
    profiles: ["member-agent"] # never started by `docker compose up` alone
    depends_on:
      - api
    restart: "no"

# Namespace the postgres data volume so `bun run demo:clean` (scripts/demo-clean.ts)
# can find and delete demo pgdata volumes by LABEL, never by fragile name-substring
# matching. Two labels, mirroring the per-container label pattern above:
#   - robotmoney.demo=1              → "this volume belongs to the demo" (the filter
#                                       demo:clean uses to enumerate ALL demo volumes).
#   - robotmoney.demo.project=<proj> → which run created it (lets CI / demo:clean
#                                       scope a delete to a single run's volume).
# Demo lifecycle (issue: demo persistent volumes): teardown (SIGTERM/Ctrl-C and
# `demo:down`) now keeps this volume — `docker compose down` WITHOUT -v — so demo
# data survives a reboot. `demo:clean` is the ONLY path that deletes it. When the
# operator passes `bun run demo -- --pg-data <host-dir>`, postgres is bind-mounted
# to that host dir instead (a generated overlay replaces this mount by target
# path), so NO named volume is created and demo:clean never touches the host dir.
volumes:
  pgdata:
    labels:
      robotmoney.demo: "1"
      robotmoney.demo.project: ${DEMO_PROJECT}
      # Same environment labels the containers carry, so a volume left behind by
      # a killed CI job is attributable to that job without parsing its name.
      robotmoney.env: ${RM_STACK_ENV_CLASS}
      robotmoney.env.hash: ${RM_STACK_ENV_HASH}

# A Compose network can outlive every container when a run is interrupted after
# container cleanup but before `compose down`. Label it explicitly so demo:reap
# can discover that network-only orphan without deriving it from `docker ps`.
networks:
  default:
    labels:
      robotmoney.demo.network: "1"
      robotmoney.demo.project: ${DEMO_PROJECT}
      robotmoney.env: ${RM_STACK_ENV_CLASS}
      robotmoney.env.hash: ${RM_STACK_ENV_HASH}
