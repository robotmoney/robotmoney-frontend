services:
  postgres:
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}

  api:
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}
    depends_on:
      - base-rpc-stub
    environment:
      RM_ALLOW_INSECURE: "1"
      # Base RPC source knob (issue #48). Default HERMETIC: point the vault-economics
      # eth_call reads (chain/vault-economics.ts) at the in-CI deterministic stub
      # (base-rpc-stub service) so the demo — and the required `e2e` check — NEVER
      # touches live, rate-limited Base mainnet (config.ts default mainnet.base.org).
      # A live showcase can OPT IN by exporting BASE_RPC_URL=https://mainnet.base.org
      # (or a private RPC) before `bun run demo`. Mirrors the ANALYTICS_SOURCE pattern.
      BASE_RPC_URL: ${BASE_RPC_URL:-http://base-rpc-stub:8645}
      # Analytics source knob (issue #13). Default HERMETIC: the demo run is
      # deterministic + offline (no FRED/Yahoo/EDGAR/... calls), matching the demo
      # spec and CI. A showcase can OPT IN to the REAL keyless pipeline by exporting
      # ANALYTICS_SOURCE=live before `bun run demo` — then the API's runAnalytics
      # (the /committee/admin/regime call) fetches live numbers. The opt-in vars
      # below only take effect on the live path.
      ANALYTICS_SOURCE: ${ANALYTICS_SOURCE:-hermetic}
      # Cold-DB floor seed: load the vendored real raw floor ONCE so a fresh live
      # boot doesn't re-fetch years of history (esp. ~200 EDGAR requests). Idempotent
      # (no-op once warm). Ignored on the hermetic path.
      ANALYTICS_FLOOR_SEED: ${ANALYTICS_FLOOR_SEED:-0}
      FLOOR_SEED_PATH: ${FLOOR_SEED_PATH:-}
      # Opt-in on-disk fetch cache TTL (ms) so repeated live boots are fast. 0 = off.
      FETCH_CACHE_TTL_MS: ${FETCH_CACHE_TTL_MS:-0}
      FETCH_CACHE_DIR: ${FETCH_CACHE_DIR:-}

  worker:
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}
    depends_on:
      - base-rpc-stub
    environment:
      # Same hermetic Base RPC default as api (issue #48): the worker's share-price
      # sampler (worker/handlers/vault.ts) also reads the vault over eth_call.
      BASE_RPC_URL: ${BASE_RPC_URL:-http://base-rpc-stub:8645}
      # Same source knob for any analytics job the worker processes (default offline).
      ANALYTICS_SOURCE: ${ANALYTICS_SOURCE:-hermetic}
      ANALYTICS_FLOOR_SEED: ${ANALYTICS_FLOOR_SEED:-0}
      FLOOR_SEED_PATH: ${FLOOR_SEED_PATH:-}
      FETCH_CACHE_TTL_MS: ${FETCH_CACHE_TTL_MS:-0}
      FETCH_CACHE_DIR: ${FETCH_CACHE_DIR:-}

  mcp:
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}

  # Deterministic, request-counting Base JSON-RPC stub (issue #48). Reuses the
  # backend image (bun) to run backend/tests/support/base-rpc-stub.ts, which
  # answers the vault-economics eth_call reads with fixed fixtures and records a
  # request count. api/worker reach it by service name (BASE_RPC_URL default
  # above), so the demo's /allocation path — and the required `e2e` check — never
  # touches live Base mainnet. The host port lets scripts/demo-rpc-guard.ts read
  # GET /__count and assert zero live calls.
  base-rpc-stub:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["bun", "run", "tests/support/base-rpc-stub.ts"]
    labels:
      robotmoney.demo.project: ${DEMO_PROJECT}
    environment:
      STUB_PORT: "8645"
    ports:
      - "${BASE_RPC_STUB_PORT:-48645}:8645"
