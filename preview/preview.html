<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      background: #f5f5f5;
    }
    #watermark {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to right, #ff6b6b, #ff8787);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 999999;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    #frame {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100vh - 40px);
      border: none;
    }
  </style>
</head>
<body>
  <div id="watermark">PREVIEW — snapshot data (not current)</div>
  <iframe id="frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-presentation"></iframe>

  <script>
    // Load goldens asynchronously
    (async () => {
      let goldens = { routes: {} };
      try {
        const response = await fetch("/api-goldens.json");
        if (response.ok) {
          goldens = await response.json();
        }
      } catch (e) {
        console.warn("Failed to load goldens:", e);
      }

      const frame = document.getElementById("frame");
      const frameWin = frame.contentWindow;

      // Patch fetch BEFORE document.open()/write() so the interceptor is in place
      // when the fetched HTML is parsed and run.
      const originalFetch = frameWin.fetch;
      frameWin.fetch = function (resource, init) {
        const url = new URL(typeof resource === "string" ? resource : resource.url, frameWin.location.href);
        const path = url.pathname + url.search;

        // GET /api/* requests: serve from goldens
        if (url.origin === frameWin.location.origin && path.startsWith("/api/")) {
          if (!init || !init.method || init.method === "GET") {
            // Match by pathname, ignoring query string (goldens are point-in-time snapshots)
            const routePath = url.pathname;
            if (routePath in goldens.routes) {
              return Promise.resolve(
                new Response(JSON.stringify(goldens.routes[routePath]), {
                  status: 200,
                  headers: { "content-type": "application/json" },
                })
              );
            }
            // No golden for this route: 404
            return Promise.resolve(
              new Response(JSON.stringify({ error: "no golden for route", path: routePath }), {
                status: 404,
                headers: { "content-type": "application/json" },
              })
            );
          }
          // Non-GET requests: no-op success
          return Promise.resolve(
            new Response(JSON.stringify({ ok: true, mocked: true }), {
              status: 200,
              headers: { "content-type": "application/json" },
            })
          );
        }

        // Other requests pass through to the real server
        return originalFetch.call(frameWin, resource, init);
      };

      // Patch history.pushState to update parent hash (deep-link mirroring)
      const originalPushState = frameWin.history.pushState;
      frameWin.history.pushState = function (state, title, url) {
        originalPushState.call(this, state, title, url);
        // Extract path from the iframe's location and mirror to parent hash
        if (url) {
          const href = new URL(url, frameWin.location.href).href;
          const iframeOrigin = frameWin.location.origin;
          if (href.startsWith(iframeOrigin)) {
            const path = href.slice(iframeOrigin.length);
            window.parent.location.hash = path;
          }
        }
      };

      // Patch history.replaceState similarly
      const originalReplaceState = frameWin.history.replaceState;
      frameWin.history.replaceState = function (state, title, url) {
        originalReplaceState.call(this, state, title, url);
        if (url) {
          const href = new URL(url, frameWin.location.href).href;
          const iframeOrigin = frameWin.location.origin;
          if (href.startsWith(iframeOrigin)) {
            const path = href.slice(iframeOrigin.length);
            window.parent.location.hash = path;
          }
        }
      };

      // Fetch the production SPA HTML
      let indexHtml = "";
      try {
        const response = await fetch("/index.html");
        indexHtml = await response.text();
      } catch (e) {
        console.error("Failed to fetch /index.html:", e);
        frameWin.document.write("<p>Failed to load preview. See console for details.</p>");
        return;
      }

      // Write the HTML into the iframe, using document.open()/write()/close()
      // which reuses the Window object (Window spec guarantees the patched fetch
      // and history survive this transition).
      frameWin.document.open();
      frameWin.document.write(indexHtml);
      frameWin.document.close();

      // After document is loaded, restore hash-based routing if present
      // (e.g., if user came in with #/allocation)
      if (window.location.hash) {
        const hash = window.location.hash.slice(1); // remove leading #
        frameWin.history.replaceState({}, "", hash || "/");
      }

      // Listen for hash changes in the parent and update the iframe's location
      window.addEventListener("hashchange", () => {
        const hash = window.location.hash.slice(1);
        frameWin.history.pushState({}, "", hash || "/");
      });
    })();
  </script>
</body>
</html>
