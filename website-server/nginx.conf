# Static/SPA/docs serving for the assembled `_static/` directory (issue #892),
# replacing backend/src/api/static.ts's serveStatic()/routeShell()/docsShell(),
# which are deleted now that build-time prerendering (scripts/prerender.ts)
# inlines every sitemap route — docs included — into its own full
# `<route>/index.html`. See scripts/static-assembly.sh and docs/decisions.md
# D29 for what `_static/` contains and why.
#
# /api/ and /health are proxied to the `api` compose service so a single-box
# deployment (and this repo's own local dev/smoke/e2e harness, which loads
# pages and lets the SPA call its own same-origin API — frontend/public/
# config.js's recommended `API_BASE_URL: ""`) still works as one origin with
# no CORS and no CSP change on the client. This is compose-internal service
# wiring, not a production routing decision: docker-compose.yml's `api`
# service is reachable at `api:8787` on the compose network regardless of
# which host port Docker assigns either service.
#
# THE ROOT IS THE INSTANCE'S CURRENT SITE. docker-compose.yml mounts the
# instance's `web/` directory read-only at /srv/web; each assembled `_static`
# lives there as an immutable `web/<siteId>/`, and `current` is a relative
# symlink naming the one being served (scripts/lib/smoke-site.ts). Switching the
# site is an atomic rename of that symlink on the host: nginx resolves the root
# per request, so no container restarts and no request sees a half-copied tree.
# `bun smoke:web` (scripts/lib/website-release.ts) then runs `nginx -s reload`
# through `docker compose exec`: a graceful reload, where old workers finish the
# requests they hold while new ones accept. Nothing here may defeat that — an
# open_file_cache would keep serving the old tree's files until it expired, and
# smoke-web-rolling.test.ts grades zero failed requests across four switches.
# WHO THE CLIENT IS (issue #1095, PR #1109 review). The api reads
# CF-Connecting-IP first for rate limiting and the comments/submissions ip_hash
# audit field (backend/src/api/client-ip.ts). That header is only Cloudflare's
# account of the client when the request really came from Cloudflare: from its
# proxied edge (the D13 production path, the ranges below) or from a
# `cloudflared` connector on this host (the stage tunnel, which reaches nginx
# from the docker gateway, i.e. a private address of this host). From any other
# peer, such as a client that reaches the published port directly, the header
# is whatever the sender wrote, so nginx OVERWRITES it with the peer address.
# The map also fills it in when a trusted peer sent none (a curl from the host),
# so the api sees one real identity per client in every composition, and never
# nginx's own address for everyone. Ranges from https://www.cloudflare.com/ips/
# (checked 2026-10-05); scripts/tests/unit/website-server-client-ip.test.ts pins
# the shape of this block.
geo $cf_trusted_peer {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map "$cf_trusted_peer:$http_cf_connecting_ip" $client_ip {
    "~^1:.+$" $http_cf_connecting_ip;
    default $remote_addr;
}

server {
    listen 8080;
    server_name _;
    root /srv/web/current;

    # Docker's embedded DNS (127.0.0.11), and the upstream host in a variable
    # rather than a bare `proxy_pass http://api:8787`: a literal upstream is
    # resolved ONCE at config load and nginx refuses to start at all if `api`
    # isn't resolvable yet (a real startup-ordering race — depends_on waits for
    # the api CONTAINER, not for Postgres/migrate inside it). The variable form
    # resolves per request instead, so website-server comes up regardless of
    # api's boot order and re-resolves if api's container restarts.
    resolver 127.0.0.11 valid=10s;

    # $http_host, not $host: nginx's $host is normalized and DROPS the port
    # from the request's Host header, while $http_host passes it through
    # verbatim. admin-webauthn.ts's relyingParty() falls back to the API's
    # own `url.origin` (reconstructed by Bun.serve from whatever Host header
    # it receives) as expectedOrigin, deliberately never trusting
    # X-Forwarded-Proto (issue #617). A dev/smoke/CI stack has no fixed
    # domain — Docker assigns website-server's host port at stack start — so
    # forwarding a port-stripped Host silently downgrades the origin `api`
    # reconstructs to the bare hostname (e.g. `http://localhost`), which
    # never matches the browser's real `http://localhost:<port>` origin and
    # fails every WebAuthn ceremony. Reproduced directly: curl through a
    # minimal nginx proxy with `proxy_set_header Host $host` on a Host
    # header carrying a port yields a backend-observed Host/url.origin with
    # the port silently dropped; switching to $http_host preserves it.
    location = /health {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
    }

    # Advertised in llms.txt and openapi.json; the api answers it itself.
    location = /version {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
    }

    location ^~ /api/ {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # See the geo/map block above: Cloudflare's value from a Cloudflare or
        # same-host peer, the peer address itself from anyone else.
        proxy_set_header CF-Connecting-IP $client_ip;
    }

    # Cacheable static assets: anything with a real file extension other than
    # .html (css/js/images/openapi.json/llms.txt/...). Mirrors the old
    # serveStatic()'s ASSET_CACHE_CONTROL branch — a missing file here is a
    # plain 404, never a shell fallback.
    location ~* \.(?!html$)[a-z0-9]+$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Everything else: a prerendered page, or the client-route fallback chain
    # that used to be routeShell()'s job —
    #   <path>/index.html (this route's own prerendered page)
    #     -> _shell.html (empty-mount shell for a client route with no
    #        prerendered file of its own, e.g. a dynamic /swarm/members/:id)
    #     -> index.html (only reachable if the assembly carries neither of the
    #        above, i.e. an un-assembled STATIC_DIR)
    # matching backend/src/api/static.ts's routeShell() fallback order exactly.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html /_shell.html /index.html;
    }
}
