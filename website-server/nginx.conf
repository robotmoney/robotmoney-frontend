# Static/SPA/docs serving for the assembled `_static/` directory (issue #892),
# replacing backend/src/api/static.ts's serveStatic()/routeShell()/docsShell(),
# which are deleted now that build-time prerendering (scripts/prerender.ts)
# inlines every sitemap route — docs included — into its own full
# `<route>/index.html`. See scripts/static-assembly.sh and docs/decisions.md
# D29 for what `_static/` contains and why.
#
# /api/ and /health are proxied to the `api` compose service so a single-box
# deployment (and this repo's own local dev/smoke/e2e harness, which loads
# pages and lets the SPA call its own same-origin API — frontend/public/
# config.js's recommended `API_BASE_URL: ""`) still works as one origin with
# no CORS and no CSP change on the client. This is compose-internal service
# wiring, not a production routing decision: docker-compose.yml's `api`
# service is reachable at `api:8787` on the compose network regardless of
# which host port Docker assigns either service.
server {
    listen 8080;
    server_name _;
    root /srv/frontend;

    # Docker's embedded DNS (127.0.0.11), and the upstream host in a variable
    # rather than a bare `proxy_pass http://api:8787`: a literal upstream is
    # resolved ONCE at config load and nginx refuses to start at all if `api`
    # isn't resolvable yet (a real startup-ordering race — depends_on waits for
    # the api CONTAINER, not for Postgres/migrate inside it). The variable form
    # resolves per request instead, so website-server comes up regardless of
    # api's boot order and re-resolves if api's container restarts.
    resolver 127.0.0.11 valid=10s;

    location = /health {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location ^~ /api/ {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cacheable static assets: anything with a real file extension other than
    # .html (css/js/images/openapi.json/llms.txt/...). Mirrors the old
    # serveStatic()'s ASSET_CACHE_CONTROL branch — a missing file here is a
    # plain 404, never a shell fallback.
    location ~* \.(?!html$)[a-z0-9]+$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Everything else: a prerendered page, or the client-route fallback chain
    # that used to be routeShell()'s job —
    #   <path>/index.html (this route's own prerendered page)
    #     -> _shell.html (empty-mount shell for a client route with no
    #        prerendered file of its own, e.g. a dynamic /swarm/members/:id)
    #     -> index.html (only reachable if the assembly carries neither of the
    #        above, i.e. an un-assembled STATIC_DIR)
    # matching backend/src/api/static.ts's routeShell() fallback order exactly.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html /_shell.html /index.html;
    }
}
